        function compressAndConvertImage(file, maxWidth = 280, maxHeight = 280, quality = 0.88) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        const dataUrl = canvas.toDataURL(outType, quality);
                        canvas.toBlob((blob) => {
                            resolve({ dataUrl, blob: blob || file });
                        }, outType, quality);
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.triggerRealtimeUIRefresh = function(sourceCollection = '') {
            if (realtimeRefreshDebounce) clearTimeout(realtimeRefreshDebounce);

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                updateLiveSyncIndicator('syncing', 'Menyinkronkan...');
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                    if (Array.isArray(appData[collectionName])) {
                        appData[collectionName] = appData[collectionName].filter(item => (item.id || item.resultId) !== docId);
                    }
                } else {
                    const cleanPayload = sanitizeFirestoreData(dataObj);
                    await setDoc(ref, cleanPayload, { merge: true });
                    if (Array.isArray(appData[collectionName])) {
                        const keyField = collectionName === 'examResults' ? 'resultId' : 'id';
                        const idx = appData[collectionName].findIndex(item => (item[keyField] || item.id) === docId);
                        const mergedObj = { id: docId, ...cleanPayload };
                        if (idx !== -1) {
                            appData[collectionName][idx] = { ...appData[collectionName][idx], ...mergedObj };
                        } else {
                            appData[collectionName].push(mergedObj);
                        }
                    }
                }
                updateLiveSyncIndicator('updated', 'Data Diperbarui');
                return true;
            } catch (err) {
                console.error(`Firestore Sync Error [${collectionName}/${docId}]:`, err);
                updateLiveSyncIndicator('error');
                return false;
            }
        }

        async function fetchSingleFirestoreDoc(collectionName, docId) {
            if (IS_PREVIEW || !db) return null;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    return { id: snap.id, ...snap.data() };
                }
                return null;
            } catch (err) {
                console.error(`Fetch Doc Error [${collectionName}/${docId}]:`, err);
                return null;
            }
        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;

            // Bersihkan subscription lama bila ada
            globalRealtimeUnsubscribes.forEach(unsub => {
                try { unsub(); } catch (e) {}
            });
            globalRealtimeUnsubscribes = [];

            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examSessions', 'examResults'
            ];

            collectionsToWatch.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, (snapshot) => {
                    const docsList = snapshot.docs.map(d => {
                        const raw = d.data();
                        if (colName === 'examResults') {
                            return { id: d.id, resultId: raw.resultId || d.id, ...raw };
                        }
                        return { id: d.id, ...raw };
                    });

                    // Urutkan soal berdasarkan nomor urut agar konsisten
                    if (colName === 'questions') {
                        docsList.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));
                    }

                    appData[colName] = docsList;

                    // Jika Admin menutup ujian saat siswa sedang mengerjakan soal, langsung hentikan ruang ujian siswa dan simpan progresnya
                    if (colName === 'exams' && appData.currentUser && appData.currentUser.role === 'student' && isExamWorkspaceActive && currentActiveExam) {
                        const updatedExam = docsList.find(x => x.id === currentActiveExam.id);
                        if (!updatedExam || !isExamStrictlyActive(updatedExam) || !checkExamScheduleAccess(updatedExam).allowed) {
                            window.forceCloseStudentExamByAdmin('Ujian ini baru saja ditutup atau dinonaktifkan oleh Administrator. Seluruh jawaban yang sudah Anda isi tetap tersimpan dengan aman.');
                            return;
                        }
                    }

                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh(colName);
                    }
                }, (err) => {
                    console.warn(`Realtime listener warning [${colName}]:`, err);
                    updateLiveSyncIndicator('error');
                });
                globalRealtimeUnsubscribes.push(unsub);
            });

            // Real-time listener untuk dokumen pengaturan global
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    appData.settings = { ...appData.settings, ...snap.data() };
                    updateBrowserFaviconAndTitle();
                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh('appSettings');
                    }
                }
            }, (err) => {
                console.warn('Realtime settings listener warning:', err);
            });
            globalRealtimeUnsubscribes.push(unsubSettings);

            setTimeout(() => {
                isInitialRealtimeLoad = false;
            }, 800);

            // Pemantau transisi jadwal ujian berbasis waktu setiap 2 detik
            // Memastikan saat jam mulai tiba (misal 22:49 WIB) atau jam selesai lewat,
            // ujian langsung muncul/hilang otomatis di Portal Siswa & Admin tanpa perlu Edit/Simpan atau Login ulang
            startScheduleTransitionWatcher();

            // Fallback polling ringan setiap 15 detik untuk menjaga konsistensi jika koneksi sempat idle
            if (fallbackPollingInterval) clearInterval(fallbackPollingInterval);
            fallbackPollingInterval = setInterval(async () => {
                if (!db || document.hidden) return;
                try {
                    const dynamicCols = ['exams', 'examParticipants', 'examSessions', 'examResults'];
                    for (const cName of dynamicCols) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', cName));
                        appData[cName] = snap.docs.map(d => {
                            const raw = d.data();
                            return cName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                        });
                    }
                } catch (pollErr) {
                    // Abaikan jika offline sementara
                }
            }, 15000);
        }

        function computeCurrentScheduleSignature() {
            return (appData.exams || []).map(ex => {
                const active = isExamStrictlyActive(ex) ? '1' : '0';
                const schedState = checkExamScheduleAccess(ex).state;
                return `${ex.id}:${active}:${schedState}`;
            }).join('|');
        }

        function startScheduleTransitionWatcher() {
            if (scheduleTransitionInterval) clearInterval(scheduleTransitionInterval);
            lastScheduleStateSignature = computeCurrentScheduleSignature();

            scheduleTransitionInterval = setInterval(() => {
                const currentSig = computeCurrentScheduleSignature();
                if (currentSig !== lastScheduleStateSignature) {
                    lastScheduleStateSignature = currentSig;

                    // Jika siswa sedang mengerjakan ujian dan jadwal baru saja berakhir (EXPIRED), hentikan otomatis
                    if (appData.currentUser && appData.currentUser.role === 'student' && isExamWorkspaceActive && currentActiveExam) {
                        const latestExam = appData.exams.find(e => e.id === currentActiveExam.id);
                        if (!latestExam || !isExamStrictlyActive(latestExam) || !checkExamScheduleAccess(latestExam).allowed) {
                            window.forceCloseStudentExamByAdmin('Waktu jadwal pelaksanaan ujian telah berakhir atau ujian ditutup oleh Administrator. Jawaban Anda tetap tersimpan.');
                            return;
                        }
                    }

                    // Perbarui tampilan Portal Siswa, Banner Login, dan Kartu Manajemen Ujian Admin secara otomatis dan instan
                    if (appData.currentUser) {
                        if (appData.currentUser.role === 'admin' && appData.activeAdminMenu === 'exams') {
                            const mainEl = document.getElementById('adminMainContent');
                            if (mainEl) renderExamsContent(mainEl);
                        } else if (appData.currentUser.role === 'student' && !isExamWorkspaceActive) {

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
                return;
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            // Muat ulang exams, examSessions & examResults terbaru dari Firestore saat login agar status aktif ujian & progres lintas perangkat 100% akurat
            if (!IS_PREVIEW && db) {
                try {
                    const [examsSnap, sessSnap, resSnap, partSnap] = await Promise.all([
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'exams')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examSessions')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examResults')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examParticipants'))
                    ]);
                    appData.exams = examsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appData.examSessions = sessSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appData.examResults = resSnap.docs.map(d => ({ id: d.id, resultId: d.data().resultId || d.id, ...d.data() }));
                    appData.examParticipants = partSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (err) {
                    console.warn('Gagal menyegarkan sesi terbaru:', err);
                }
            }

            window.renderStudentPortal(true);
        };

            if (sidebar) {
                if (isMobileSidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    sidebar.classList.add('translate-x-0');
                } else {
                    sidebar.classList.remove('translate-x-0');
                    sidebar.classList.add('-translate-x-full');
                }
            }
            if (backdrop) {
                backdrop.classList.toggle('hidden', !isMobileSidebarOpen);
                backdrop.classList.toggle('block', isMobileSidebarOpen);
            }
        };

        function renderStudentsContent(container) {
            const search = (appData.filters.studentSearch || '').toLowerCase();
            const filterCls = appData.filters.studentClass || 'ALL';

            const filteredStudents = appData.students.filter(s => {
                const schoolStr = s.asalSekolah !== undefined ? s.asalSekolah : (appData.settings.schoolName || '');
                const matchSearch = !search || s.fullName.toLowerCase().includes(search) || s.nisn.toLowerCase().includes(search) || (s.nis || '').toLowerCase().includes(search) || schoolStr.toLowerCase().includes(search);
                const matchCls = filterCls === 'ALL' || s.classId === filterCls || s.className === filterCls;
                return matchSearch && matchCls;
            });

            // Bersihkan ID siswa yang sudah tidak ada di daftar master
            const validIds = new Set(appData.students.map(s => s.id));
            Array.from(selectedStudentIds).forEach(id => {
                if (!validIds.has(id)) selectedStudentIds.delete(id);
            });

            const allFilteredSelected = filteredStudents.length > 0 && filteredStudents.every(s => selectedStudentIds.has(s.id));
            const selectedCount = selectedStudentIds.size;

            const rows = filteredStudents.map((s, idx) => {
                const schoolDisplay = s.asalSekolah !== undefined ? (s.asalSekolah || '-') : (appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG');

                    <td class="px-4 py-3 text-xs font-semibold ${schoolDisplay === '-' ? 'text-slate-400 italic' : 'text-indigo-700'}">${escapeHtml(schoolDisplay)}</td>
                    <td class="px-4 py-3 text-xs">${escapeHtml(s.gender || 'L')}</td>
                    <td class="px-4 py-3 text-xs">${escapeHtml(s.className)}</td>
                    <td class="px-4 py-3 text-xs"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${s.status === 'Aktif' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-600'}">${escapeHtml(s.status || 'Aktif')}</span></td>
                    <td class="px-4 py-3 text-xs space-x-1">
                        <button type="button" onclick="window.openStudentFormModal('${s.id}')" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-semibold" title="Edit Siswa"><i class="fa-solid fa-pen"></i></button>
                        <button type="button" onclick="window.deleteStudentRecord('${s.id}')" class="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-semibold" title="Hapus Siswa"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
            }).join('');

            const classFilterOpts = appData.classes.map(c => `<option value="${escapeHtml(c.id)}" ${filterCls === c.id ? 'selected' : ''}>Kelas ${escapeHtml(c.className)}</option>`).join('');

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <h3 class="font-bold text-sm text-slate-800">Manajemen Data Siswa</h3>
                            <p class="text-xs text-slate-500">Kelola data peserta ujian siswa, pencarian, filter kelas, hapus massal, dan impor/ekspor Excel (.xlsx).</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button type="button" onclick="window.deleteSelectedStudents()" ${selectedCount > 0 ? '' : 'disabled'} class="px-3.5 py-2 ${selectedCount > 0 ? 'bg-red-600 hover:bg-red-700 text-white shadow-sm cursor-pointer' : 'bg-slate-100 text-slate-400 cursor-not-allowed'} rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-trash-can mr-1"></i> Hapus Terpilih (${selectedCount})
                            </button>
                            <button type="button" onclick="window.deleteAllFilteredStudents()" ${filteredStudents.length > 0 ? '' : 'disabled'} class="px-3.5 py-2 ${filteredStudents.length > 0 ? 'bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 cursor-pointer' : 'bg-slate-100 text-slate-400 cursor-not-allowed'} rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-users-slash mr-1"></i> Hapus Semua (${filteredStudents.length})
                            </button>
                            <button type="button" onclick="window.downloadStudentTemplate()" class="px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-download mr-1"></i> Unduh Template Excel
                            </button>
                            <button type="button" onclick="window.triggerStudentExcelImport()" class="px-3.5 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-file-excel mr-1"></i> Impor Excel (.xlsx)
                            </button>
                            <button type="button" onclick="window.exportStudentsExcel()" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-file-export mr-1"></i> Ekspor Data (.xlsx)
                            </button>
                            <button type="button" onclick="window.openStudentFormModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition">
                                <i class="fa-solid fa-plus mr-1"></i> Tambah Siswa

                        </div>
                        <select onchange="window.filterStudentsList(null, this.value)" class="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">

                            ${classFilterOpts}
                        </select>

                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div class="table-responsive-wrapper custom-scrollbar">
                            <table class="w-full min-w-[760px] text-left border-collapse">

                                    <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase">
                                        <th class="px-4 py-3 text-center w-10">
                                            <input type="checkbox" ${allFilteredSelected ? 'checked' : ''} onchange="window.toggleSelectAllStudents(this.checked)" title="Pilih Semua Siswa" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                                        </th>
                                        <th class="px-4 py-3">No</th><th class="px-4 py-3">NISN</th><th class="px-4 py-3">NIS</th><th class="px-4 py-3">Nama Lengkap</th><th class="px-4 py-3">Asal Sekolah</th><th class="px-4 py-3">L/P</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Aksi</th>

                    </div>
                </div>
            `;
        }

        window.toggleSelectStudent = function(studentId, isChecked) {
            if (!studentId) return;
            if (isChecked) {
                selectedStudentIds.add(studentId);
            } else {
                selectedStudentIds.delete(studentId);
            }
            renderStudentsContent(document.getElementById('adminMainContent'));
        };

        window.toggleSelectAllStudents = function(isChecked) {
            const search = (appData.filters.studentSearch || '').toLowerCase();
            const filterCls = appData.filters.studentClass || 'ALL';
            const filteredStudents = appData.students.filter(s => {
                const schoolStr = s.asalSekolah !== undefined ? s.asalSekolah : (appData.settings.schoolName || '');
                const matchSearch = !search || s.fullName.toLowerCase().includes(search) || s.nisn.toLowerCase().includes(search) || (s.nis || '').toLowerCase().includes(search) || schoolStr.toLowerCase().includes(search);
                const matchCls = filterCls === 'ALL' || s.classId === filterCls || s.className === filterCls;
                return matchSearch && matchCls;
            });

            filteredStudents.forEach(s => {
                if (isChecked) selectedStudentIds.add(s.id);
                else selectedStudentIds.delete(s.id);
            });
            renderStudentsContent(document.getElementById('adminMainContent'));
        };

        window.deleteSelectedStudents = function() {
            const idsToDelete = Array.from(selectedStudentIds);
            if (idsToDelete.length === 0) {
                window.showModal('Pilih Siswa Terlebih Dahulu', 'Silakan centang minimal satu siswa pada tabel untuk dihapus secara bersamaan.', 'info');
                return;
            }

            window.showModal(
                'Hapus Data Siswa Terpilih',
                `Apakah Anda yakin ingin menghapus ${idsToDelete.length} data siswa yang dicentang secara bersamaan? Tindakan ini tidak dapat dibatalkan.`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    updateLiveSyncIndicator('syncing', `Menghapus ${idsToDelete.length} Siswa...`);
                    const idSet = new Set(idsToDelete);
                    appData.students = appData.students.filter(s => !idSet.has(s.id));
                    selectedStudentIds.clear();

                    for (const sid of idsToDelete) {
                        await syncCollectionRecord('students', sid, null, true);
                    }

                    logActivity(`Administrator menghapus ${idsToDelete.length} data siswa secara bersamaan.`);
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Berhasil Dihapus', `${idsToDelete.length} data siswa berhasil dihapus secara bersamaan.`, 'success');
                    return true;
                },
                { showCancel: true, okText: `Ya, Hapus ${idsToDelete.length} Siswa` }
            );
        };

        window.deleteAllFilteredStudents = function() {
            const search = (appData.filters.studentSearch || '').toLowerCase();
            const filterCls = appData.filters.studentClass || 'ALL';
            const filteredStudents = appData.students.filter(s => {
                const schoolStr = s.asalSekolah !== undefined ? s.asalSekolah : (appData.settings.schoolName || '');
                const matchSearch = !search || s.fullName.toLowerCase().includes(search) || s.nisn.toLowerCase().includes(search) || (s.nis || '').toLowerCase().includes(search) || schoolStr.toLowerCase().includes(search);
                const matchCls = filterCls === 'ALL' || s.classId === filterCls || s.className === filterCls;
                return matchSearch && matchCls;
            });

            if (filteredStudents.length === 0) return;
            const idsToDelete = filteredStudents.map(s => s.id);

            window.showModal(
                'Konfirmasi Hapus Semua Siswa',
                `Apakah Anda yakin ingin menghapus seluruh (${idsToDelete.length}) data siswa yang tampil pada daftar ini secara bersamaan?`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    updateLiveSyncIndicator('syncing', `Menghapus ${idsToDelete.length} Siswa...`);
                    const idSet = new Set(idsToDelete);
                    appData.students = appData.students.filter(s => !idSet.has(s.id));
                    idsToDelete.forEach(id => selectedStudentIds.delete(id));

                    for (const sid of idsToDelete) {
                        await syncCollectionRecord('students', sid, null, true);
                    }

                    logActivity(`Administrator menghapus ${idsToDelete.length} data siswa sekaligus.`);
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Berhasil Dihapus', `${idsToDelete.length} data siswa berhasil dihapus dari database.`, 'success');
                    return true;
                },
                { showCancel: true, okText: `Ya, Hapus Semua (${idsToDelete.length} Siswa)` }
            );
        };

        window.filterStudentsList = function(searchVal, classVal) {
            if (searchVal !== null) appData.filters.studentSearch = searchVal;
            if (classVal !== null) appData.filters.studentClass = classVal;
            renderStudentsContent(document.getElementById('adminMainContent'));
        };

        window.downloadStudentTemplate = function() {
            const headers = ['NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin (L/P)', 'Kelas (1-6)', 'PIN Login'];
            const defaultSchool = appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG';

        function getQuestionTypeBadgeLabel(type) {
            if (type === 'pg') return 'Pilihan Ganda';
            if (type === 'pg_complex') return 'Pilihan Ganda Kompleks';
            if (type === 'true_false') return 'Benar / Salah';
            if (type === 'matching') return 'Menjodohkan';
            if (type === 'short_answer') return 'Isian Singkat';
            if (type === 'essay') return 'Uraian / Esai';
            return type || 'Pilihan Ganda';
        }

        function normalizeImportedQuestionType(rawVal) {
            const raw = String(rawVal ?? '').trim();
            if (!raw) return { valid: false, code: '', rawLabel: '(Kosong)' };
            const clean = raw.toLowerCase().replace(/\s+/g, ' ').trim();
            const compact = clean.replace(/[^a-z0-9]/g, '');

            if (
                clean === 'pg_complex' ||
                clean.includes('kompleks') ||
                clean.includes('complex') ||
                clean.includes('multi') ||
                compact === 'pgk' ||
                compact === 'pilganmultijawaban' ||
                compact === 'pilihangandakompleks'
            ) {
                return { valid: true, code: 'pg_complex', rawLabel: raw };
            }
            if (
                clean === 'pg' ||
                clean === 'pilihan ganda' ||
                clean === 'pg (pilihan ganda)' ||
                clean === 'pilihan ganda (pg)' ||
                compact === 'pgpilihanganda' ||
                compact === 'pilihanganda' ||
                compact === 'pilgan' ||
                compact === 'multiplechoice'
            ) {
                return { valid: true, code: 'pg', rawLabel: raw };
            }
            if (
                clean === 'true_false' ||
                clean === 'true/false' ||
                clean === 'true false' ||
                clean === 'b/s' ||
                clean === 'bs' ||
                clean === 't/f' ||
                clean === 'tf' ||
                clean.includes('benar') ||
                clean.includes('salah') ||
                compact === 'benarsalah' ||
                compact === 'truefalse'
            ) {
                return { valid: true, code: 'true_false', rawLabel: raw };
            }
            if (
                clean === 'matching' ||
                clean.includes('jodoh') ||
                clean.includes('pasangan') ||
                clean.includes('match')
            ) {
                return { valid: true, code: 'matching', rawLabel: raw };
            }
            if (
                clean === 'short_answer' ||
                clean === 'short answer' ||
                clean.includes('isian') ||
                clean.includes('singkat')
            ) {
                return { valid: true, code: 'short_answer', rawLabel: raw };
            }
            if (
                clean === 'essay' ||
                clean.includes('uraian') ||
                clean.includes('esai') ||
                clean.includes('essay')
            ) {
                return { valid: true, code: 'essay', rawLabel: raw };
            }
            return { valid: false, code: '', rawLabel: raw };
        }

        function parseTrueFalseStatementsAndKey(optList, keyRaw) {
            const statements = (optList || []).map(s => String(s ?? '').trim()).filter(s => s !== '');
            const isDefaultBS = statements.length === 2 && statements[0].toLowerCase() === 'benar' && statements[1].toLowerCase() === 'salah';
            const rawKeyStr = String(keyRaw ?? '').trim();
            const keyTokens = rawKeyStr
                .split(/[,;|/\s\-]+/)
                .map(t => t.trim())
                .filter(Boolean)
                .map(t => {
                    const low = t.toLowerCase();
                    if (low === 'b' || low === 'benar' || low === 'true' || low === 't' || low === '1') return 'Benar';
                    if (low === 's' || low === 'salah' || low === 'false' || low === 'f' || low === '0') return 'Salah';
                    return t;
                });

            if (!isDefaultBS && (statements.length >= 1 && (statements.length > 2 || keyTokens.length > 1 || !['benar', 'salah'].includes(statements[0].toLowerCase())))) {
                const normalizedKeys = statements.map((_, idx) => keyTokens[idx] || keyTokens[0] || 'Benar');
                return {
                    isMultiStatement: true,
                    options: statements,
                    correctAnswer: normalizedKeys
                };
            }

            const singleAns = keyTokens[0] || (rawKeyStr.toLowerCase().startsWith('s') ? 'Salah' : 'Benar');
            return {
                isMultiStatement: false,
                options: ['Benar', 'Salah'],
                correctAnswer: singleAns
            };
        }

        window.confirmDeleteQuestionBank = function() {
            if (isDeletingQuestionBank) return;
            const selectedBankId = appData.filters.questionBankId || 'ALL';
            if (selectedBankId === 'ALL') {
                window.showModal('Pilih Paket Terlebih Dahulu', 'Silakan pilih salah satu paket bank soal pada dropdown untuk dihapus.', 'error');
                return;
            }
            const bankObj = appData.questionBanks.find(b => b.id === selectedBankId);
            if (!bankObj) return;

            const relatedQuestions = appData.questions.filter(q => q.bankId === selectedBankId);
            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-3.5 bg-red-50 border border-red-200 rounded-2xl text-red-900 space-y-1">
                        <p class="font-extrabold text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-red-600"></i> Konfirmasi Hapus Paket Bank Soal</p>
                        <p class="text-[11px] text-red-700">Tindakan ini akan menghapus paket beserta seluruh soal di dalamnya secara permanen dari Firebase Firestore.</p>
                    </div>
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
                        <div class="flex justify-between"><span>Nama Paket:</span> <strong class="text-slate-900">${escapeHtml(bankObj.title)}</strong></div>
                        <div class="flex justify-between"><span>Jumlah Soal Terhubung:</span> <strong class="text-red-600">${relatedQuestions.length} Butir Soal</strong></div>
                    </div>
                </div>
            `;

            window.showModal('Hapus Paket Bank Soal', '', 'error', async (confirmed) => {
                if (!confirmed) return true;
                return await window.executeDeleteQuestionBank(selectedBankId);
            }, { html, showCancel: true, okText: 'Ya, Hapus Paket & Soal' });
        };

        window.executeDeleteQuestionBank = async function(bankId) {
            if (isDeletingQuestionBank) return false;
            isDeletingQuestionBank = true;
            try {
                const questionsInBank = appData.questions.filter(q => q.bankId === bankId);
                const qIdsToRemove = new Set(questionsInBank.map(q => q.id));

                for (const q of questionsInBank) {
                    await syncCollectionRecord('questions', q.id, null, true);
                }

                appData.questions = appData.questions.filter(q => !qIdsToRemove.has(q.id));
                appData.questionBanks = appData.questionBanks.filter(b => b.id !== bankId);

                await syncCollectionRecord('questionBanks', bankId, null, true);

                for (const ex of appData.exams) {
                    if (Array.isArray(ex.questionIds)) {
                        ex.questionIds = ex.questionIds.filter(qid => !qIdsToRemove.has(qid));
                        await syncCollectionRecord('exams', ex.id, ex);
                    }
                }

                appData.filters.questionBankId = 'ALL';
                logActivity(`Paket bank soal (ID: ${bankId}) beserta ${questionsInBank.length} soal berhasil dihapus permanen.`);
                window.showModal('Berhasil Dihapus', `Paket bank soal dan ${questionsInBank.length} soal terkait berhasil dihapus dari database.`, 'success');
                renderQuestionBanksContent(document.getElementById('adminMainContent'));
                isDeletingQuestionBank = false;
                return true;
            } catch (err) {
                console.error('Delete Bank Error:', err);
                window.showModal('Gagal Menghapus', 'Terjadi kesalahan saat menghapus paket soal dari server.', 'error');
                isDeletingQuestionBank = false;
                return false;
            }
        };

        window.updateQuestionLivePreview = function() {
            const num = document.getElementById('qFormNum')?.value || '1';
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = document.getElementById('qFormWeight')?.value || '10';
            const stimulus = document.getElementById('qFormStimulus')?.value || '';
            const stimImgUrl = document.getElementById('qFormStimulusImg')?.value || '';
            const text = document.getElementById('qFormText')?.value || '';
            const qImgUrl = document.getElementById('qFormQuestionImg')?.value || '';
            const key = document.getElementById('qFormKey')?.value || '-';
            const expl = document.getElementById('qFormExplanation')?.value || '-';

            const optA = document.getElementById('qOptA')?.value || '';
            const optB = document.getElementById('qOptB')?.value || '';
            const optC = document.getElementById('qOptC')?.value || '';
            const optD = document.getElementById('qOptD')?.value || '';

            const numLabel = document.getElementById('previewNumLabel');
            const weightLabel = document.getElementById('previewWeightLabel');
            const typeBadge = document.getElementById('previewTypeBadge');
            const stimBox = document.getElementById('previewStimulusBox');
            const stimText = document.getElementById('previewStimulusText');
            const stimImg = document.getElementById('previewStimulusImg');
            const qText = document.getElementById('previewQuestionText');
            const qImg = document.getElementById('previewQuestionImg');
            const optList = document.getElementById('previewOptionsList');
            const keyText = document.getElementById('previewKeyText');
            const explText = document.getElementById('previewExplText');

            if (!numLabel) return;
            numLabel.innerText = `Soal Nomor ${num}`;
            weightLabel.innerText = `Bobot: ${weight} Poin`;
            if (typeBadge) typeBadge.innerText = getQuestionTypeBadgeLabel(type);

            if (stimulus.trim() || stimImgUrl.trim()) {
                stimText.innerText = stimulus;
                if (stimImg) {
                    if (stimImgUrl.trim()) {
                        stimImg.src = stimImgUrl.trim();
                        stimImg.classList.remove('hidden');
                    } else {
                        stimImg.classList.add('hidden');
                    }
                }
                stimBox.classList.remove('hidden');
            } else {
                stimBox.classList.add('hidden');
            }

            qText.innerText = text.trim() ? text : '(Teks pertanyaan akan tampil di sini)';
            if (qImg) {
                if (qImgUrl.trim()) {
                    qImg.src = qImgUrl.trim();
                    qImg.classList.remove('hidden');
                } else {
                    qImg.classList.add('hidden');
                }
            }

            keyText.innerText = key.trim() ? key : '-';
            explText.innerText = expl.trim() ? expl : '-';

            if (type === 'pg' || type === 'pg_complex') {
                const badgeType = type === 'pg_complex' ? 'checkbox' : 'radio';
                optList.innerHTML = [optA || 'Opsi A', optB || 'Opsi B', optC || 'Opsi C', optD || 'Opsi D'].map((o, idx) => `
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2"><span class="font-bold w-5">${String.fromCharCode(65 + idx)}.</span> <span>${escapeHtml(o)}</span></div>
                        <span class="text-[10px] text-slate-400 uppercase font-mono">${badgeType}</span>
                    </div>
                `).join('');
            } else if (type === 'matching') {
                optList.innerHTML = [optA, optB, optC, optD].filter(x => x && x.trim() !== '').map((pair, i) => `
                    <div class="p-2 bg-white rounded-xl border border-slate-200 text-xs flex items-center justify-between">
                        <span class="font-semibold">#${i + 1}</span>
                        <span>${escapeHtml(pair)}</span>
                    </div>
                `).join('') || `<div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs text-slate-400">Masukkan pasangan kiri = kanan</div>`;
            } else if (type === 'true_false') {
                const parsedTF = parseTrueFalseStatementsAndKey([optA, optB, optC, optD], key);
                if (parsedTF.isMultiStatement) {
                    optList.innerHTML = parsedTF.options.map((stmt, idx) => `
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center justify-between gap-2">
                            <span><strong>${idx + 1}.</strong> ${escapeHtml(stmt)}</span>
                            <span class="px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded font-bold text-[10px]">Benar / Salah</span>
                        </div>
                    `).join('');
                } else {
                    optList.innerHTML = `
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold">B.</span> Benar</div>
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold">S.</span> Salah</div>
                    `;
                }

                optList.innerHTML = `<div class="p-3 bg-white rounded-xl border border-slate-200 text-xs italic text-slate-400">Kolom jawaban teks isian / uraian untuk siswa.</div>`;

                }
            }
            const explEl = document.getElementById('qFormExplanation');
            if (explEl) explEl.value = q.explanation || '';

            window.handleQuestionTypeChange();
            if (q.type === 'matching' && Array.isArray(q.matchingPairs)) {
                const ids = ['qOptA', 'qOptB', 'qOptC', 'qOptD'];
                q.matchingPairs.forEach((p, idx) => {
                    if (ids[idx] && document.getElementById(ids[idx])) {
                        document.getElementById(ids[idx]).value = `${p.left} = ${p.right}`;
                    }
                });

                if (document.getElementById('qOptA')) document.getElementById('qOptA').value = q.options[0] || '';
                if (document.getElementById('qOptB')) document.getElementById('qOptB').value = q.options[1] || '';
                if (document.getElementById('qOptC')) document.getElementById('qOptC').value = q.options[2] || '';
                if (document.getElementById('qOptD')) document.getElementById('qOptD').value = q.options[3] || '';

        window.saveQuestionRecord = function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const stimulusImage = (document.getElementById('qFormStimulusImg')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const questionImage = (document.getElementById('qFormQuestionImg')?.value || '').trim();
            const correctAnswerRaw = (document.getElementById('qFormKey')?.value || '').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi Soal', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }

            let options = [];
            let matchingPairs = [];
            let correctAnswer = correctAnswerRaw || 'A';

            if (type === 'pg' || type === 'pg_complex') {
                options = [
                    document.getElementById('qOptA')?.value || 'Opsi A',
                    document.getElementById('qOptB')?.value || 'Opsi B',
                    document.getElementById('qOptC')?.value || 'Opsi C',
                    document.getElementById('qOptD')?.value || 'Opsi D'
                ];
                if (type === 'pg_complex') {
                    correctAnswer = correctAnswerRaw
                        ? correctAnswerRaw.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean)
                        : ['A'];
                } else {
                    correctAnswer = (correctAnswerRaw || 'A').trim().toUpperCase();
                }
            } else if (type === 'matching') {
                const rawPairs = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ].filter(x => x.trim() !== '');
                const ansObj = {};
                rawPairs.forEach((rp, idx) => {
                    const parts = rp.split('=');
                    const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                    const right = (parts[1] || correctAnswerRaw || `Pasangan ${idx + 1}`).trim();
                    matchingPairs.push({ left, right });
                    ansObj[String(idx)] = right;
                });
                correctAnswer = ansObj;
            } else if (type === 'true_false') {
                const rawStmts = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ];
                const parsedTF = parseTrueFalseStatementsAndKey(rawStmts, correctAnswerRaw);
                options = parsedTF.options;
                correctAnswer = parsedTF.correctAnswer;
            }

            const selectedBank = appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL'
                ? appData.filters.questionBankId
                : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    existing.orderNum = orderNum;
                    existing.type = type;
                    existing.weight = weight;
                    existing.stimulusText = stimulusText;
                    existing.stimulusImage = stimulusImage;
                    existing.questionText = questionText;
                    existing.questionImage = questionImage;
                    existing.options = options;
                    if (type === 'matching') existing.matchingPairs = matchingPairs;
                    existing.correctAnswer = correctAnswer;
                    existing.explanation = explanation;
                    syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = {
                    id: 'Q-' + Date.now(),
                    bankId: selectedBank,
                    subjectId: appData.subjects[0] ? appData.subjects[0].id : 'SUB-IPAS',
                    classLevel: '4',
                    orderNum,
                    type,
                    weight,
                    stimulusText,
                    stimulusImage,
                    questionText,
                    questionImage,
                    options,
                    matchingPairs: type === 'matching' ? matchingPairs : [],
                    correctAnswer,
                    partialScoring: true,
                    explanation,
                    difficulty: 'Sedang'
                };
                appData.questions.push(newQ);
                syncCollectionRecord('questions', newQ.id, newQ);
                if (appData.exams[0] && Array.isArray(appData.exams[0].questionIds)) {
                    appData.exams[0].questionIds.push(newQ.id);
                    syncCollectionRecord('exams', appData.exams[0].id, appData.exams[0]);
                }
            }

            window.showModal('Berhasil', 'Butir soal berhasil disimpan ke bank soal.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris soal.', 'error');
                        return;
                    }

                    const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                        ? appData.filters.questionBankId
                        : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-DEFAULT');

                    const headerRow = (rows[0] || []).map(h => String(h ?? '').trim().toLowerCase());
                    const hasImageColumns = headerRow.some(h => h.includes('gambar') || h.includes('url')) || (rows[0] && rows[0].length >= 12);

                    const parsedQuestions = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;

                        let typeRaw = String(cols[1] ?? '').trim();
                        let weight = Number(cols[2]) || 10;
                        let stimulusText = '';
                        let stimulusImage = '';
                        let questionText = '';
                        let questionImage = '';
                        let optA = '';
                        let optB = '';
                        let optC = '';
                        let optD = '';
                        let keyRaw = '';
                        let explanation = '';

                        if (hasImageColumns) {
                            stimulusText = String(cols[3] ?? '').trim();
                            stimulusImage = String(cols[4] ?? '').trim();
                            questionText = String(cols[5] ?? '').trim();
                            questionImage = String(cols[6] ?? '').trim();
                            optA = String(cols[7] ?? '').trim();
                            optB = String(cols[8] ?? '').trim();
                            optC = String(cols[9] ?? '').trim();
                            optD = String(cols[10] ?? '').trim();
                            keyRaw = String(cols[11] ?? '').trim();
                            explanation = String(cols[12] ?? '').trim();
                        } else {
                            stimulusText = String(cols[3] ?? '').trim();
                            questionText = String(cols[4] ?? '').trim();
                            optA = String(cols[5] ?? '').trim();
                            optB = String(cols[6] ?? '').trim();
                            optC = String(cols[7] ?? '').trim();
                            optD = String(cols[8] ?? '').trim();
                            keyRaw = String(cols[9] ?? '').trim();
                            explanation = String(cols[10] ?? '').trim();
                        }

                        if (!questionText && !typeRaw) continue;
                        if (!questionText) continue;

                        const normType = normalizeImportedQuestionType(typeRaw);
                        const finalType = normType.code;

                        let options = [];
                        let matchingPairs = [];
                        let correctAnswer = keyRaw;

                        if (finalType === 'pg') {
                            options = [optA || 'Opsi A', optB || 'Opsi B', optC || 'Opsi C', optD || 'Opsi D'];
                            correctAnswer = (keyRaw || 'A').trim().toUpperCase();
                        } else if (finalType === 'pg_complex') {
                            options = [optA || 'Opsi A', optB || 'Opsi B', optC || 'Opsi C', optD || 'Opsi D'];
                            correctAnswer = keyRaw
                                ? keyRaw.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean)
                                : ['A'];
                        } else if (finalType === 'true_false') {
                            const parsedTF = parseTrueFalseStatementsAndKey([optA, optB, optC, optD], keyRaw);
                            options = parsedTF.options;
                            correctAnswer = parsedTF.correctAnswer;
                        } else if (finalType === 'matching') {
                            const rawPairs = [optA, optB, optC, optD].filter(Boolean);
                            const ansMap = {};
                            rawPairs.forEach((r, idx) => {
                                const parts = String(r).split('=');
                                const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                                const right = (parts.slice(1).join('=') || `Pasangan ${idx + 1}`).trim();
                                matchingPairs.push({ left, right });
                                ansMap[String(idx)] = right;
                            });
                            correctAnswer = ansMap;
                        }

                        parsedQuestions.push({
                            orderNum: parsedQuestions.length + 1,
                            type: finalType,
                            isValidType: normType.valid,
                            rawTypeLabel: normType.rawLabel,
                            weight,
                            stimulusText,
                            stimulusImage,
                            questionText,
                            questionImage,
                            options,
                            matchingPairs,
                            correctAnswer,
                            keyDisplay: Array.isArray(correctAnswer) ? correctAnswer.join(', ') : (typeof correctAnswer === 'object' ? JSON.stringify(correctAnswer) : String(correctAnswer)),
                            explanation
                        });
                    }

                    const validQuestions = parsedQuestions.filter(q => q.isValidType);
                    const previewRowsHtml = parsedQuestions.map((q, idx) => `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 align-top">

                            <td class="px-3 py-2 text-xs font-mono font-extrabold text-emerald-700">${escapeHtml(q.keyDisplay)}</td>
                        </tr>

                    const html = `

                            <div class="max-h-80 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-100 border-b border-slate-200 text-[10px] font-extrabold text-slate-600 uppercase sticky top-0">
                                            <th class="px-3 py-2">No</th><th class="px-3 py-2">Jenis Soal</th><th class="px-3 py-2 text-center">Bobot</th><th class="px-3 py-2">Pertanyaan</th><th class="px-3 py-2">Kunci</th>
                                        </tr>
                                    </thead>
                                    <tbody>${previewRowsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    `;

                    window.showModal('Pratinjau Impor Bank Soal (.xlsx)', '', 'info', async (confirmed) => {
                        if (!confirmed) return true;

                            const item = validQuestions[idx];

                                bankId,
                                subjectId: appData.subjects[0] ? appData.subjects[0].id : 'SUB-IPAS',
                                classLevel: '4',
                                orderNum: idx + 1,
                                type: item.type,
                                weight: item.weight,
                                stimulusText: item.stimulusText,
                                stimulusImage: item.stimulusImage,
                                questionText: item.questionText,
                                questionImage: item.questionImage,
                                options: item.options,
                                matchingPairs: item.matchingPairs || [],
                                correctAnswer: item.correctAnswer,
                                partialScoring: true,
                                explanation: item.explanation,
                                difficulty: 'Sedang'
                            };
                            appData.questions.push(newQ);
                            await syncCollectionRecord('questions', newQ.id, newQ);

                        renderQuestionBanksContent(document.getElementById('adminMainContent'));
                        window.showModal('Impor Soal Berhasil', `Berhasil menyimpan ${validQuestions.length} butir soal ke Firebase Firestore.`, 'success');

        function getTodayIsoWIB() {
            const now = new Date(Date.now() + (7 * 3600 * 1000));
            return now.toISOString().slice(0, 10);
        }

        function formatIsoToDDMMYYYY(isoStr) {
            if (!isoStr) return '';
            const clean = String(isoStr).trim();
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
            }
            const parts = clean.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
            }
            return clean;
        }

        function parseDDMMYYYYToIso(valStr) {
            if (!valStr) return '';
            const clean = String(valStr).trim();
            if (/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                const yyyy = p[0];
                const mm = p[1].padStart(2, '0');
                const dd = p[2].padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                const dd = p[0].padStart(2, '0');
                const mm = p[1].padStart(2, '0');
                const yyyy = p[2];
                return `${yyyy}-${mm}-${dd}`;
            }
            return '';
        }

        function normalizeTimeHHMM(valStr, fallback = '07:00') {
            if (!valStr) return fallback;
            const clean = String(valStr).trim().replace(/\./g, ':');
            const m = clean.match(/^(\d{1,2}):(\d{1,2})/);
            if (!m) return fallback;
            const hh = Math.min(23, Math.max(0, Number(m[1]) || 0));
            const mm = Math.min(59, Math.max(0, Number(m[2]) || 0));
            return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }

        window.syncDatePickerFromDisplay = function(textEl, pickerId) {

            textEl.value = v.slice(0, 10);

            if (pickerEl && iso) {

        function isExamStrictlyActive(exam) {
            if (!exam) return false;
            return String(exam.status || '').trim().toLowerCase() === 'aktif';
        }

        function isExamMatchingStudentClass(exam, student) {
            if (!exam || !student) return false;
            if (!exam.classId || exam.classId === 'ALL') return true;
            const examClassName = String(getClassNameById(exam.classId) || '').trim().toLowerCase();
            const studentClassName = String(student.className || getClassNameById(student.classId) || '').trim().toLowerCase();
            return (
                exam.classId === student.classId ||
                exam.classId === student.className ||
                (examClassName !== '' && examClassName === studentClassName)
            );
        }

        function checkExamScheduleAccess(exam) {
            if (!exam) return { allowed: false, state: 'INVALID', message: 'Data ujian tidak ditemukan.' };
            const todayIso = getTodayIsoWIB();
            const startIso = parseDDMMYYYYToIso(exam.startDate) || todayIso;
            const endIso = parseDDMMYYYYToIso(exam.endDate) || todayIso;
            const startTime = normalizeTimeHHMM(exam.startTime, '00:00');
            const endTime = normalizeTimeHHMM(exam.endTime, '23:59');

            const startParts = startIso.split('-').map(Number);
            const endParts = endIso.split('-').map(Number);
            const startT = startTime.split(':').map(Number);
            const endT = endTime.split(':').map(Number);

            // Hitung timestamp absolut dalam zona waktu WIB (UTC+7) tanpa bergantung pada timezone lokal browser
            const startMs = Date.UTC(startParts[0], startParts[1] - 1, startParts[2], startT[0] - 7, startT[1], 0, 0);
            const endMs = Date.UTC(endParts[0], endParts[1] - 1, endParts[2], endT[0] - 7, endT[1], 59, 999);
            const nowMs = Date.now();

            if (!isNaN(startMs) && nowMs < startMs) {
                return {
                    allowed: false,
                    state: 'UPCOMING',
                    message: `Ujian belum dimulai. Jadwal mulai: ${formatIsoToDDMMYYYY(startIso)} pukul ${startTime} WIB.`
                };
            }
            if (!isNaN(endMs) && nowMs > endMs) {
                return {
                    allowed: false,
                    state: 'EXPIRED',
                    message: `Waktu pelaksanaan ujian telah berakhir pada ${formatIsoToDDMMYYYY(endIso)} pukul ${endTime} WIB.`
                };
            }
            return { allowed: true, state: 'ONGOING', message: '' };
        }

        function isExamEligibleForStudent(exam, student) {
            if (!exam || !student) return false;
            if (!isExamStrictlyActive(exam)) return false;
            if (!isExamMatchingStudentClass(exam, student)) return false;
            if (!checkExamScheduleAccess(exam).allowed) return false;
            return true;
        }

        async function verifyExamEligibilityFromServer(examId, student) {
            const blockedMsg = 'Ujian ini sudah ditutup atau melewati jadwal pelaksanaan. Silakan hubungi administrator sekolah.';
            if (!examId || !student) return { allowed: false, message: blockedMsg };
            let targetExam = appData.exams.find(e => e.id === examId) || null;
            if (!IS_PREVIEW && db) {
                const cloudExam = await fetchSingleFirestoreDoc('exams', examId);
                if (!cloudExam) {
                    appData.exams = appData.exams.filter(e => e.id !== examId);
                    return { allowed: false, message: blockedMsg };
                }
                targetExam = cloudExam;
                const idx = appData.exams.findIndex(e => e.id === examId);
                if (idx !== -1) appData.exams[idx] = cloudExam;
                else appData.exams.push(cloudExam);
            }
            if (!targetExam || !isExamStrictlyActive(targetExam)) {
                return { allowed: false, message: blockedMsg };
            }
            if (!isExamMatchingStudentClass(targetExam, student)) {
                return { allowed: false, message: 'Ujian ini tidak diperuntukkan bagi kelas Anda.' };
            }
            const sched = checkExamScheduleAccess(targetExam);
            if (!sched.allowed) {
                return { allowed: false, message: sched.message || blockedMsg };
            }
            return { allowed: true, exam: targetExam };
        }

            const existing = examId ? appData.exams.find(x => x.id === examId) : null;
