            const clean = String(str || '').trim();

                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {

                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    await setDoc(ref, dataObj, { merge: true });
                }
                return true;
            } catch (err) {
                console.error('Firestore Sync Error:', err);
                return false;
            }
        }

        window.showModal = function(title, message, type = 'info', callback = null, options = {}) {
            const modal = document.getElementById('customModal');

            const header = document.getElementById('modalHeader');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const bodyEl = document.getElementById('modalDynamicBody');
            const btnOk = document.getElementById('modalBtnOk');
            const btnCancel = document.getElementById('modalBtnCancel');

            if (header && header.parentElement) {
                header.parentElement.classList.remove('hidden');
            }
            if (header) header.classList.remove('hidden');

            dialogBox.className = `bg-white rounded-2xl shadow-2xl ${options.wide ? 'max-w-3xl' : 'max-w-lg'} w-full mx-auto overflow-hidden transform transition-all my-8 flex flex-col max-h-[90vh]`;
            header.className = `px-6 py-4 text-white flex items-center justify-between shrink-0 ${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`;

            const icon = type === 'error' ? 'triangle-exclamation' : type === 'success' ? 'circle-check' : 'info-circle';
            titleEl.innerHTML = `<i class="fa-solid fa-${icon}"></i> <span>${escapeHtml(title)}</span>`;

            if (message) {
                msgEl.innerText = message;
                msgEl.classList.remove('hidden');
            } else {
                msgEl.innerText = '';
                msgEl.classList.add('hidden');
            }

            bodyEl.innerHTML = options.html || '';
            currentModalCallback = callback;

            const footerEl = document.getElementById('modalFooter');
            if (footerEl) footerEl.classList.remove('hidden');

            if (callback || options.showCancel) {
                btnCancel.classList.remove('hidden');
                btnOk.innerText = options.okText || 'Simpan / Lanjutkan';
            } else {
                btnCancel.classList.add('hidden');
                btnOk.innerText = options.okText || 'OK';
            }

            modal.classList.remove('hidden');
        };

                window.closeModal();

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
                return;
            }
            let tableHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body><table border="1"><thead><tr style="background:#4f46e5;color:#ffffff;font-weight:bold;">`;
            headers.forEach(h => { tableHtml += `<th>${escapeHtml(h)}</th>`; });
            tableHtml += `</tr></thead><tbody>`;
            rows.forEach(row => {
                tableHtml += `<tr>`;
                row.forEach(cell => { tableHtml += `<td>${escapeHtml(cell)}</td>`; });
                tableHtml += `</tr>`;
            });
            tableHtml += `</tbody></table></body></html>`;

            const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = cleanName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            window.renderStudentPortal();

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Tahun Pelajaran', 'Status'];
            const rows = appData.students.map((s, idx) => {
                const schoolVal = s.asalSekolah !== undefined ? (s.asalSekolah || '-') : (appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG');
                return [idx + 1, s.nisn, s.nis || '-', s.fullName, schoolVal, s.gender || 'L', s.className, s.academicYear, s.status];
            });
            window.downloadExcelFile('Data_Siswa_CBT_Sekolah.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa di bawah baris judul (header).', 'error');
                        return;
                    }

                    const headerRow = (rows[0] || []).map(h => String(h ?? '').trim().toLowerCase());
                    const hasAsalSekolahHeader = headerRow.some(h => h.includes('asal sekolah') || h.includes('asalsekolah') || h.includes('sekolah'));

                    const parsedStudents = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;
                        const nisn = String(cols[0] ?? '').trim();
                        const nis = String(cols[1] ?? '').trim();
                        const fullName = String(cols[2] ?? '').trim();

                        let asalSekolah = '';
                        let gender = 'L';
                        let className = '4';
                        let pin = '123456';

                        if (hasAsalSekolahHeader || cols.length >= 7) {
                            asalSekolah = String(cols[3] ?? '').trim();
                            gender = String(cols[4] ?? 'L').trim().toUpperCase();
                            className = String(cols[5] ?? '4').trim();
                            pin = String(cols[6] ?? '123456').trim() || '123456';
                        } else {
                            asalSekolah = '';
                            gender = String(cols[3] ?? 'L').trim().toUpperCase();
                            className = String(cols[4] ?? '4').trim();
                            pin = String(cols[5] ?? '123456').trim() || '123456';
                        }

                        if (!nisn && !fullName) continue;
                        if (!nisn || !fullName) continue;

                        const isDuplicate = appData.students.some(s => s.nisn === nisn) || parsedStudents.some(s => s.nisn === nisn);
                        parsedStudents.push({
                            nisn,
                            nis: nis || '-',
                            fullName,
                            asalSekolah,
                            gender: gender === 'P' ? 'P' : 'L',
                            className: className || '4',
                            pin,
                            isDuplicate
                        });
                    }

                    if (parsedStudents.length === 0) {
                        window.showModal('Tidak Ada Data Valid', 'Pastikan kolom NISN dan Nama Lengkap terisi sesuai Template_Impor_Siswa.xlsx.', 'error');
                        return;
                    }

                    const validList = parsedStudents.filter(s => !s.isDuplicate);
                    const emptySchoolCount = validList.filter(s => !s.asalSekolah).length;

                    const previewRowsHtml = parsedStudents.map((s, idx) => `
                        <tr class="border-b border-slate-100 ${s.isDuplicate ? 'bg-amber-50/70 text-slate-400' : 'hover:bg-slate-50'}">
                            <td class="px-3 py-2 text-xs">${idx + 1}</td>
                            <td class="px-3 py-2 text-xs font-mono font-bold">${escapeHtml(s.nisn)}</td>
                            <td class="px-3 py-2 text-xs">${escapeHtml(s.nis)}</td>
                            <td class="px-3 py-2 text-xs font-bold text-slate-800">${escapeHtml(s.fullName)}</td>
                            <td class="px-3 py-2 text-xs font-semibold ${s.asalSekolah ? 'text-indigo-700' : 'text-red-500 italic'}">
                                ${s.asalSekolah ? escapeHtml(s.asalSekolah) : '<i class="fa-solid fa-circle-exclamation mr-1"></i>Kosong (-)'}
                            </td>
                            <td class="px-3 py-2 text-xs text-center">${escapeHtml(s.gender)}</td>
                            <td class="px-3 py-2 text-xs text-center font-bold">${escapeHtml(s.className)}</td>
                            <td class="px-3 py-2 text-xs font-mono">${escapeHtml(s.pin)}</td>
                            <td class="px-3 py-2 text-xs">
                                ${s.isDuplicate
                                    ? '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded-full text-[10px] font-bold">NISN Duplikat (Dilewati)</span>'
                                    : '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-[10px] font-bold">Siap Diimpor</span>'}
                            </td>
                        </tr>
                    `).join('');

                    const html = `
                        <div class="space-y-3">
                            <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl flex flex-wrap items-center justify-between gap-2 text-xs">
                                <div>
                                    <span class="font-bold text-indigo-900">File: ${escapeHtml(file.name)}</span>
                                    <p class="text-[11px] text-indigo-700 mt-0.5">Total Terbaca: <strong>${parsedStudents.length} baris</strong> • Siap Disimpan: <strong>${validList.length} siswa</strong></p>
                                </div>
                                <span class="px-2.5 py-1 bg-white text-indigo-700 rounded-lg font-bold border border-indigo-200">Pratinjau Excel</span>
                            </div>
                            ${emptySchoolCount > 0 ? `
                                <div class="p-2.5 bg-amber-50 border border-amber-200 rounded-xl text-[11px] text-amber-800 flex items-center gap-2">
                                    <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
                                    <span>Terdapat <strong>${emptySchoolCount} baris</strong> dengan kolom <strong>Asal Sekolah</strong> kosong. Data tersebut akan disimpan sebagai nilai kosong ("") sesuai isi file Excel.</span>
                                </div>
                            ` : ''}
                            <div class="max-h-72 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-100 border-b border-slate-200 text-[10px] font-extrabold text-slate-600 uppercase sticky top-0">
                                            <th class="px-3 py-2">No</th>
                                            <th class="px-3 py-2">NISN</th>
                                            <th class="px-3 py-2">NIS</th>
                                            <th class="px-3 py-2">Nama Lengkap</th>
                                            <th class="px-3 py-2">Asal Sekolah</th>
                                            <th class="px-3 py-2 text-center">L/P</th>
                                            <th class="px-3 py-2 text-center">Kelas</th>
                                            <th class="px-3 py-2">PIN</th>
                                            <th class="px-3 py-2">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>${previewRowsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    `;

                    window.showModal('Pratinjau Impor Data Siswa (.xlsx)', '', 'info', (confirmed) => {
                        if (!confirmed) return true;
                        if (validList.length === 0) {
                            window.showModal('Info', 'Tidak ada siswa baru untuk disimpan karena seluruh NISN sudah terdaftar.', 'info');
                            return true;
                        }
                        validList.forEach(item => {
                            const clsObj = appData.classes.find(c => String(c.className).toLowerCase() === String(item.className).toLowerCase()) || appData.classes[0];
                            const newStd = {
                                id: 'STD-' + Date.now() + '-' + Math.floor(Math.random() * 10000),
                                nisn: item.nisn,
                                nis: item.nis,
                                fullName: item.fullName,
                                asalSekolah: item.asalSekolah,
                                gender: item.gender,
                                classId: clsObj ? clsObj.id : 'CLS-4A',
                                className: clsObj ? clsObj.className : item.className,
                                academicYear: appData.settings.academicYear,
                                username: item.nisn,
                                passwordHash: hashCredential(item.pin),
                                status: 'Aktif'
                            };
                            appData.students.push(newStd);
                            syncCollectionRecord('students', newStd.id, newStd);
                        });
                        logActivity(`Impor Excel Siswa selesai: ${validList.length} data siswa baru ditambahkan.`);
                        renderStudentsContent(document.getElementById('adminMainContent'));
                        window.showModal('Impor Berhasil', `Berhasil menyimpan ${validList.length} data siswa beserta data Asal Sekolah ke database.`, 'success');
                        return true;
                    }, { html, wide: true, showCancel: true, okText: `Simpan ${validList.length} Siswa ke Database` });
                });
            };
            fileInput.click();
        };

        window.updateQuestionLivePreview = function() {
            const num = document.getElementById('qFormNum')?.value || '1';
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = document.getElementById('qFormWeight')?.value || '10';
            const stimulus = document.getElementById('qFormStimulus')?.value || '';
            const stimImgUrl = document.getElementById('qFormStimulusImg')?.value || '';
            const text = document.getElementById('qFormText')?.value || '';
            const qImgUrl = document.getElementById('qFormQuestionImg')?.value || '';
            const key = document.getElementById('qFormKey')?.value || '-';
            const expl = document.getElementById('qFormExplanation')?.value || '-';

            const optA = document.getElementById('qOptA')?.value || 'Opsi A';
            const optB = document.getElementById('qOptB')?.value || 'Opsi B';
            const optC = document.getElementById('qOptC')?.value || 'Opsi C';
            const optD = document.getElementById('qOptD')?.value || 'Opsi D';

            const numLabel = document.getElementById('previewNumLabel');
            const weightLabel = document.getElementById('previewWeightLabel');
            const stimBox = document.getElementById('previewStimulusBox');
            const stimText = document.getElementById('previewStimulusText');
            const stimImg = document.getElementById('previewStimulusImg');
            const qText = document.getElementById('previewQuestionText');
            const qImg = document.getElementById('previewQuestionImg');
            const optList = document.getElementById('previewOptionsList');
            const keyText = document.getElementById('previewKeyText');
            const explText = document.getElementById('previewExplText');

            if (!numLabel) return;
            numLabel.innerText = `Soal Nomor ${num}`;
            weightLabel.innerText = `Bobot: ${weight} Poin`;

            if (stimulus.trim() || stimImgUrl.trim()) {
                stimText.innerText = stimulus;
                if (stimImg) {
                    if (stimImgUrl.trim()) {
                        stimImg.src = stimImgUrl.trim();
                        stimImg.classList.remove('hidden');
                    } else {
                        stimImg.classList.add('hidden');
                    }
                }
                stimBox.classList.remove('hidden');
            } else {
                stimBox.classList.add('hidden');
            }

            qText.innerText = text.trim() ? text : '(Teks pertanyaan akan tampil di sini)';
            if (qImg) {
                if (qImgUrl.trim()) {
                    qImg.src = qImgUrl.trim();
                    qImg.classList.remove('hidden');
                } else {
                    qImg.classList.add('hidden');
                }
            }

            keyText.innerText = key.trim() ? key : '-';
            explText.innerText = expl.trim() ? expl : '-';

            if (type === 'pg' || type === 'pg_complex') {
                optList.innerHTML = `
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold w-5">A.</span> <span>${escapeHtml(optA)}</span></div>
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold w-5">B.</span> <span>${escapeHtml(optB)}</span></div>
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold w-5">C.</span> <span>${escapeHtml(optC)}</span></div>
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold w-5">D.</span> <span>${escapeHtml(optD)}</span></div>
                `;
            } else if (type === 'matching') {
                optList.innerHTML = [optA, optB, optC, optD].filter(x => x && !x.startsWith('Opsi ')).map((pair, i) => `
                    <div class="p-2 bg-white rounded-xl border border-slate-200 text-xs flex items-center justify-between">
                        <span class="font-semibold">#${i + 1}</span>
                        <span>${escapeHtml(pair)}</span>
                    </div>
                `).join('') || `<div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs text-slate-400">Masukkan pasangan kiri = kanan</div>`;
            } else if (type === 'true_false') {
                optList.innerHTML = `
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold">Opsi 1:</span> Benar</div>
                    <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center gap-2"><span class="font-bold">Opsi 2:</span> Salah</div>

                optList.innerHTML = `<div class="p-3 bg-white rounded-xl border border-slate-200 text-xs italic text-slate-400">Kolom jawaban teks isian / uraian untuk siswa.</div>`;
            }

        window.loadQuestionIntoForm = function(qId) {
            const delBtn = document.getElementById('btnDeleteCurrentQuestion');
            if (!qId) {
                if (delBtn) delBtn.classList.add('hidden');
                return;
            }
            const q = appData.questions.find(x => x.id === qId);
            if (!q) return;

            if (delBtn) delBtn.classList.remove('hidden');
            const editEl = document.getElementById('editQuestionId');
            if (editEl) editEl.value = q.id;
            const numEl = document.getElementById('qFormNum');
            if (numEl) numEl.value = q.orderNum || 1;
            const typeEl = document.getElementById('qFormType');
            if (typeEl) typeEl.value = q.type || 'pg';
            const weightEl = document.getElementById('qFormWeight');
            if (weightEl) weightEl.value = q.weight || 10;
            const stimEl = document.getElementById('qFormStimulus');
            if (stimEl) stimEl.value = q.stimulusText || '';
            const stimImgEl = document.getElementById('qFormStimulusImg');
            if (stimImgEl) stimImgEl.value = q.stimulusImage || '';
            const txtEl = document.getElementById('qFormText');
            if (txtEl) txtEl.value = q.questionText || '';
            const qImgEl = document.getElementById('qFormQuestionImg');
            if (qImgEl) qImgEl.value = q.questionImage || '';

            const keyEl = document.getElementById('qFormKey');
            if (keyEl) {
                if (q.type === 'matching' && q.matchingPairs) {
                    keyEl.value = q.matchingPairs.map(p => `${p.left}=${p.right}`).join('; ');
                } else {
                    keyEl.value = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(',') : (typeof q.correctAnswer === 'object' ? JSON.stringify(q.correctAnswer) : (q.correctAnswer || ''));
                }
            }
            const explEl = document.getElementById('qFormExplanation');
            if (explEl) explEl.value = q.explanation || '';

            window.handleQuestionTypeChange();
            if (q.type === 'matching' && Array.isArray(q.matchingPairs)) {
                const ids = ['qOptA', 'qOptB', 'qOptC', 'qOptD'];
                q.matchingPairs.forEach((p, idx) => {
                    if (ids[idx] && document.getElementById(ids[idx])) {
                        document.getElementById(ids[idx]).value = `${p.left} = ${p.right}`;
                    }
                });
            } else if (q.options && q.options.length >= 2) {
                if (document.getElementById('qOptA')) document.getElementById('qOptA').value = q.options[0] || '';
                if (document.getElementById('qOptB')) document.getElementById('qOptB').value = q.options[1] || '';
                if (document.getElementById('qOptC')) document.getElementById('qOptC').value = q.options[2] || '';
                if (document.getElementById('qOptD')) document.getElementById('qOptD').value = q.options[3] || '';
            }
            window.updateQuestionLivePreview();
        };

        window.saveQuestionRecord = function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const stimulusImage = (document.getElementById('qFormStimulusImg')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const questionImage = (document.getElementById('qFormQuestionImg')?.value || '').trim();
            const correctAnswerRaw = (document.getElementById('qFormKey')?.value || '').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi Soal', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }

            let options = [];
            let matchingPairs = [];
            let correctAnswer = correctAnswerRaw || 'A';

            if (type === 'pg' || type === 'pg_complex') {
                options = [
                    document.getElementById('qOptA')?.value || 'Opsi A',
                    document.getElementById('qOptB')?.value || 'Opsi B',
                    document.getElementById('qOptC')?.value || 'Opsi C',
                    document.getElementById('qOptD')?.value || 'Opsi D'
                ];
                if (type === 'pg_complex') {
                    correctAnswer = correctAnswerRaw ? correctAnswerRaw.split(',').map(x => x.trim().toUpperCase()) : ['A'];
                } else {
                    correctAnswer = (correctAnswerRaw || 'A').toUpperCase();
                }
            } else if (type === 'matching') {
                const rawPairs = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ].filter(x => x.trim() !== '');
                const ansObj = {};
                rawPairs.forEach((rp, idx) => {
                    const parts = rp.split('=');
                    const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                    const right = (parts[1] || correctAnswerRaw || `Pasangan ${idx + 1}`).trim();
                    matchingPairs.push({ left, right });
                    ansObj[String(idx)] = right;
                });
                correctAnswer = ansObj;
            } else if (type === 'true_false') {
                options = ['Benar', 'Salah'];
            }

            const selectedBank = appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL'
                ? appData.filters.questionBankId
                : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-IPAS4');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    existing.orderNum = orderNum;
                    existing.type = type;
                    existing.weight = weight;
                    existing.stimulusText = stimulusText;
                    existing.stimulusImage = stimulusImage;
                    existing.questionText = questionText;
                    existing.questionImage = questionImage;
                    existing.options = options;
                    if (type === 'matching') existing.matchingPairs = matchingPairs;
                    existing.correctAnswer = correctAnswer;
                    existing.explanation = explanation;
                    syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = {
                    id: 'Q-' + Date.now(),
                    bankId: selectedBank,
                    subjectId: 'SUB-IPAS',
                    classLevel: '4',
                    orderNum,
                    type,
                    weight,
                    stimulusText,
                    stimulusImage,
                    questionText,
                    questionImage,
                    options,
                    matchingPairs: type === 'matching' ? matchingPairs : undefined,
                    correctAnswer,
                    explanation,
                    difficulty: 'Sedang'
                };
                appData.questions.push(newQ);
                syncCollectionRecord('questions', newQ.id, newQ);
                if (appData.exams[0] && Array.isArray(appData.exams[0].questionIds)) {
                    appData.exams[0].questionIds.push(newQ.id);
                }

        window.executeExportQuestionsExcel = function(mode = 'ALL', bankId = '') {
            let questionsToExport = [];
            if (mode === 'PACKAGE') {
                if (!bankId) {
                    window.showModal('Pilih Paket', 'Silakan pilih paket bank soal terlebih dahulu.', 'error');
                    return false;
                }
                questionsToExport = appData.questions.filter(q => q.bankId === bankId);
            } else {
                questionsToExport = [...appData.questions];
            }

            if (questionsToExport.length === 0) {
                window.showModal('Bank Soal Kosong', 'Tidak ada butir soal untuk diekspor pada pilihan tersebut.', 'error');
                return false;
            }

            const headers = [
                'No',
                'Jenis Soal (pg/pg_complex/true_false/matching/short_answer/essay)',
                'Bobot Poin',
                'Teks Stimulus / Wacana',
                'URL Gambar Stimulus (Opsional)',
                'Teks Pertanyaan Soal',
                'URL Gambar Soal (Opsional)',
                'Opsi A / Pasangan 1',
                'Opsi B / Pasangan 2',
                'Opsi C / Pasangan 3',
                'Opsi D / Pasangan 4',
                'Kunci Jawaban',
                'Pembahasan Soal'
            ];

            const rows = questionsToExport.map((q, idx) => {
                const qType = q.type || 'pg';
                let optA = '';
                let optB = '';
                let optC = '';
                let optD = '';
                let keyStr = '';

                if (qType === 'matching') {
                    const pairs = Array.isArray(q.matchingPairs) ? q.matchingPairs : [];
                    if (pairs[0]) optA = `${pairs[0].left} = ${pairs[0].right}`;
                    if (pairs[1]) optB = `${pairs[1].left} = ${pairs[1].right}`;
                    if (pairs[2]) optC = `${pairs[2].left} = ${pairs[2].right}`;
                    if (pairs[3]) optD = `${pairs[3].left} = ${pairs[3].right}`;
                    keyStr = pairs.map(p => `${p.left}=${p.right}`).join('; ');
                } else if (qType === 'true_false') {
                    optA = 'Benar';
                    optB = 'Salah';
                    keyStr = String(q.correctAnswer || 'Benar');
                } else if (qType === 'pg' || qType === 'pg_complex') {
                    const opts = Array.isArray(q.options) ? q.options : [];
                    optA = opts[0] !== undefined ? String(opts[0]) : '';
                    optB = opts[1] !== undefined ? String(opts[1]) : '';
                    optC = opts[2] !== undefined ? String(opts[2]) : '';
                    optD = opts[3] !== undefined ? String(opts[3]) : '';
                    if (Array.isArray(q.correctAnswer)) {
                        keyStr = q.correctAnswer.join(', ');
                    } else {
                        keyStr = String(q.correctAnswer || 'A');
                    }
                } else {
                    const opts = Array.isArray(q.options) ? q.options : [];
                    optA = opts[0] !== undefined ? String(opts[0]) : '';
                    optB = opts[1] !== undefined ? String(opts[1]) : '';
                    optC = opts[2] !== undefined ? String(opts[2]) : '';
                    optD = opts[3] !== undefined ? String(opts[3]) : '';
                    keyStr = typeof q.correctAnswer === 'object' && q.correctAnswer !== null
                        ? JSON.stringify(q.correctAnswer)
                        : String(q.correctAnswer !== undefined && q.correctAnswer !== null ? q.correctAnswer : '');
                }

                return [
                    q.orderNum || (idx + 1),
                    qType,
                    Number(q.weight) || 10,
                    q.stimulusText || '',
                    q.stimulusImage || '',
                    q.questionText || '',
                    q.questionImage || '',
                    optA,
                    optB,
                    optC,
                    optD,
                    keyStr,
                    q.explanation || ''
                ];
            });

            const rawSchool = (appData.settings.schoolName || 'SDN_GEDONGBOYOUNTUNG').trim().toUpperCase();
            const safeSchool = rawSchool.replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const dateStr = `${yyyy}-${mm}-${dd}`;
            const fileName = `ARSIP_BANK_SOAL_${safeSchool}_${dateStr}.xlsx`;

            window.downloadExcelFile(fileName, headers, rows);
            logActivity(`Ekspor Bank Soal berhasil (${questionsToExport.length} soal) ke file ${fileName}.`);
            return true;
        };

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris soal di bawah baris judul (header).', 'error');
                        return;
                    }

                    const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                        ? appData.filters.questionBankId
                        : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-IPAS4');

                    const parsedQuestions = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;

                        let fileOrderNum = i;
                        let typeRaw = '';
                        let weight = 10;
                        let stimulusText = '';
                        let stimulusImage = '';
                        let questionText = '';
                        let questionImage = '';
                        let optA = '';
                        let optB = '';
                        let optC = '';
                        let optD = '';
                        let keyRaw = '';
                        let explanation = '';

                        if (cols.length >= 12) {
                            const parsedNum = Number(cols[0]);
                            if (!isNaN(parsedNum) && parsedNum > 0) fileOrderNum = parsedNum;
                            typeRaw = String(cols[1] ?? 'pg').trim().toLowerCase();
                            weight = Number(cols[2]) || 10;
                            stimulusText = String(cols[3] ?? '').trim();
                            stimulusImage = String(cols[4] ?? '').trim();
                            questionText = String(cols[5] ?? '').trim();
                            questionImage = String(cols[6] ?? '').trim();
                            optA = String(cols[7] ?? '').trim();
                            optB = String(cols[8] ?? '').trim();
                            optC = String(cols[9] ?? '').trim();
                            optD = String(cols[10] ?? '').trim();
                            keyRaw = String(cols[11] ?? 'A').trim();
                            explanation = String(cols[12] ?? '').trim();
                        } else {
                            const parsedNum = Number(cols[0]);
                            if (!isNaN(parsedNum) && parsedNum > 0) fileOrderNum = parsedNum;
                            typeRaw = String(cols[1] ?? 'pg').trim().toLowerCase();
                            weight = Number(cols[2]) || 10;
                            stimulusText = String(cols[3] ?? '').trim();
                            questionText = String(cols[4] ?? '').trim();
                            optA = String(cols[5] ?? '').trim();
                            optB = String(cols[6] ?? '').trim();
                            optC = String(cols[7] ?? '').trim();
                            optD = String(cols[8] ?? '').trim();
                            keyRaw = String(cols[9] ?? 'A').trim();
                            explanation = String(cols[10] ?? '').trim();
                        }

                        if (!questionText) continue;

                        const validTypes = ['pg', 'pg_complex', 'true_false', 'matching', 'short_answer', 'essay'];
                        const finalType = validTypes.includes(typeRaw) ? typeRaw : 'pg';

                        let options = [];
                        let matchingPairs = undefined;
                        let correctAnswer = keyRaw;

                        if (finalType === 'pg' || finalType === 'pg_complex') {
                            options = [optA || 'Opsi A', optB || 'Opsi B', optC || 'Opsi C', optD || 'Opsi D'];
                            if (finalType === 'pg_complex') {
                                correctAnswer = keyRaw ? keyRaw.split(',').map(x => x.trim().toUpperCase()) : ['A'];
                            } else {
                                correctAnswer = (keyRaw || 'A').toUpperCase();
                            }
                        } else if (finalType === 'matching') {
                            const rawPairs = [optA, optB, optC, optD].filter(Boolean);
                            matchingPairs = [];
                            const ansMap = {};
                            rawPairs.forEach((r, idx) => {
                                const parts = String(r).split('=');
                                const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                                const right = (parts.slice(1).join('=') || `Pasangan ${idx + 1}`).trim();
                                matchingPairs.push({ left, right });
                                ansMap[String(idx)] = right;
                            });
                            if (matchingPairs.length === 0 && keyRaw.includes('=')) {
                                keyRaw.split(';').map(s => s.trim()).filter(Boolean).forEach((pairStr, pIdx) => {
                                    const pts = pairStr.split('=');
                                    const l = (pts[0] || `Pernyataan ${pIdx + 1}`).trim();
                                    const r = (pts.slice(1).join('=') || `Pasangan ${pIdx + 1}`).trim();
                                    matchingPairs.push({ left: l, right: r });
                                    ansMap[String(pIdx)] = r;
                                });
                            }
                            correctAnswer = ansMap;
                        }

                        parsedQuestions.push({
                            orderNum: i,
                            type: finalType,
                            weight,
                            stimulusText,
                            stimulusImage,
                            questionText,
                            questionImage,
                            options,
                            matchingPairs,
                            correctAnswer,
                            keyDisplay: Array.isArray(correctAnswer) ? correctAnswer.join(', ') : (typeof correctAnswer === 'object' ? JSON.stringify(correctAnswer) : String(correctAnswer)),
                            explanation
                        });
                    }

                    if (parsedQuestions.length === 0) {
                        window.showModal('Tidak Ada Soal Terbaca', 'Pastikan kolom Teks Pertanyaan Soal sudah diisi sesuai Template Excel Bank Soal.', 'error');

        window.regenerateExamToken = function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newToken = '';
            for (let i = 0; i < 6; i++) newToken += chars.charAt(Math.floor(Math.random() * chars.length));
            ex.token = newToken;
            syncCollectionRecord('exams', ex.id, ex);
            logActivity(`Token ujian ${ex.examName} diperbarui menjadi ${newToken}.`);
            renderSchedulesContent(document.getElementById('adminMainContent'));
        };

        window.resetStudentExamSession = function(studentId, examId = '') {
            window.showModal('Konfirmasi Reset Sesi', 'Mereset sesi akan menghapus hasil ujian dan hitungan pelanggaran siswa ini agar siswa dapat mengerjakan ujian kembali dari awal. Lanjutkan?', 'error', (confirmed) => {
                if (confirmed) {
                    const toRemove = appData.examResults.filter(r => r.studentId === studentId && (!examId || r.examId === examId));
                    toRemove.forEach(r => syncCollectionRecord('examResults', r.resultId, null, true));
                    appData.examResults = appData.examResults.filter(r => !(r.studentId === studentId && (!examId || r.examId === examId)));
                    const part = appData.examParticipants.find(p => p.studentId === studentId && (!examId || p.examId === examId));
                    if (part) {
                        part.status = 'Belum Mulai';
                        part.violationCount = 0;
                        syncCollectionRecord('examParticipants', part.id, part);
                    }
                    const stdObj = appData.students.find(s => s.id === studentId);
                    logActivity(`Sesi ujian siswa ${stdObj ? stdObj.fullName : studentId} telah direset oleh Administrator.`);
                    renderParticipantsContent(document.getElementById('adminMainContent'));
                }
            }, { okText: 'Ya, Reset Sesi' });
        };

        window.resetAllExamSessions = function(examId) {
            if (!examId) {
                window.showModal('Pilih Paket Ujian', 'Tidak ada paket ujian aktif yang dipilih untuk direset.', 'error');
                return;
            }
            const activeExam = appData.exams.find(e => e.id === examId);
            const examName = activeExam ? activeExam.examName : 'Paket Ujian Ini';

            window.showModal(
                'Konfirmasi Reset Semua Sesi',
                `Apakah Anda yakin ingin mereset sesi seluruh peserta pada paket ujian "${examName}"? Semua siswa dapat memulai ulang ujian dari awal.`,
                'error',
                (confirmed) => {
                    if (confirmed) {
                        let successCount = 0;
                        appData.students.forEach(s => {
                            const toRemove = appData.examResults.filter(r => r.studentId === s.id && r.examId === examId);
                            toRemove.forEach(r => syncCollectionRecord('examResults', r.resultId, null, true));
                            appData.examResults = appData.examResults.filter(r => !(r.studentId === s.id && r.examId === examId));

                            let part = appData.examParticipants.find(p => p.studentId === s.id && p.examId === examId);
                            if (part) {
                                part.status = 'Belum Mulai';
                                part.violationCount = 0;
                                syncCollectionRecord('examParticipants', part.id, part);
                            } else {
                                const newPart = {
                                    id: 'PRT-' + s.id + '-' + examId,
                                    examId,
                                    studentId: s.id,
                                    nisn: s.nisn,
                                    studentName: s.fullName,
                                    className: s.className || '4',
                                    status: 'Belum Mulai',
                                    violationCount: 0,
                                    extraTimeMinutes: 0
                                };
                                appData.examParticipants.push(newPart);
                                syncCollectionRecord('examParticipants', newPart.id, newPart);
                            }
                            successCount++;
                        });

                        logActivity(`Administrator mereset sesi seluruh peserta (${successCount} siswa) untuk paket ujian ${examName}.`);
                        renderParticipantsContent(document.getElementById('adminMainContent'));
                        window.showModal('Reset Sesi Berhasil', `Berhasil mereset sesi ujian untuk ${successCount} peserta. Seluruh siswa kini dapat mengikuti ujian kembali dari awal.`, 'success');

        window.openEssayGradingModal = function(resultId) {
            const res = appData.examResults.find(r => r.resultId === resultId);

            const essayQuestions = appData.questions.filter(q => q.type === 'essay');

            const studentAns = (res.answersSnapshot && q) ? (res.answersSnapshot[q.id] || '(Tidak dijawab)') : '(Tidak dijawab)';

            const student = appData.currentUser;
            if (student) {

                if (!p) {
                    p = {
                        id: 'PRT-' + Date.now(),
                        examId: currentActiveExam.id,
                        studentId: student.studentId,
                        nisn: student.nisn,
                        studentName: student.name,
                        className: student.className || '4',
                        status: 'Sedang Mengerjakan',
                        violationCount: currentViolationCount,

                    };

            const footerEl = document.getElementById('modalFooter');

        window.startExamSession = function(examId) {
            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) return;
            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = [...appData.questions];
            }
            currentStudentAnswers = {};
            currentDoubtfulMap = {};
            currentQuestionIndex = 0;
            currentViolationCount = 0;
            lastViolationTimestamp = 0;
            remainingSeconds = ex.durationMinutes * 60;

            const student = appData.currentUser;
            if (student) {
                let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
                if (!p) {
                    p = {
                        id: 'PRT-' + Date.now(),

                        studentId: student.studentId,
                        nisn: student.nisn,
                        studentName: student.name,
                        className: student.className || '4',

                    currentViolationCount = p.violationCount || 0;

            renderExamWorkspace();
            startExamTimer();
            window.attachAntiCheatListeners();

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) {
                    timerEl.innerText = formatHMS(remainingSeconds);
                }
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.detachAntiCheatListeners();
                    window.showModal('Waktu Habis', 'Waktu pengerjaan ujian telah berakhir. Jawaban Anda otomatis dikirim.', 'info', () => {
                        window.submitExamFinal();
                    });
                }
            }, 1000);
        }

        function getQuestionTypeBadgeLabel(type) {
            if (type === 'pg') return 'Pilihan Ganda';
            if (type === 'pg_complex') return 'Pilihan Ganda Kompleks';
            if (type === 'true_false') return 'Benar / Salah';
            if (type === 'matching') return 'Menjodohkan';
            if (type === 'short_answer') return 'Isian Singkat';
            if (type === 'essay') return 'Uraian / Esai';
            return 'Pilihan Ganda';
        }

        function getQuestionInstructionText(type) {
            if (type === 'pg') return 'Pilih satu jawaban yang paling tepat!';
            if (type === 'pg_complex') return 'Pilih lebih dari satu jawaban yang benar!';
            if (type === 'true_false') return 'Tentukan apakah pernyataan tersebut Benar atau Salah!';
            if (type === 'matching') return 'Pasangkan setiap pernyataan di sebelah kiri dengan pasangan yang tepat!';
            if (type === 'short_answer') return 'Ketikkan jawaban singkat dan tepat pada kolom yang tersedia!';
            if (type === 'essay') return 'Tuliskan uraian jawaban lengkap Anda pada kolom di bawah ini!';
            return 'Pilih satu jawaban yang paling tepat!';
        }

        function isQuestionAnswered(ans) {
            if (ans === undefined || ans === null || ans === '') return false;
            if (Array.isArray(ans)) return ans.length > 0;
            if (typeof ans === 'object') return Object.keys(ans).length > 0;
            return true;
        }

            const q = currentExamQuestions[currentQuestionIndex];
            if (!q) return;

            let answeredTotal = 0;
            let doubtfulTotal = 0;

            const gridNav = currentExamQuestions.map((item, idx) => {
                const ans = currentStudentAnswers[item.id];
                const isDoubt = !!currentDoubtfulMap[item.id];
                const isAns = isQuestionAnswered(ans);
                if (isAns) answeredTotal++;
                if (isDoubt) doubtfulTotal++;

                let btnStyle = 'bg-slate-100 text-slate-700 border border-slate-200 hover:bg-slate-200 font-bold';
                if (idx === currentQuestionIndex) {
                    btnStyle = 'bg-white text-slate-900 font-extrabold border-2 border-blue-600 ring-2 ring-blue-100 shadow-xs';
                } else if (isDoubt) {
                    btnStyle = 'bg-amber-400 text-slate-950 font-extrabold border border-amber-500';
                } else if (isAns) {
                    btnStyle = 'bg-blue-600 text-white font-extrabold border border-blue-700';
                }
                return `<button type="button" onclick="window.jumpToQuestion(${idx})" class="h-10 rounded-xl text-xs flex items-center justify-center transition ${btnStyle}">${idx + 1}</button>`;
            }).join('');

            let answerInputHtml = '';
            if (q.type === 'pg') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur === letter;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${letter}')" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white hover:border-blue-300'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                            </div>
                            <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${selected ? 'border-blue-600' : 'border-slate-300'}">
                                ${selected ? '<span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>' : ''}
                            </span>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'pg_complex') {
                const cur = Array.isArray(currentStudentAnswers[q.id]) ? currentStudentAnswers[q.id] : [];
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur.includes(letter);
                    return `
                        <label class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white hover:border-blue-300'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                            </div>
                            <input type="checkbox" value="${letter}" ${selected ? 'checked' : ''} onchange="window.saveComplexAnswer('${q.id}', '${letter}', this.checked)" class="w-5 h-5 text-blue-600 rounded border-slate-300">
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'true_false') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = ['Benar', 'Salah'].map((val, i) => {
                    const letter = i === 0 ? 'B' : 'S';
                    const selected = cur === val;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${val}')" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white hover:border-blue-300'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-bold text-slate-800">${val}</span>
                            </div>
                            <span class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${selected ? 'border-blue-600' : 'border-slate-300'}">
                                ${selected ? '<span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>' : ''}
                            </span>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'matching') {
                const pairs = Array.isArray(q.matchingPairs) ? q.matchingPairs : [];
                const rightOptions = pairs.map(p => p.right);
                const curObj = (typeof currentStudentAnswers[q.id] === 'object' && currentStudentAnswers[q.id] !== null) ? currentStudentAnswers[q.id] : {};
                answerInputHtml = pairs.map((p, idx) => {
                    const selectedVal = curObj[String(idx)] || '';
                    const optsHtml = rightOptions.map(ro => `<option value="${escapeHtml(ro)}" ${selectedVal === ro ? 'selected' : ''}>${escapeHtml(ro)}</option>`).join('');
                    return `
                        <div class="p-3.5 bg-white rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <span class="text-xs font-semibold text-slate-800">${idx + 1}. ${escapeHtml(p.left)}</span>
                            <select onchange="window.saveMatchingAnswer('${q.id}', '${idx}', this.value)" class="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-blue-700">
                                <option value="">-- Pilih Pasangan --</option>
                                ${optsHtml}
                            </select>
                        </div>
                    `;
                }).join('');
            } else if (q.type === 'short_answer') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<input type="text" value="${escapeHtml(cur)}" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban singkat Anda di sini..." class="w-full p-4 bg-white border border-slate-300 rounded-2xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500">`;
            } else if (q.type === 'essay') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<textarea rows="5" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban uraian lengkap Anda di sini..." class="w-full p-4 bg-white border border-slate-300 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${escapeHtml(cur)}</textarea>`;
            }

            const isCurrentDoubtful = !!currentDoubtfulMap[q.id];
            const hasStimulusText = Boolean(q.stimulusText && q.stimulusText.trim());
            const hasStimulusImg = Boolean(q.stimulusImage && q.stimulusImage.trim());
            const hasQuestionImg = Boolean(q.questionImage && q.questionImage.trim());

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden select-none">
                    <header class="min-h-16 bg-[#0f172a] text-white px-4 lg:px-6 py-2.5 flex flex-wrap justify-between items-center gap-3 shrink-0 border-b border-slate-800">
