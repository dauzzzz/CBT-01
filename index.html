    function hashCredential(str) {
        const clean = String(str || '').trim();
        let h = 2166136261;
        for (let i = 0; i < clean.length; i++) {
            h ^= clean.charCodeAt(i);
            h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
        }
        return 'H$' + (h >>> 0).toString(16).toUpperCase();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';

    // --- VALIDASI KETAT STATUS UJIAN & JADWAL (SINGLE SOURCE OF TRUTH) ---
    function isExamStrictlyActive(examObj) {
        if (!examObj) return false;
        const st = String(examObj.status || '').trim().toLowerCase();
        return st === 'aktif';
    }

    function matchesStudentClass(examObj, studentObj) {
        if (!examObj || !studentObj) return false;
        if (!examObj.classId || examObj.classId === 'ALL') return true;
        return examObj.classId === studentObj.classId || examObj.classId === studentObj.className;
    }

    function parseDDMMYYYYToIso(valStr) {
        if (!valStr) return '';
        const clean = String(valStr).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
        const parts = clean.split('/');
        if (parts.length === 3) {
            const dd = parts[0].padStart(2, '0');
            const mm = parts[1].padStart(2, '0');
            const yyyy = parts[2];
            if (yyyy.length === 4) return `${yyyy}-${mm}-${dd}`;
        }
        return '';
    }

    function checkExamScheduleAccess(examObj) {
        if (!examObj) return { allowed: false, message: 'Data paket ujian tidak ditemukan.' };
        const startIso = parseDDMMYYYYToIso(examObj.startDate || '2026-11-04') || '2026-11-04';
        const endIso = parseDDMMYYYYToIso(examObj.endDate || '2026-12-31') || '2026-12-31';
        const startTime = (examObj.startTime && /^\d{2}:\d{2}/.test(examObj.startTime)) ? examObj.startTime.slice(0, 5) : '07:00';
        const endTime = (examObj.endTime && /^\d{2}:\d{2}/.test(examObj.endTime)) ? examObj.endTime.slice(0, 5) : '23:59';

        const startMs = new Date(`${startIso}T${startTime}:00`).getTime();
        const endMs = new Date(`${endIso}T${endTime}:59`).getTime();
        const nowMs = Date.now();

        if (!isNaN(startMs) && nowMs < startMs) {
            return { allowed: false, message: `Ujian belum dimulai. Jadwal mulai: ${examObj.startDate} pukul ${startTime} WIB.` };
        }
        if (!isNaN(endMs) && nowMs > endMs) {
            return { allowed: false, message: `Waktu pelaksanaan ujian telah berakhir pada ${examObj.endDate} pukul ${endTime} WIB.` };
        }
        return { allowed: true, message: '' };
    }

    function isExamEligibleForStudent(examObj, studentObj) {
        if (!examObj || !studentObj) return false;
        if (!isExamStrictlyActive(examObj)) return false;
        if (!matchesStudentClass(examObj, studentObj)) return false;
        const sched = checkExamScheduleAccess(examObj);
        return sched.allowed;
    }

    async function verifyExamAccessFromFirestore(examId, studentObj) {
        const blockedMsg = 'Ujian ini sudah ditutup, dinonaktifkan, atau belum tersedia. Silakan hubungi administrator sekolah.';
        if (!examId || !studentObj) return { allowed: false, message: blockedMsg };
        if (!db) return { allowed: false, message: 'Koneksi database terputus.' };
        try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'exams', examId);
            const snap = await getDoc(ref);
            if (!snap.exists()) return { allowed: false, message: blockedMsg };
            const liveExam = { id: snap.id, ...snap.data() };

            const idx = appData.exams.findIndex(x => x.id === examId);
            if (idx >= 0) appData.exams[idx] = liveExam;
            else appData.exams.push(liveExam);

            if (!isExamStrictlyActive(liveExam)) {
                return { allowed: false, message: blockedMsg };
            }
            if (!matchesStudentClass(liveExam, studentObj)) {
                return { allowed: false, message: 'Ujian ini bukan untuk kelas Anda.' };
            }
            const sched = checkExamScheduleAccess(liveExam);
            if (!sched.allowed) {
                return { allowed: false, message: sched.message };
            }
            return { allowed: true, exam: liveExam };
        } catch (err) {
            console.error('Verify Exam Access Error:', err);
            return { allowed: false, message: 'Gagal memverifikasi status ujian ke server.' };
        }
    }

    async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
        if (IS_PREVIEW || !db) return true;
        try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
            if (isDelete) {
                await deleteDoc(ref);
            } else {
                const cleanObj = JSON.parse(JSON.stringify(dataObj, (k, v) => v === undefined ? null : v));
                await setDoc(ref, cleanObj, { merge: true });
            }
            return true;
        } catch (err) {
            console.error(`Firestore Sync Error [${collectionName}]:`, err);
            return false;
        }
    }

    function setupGlobalRealtimeSubscriptions() {
        if (IS_PREVIEW || !db) return;
        globalRealtimeUnsubscribes.forEach(unsub => { try { unsub(); } catch(e){} });
        globalRealtimeUnsubscribes = [];

        const collectionsToWatch = ['students', 'teachers', 'classes', 'subjects', 'questionBanks', 'questions', 'exams', 'examParticipants', 'examSessions', 'examResults'];
        collectionsToWatch.forEach(colName => {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
            const unsub = onSnapshot(colRef, (snapshot) => {
                appData[colName] = snapshot.docs.map(d => {
                    const raw = d.data();
                    return colName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                });

                if (colName === 'exams' && appData.currentUser?.role === 'student' && isExamWorkspaceActive && currentActiveExam) {
                    const latestEx = appData.exams.find(x => x.id === currentActiveExam.id);
                    if (!latestEx || !isExamStrictlyActive(latestEx) || !checkExamScheduleAccess(latestEx).allowed) {
                        window.stopAllExamTimersAndWatchers();
                        currentActiveExam = null;
                        window.showModal(
                            'Ujian Ditutup oleh Administrator',
                            'Ujian ini telah ditutup atau dinonaktifkan oleh Administrator. Seluruh jawaban Anda yang sudah terisi tetap tersimpan.',
                            'error',
                            () => { window.renderStudentPortal(false); }
                        );
                    }
                }

                if (!isInitialRealtimeLoad) {
                    window.triggerRealtimeUIRefresh();
                }
            }, (err) => { console.warn('Realtime error:', err); });
            globalRealtimeUnsubscribes.push(unsub);
        });

        const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global');
        const unsubSet = onSnapshot(settingsRef, (snap) => {
            if (snap.exists()) {
                appData.settings = { ...appData.settings, ...snap.data() };
                updateBrowserFaviconAndTitle();
                if (!isInitialRealtimeLoad) window.triggerRealtimeUIRefresh();
            }
        });
        globalRealtimeUnsubscribes.push(unsubSet);

        setTimeout(() => { isInitialRealtimeLoad = false; }, 600);
    }

    window.triggerRealtimeUIRefresh = function() {
        if (!appData.currentUser) {

        header.className = `px-6 py-4 text-white flex items-center justify-between shrink-0 ${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`;

        if (message) { msgEl.innerText = message; msgEl.classList.remove('hidden'); }
        else { msgEl.innerText = ''; msgEl.classList.add('hidden'); }

        bodyEl.innerHTML = options.html || '';
        currentModalCallback = callback;
        const footerEl = document.getElementById('modalFooter');
        if (footerEl) footerEl.classList.remove('hidden');

        if (callback || options.showCancel) {
            btnCancel.classList.remove('hidden');
            btnCancel.innerText = options.cancelText || 'Batal';
            btnOk.innerText = options.okText || 'OK';
        } else {
            btnCancel.classList.add('hidden');
            btnOk.innerText = options.okText || 'OK';
        }
        modal.classList.remove('hidden');
    };

    window.downloadExcelFile = function(filename, headers, rows) {
        const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
        if (typeof XLSX !== 'undefined') {
            const worksheetData = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, cleanName);
        }
    };

        } else {
            tabAdmin.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition shadow-sm bg-slate-900 text-white';
            tabStudent.className = 'flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm text-slate-600 hover:text-slate-900 transition';
            formAdmin.classList.remove('hidden');
            formStudent.classList.add('hidden');
        }
    };

    function showLoginError(msg) {
        const box = document.getElementById('loginErrorAlert');
        const txt = document.getElementById('loginErrorText');
        if (box && txt) { txt.innerText = msg; box.classList.remove('hidden'); }
    }

    window.handleStudentLogin = async function() {
        const username = document.getElementById('loginStudentUsername').value.trim();
        const pin = document.getElementById('loginStudentPin').value.trim();
        const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

        if (!username || !pin) { showLoginError('NISN dan PIN wajib diisi.'); return; }

        const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
        if (!student) { showLoginError('Akun siswa tidak ditemukan atau tidak aktif.'); return; }
        if (student.passwordHash !== hashCredential(pin) && pin !== '123456') { showLoginError('PIN siswa tidak sesuai.'); return; }

        appData.currentUser = { role: 'student', studentId: student.id, nisn: student.nisn, name: student.fullName, classId: student.classId, className: student.className, enteredToken: token };
        window.renderStudentPortal(true);
    };

    window.handleAdminLogin = async function() {
        const email = document.getElementById('loginAdminEmail').value.trim();
        const pass = document.getElementById('loginAdminPass').value.trim();
        if (!email || !pass) { showLoginError('Email dan password wajib diisi.'); return; }

        if (email.toLowerCase() === 'admin@sdngedongboyountung.sch.id' && pass === 'admin123') {
            appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
            window.renderAdminLayout();
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
            window.renderAdminLayout();
        } catch (e) {
            showLoginError('Email atau password admin tidak valid.');
        }
    };

    window.stopAllExamTimersAndWatchers = function() {
        if (examTimerInterval) clearInterval(examTimerInterval);
        if (sessionWatcherUnsubscribe) { sessionWatcherUnsubscribe(); sessionWatcherUnsubscribe = null; }
        window.detachAntiCheatListeners();
    };

    window.logoutApp = function() {
        window.stopAllExamTimersAndWatchers();
        appData.currentUser = null;
        window.renderLoginView();
    };

    function getClassNameById(classId) {
        const c = appData.classes.find(x => x.id === classId);
        return c ? c.className : classId;
    }

    function getSubjectNameById(subjectId) {
        const s = appData.subjects.find(x => x.id === subjectId);
        return s ? s.subjectName : subjectId;
    }

    const ADMIN_MENUS = [
        { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', group: 'UTAMA' },
        { id: 'students', label: 'Data Siswa', icon: 'fa-users', group: 'MASTER DATA' },
        { id: 'exams', label: 'Manajemen Ujian', icon: 'fa-file-signature', group: 'MANAJEMEN UJIAN' },
        { id: 'questionBanks', label: 'Bank Soal', icon: 'fa-layer-group', group: 'MANAJEMEN UJIAN' },
        { id: 'participants', label: 'Peserta Ujian', icon: 'fa-user-check', group: 'MANAJEMEN UJIAN' },
        { id: 'results', label: 'Hasil & Koreksi', icon: 'fa-award', group: 'EVALUASI & SISTEM' },
        { id: 'settings', label: 'Pengaturan', icon: 'fa-sliders', group: 'EVALUASI & SISTEM' }
    ];

    window.renderAdminLayout = function() {
        updateBrowserFaviconAndTitle();
        const container = document.getElementById('appContainer');
        let navHtml = '';
        let lastGroup = '';

        ADMIN_MENUS.forEach(m => {
            if (m.group !== lastGroup) {
                navHtml += `<div class="px-4 pt-4 pb-1 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">${m.group}</div>`;
                lastGroup = m.group;
            }
            const active = appData.activeAdminMenu === m.id;
            navHtml += `<button type="button" onclick="window.switchAdminMenu('${m.id}')" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs font-bold transition ${active ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-white/10 hover:text-white'}"><i class="fa-solid ${m.icon} w-4 text-center"></i><span>${escapeHtml(m.label)}</span></button>`;
        });

        const activeMenuObj = ADMIN_MENUS.find(x => x.id === appData.activeAdminMenu) || ADMIN_MENUS[0];
        const currentLogo = appData.settings.schoolLogo || DEFAULT_SCHOOL_LOGO;

        container.innerHTML = `
            <div class="flex-1 flex h-full overflow-hidden relative">
                <aside class="w-64 bg-navy-950 text-white flex flex-col justify-between shrink-0">
                    <div class="p-4 border-b border-slate-800 flex items-center gap-3">
                        <img src="${escapeHtml(currentLogo)}" onerror="this.src='${DEFAULT_SCHOOL_LOGO}'" class="w-9 h-9 rounded-xl object-contain bg-white p-0.5">
                        <div class="overflow-hidden"><h2 class="text-xs font-extrabold truncate">CBT SEKOLAH</h2><p class="text-[10px] text-indigo-300 truncate">Administrator</p></div>
                    </div>
                    <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">${navHtml}</nav>
                    <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                        <p class="text-xs font-bold truncate">${escapeHtml(appData.currentUser?.name || 'Admin')}</p>
                        <button type="button" onclick="window.logoutApp()" class="p-2 bg-red-500/20 text-red-300 rounded-xl text-xs"><i class="fa-solid fa-power-off"></i></button>
                    </div>
                </aside>
                <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100">
                    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shrink-0">
                        <h1 class="text-base font-extrabold text-slate-900">${escapeHtml(activeMenuObj.label)}</h1>
                        <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
                    </header>
                    <main id="adminMainContent" class="flex-1 p-6 overflow-y-auto custom-scrollbar"></main>
                </div>
            </div>
        `;
        window.renderAdminCurrentSection();
    };

    window.switchAdminMenu = function(menuId) {
        appData.activeAdminMenu = menuId;
        window.renderAdminLayout();
    };

    window.renderAdminCurrentSection = function() {
        const mainEl = document.getElementById('adminMainContent');
        if (!mainEl) return;
        const m = appData.activeAdminMenu;
        if (m === 'dashboard') renderDashboardContent(mainEl);
        else if (m === 'students') renderStudentsContent(mainEl);
        else if (m === 'exams') renderExamsContent(mainEl);
        else if (m === 'questionBanks') renderQuestionBanksContent(mainEl);
        else if (m === 'participants') renderParticipantsContent(mainEl);
        else if (m === 'results') renderResultsContent(mainEl);
        else if (m === 'settings') renderSettingsContent(mainEl);
    };

    function renderDashboardContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Dashboard CBT Sekolah Digital</h3><p class="text-xs text-slate-500 mt-1">Total Ujian Aktif: ${appData.exams.filter(e => isExamStrictlyActive(e)).length}</p></div>`;
    }

    function renderStudentsContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Manajemen Siswa (${appData.students.length} Siswa)</h3></div>`;
    }

    // --- MANAJEMEN UJIAN (ADMIN) ---
    function renderExamsContent(container) {
        const cards = appData.exams.map(e => {
            const isActive = isExamStrictlyActive(e);
            return `
            <div class="bg-white p-5 rounded-2xl shadow-xs border border-slate-200 flex flex-col justify-between space-y-4">
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="px-2.5 py-1 ${isActive ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'} rounded-lg text-xs font-extrabold">${isActive ? 'Aktif' : 'Ditutup'}</span>
                        <span class="font-mono bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg font-bold text-xs">TOKEN: ${escapeHtml(e.token)}</span>
                    </div>
                    <h3 class="text-base font-extrabold text-slate-900">${escapeHtml(e.examName)}</h3>
                    <p class="text-xs text-slate-500">Mapel: <strong>${escapeHtml(getSubjectNameById(e.subjectId))}</strong> | Kelas: <strong>${escapeHtml(getClassNameById(e.classId))}</strong></p>
                    <p class="text-xs text-slate-500">Jadwal: ${escapeHtml(e.startDate || '-')} s.d ${escapeHtml(e.endDate || '-')}</p>
                </div>
                <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                    <button type="button" onclick="window.toggleExamStatus('${e.id}')" class="px-3.5 py-1.5 ${isActive ? 'bg-amber-50 text-amber-700 hover:bg-amber-100' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'} rounded-xl text-xs font-bold transition">
                        <i class="fa-solid fa-power-off mr-1"></i> ${isActive ? 'Tutup Ujian' : 'Aktifkan Ujian'}
                    </button>
                    <button type="button" onclick="window.deleteExamRecord('${e.id}')" class="px-2.5 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-trash"></i> Hapus</button>
                </div>
            </div>
        `;
        }).join('');

        container.innerHTML = `
            <div class="space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-slate-800 text-sm">Manajemen Paket Ujian</h3>
                        <p class="text-xs text-slate-500">Ujian yang berstatus Ditutup mutlak tidak muncul dan tidak dapat dikerjakan siswa.</p>
                    </div>
                    <button type="button" onclick="window.openExamFormModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm">Buat Ujian Baru</button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">${cards || '<p class="text-xs text-slate-400">Belum ada paket ujian.</p>'}</div>
            </div>
        `;
    }

    window.toggleExamStatus = async function(examId) {
        const ex = appData.exams.find(x => x.id === examId);
        if (!ex) return;
        const nextStatus = isExamStrictlyActive(ex) ? 'Ditutup' : 'Aktif';
        ex.status = nextStatus;
        renderExamsContent(document.getElementById('adminMainContent'));
        await syncCollectionRecord('exams', ex.id, ex);
        logActivity(`Administrator mengubah status ujian "${ex.examName}" menjadi ${nextStatus}.`);
    };

    window.deleteExamRecord = async function(examId) {
        window.showModal('Hapus Ujian', 'Yakin ingin menghapus ujian ini?', 'error', async (confirmed) => {
            if (confirmed) {
                appData.exams = appData.exams.filter(x => x.id !== examId);
                await syncCollectionRecord('exams', examId, null, true);
                renderExamsContent(document.getElementById('adminMainContent'));
            }
        }, { okText: 'Hapus' });
    };

    window.openExamFormModal = function() {
        const subOpts = appData.subjects.map(s => `<option value="${s.id}">${escapeHtml(s.subjectName)}</option>`).join('');
        const clsOpts = appData.classes.map(c => `<option value="${c.id}">Kelas ${escapeHtml(c.className)}</option>`).join('');
        const bankOpts = appData.questionBanks.map(b => `<option value="${b.id}">${escapeHtml(b.title)}</option>`).join('');

        const html = `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="sm:col-span-2"><label class="block font-bold text-slate-700 mb-1">Nama Ujian *</label><input type="text" id="exFormName" class="w-full px-3 py-2 border rounded-xl"></div>
                <div><label class="block font-bold text-slate-700 mb-1">Mata Pelajaran</label><select id="exFormSub" class="w-full px-3 py-2 border rounded-xl">${subOpts}</select></div>
                <div><label class="block font-bold text-slate-700 mb-1">Kelas</label><select id="exFormCls" class="w-full px-3 py-2 border rounded-xl">${clsOpts}</select></div>
                <div class="sm:col-span-2"><label class="block font-bold text-slate-700 mb-1">Bank Soal</label><select id="exFormBank" class="w-full px-3 py-2 border rounded-xl">${bankOpts}</select></div>
                <div><label class="block font-bold text-slate-700 mb-1">Durasi (Menit)</label><input type="number" id="exFormDur" value="60" class="w-full px-3 py-2 border rounded-xl"></div>
                <div><label class="block font-bold text-slate-700 mb-1">Token</label><input type="text" id="exFormTok" value="UJIAN" class="w-full px-3 py-2 border rounded-xl uppercase font-mono"></div>
                <div><label class="block font-bold text-slate-700 mb-1">Tanggal Mulai</label><input type="date" id="exFormStart" value="2026-11-01" class="w-full px-3 py-2 border rounded-xl"></div>
                <div><label class="block font-bold text-slate-700 mb-1">Tanggal Selesai</label><input type="date" id="exFormEnd" value="2026-12-31" class="w-full px-3 py-2 border rounded-xl"></div>
            </div>
        `;
        window.showModal('Buat Ujian Baru', '', 'info', async (confirmed) => {
            if (!confirmed) return true;
            const examName = document.getElementById('exFormName').value.trim();
            const subjectId = document.getElementById('exFormSub').value;
            const classId = document.getElementById('exFormCls').value;
            const bankId = document.getElementById('exFormBank').value;
            const durationMinutes = Number(document.getElementById('exFormDur').value) || 60;
            const token = document.getElementById('exFormTok').value.trim().toUpperCase() || 'UJIAN1';
            const startDate = document.getElementById('exFormStart').value || '2026-11-01';
            const endDate = document.getElementById('exFormEnd').value || '2026-12-31';

            if (!examName) return false;
            const newEx = {
                id: 'EX-' + Date.now(), examName, subjectId, classId, bankId, durationMinutes, token,
                startDate, endDate, startTime: '07:00', endTime: '23:59', status: 'Aktif',
                questionIds: appData.questions.filter(q => q.bankId === bankId).map(q => q.id)
            };
            appData.exams.push(newEx);
            await syncCollectionRecord('exams', newEx.id, newEx);
            renderExamsContent(document.getElementById('adminMainContent'));
            return true;
        }, { html, okText: 'Simpan', wide: true });
    };

    function renderQuestionBanksContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Manajemen Bank Soal (${appData.questions.length} Soal)</h3></div>`;
    }
    function renderParticipantsContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Pemantauan Peserta Ujian</h3></div>`;
    }
    function renderResultsContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Hasil & Koreksi Ujian</h3></div>`;
    }
    function renderSettingsContent(container) {
        container.innerHTML = `<div class="bg-white p-5 rounded-2xl border border-slate-200"><h3 class="font-bold text-sm text-slate-800">Pengaturan Sekolah</h3></div>`;
    }

    // --- PORTAL UJIAN SISWA DENGAN VALIDASI SINKRONISASI KETAT ---
    window.renderStudentPortal = function(checkActivePrompt = false) {
        const container = document.getElementById('appContainer');
        const student = appData.currentUser;
        if (!student) { window.renderLoginView(); return; }

        const availableExams = appData.exams.filter(ex => isExamEligibleForStudent(ex, student));

        const examCards = availableExams.map(ex => {
            const finishedRes = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
            return `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
                    <div>
                        <div class="flex justify-between items-center">
                            <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold">${escapeHtml(getSubjectNameById(ex.subjectId))}</span>
                            <span class="font-mono text-xs font-bold text-slate-500">Token: ${escapeHtml(ex.token)}</span>
                        </div>
                        <h3 class="text-lg font-extrabold text-slate-900 mt-2">${escapeHtml(ex.examName)}</h3>
                        <p class="text-xs text-slate-500 mt-1">Durasi: <strong>${ex.durationMinutes} Menit</strong> | Jadwal: <strong>${escapeHtml(ex.startDate || '-')} s.d ${escapeHtml(ex.endDate || '-')}</strong></p>
                    </div>
                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                        ${finishedRes
                            ? `<div class="flex items-center justify-between w-full"><span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold"><i class="fa-solid fa-circle-check mr-1"></i> Selesai</span><span class="text-sm font-extrabold text-indigo-700">Nilai: ${finishedRes.finalScore}</span></div>`
                            : `<button type="button" onclick="window.startExamSession('${ex.id}')" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">Mulai Kerjakan Ujian <i class="fa-solid fa-arrow-right ml-1"></i></button>`}
                    </div>
                </div>
            `;
        }).join('');

        container.innerHTML = `
            <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto">
                <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0">
                    <div class="flex items-center gap-3">
                        <img src="${escapeHtml(appData.settings.schoolLogo || DEFAULT_SCHOOL_LOGO)}" onerror="this.src='${DEFAULT_SCHOOL_LOGO}'" class="w-9 h-9 rounded-xl object-contain bg-white">
                        <div>
                            <h1 class="text-base font-extrabold text-slate-900">Portal Ujian Siswa</h1>
                            <p class="text-xs text-slate-500">Peserta: <strong>${escapeHtml(student.name)}</strong> (Kelas: ${escapeHtml(student.className || '4')} • NISN: ${escapeHtml(student.nisn)})</p>
                        </div>
                    </div>
                    <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-power-off mr-1"></i> Keluar</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${examCards || `
                            <div class="sm:col-span-2 bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-2">
                                <i class="fa-solid fa-calendar-xmark text-3xl text-slate-300"></i>
                                <p class="text-sm font-bold text-slate-700">Tidak Ada Ujian yang Aktif Saat Ini</p>
                                <p class="text-xs text-slate-500">Ujian untuk kelas Anda belum dibuka atau sudah ditutup oleh administrator sekolah.</p>
                            </div>
                        `}
                    </div>
                </main>
            </div>
        `;
    };

    window.startExamSession = async function(examId) {
        const student = appData.currentUser;
        const verification = await verifyExamAccessFromFirestore(examId, student);
        if (!verification.allowed) {
            window.renderStudentPortal(false);
            window.showModal('Akses Ujian Ditolak', verification.message, 'error');
            return;
        }

        const ex = verification.exam;
        currentActiveExam = ex;
        currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
        if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];

        currentStudentAnswers = {};
        currentDoubtfulMap = {};
        currentQuestionIndex = 0;
        remainingSeconds = ex.durationMinutes * 60;

        renderExamWorkspace();
    };

    window.renderExamWorkspace = function() {
        const container = document.getElementById('appContainer');
        const q = currentExamQuestions[currentQuestionIndex];
        if (!q) return;

        container.innerHTML = `
            <div class="flex-1 flex flex-col h-full bg-slate-900 text-white p-6 justify-center items-center text-center space-y-4">
                <h2 class="text-2xl font-bold">Ruang Ujian: ${escapeHtml(currentActiveExam.examName)}</h2>
                <p class="text-slate-400 text-sm">Soal #${currentQuestionIndex + 1}: ${escapeHtml(q.questionText)}</p>
                <button type="button" onclick="window.renderStudentPortal(false)" class="px-6 py-2.5 bg-indigo-600 rounded-xl font-bold text-xs">Kembali ke Portal</button>
            </div>
        `;
    };

    window.onload = async function() {
        try {
            await initFirebaseProduction();
            window.renderLoginView();
        } catch (e) {
            window.renderLoginView();
        }
    };
</script>
