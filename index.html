        function isExamStrictlyActive(examObj) {
            if (!examObj) return false;

        function formatIsoToDDMMYYYY(isoStr) {
            if (!isoStr) return '';
            const clean = String(isoStr).trim();
            if (/^\d{2}\/\d{2}\/\d{4}$/.test(clean)) return clean;
            const parts = clean.split('-');
            if (parts.length === 3) {
                return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
            }
            return clean;
        }

        function parseDDMMYYYYToIso(valStr) {
            if (!valStr) return '';
            const clean = String(valStr).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
            const parts = clean.split('/');
            if (parts.length === 3) {
                const dd = parts[0].padStart(2, '0');
                const mm = parts[1].padStart(2, '0');
                const yyyy = parts[2];
                if (yyyy.length === 4) return `${yyyy}-${mm}-${dd}`;
            }
            return '';
        }

        function checkExamScheduleAccess(exam) {
            if (!exam) return { allowed: false, message: 'Data ujian tidak ditemukan.' };
            const startIso = parseDDMMYYYYToIso(exam.startDate || '2026-11-04') || '2026-11-04';
            const endIso = parseDDMMYYYYToIso(exam.endDate || '2026-12-04') || '2026-12-04';
            const startTime = (exam.startTime && /^\d{2}:\d{2}/.test(exam.startTime)) ? exam.startTime.slice(0, 5) : '07:00';
            const endTime = (exam.endTime && /^\d{2}:\d{2}/.test(exam.endTime)) ? exam.endTime.slice(0, 5) : '23:59';

            const startMs = new Date(`${startIso}T${startTime}:00`).getTime();
            const endMs = new Date(`${endIso}T${endTime}:59`).getTime();
            const nowMs = Date.now();

            if (!isNaN(startMs) && nowMs < startMs) {
                return {
                    allowed: false,
                    message: `Ujian belum dimulai. Jadwal mulai: ${formatIsoToDDMMYYYY(startIso)} pukul ${startTime} WIB.`
                };
            }
            if (!isNaN(endMs) && nowMs > endMs) {
                return {
                    allowed: false,
                    message: `Waktu akses ujian telah berakhir pada ${formatIsoToDDMMYYYY(endIso)} pukul ${endTime} WIB.`
                };
            }
            return { allowed: true, message: '' };
        }

        function isExamEligibleForStudent(exam, student) {
            if (!exam || !student) return false;
            if (!isExamStrictlyActive(exam)) return false;
            const matchesClass = !exam.classId || exam.classId === 'ALL' || exam.classId === student.classId || exam.classId === student.className || getClassNameById(exam.classId) === student.className;
            if (!matchesClass) return false;
            const sched = checkExamScheduleAccess(exam);
            return sched.allowed;
        }

        function compressAndConvertImage(file, maxWidth = 280, maxHeight = 280, quality = 0.88) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        const dataUrl = canvas.toDataURL(outType, quality);
                        canvas.toBlob((blob) => {
                            resolve({ dataUrl, blob: blob || file });
                        }, outType, quality);
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                updateLiveSyncIndicator('syncing', 'Menyinkronkan...');
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                    if (Array.isArray(appData[collectionName])) {
                        appData[collectionName] = appData[collectionName].filter(item => (item.id || item.resultId) !== docId);
                    }
                } else {
                    const cleanPayload = sanitizeFirestoreData(dataObj);
                    await setDoc(ref, cleanPayload, { merge: true });
                    if (Array.isArray(appData[collectionName])) {
                        const keyField = collectionName === 'examResults' ? 'resultId' : 'id';
                        const idx = appData[collectionName].findIndex(item => (item[keyField] || item.id) === docId);
                        const mergedObj = { id: docId, ...cleanPayload };
                        if (idx !== -1) {
                            appData[collectionName][idx] = { ...appData[collectionName][idx], ...mergedObj };
                        } else {
                            appData[collectionName].push(mergedObj);
                        }
                    }
                }
                updateLiveSyncIndicator('updated', 'Data Diperbarui');
                return true;
            } catch (err) {
                console.error(`Firestore Sync Error [${collectionName}/${docId}]:`, err);
                updateLiveSyncIndicator('error');
                return false;
            }
        }

        async function fetchSingleFirestoreDoc(collectionName, docId) {
            if (IS_PREVIEW || !db) return null;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    return { id: snap.id, ...snap.data() };
                }
                return null;
            } catch (err) {
                console.error(`Fetch Doc Error [${collectionName}/${docId}]:`, err);
                return null;
            }
        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;

            globalRealtimeUnsubscribes.forEach(unsub => {
                try { unsub(); } catch (e) {}
            });
            globalRealtimeUnsubscribes = [];

            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examSessions', 'examResults'
            ];

            collectionsToWatch.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, (snapshot) => {
                    const docsList = snapshot.docs.map(d => {
                        const raw = d.data();
                        if (colName === 'examResults') {
                            return { id: d.id, resultId: raw.resultId || d.id, ...raw };
                        }
                        return { id: d.id, ...raw };
                    });

                    if (colName === 'questions') {
                        docsList.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));
                    }

                    appData[colName] = docsList;

                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh(colName);
                    }
                }, (err) => {
                    console.warn(`Realtime listener warning [${colName}]:`, err);
                    updateLiveSyncIndicator('error');
                });
                globalRealtimeUnsubscribes.push(unsub);
            });

            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    appData.settings = { ...appData.settings, ...snap.data() };
                    updateBrowserFaviconAndTitle();
                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh('appSettings');
                    }
                }
            }, (err) => {
                console.warn('Realtime settings listener warning:', err);
            });
            globalRealtimeUnsubscribes.push(unsubSettings);

            setTimeout(() => {
                isInitialRealtimeLoad = false;
            }, 800);

            if (fallbackPollingInterval) clearInterval(fallbackPollingInterval);
            fallbackPollingInterval = setInterval(async () => {
                if (!db || document.hidden) return;
                try {
                    const dynamicCols = ['exams', 'examParticipants', 'examSessions', 'examResults'];
                    for (const cName of dynamicCols) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', cName));
                        appData[cName] = snap.docs.map(d => {
                            const raw = d.data();
                            return cName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                        });
                    }
                } catch (pollErr) {
                    // Abaikan offline sementara
                }
            }, 15000);
        }

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
                return;
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            if (!IS_PREVIEW && db) {
                try {
                    const [sessSnap, resSnap, partSnap] = await Promise.all([

                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examResults')),

                                <i class="fa-solid fa-xmark text-base"></i>
                            </button>
                        </div>
                        <nav class="flex-1 p-3 space-y-1 overflow-y-auto custom-scrollbar">${navHtml}</nav>
                        <div class="p-4 border-t border-slate-800 flex items-center justify-between">
                            <div class="truncate">
                                <p class="text-xs font-bold truncate">${escapeHtml(appData.currentUser?.name || 'Administrator')}</p>
                                <p class="text-[10px] text-emerald-400 font-semibold">• Cloud Aktif</p>
                            </div>
                            <button type="button" onclick="window.logoutApp()" class="p-2 bg-red-500/20 hover:bg-red-500 text-red-300 hover:text-white rounded-xl text-xs transition" title="Keluar">
                                <i class="fa-solid fa-power-off"></i>
                            </button>
                        </div>
                    </aside>
                    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100 w-full">
                        <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between gap-2 shrink-0">
                            <div class="flex items-center gap-3 min-w-0">
                                <button type="button" onclick="window.toggleMobileSidebar(true)" class="md:hidden p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition shrink-0" title="Buka Menu Navigasi">
                                    <i class="fa-solid fa-bars text-sm"></i>
                                </button>
                                <img src="${escapeHtml(currentLogo)}" onerror="this.src='${DEFAULT_SCHOOL_LOGO}'" alt="Logo" class="w-8 h-8 rounded-lg object-contain bg-slate-50 border border-slate-200 p-0.5 hidden sm:block shrink-0">
                                <div class="min-w-0">
                                    <h1 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">${escapeHtml(activeMenuObj.label)}</h1>
                                    <p class="text-[10px] sm:text-[11px] text-slate-500 truncate">${escapeHtml(appData.settings.schoolName)}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="live-sync-badge px-2.5 py-1 rounded-full bg-emerald-50/80 border border-emerald-200/80 text-emerald-700 text-[10px] sm:text-[11px] font-bold flex items-center gap-1.5 transition-all">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> <span class="hidden sm:inline">Live Sync Aktif</span><span class="sm:hidden">Sync</span>
                                </div>
                                <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold flex items-center gap-1">
                                    <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden sm:inline">Logout</span>
                                </button>
                            </div>
                        </header>
                        <main id="adminMainContent" class="flex-1 p-3 sm:p-6 overflow-y-auto custom-scrollbar"></main>
                    </div>
                </div>
            `;
            window.renderAdminCurrentSection();
        };

        window.toggleMobileSidebar = function(openState) {
            isMobileSidebarOpen = Boolean(openState);
            const sidebar = document.getElementById('adminSidebar');
            const backdrop = document.getElementById('mobileSidebarBackdrop');
            if (sidebar) {
                if (isMobileSidebarOpen) {
                    sidebar.classList.remove('-translate-x-full');
                    sidebar.classList.add('translate-x-0');
                } else {
                    sidebar.classList.remove('translate-x-0');
                    sidebar.classList.add('-translate-x-full');
                }
            }
            if (backdrop) {
                backdrop.classList.toggle('hidden', !isMobileSidebarOpen);
                backdrop.classList.toggle('block', isMobileSidebarOpen);
            }
        };

        window.switchAdminMenu = function(menuId) {
            appData.activeAdminMenu = menuId;
            isMobileSidebarOpen = false;
            window.renderAdminLayout();
        };

        window.renderAdminCurrentSection = function() {
            const mainEl = document.getElementById('adminMainContent');
            if (!mainEl) return;
            const m = appData.activeAdminMenu;
            if (m === 'dashboard') renderDashboardContent(mainEl);
            else if (m === 'students') renderStudentsContent(mainEl);
            else if (m === 'teachers') renderTeachersContent(mainEl);
            else if (m === 'classes') renderClassesContent(mainEl);
            else if (m === 'subjects') renderSubjectsContent(mainEl);
            else if (m === 'questionBanks') renderQuestionBanksContent(mainEl);
            else if (m === 'exams') renderExamsContent(mainEl);
            else if (m === 'schedules') renderSchedulesContent(mainEl);
            else if (m === 'participants') renderParticipantsContent(mainEl);
            else if (m === 'results') renderResultsContent(mainEl);
            else if (m === 'analysis') renderAnalysisContent(mainEl);
            else if (m === 'spreadsheet') renderSpreadsheetContent(mainEl);
            else if (m === 'settings') renderSettingsContent(mainEl);
        };

        // --- RENDER PORTAL SISWA (DENGAN FILTER KETAT IS EXAM ELIGIBLE) ---
        window.renderStudentPortal = function(checkActivePrompt = false) {
            window.stopAllExamTimersAndWatchers();
            const container = document.getElementById('appContainer');
            const student = appData.currentUser;
            if (!student) {
                window.renderLoginView();
                return;
            }

            // FILTER KETAT: Ujian wajib berstatus Aktif, sesuai kelas siswa, dan masuk jadwal WIB
            const availableExams = appData.exams.filter(ex => isExamEligibleForStudent(ex, student));
            let unfinishedSessionToPrompt = null;

            const examCards = availableExams.map(ex => {
                const finishedRes = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
                const sessId = getSessionDocId(ex.id, student.studentId);
                const activeSess = !finishedRes
                    ? appData.examSessions.find(s => s.id === sessId && s.status === 'IN_PROGRESS')
                    : null;

                if (activeSess && !unfinishedSessionToPrompt) {
                    unfinishedSessionToPrompt = { exam: ex, session: activeSess };
                }

                let actionAreaHtml = '';
                if (finishedRes) {
                    actionAreaHtml = `
                        <div class="flex items-center justify-between w-full">
                            <span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold"><i class="fa-solid fa-circle-check mr-1"></i> Ujian Selesai</span>
                            ${ex.isPublished !== false ? `<span class="text-sm font-extrabold text-indigo-700">Nilai: ${finishedRes.finalScore}</span>` : ''}
                        </div>
                    `;
                } else if (activeSess) {
                    const remSecs = Math.max(0, Math.floor(((activeSess.endTimeMs || Date.now()) - Date.now()) / 1000));
                    const remMinutes = Math.ceil(remSecs / 60);
                    actionAreaHtml = `
                        <div class="w-full space-y-2.5">
                            <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 space-y-1">
                                <div class="font-extrabold flex items-center justify-between">
                                    <span><i class="fa-solid fa-clock-rotate-left mr-1 text-amber-600"></i> UJIAN BELUM SELESAI</span>
                                    <span class="font-mono text-[11px] bg-amber-200/70 px-2 py-0.5 rounded font-extrabold">${remSecs > 0 ? `Sisa ~${remMinutes} Menit` : 'Waktu Habis'}</span>
                                </div>
                                <p class="text-[11px] text-amber-800">Progres Tersimpan: <strong>${activeSess.answeredCount || 0} / ${activeSess.totalQuestions || (ex.questionIds || []).length} soal dijawab</strong> • Terakhir di Soal <strong>#${(activeSess.lastQuestionIndex || 0) + 1}</strong></p>
                            </div>
                            <button type="button" onclick="window.promptResumeOrStartExam('${ex.id}')" class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl text-xs font-extrabold transition shadow-sm flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-play"></i> LANJUTKAN UJIAN
                            </button>
                        </div>
                    `;
                } else {
                    actionAreaHtml = `
                        <button type="button" onclick="window.promptResumeOrStartExam('${ex.id}')" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                            Mulai Kerjakan Ujian <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    `;
                }

                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border ${activeSess ? 'border-amber-300 ring-2 ring-amber-100' : 'border-slate-200'} flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-center">
                                <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold">${escapeHtml(getSubjectNameById(ex.subjectId))}</span>
                                <span class="font-mono text-xs font-bold text-slate-500">Token: ${escapeHtml(ex.token)}</span>
                            </div>
                            <h3 class="text-lg font-extrabold text-slate-900 mt-2">${escapeHtml(ex.examName)}</h3>
                            <p class="text-xs text-slate-500 mt-1">Durasi: <strong>${ex.durationMinutes} Menit</strong> | Jumlah Soal: <strong>${(ex.questionIds || []).length} Soal</strong></p>
                            <p class="text-[11px] text-slate-400 mt-0.5">Jadwal: ${escapeHtml(formatIsoToDDMMYYYY(ex.startDate || ''))} (${escapeHtml(ex.startTime || '07:00')} - ${escapeHtml(ex.endTime || '23:59')} WIB)</p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            ${actionAreaHtml}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto">
                    <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3.5 flex flex-wrap justify-between items-center gap-3 shrink-0">
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${escapeHtml(appData.settings.schoolLogo || DEFAULT_SCHOOL_LOGO)}" onerror="this.src='${DEFAULT_SCHOOL_LOGO}'" alt="Logo Sekolah" class="w-10 h-10 rounded-xl object-contain bg-slate-50 border border-slate-200 p-0.5 shrink-0">
                            <div class="min-w-0">
                                <h1 class="text-sm sm:text-base font-extrabold text-slate-900 truncate">Portal Ujian Siswa • ${escapeHtml(appData.settings.schoolName)}</h1>
                                <p class="text-[11px] sm:text-xs text-slate-500 truncate">Peserta: <strong>${escapeHtml(student.name)}</strong> (Kelas: ${escapeHtml(student.className || '4')} • NISN: ${escapeHtml(student.nisn)})</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <div class="live-sync-badge px-2.5 py-1 rounded-full bg-emerald-50/80 border border-emerald-200/80 text-emerald-700 text-[10px] sm:text-[11px] font-bold flex items-center gap-1.5 transition-all">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> <span class="hidden sm:inline">Live Sync Aktif</span><span class="sm:hidden">Sync</span>
                            </div>
                            <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-power-off mr-1"></i> Keluar</button>
                        </div>
                    </header>
                    <main class="p-4 sm:p-6 max-w-4xl mx-auto w-full space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${examCards || `
                                <div class="sm:col-span-2 bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-2">
                                    <i class="fa-solid fa-calendar-xmark text-3xl text-slate-300"></i>
                                    <p class="text-sm font-bold text-slate-700">Tidak Ada Ujian yang Aktif Saat Ini</p>
                                    <p class="text-xs text-slate-500">Ujian untuk kelas Anda belum dibuka atau sudah ditutup oleh administrator sekolah.</p>
                                </div>
                            `}
                        </div>
                    </main>
                </div>
            `;

            if (checkActivePrompt && unfinishedSessionToPrompt) {
                setTimeout(() => {
                    window.showUnfinishedExamNotificationModal(unfinishedSessionToPrompt.exam.id);
                }, 150);
            }
        };

        window.showUnfinishedExamNotificationModal = async function(examId) {
            const student = appData.currentUser;
            if (!student) return;
            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) return;

            const sessId = getSessionDocId(examId, student.studentId);
            const cloudSess = await fetchSingleFirestoreDoc('examSessions', sessId);
            const activeSess = cloudSess || appData.examSessions.find(s => s.id === sessId);

            if (!activeSess || activeSess.status !== 'IN_PROGRESS') return;

            const remSecs = Math.max(0, Math.floor(((activeSess.endTimeMs || Date.now()) - Date.now()) / 1000));
            const currentDevice = getDeviceLabel();
            const isDifferentDevice = activeSess.deviceInfo && activeSess.deviceInfo !== currentDevice;

            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-950 space-y-1.5">
                        <p class="font-extrabold text-sm flex items-center gap-2 text-amber-800">
                            <i class="fa-solid fa-laptop-medical text-base"></i> UJIAN SEBELUMNYA BELUM SELESAI
                        </p>
                        <p class="text-xs text-amber-900 leading-relaxed">
                            Ujian Anda masih memiliki progres yang tersimpan di server cloud. Anda dapat melanjutkan ujian tepat dari nomor soal terakhir tanpa kehilangan jawaban.
                        </p>
                    </div>
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-1.5 font-medium text-slate-700">
                        <div class="flex justify-between"><span>Paket Ujian:</span> <strong class="text-slate-900">${escapeHtml(ex.examName)}</strong></div>
                        <div class="flex justify-between"><span>Mata Pelajaran:</span> <strong class="text-indigo-700">${escapeHtml(getSubjectNameById(ex.subjectId))}</strong></div>
                        <div class="flex justify-between"><span>Jawaban Tersimpan:</span> <strong class="text-blue-600">${activeSess.answeredCount || 0} dari ${activeSess.totalQuestions || (ex.questionIds || []).length} Soal</strong></div>
                        <div class="flex justify-between"><span>Ditandai Ragu-ragu:</span> <strong class="text-amber-600">${activeSess.doubtfulCount || 0} Soal</strong></div>
                        <div class="flex justify-between"><span>Nomor Soal Terakhir:</span> <strong class="text-slate-900">Soal Nomor ${(activeSess.lastQuestionIndex || 0) + 1}</strong></div>
                        <div class="flex justify-between"><span>Sisa Waktu Sebenarnya:</span> <strong class="font-mono text-red-600">${formatHMS(remSecs)}</strong></div>
                        <div class="flex justify-between"><span>Riwayat Pelanggaran:</span> <strong class="text-red-600">${activeSess.violationCount || 0} Kali</strong></div>
                    </div>
                    ${isDifferentDevice ? `
                        <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl text-[11px] text-blue-900 flex items-start gap-2">
                            <i class="fa-solid fa-mobile-screen-button text-blue-600 mt-0.5"></i>
                            <span><strong>Konfirmasi Perpindahan Perangkat:</strong> Sesi ini sebelumnya dibuka pada <em>${escapeHtml(activeSess.deviceInfo)}</em>. Melanjutkan di perangkat ini (<em>${escapeHtml(currentDevice)}</em>) akan memindahkan kendali sesi aktif ke perangkat ini.</span>
                        </div>
                    ` : ''}
                </div>
            `;

            window.showModal(
                'UJIAN SEBELUMNYA BELUM SELESAI',
                '',
                'info',
                (confirmed) => {
                    if (confirmed) {
                        window.startExamSession(examId, activeSess);
                    }
                    return true;
                },
                {
                    html,
                    showCancel: true,
                    okText: 'LANJUTKAN UJIAN',
                    cancelText: 'KEMBALI'
                }
            );
        };

        window.promptResumeOrStartExam = async function(examId) {
            const student = appData.currentUser;
            if (!student) return;

            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) {
                window.showModal('Ujian Tidak Ditemukan', 'Data ujian tidak tersedia.', 'error');
                return;
            }

            if (!isExamEligibleForStudent(ex, student)) {
                window.showModal('Ujian Tidak Tersedia', 'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.', 'error');
                window.renderStudentPortal(false);
                return;
            }

            const accessCheck = checkExamScheduleAccess(ex);
            if (!accessCheck.allowed) {
                window.showModal('Di Luar Jadwal Ujian', accessCheck.message, 'error');
                return;
            }

            const finishedRes = appData.examResults.find(r => r.studentId === student.studentId && r.examId === examId);
            if (finishedRes) {
                window.showModal('Ujian Sudah Selesai', 'Anda telah menyelesaikan dan mengirim ujian ini sebelumnya.', 'info');
                window.renderStudentPortal(false);
                return;
            }

            const sessId = getSessionDocId(examId, student.studentId);
            const cloudSess = await fetchSingleFirestoreDoc('examSessions', sessId);
            if (cloudSess) {
                const idx = appData.examSessions.findIndex(s => s.id === sessId);
                if (idx !== -1) appData.examSessions[idx] = cloudSess;
                else appData.examSessions.push(cloudSess);
            }

            const existingSess = cloudSess || appData.examSessions.find(s => s.id === sessId);
            if (existingSess && existingSess.status === 'SUBMITTED') {
                window.showModal('Ujian Telah Dikirim', 'Sesi ujian Anda telah berstatus selesai.', 'info');
                window.renderStudentPortal(false);
                return;
            }

            if (existingSess && existingSess.status === 'IN_PROGRESS') {
                window.showUnfinishedExamNotificationModal(examId);
            } else {
                window.startExamSession(examId, null);
            }
        };

        window.forceTerminateActiveStudentExam = async function(customNotice) {
            if (!currentActiveExam) return;
            window.stopAllExamTimersAndWatchers();
            await window.persistExamSessionToCloud(true);

            const student = appData.currentUser;
            if (student) {
                const part = appData.examParticipants.find(p => p.examId === currentActiveExam.id && p.studentId === student.studentId);
                if (part && part.status !== 'Selesai') {
                    part.status = 'Dihentikan (Ujian Ditutup Admin)';
                    syncCollectionRecord('examParticipants', part.id, part);
                }
            }

            currentActiveExam = null;
            currentExamQuestions = [];
            window.renderStudentPortal(false);
            window.showModal(
                'Ujian Ditutup oleh Administrator',
                customNotice || 'Ujian telah ditutup oleh administrator. Jawaban yang sudah Anda isi tetap tersimpan di sistem.',
                'error'
            );
        };

        window.onload = async function() {
            try {
                await initFirebaseProduction();
                window.renderLoginView();
            } catch (error) {
                window.renderLoginView();
                window.showModal(
                    'Koneksi Firebase Gagal',
                    'Aplikasi belum dapat terhubung ke Firebase. Periksa konfigurasi project, pastikan Firestore Database tersedia, dan sesuaikan Security Rules.',
                    'error'
                );
            }
        };
    </script>
</body>
</html>
