        window.startExamSession = async function(examId, resumeSessionObj = null) {
            const student = appData.currentUser;
            if (!student) return;

            window.enterStudentFullscreen();

            const verification = await verifyExamEligibilityFromServer(examId, student);
            if (!verification.allowed) {
                window.renderStudentPortal(false);
                window.showModal('Ujian Ditutup / Belum Tersedia', verification.message, 'error');
                return;
            }
            const ex = verification.exam;

            // Pastikan ujian belum disubmit
            const alreadyDone = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
            if (alreadyDone) {
                await window.autoLogoutStudentToInitialLogin(
                    'Ujian Telah Diselesaikan',
                    'Anda telah menyelesaikan dan mengirim jawaban untuk ujian ini. Sistem secara otomatis mengeluarkan (Logout) akun Anda ke halaman awal login.',
                    'info'
                );
                return;
            }

            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = appData.questions.filter(q => q.bankId === ex.bankId);
                if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];
            }

            isSubmittingFinalExam = false;
            currentSessionId = getSessionDocId(ex.id, student.studentId);
            currentSessionToken = 'TOK-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            // Cek kembali dari cloud jika resumeSessionObj belum diberikan
            if (!resumeSessionObj) {
                const cloudSess = await fetchSingleFirestoreDoc('examSessions', currentSessionId);
                if (cloudSess && cloudSess.status === 'IN_PROGRESS') {
                    resumeSessionObj = cloudSess;
                }
            }

            const nowMs = Date.now();
            if (resumeSessionObj && resumeSessionObj.status === 'IN_PROGRESS') {
                // Pulihkan progres ujian sebelumnya (Resume)
                currentStudentAnswers = resumeSessionObj.answers ? JSON.parse(JSON.stringify(resumeSessionObj.answers)) : {};
                currentDoubtfulMap = resumeSessionObj.doubtfulMap ? JSON.parse(JSON.stringify(resumeSessionObj.doubtfulMap)) : {};
                const savedIdx = Number(resumeSessionObj.lastQuestionIndex) || 0;
                currentQuestionIndex = (savedIdx >= 0 && savedIdx < currentExamQuestions.length) ? savedIdx : 0;
                currentViolationCount = Number(resumeSessionObj.violationCount) || 0;
                currentViolationLogs = Array.isArray(resumeSessionObj.violationLogs) ? resumeSessionObj.violationLogs : [];
                currentExamStartedAtMs = Number(resumeSessionObj.startedAtMs) || nowMs;
                currentExamEndTimeMs = Number(resumeSessionObj.endTimeMs) || (currentExamStartedAtMs + (ex.durationMinutes * 60 * 1000));
                remainingSeconds = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
            } else {
                // Sesi baru pertama kali
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                currentQuestionIndex = 0;
                currentViolationCount = 0;
                currentViolationLogs = [];
                currentExamStartedAtMs = nowMs;
                currentExamEndTimeMs = nowMs + (ex.durationMinutes * 60 * 1000);
                remainingSeconds = ex.durationMinutes * 60;
            }

            let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + ex.id,
                    examId: ex.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '4',
                    status: 'Sedang Mengerjakan',
                    violationCount: currentViolationCount,
                    extraTimeMinutes: 0
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Sedang Mengerjakan';
                p.violationCount = currentViolationCount;
            }
            syncCollectionRecord('examParticipants', p.id, p);

            // Jika waktu ujian ternyata sudah habis saat siswa berada di luar aplikasi, langsung jalankan mekanisme penyelesaian otomatis & logout
            if (remainingSeconds <= 0) {
                isExamWorkspaceActive = true;
                await window.submitExamFinal(true);
                return;
            }

            window.attachAntiCheatListeners();
            renderExamWorkspace();
            await window.persistExamSessionToCloud(true);
            startExamTimer();
            attachRealtimeSessionTokenListener(currentSessionId);
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            if (periodicAutoSaveInterval) clearInterval(periodicAutoSaveInterval);

            // Timer berbasis selisih timestamp target (currentExamEndTimeMs) sehingga tidak bisa di-reset oleh refresh/pindah perangkat
            examTimerInterval = setInterval(() => {
                if (currentActiveExam) {
                    const latestExamInState = appData.exams.find(e => e.id === currentActiveExam.id);
                    if (!latestExamInState || !isExamStrictlyActive(latestExamInState) || !checkExamScheduleAccess(latestExamInState).allowed) {
                        window.forceCloseStudentExamByAdmin('Ujian telah ditutup oleh administrator sekolah. Jawaban yang sudah Anda isi tetap tersimpan.');
                        return;
                    }
                }
                const nowMs = Date.now();
                remainingSeconds = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) {
                    timerEl.innerText = formatHMS(remainingSeconds);
                }
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.stopAllExamTimersAndWatchers();
                    window.submitExamFinal(true);
                }
            }, 1000);

            // Auto-save berkala setiap 15 detik sebagai pengaman tambahan
            periodicAutoSaveInterval = setInterval(() => {
                if (isExamWorkspaceActive && currentActiveExam && !isSubmittingFinalExam) {
                    window.persistExamSessionToCloud(true);
                }
            }, 15000);
        }

        window.exitExamTemporarily = async function() {
            await window.persistExamSessionToCloud(true);
            window.stopAllExamTimersAndWatchers();
            window.renderStudentPortal(false);
        };

        function getQuestionInstructionText(type) {
            if (type === 'pg') return 'Pilih satu jawaban yang paling tepat!';
            if (type === 'pg_complex') return 'Pilih lebih dari satu jawaban yang benar!';
            if (type === 'true_false') return 'Tentukan apakah pernyataan tersebut Benar atau Salah!';
            if (type === 'matching') return 'Pasangkan setiap pernyataan di sebelah kiri dengan pasangan yang tepat!';
            if (type === 'short_answer') return 'Ketikkan jawaban singkat dan tepat pada kolom yang tersedia!';
            if (type === 'essay') return 'Tuliskan uraian jawaban lengkap Anda pada kolom di bawah ini!';
            return 'Pilih satu jawaban yang paling tepat!';
        }

        function isQuestionAnswered(ans) {
            if (ans === undefined || ans === null || ans === '') return false;
            if (Array.isArray(ans)) return ans.length > 0;
            if (typeof ans === 'object') return Object.keys(ans).length > 0;
            return String(ans).trim() !== '';
        }

        function safeRoundTwoDecimals(val) {
            const num = Number(val);
            if (!Number.isFinite(num)) return 0;
            return Math.round((num + Number.EPSILON) * 100) / 100;
        }

        function normalizeShortText(val) {
            if (val === null || val === undefined) return '';
            const wsRegex = new RegExp('\\s+', 'g');
            return String(val).trim().toLowerCase().replace(wsRegex, ' ');
        }

        function normalizeSingleChoiceToken(val) {
            if (val === null || val === undefined) return '';
            const raw = String(val).trim().toUpperCase();
            if (!raw) return '';
            const optPrefixRegex = new RegExp('^(?:OPSI|PILIHAN)\\s*([A-F])$', 'i');
            const mOpt = raw.match(optPrefixRegex);
            if (mOpt) return mOpt[1].toUpperCase();
            const letterDotRegex = new RegExp('^([A-F])[\\.\\)\\:\\-]\\s*.*$');
            const mLetter = raw.match(letterDotRegex);
            if (mLetter) return mLetter[1].toUpperCase();
            return raw;
        }

        function normalizeTrueFalseToken(val) {
            const s = normalizeShortText(val);
            if (!s) return '';
            if (s === 'b' || s === 'benar' || s === 'true' || s === 't' || s === '1' || s === 'ya') return 'benar';
            if (s === 's' || s === 'salah' || s === 'false' || s === 'f' || s === '0' || s === 'tidak') return 'salah';
            return s;
        }

        // ============================================================================
        // MESIN PERHITUNGAN SKOR TERPUSAT (6 TIPE SOAL & NORMALISASI SKALA 100)
        // ============================================================================
        window.evaluateQuestionScore = function(q, userAnswer, manualEssayScore = undefined) {
            const maxWeight = Math.max(0, Number(q && q.weight !== undefined ? q.weight : 10) || 0);
            const qType = (q && q.type) ? String(q.type).trim() : 'pg';

            if (!isQuestionAnswered(userAnswer)) {
                return { status: 'EMPTY', earnedWeight: 0, maxWeight, ratio: 0 };
            }

            // 1. Pilihan Ganda Biasa (pg): Skor penuh (100% x bobot) jika tepat sama dengan kunci, 0 jika salah
            if (qType === 'pg') {
                const uToken = normalizeSingleChoiceToken(userAnswer);
                const kToken = normalizeSingleChoiceToken(q.correctAnswer);
                let isMatch = (uToken !== '' && uToken === kToken);
                if (!isMatch && Array.isArray(q.options)) {
                    const uIdx = uToken.length === 1 ? (uToken.charCodeAt(0) - 65) : -1;
                    const optText = (uIdx >= 0 && q.options[uIdx] !== undefined) ? normalizeShortText(q.options[uIdx]) : '';
                    if (optText && optText === normalizeShortText(q.correctAnswer)) {
                        isMatch = true;
                    }
                }
                return {
                    status: isMatch ? 'CORRECT' : 'WRONG',
                    earnedWeight: isMatch ? maxWeight : 0,
                    maxWeight,
                    ratio: isMatch ? 1 : 0
                };
            }

            // 2. Pilihan Ganda Kompleks (pg_complex):
            // Rumus: Math.max(0, (Jumlah Benar Dipilih - Jumlah Salah Dipilih) / Total Kunci Benar) * Bobot Soal
            if (qType === 'pg_complex') {
                const splitRegex = new RegExp('[,;|/\\s]+');
                const rawKeys = Array.isArray(q.correctAnswer)
                    ? q.correctAnswer
                    : String(q.correctAnswer || '').split(splitRegex).filter(Boolean);
                const keySet = new Set(rawKeys.map(k => normalizeSingleChoiceToken(k)).filter(Boolean));
                const totalCorrectKeys = keySet.size;
                if (totalCorrectKeys === 0) {
                    return { status: 'WRONG', earnedWeight: 0, maxWeight, ratio: 0 };
                }

                const rawUserArr = Array.isArray(userAnswer)
                    ? userAnswer
                    : String(userAnswer || '').split(splitRegex).filter(Boolean);
                const userSet = new Set(rawUserArr.map(u => normalizeSingleChoiceToken(u)).filter(Boolean));

                let correctChosen = 0;
                let wrongChosen = 0;
                userSet.forEach(choice => {
                    if (keySet.has(choice)) correctChosen++;
                    else wrongChosen++;
                });

                const rawRatio = (correctChosen - wrongChosen) / totalCorrectKeys;
                const clampedRatio = Math.min(1, Math.max(0, rawRatio));
                const earnedWeight = safeRoundTwoDecimals(clampedRatio * maxWeight);
                const status = (clampedRatio === 1 && correctChosen === totalCorrectKeys && wrongChosen === 0)
                    ? 'CORRECT'
                    : (clampedRatio > 0 ? 'PARTIAL' : 'WRONG');

                return { status, earnedWeight, maxWeight, ratio: clampedRatio };
            }

            // 3. Benar / Salah (true_false - Multi-Pernyataan maupun Tunggal):
            // Rumus Proporsional: (Jumlah Baris Tepat / Total Baris Pernyataan) * Bobot Soal
            if (qType === 'true_false') {
                const opts = Array.isArray(q.options) && q.options.length > 0 ? q.options : ['Benar', 'Salah'];
                const isDefaultTwoBS = opts.length === 2 &&
                    normalizeTrueFalseToken(opts[0]) === 'benar' &&
                    normalizeTrueFalseToken(opts[1]) === 'salah';
                const isMultiStatement = Array.isArray(q.correctAnswer) ||
                    !isDefaultTwoBS ||
                    (typeof userAnswer === 'object' && userAnswer !== null && !Array.isArray(userAnswer));

                if (isMultiStatement) {
                    const tfSplitRegex = new RegExp('[,;|/\\s\\-]+');
                    const keyList = Array.isArray(q.correctAnswer)
                        ? q.correctAnswer
                        : String(q.correctAnswer || '').split(tfSplitRegex).filter(Boolean);
                    const totalRows = Math.max(opts.length, keyList.length, 1);
                    let correctRows = 0;

                    for (let idx = 0; idx < totalRows; idx++) {
                        let rawStudentVal = '';
                        if (typeof userAnswer === 'object' && userAnswer !== null && !Array.isArray(userAnswer)) {
                            rawStudentVal = userAnswer[String(idx)] !== undefined ? userAnswer[String(idx)] : '';
                        } else if (Array.isArray(userAnswer)) {
                            rawStudentVal = userAnswer[idx] !== undefined ? userAnswer[idx] : '';
                        } else if (idx === 0) {
                            rawStudentVal = String(userAnswer);
                        }
                        const normStudent = normalizeTrueFalseToken(rawStudentVal);
                        const normKey = normalizeTrueFalseToken(keyList[idx] !== undefined ? keyList[idx] : keyList[0]);
                        if (normStudent !== '' && normKey !== '' && normStudent === normKey) {
                            correctRows++;
                        }
                    }

                    const ratio = Math.min(1, Math.max(0, correctRows / totalRows));
                    const earnedWeight = safeRoundTwoDecimals(ratio * maxWeight);
                    const status = ratio === 1 ? 'CORRECT' : (ratio > 0 ? 'PARTIAL' : 'WRONG');
                    return { status, earnedWeight, maxWeight, ratio };
                } else {
                    const normStudent = normalizeTrueFalseToken(userAnswer);
                    const normKey = normalizeTrueFalseToken(q.correctAnswer);
                    const isMatch = (normStudent !== '' && normStudent === normKey);
                    return {
                        status: isMatch ? 'CORRECT' : 'WRONG',
                        earnedWeight: isMatch ? maxWeight : 0,
                        maxWeight,
                        ratio: isMatch ? 1 : 0
                    };
                }
            }

            // 4. Menjodohkan (matching):
            // Rumus Proporsional: (Jumlah Pasangan Tepat / Total Pasangan Kunci) * Bobot Soal
            if (qType === 'matching') {
                const expectedMap = {};
                if (Array.isArray(q.matchingPairs) && q.matchingPairs.length > 0) {
                    q.matchingPairs.forEach((pair, idx) => {
                        if (pair && pair.right !== undefined && String(pair.right).trim() !== '') {
                            expectedMap[String(idx)] = normalizeShortText(pair.right);
                        }
                    });
                }
                if (Object.keys(expectedMap).length === 0 && q.correctAnswer && typeof q.correctAnswer === 'object' && !Array.isArray(q.correctAnswer)) {
                    Object.entries(q.correctAnswer).forEach(([k, v]) => {
                        if (v !== undefined && String(v).trim() !== '') {
                            expectedMap[String(k)] = normalizeShortText(v);
                        }
                    });
                }
                if (Object.keys(expectedMap).length === 0) {
                    const parsedFallback = parseMatchingOptionsAndKey(q.options || [], typeof q.correctAnswer === 'string' ? q.correctAnswer : '');
                    Object.entries(parsedFallback.correctAnswer || {}).forEach(([k, v]) => {
                        expectedMap[String(k)] = normalizeShortText(v);
                    });
                }

                const pairKeys = Object.keys(expectedMap);
                const totalPairs = pairKeys.length;
                if (totalPairs === 0) {
                    return { status: 'WRONG', earnedWeight: 0, maxWeight, ratio: 0 };
                }

                const studentMap = (typeof userAnswer === 'object' && userAnswer !== null) ? userAnswer : {};
                let matchedPairs = 0;
                pairKeys.forEach(k => {
                    const sVal = normalizeShortText(studentMap[k]);
                    const kVal = expectedMap[k];
                    if (sVal !== '' && sVal === kVal) {
                        matchedPairs++;
                    }
                });

                const ratio = Math.min(1, Math.max(0, matchedPairs / totalPairs));
                const earnedWeight = safeRoundTwoDecimals(ratio * maxWeight);
                const status = ratio === 1 ? 'CORRECT' : (ratio > 0 ? 'PARTIAL' : 'WRONG');
                return { status, earnedWeight, maxWeight, ratio };
            }

            // 5. Isian Singkat (short_answer):
            // Normalisasi .trim().toLowerCase().replace(/\s+/g, ' ') & dukungan multi-alternatif kunci ("10, sepuluh")
            if (qType === 'short_answer') {
                const normStudent = normalizeShortText(userAnswer);
                const altSplitRegex = new RegExp('[,;|/]+');
                const rawKey = q.correctAnswer;
                let alternatives = [];
                if (Array.isArray(rawKey)) {
                    alternatives = rawKey.map(k => normalizeShortText(k)).filter(Boolean);
                } else {
                    const fullKeyStr = String(rawKey ?? '');
                    alternatives = fullKeyStr.split(altSplitRegex).map(k => normalizeShortText(k)).filter(Boolean);
                    const wholeNorm = normalizeShortText(fullKeyStr);
                    if (wholeNorm && !alternatives.includes(wholeNorm)) {
                        alternatives.push(wholeNorm);
                    }
                }
                const isMatch = normStudent !== '' && alternatives.includes(normStudent);
                return {
                    status: isMatch ? 'CORRECT' : 'WRONG',
                    earnedWeight: isMatch ? maxWeight : 0,
                    maxWeight,
                    ratio: isMatch ? 1 : 0
                };
            }

            // 6. Uraian / Essay (essay):
            // Mendukung input nilai manual korektor (clamped 0 s.d maxWeight) atau keyword matching proporsional
            if (qType === 'essay') {
                if (manualEssayScore !== undefined && manualEssayScore !== null && manualEssayScore !== '') {
                    const numericManual = Number(manualEssayScore);
                    if (Number.isFinite(numericManual)) {
                        const clampedManual = safeRoundTwoDecimals(Math.min(maxWeight, Math.max(0, numericManual)));
                        const ratio = maxWeight > 0 ? Math.min(1, Math.max(0, clampedManual / maxWeight)) : 0;
                        return { status: 'ESSAY', earnedWeight: clampedManual, maxWeight, ratio };
                    }
                }

                // Fallback keyword matching jika guru mengisi kata kunci pada Kunci Jawaban
                const rawKeyStr = String(q.correctAnswer ?? '').trim();
                if (rawKeyStr && rawKeyStr !== '-') {
                    const kwSplitRegex = new RegExp('[,;|]+');
                    const keywords = rawKeyStr.split(kwSplitRegex).map(k => normalizeShortText(k)).filter(Boolean);
                    if (keywords.length > 0) {
                        const normStudentEssay = normalizeShortText(userAnswer);
                        let matchedKw = 0;
                        keywords.forEach(kw => {
                            if (kw && normStudentEssay.includes(kw)) matchedKw++;
                        });
                        const kwRatio = Math.min(1, Math.max(0, matchedKw / keywords.length));
                        const kwEarned = safeRoundTwoDecimals(kwRatio * maxWeight);
                        return { status: 'ESSAY', earnedWeight: kwEarned, maxWeight, ratio: kwRatio };
                    }
                }

                return { status: 'ESSAY', earnedWeight: 0, maxWeight, ratio: 0 };
            }

            return { status: 'WRONG', earnedWeight: 0, maxWeight, ratio: 0 };
        };

        // 7. Validasi & Normalisasi Total Skor Akhir ke Skala 100 (2 Desimal Bebas Floating-Point Error)
        window.calculateExamSubmissionScore = function(questionsList, studentAnswersMap, existingEssayScores = {}) {
            const qArray = Array.isArray(questionsList) ? questionsList : [];
            const ansMap = (studentAnswersMap && typeof studentAnswersMap === 'object') ? studentAnswersMap : {};
            const manualMap = (existingEssayScores && typeof existingEssayScores === 'object') ? existingEssayScores : {};

            let totalScoreObtained = 0;
            let maxPossibleScore = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let emptyCount = 0;
            let hasEssayQuestion = false;
            const essayScores = {};

            qArray.forEach(q => {
                if (!q) return;
                const qWeight = Math.max(0, Number(q.weight !== undefined ? q.weight : 10) || 0);
                maxPossibleScore = safeRoundTwoDecimals(maxPossibleScore + qWeight);

                const ans = ansMap[q.id];
                const hasManual = manualMap[q.id] !== undefined && manualMap[q.id] !== null && manualMap[q.id] !== '';
                const evalRes = window.evaluateQuestionScore(q, ans, hasManual ? manualMap[q.id] : undefined);

                if (q.type === 'essay') {
                    hasEssayQuestion = true;
                    essayScores[q.id] = evalRes.earnedWeight;
                    if (evalRes.status === 'EMPTY') {
                        emptyCount++;
                    } else {
                        totalScoreObtained = safeRoundTwoDecimals(totalScoreObtained + evalRes.earnedWeight);
                        if (evalRes.earnedWeight > 0) correctCount++;
                    }
                    return;
                }

                if (evalRes.status === 'EMPTY') {
                    emptyCount++;
                } else if (evalRes.status === 'CORRECT' || evalRes.status === 'PARTIAL') {
                    totalScoreObtained = safeRoundTwoDecimals(totalScoreObtained + evalRes.earnedWeight);
                    correctCount++;
                } else {
                    wrongCount++;
                }
            });

            const clampedTotalObtained = Math.min(maxPossibleScore, Math.max(0, totalScoreObtained));
            const rawFinalScore = maxPossibleScore > 0 ? (clampedTotalObtained / maxPossibleScore) * 100 : 0;
            const finalScore = safeRoundTwoDecimals(Math.min(100, Math.max(0, rawFinalScore)));

            return {
                totalScoreObtained: safeRoundTwoDecimals(clampedTotalObtained),
                maxPossibleScore: safeRoundTwoDecimals(maxPossibleScore),
                finalScore,
                correctCount,
                wrongCount,
                emptyCount,
                hasEssayQuestion,
                essayScores
            };
        };

            if (!rawText) return '';
            const lines = String(rawText).split(/\r?\n/);

                    return `<strong class="font-bold text-slate-900 text-base sm:text-[17px]">${escapeHtml(line)}</strong>`;
                }
                return escapeHtml(line);
            }).join('\n');
        }

        window.saveAnswer = function(qId, val) {
            currentStudentAnswers[qId] = val;
            const answeredEl = document.getElementById('answeredCounterText');
            if (answeredEl) {
                let count = 0;
                currentExamQuestions.forEach(item => {
                    if (isQuestionAnswered(currentStudentAnswers[item.id])) count++;
                });
                answeredEl.innerText = String(count);
            }
            window.scheduleAutoSave(false);
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            currentStudentAnswers[qId] = val;
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveComplexAnswer = function(qId, val, checked) {
            if (!Array.isArray(currentStudentAnswers[qId])) currentStudentAnswers[qId] = [];
            if (checked) {
                if (!currentStudentAnswers[qId].includes(val)) currentStudentAnswers[qId].push(val);
            } else {
                currentStudentAnswers[qId] = currentStudentAnswers[qId].filter(x => x !== val);
            }
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveMatchingAnswer = function(qId, pairIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            if (val) {
                currentStudentAnswers[qId][String(pairIdx)] = val;
            } else {
                delete currentStudentAnswers[qId][String(pairIdx)];
            }
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveMultiTrueFalseAnswer = function(qId, stmtIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null || Array.isArray(currentStudentAnswers[qId])) {
                currentStudentAnswers[qId] = {};
            }
            currentStudentAnswers[qId][String(stmtIdx)] = val;
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];

            const total = currentExamQuestions.length;
            let answeredCount = 0;
            let doubtfulCount = 0;
            currentExamQuestions.forEach(q => {
                const ans = currentStudentAnswers[q.id];
                if (isQuestionAnswered(ans)) {
                    answeredCount++;
                }
                if (currentDoubtfulMap[q.id]) {
                    doubtfulCount++;
                }
            });
            const emptyCount = total - answeredCount;

            const html = `
                <div class="space-y-4 py-2 text-xs">
                    <div class="flex items-center gap-3 p-3 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-900">

            window.showModal('Konfirmasi Selesai Ujian', '', 'info', (confirmed) => {

        window.submitExamFinal = async function(isTimeoutAutoSubmit = false) {
            if (isSubmittingFinalExam) return;
            isSubmittingFinalExam = true;
            window.stopAllExamTimersAndWatchers();
            window.closeModal();

            const student = appData.currentUser;
            if (!student || !currentActiveExam) {
                isSubmittingFinalExam = false;
                await window.autoLogoutStudentToInitialLogin();
                return;
            }

            const activeExamSnapshot = currentActiveExam;
            const sessId = getSessionDocId(activeExamSnapshot.id, student.studentId);
            const clonedAnswers = JSON.parse(JSON.stringify(currentStudentAnswers || {}));
            const calc = window.calculateExamSubmissionScore(currentExamQuestions, clonedAnswers, {});

            appData.examResults = appData.examResults.filter(r => !(r.studentId === student.studentId && r.examId === activeExamSnapshot.id));

            const submittedTimeStr = isTimeoutAutoSubmit
                ? new Date().toLocaleString('id-ID') + ' (Auto-Submit Waktu Habis)'
                : new Date().toLocaleString('id-ID');

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + activeExamSnapshot.id,
                examId: activeExamSnapshot.id,
                examName: activeExamSnapshot.examName,
                subjectId: activeExamSnapshot.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId,
                className: student.className || '4',
                submittedAt: submittedTimeStr,
                totalScoreObtained: calc.totalScoreObtained,
                maxPossibleScore: calc.maxPossibleScore,
                finalScore: calc.finalScore,
                correctCount: calc.correctCount,
                wrongCount: calc.wrongCount,
                emptyCount: calc.emptyCount,
                violationCount: currentViolationCount,
                essayGradingStatus: calc.hasEssayQuestion ? 'Belum Dinilai' : 'Sudah Dinilai',
                essayScores: calc.essayScores,
                answersSnapshot: clonedAnswers
            };

            appData.examResults.push(resultObj);

            const completedSessionPayload = {
                id: sessId,
                examId: activeExamSnapshot.id,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                status: 'SUBMITTED',
                submittedAtMs: Date.now(),
                submittedAtFormatted: resultObj.submittedAt,
                finalScore: resultObj.finalScore,
                violationCount: currentViolationCount,
                sessionToken: currentSessionToken
            };
            const sIdx = appData.examSessions.findIndex(s => s.id === sessId);
            if (sIdx !== -1) appData.examSessions[sIdx] = { ...appData.examSessions[sIdx], ...completedSessionPayload };

            let p = appData.examParticipants.find(x => x.examId === activeExamSnapshot.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + activeExamSnapshot.id,
                    examId: activeExamSnapshot.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '4',
                    status: 'Selesai',
                    violationCount: currentViolationCount,
                    extraTimeMinutes: 0
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
                p.violationCount = currentViolationCount;
            }

            logActivity(`Siswa ${student.name} menyelesaikan ujian ${activeExamSnapshot.examName} dan otomatis logout.`);

            try {
                await Promise.all([
                    syncCollectionRecord('examResults', resultObj.resultId, resultObj),
                    syncCollectionRecord('examSessions', sessId, completedSessionPayload),
                    syncCollectionRecord('examParticipants', p.id, p)
                ]);
            } catch (syncErr) {
                console.warn('Sinkronisasi hasil ujian selesai:', syncErr);
            }

            await window.autoLogoutStudentToInitialLogin();
        };

        function evaluateSingleQuestionForReview(q, ans, resObj) {
            const manualMap = (resObj && resObj.essayScores && typeof resObj.essayScores === 'object') ? resObj.essayScores : {};
            const manualScore = (q && q.id && manualMap[q.id] !== undefined) ? manualMap[q.id] : undefined;
            const scoreRes = window.evaluateQuestionScore(q, ans, manualScore);

            const formatVal = (v) => {
                if (v === undefined || v === null || v === '') return '(Tidak dijawab)';
                if (Array.isArray(v)) return v.join(', ');
                if (typeof v === 'object') {
                    return Object.entries(v).map(([k, val]) => `${Number(k) + 1}: ${val}`).join(' | ');
                }
                if (q.type === 'pg' && Array.isArray(q.options)) {
                    const idx = String(v).trim().toUpperCase().charCodeAt(0) - 65;
                    const optTxt = q.options[idx];
                    return optTxt ? `${String(v).toUpperCase()}. ${optTxt}` : String(v);
                }
                return String(v);
            };

            const formatKey = () => {
                const k = q.correctAnswer;
                if (q.type === 'pg' && Array.isArray(q.options)) {
                    const letter = String(k || 'A').trim().toUpperCase();
                    const idx = letter.charCodeAt(0) - 65;
                    const optTxt = q.options[idx];
                    return optTxt ? `${letter}. ${optTxt}` : letter;
                }
                if (Array.isArray(k)) return k.join(', ');
                if (typeof k === 'object' && k !== null) {
                    return Object.entries(k).map(([idxKey, val]) => `${Number(idxKey) + 1}: ${val}`).join(' | ');
                }
                return String(k ?? '-');
            };

            if (scoreRes.status === 'EMPTY') {
                return {
                    status: 'EMPTY',
                    earnedWeight: 0,
                    maxWeight: scoreRes.maxWeight,
                    badgeText: 'Tidak Dijawab',
                    badgeClass: 'bg-slate-100 text-slate-600 border-slate-300',
                    cardBorder: 'border-slate-200 bg-slate-50/60',
                    studentAnsText: '(Tidak dijawab)',
                    correctKeyText: formatKey()
                };
            }

            if (q.type === 'essay') {
                const isGraded = resObj && resObj.essayGradingStatus === 'Sudah Dinilai';
                return {
                    status: 'ESSAY',
                    earnedWeight: scoreRes.earnedWeight,
                    maxWeight: scoreRes.maxWeight,
                    badgeText: isGraded
                        ? `Skor Uraian: ${scoreRes.earnedWeight}/${scoreRes.maxWeight}`
                        : (scoreRes.earnedWeight > 0 ? `Skor Kata Kunci: ${scoreRes.earnedWeight}/${scoreRes.maxWeight}` : 'Menunggu Koreksi Guru'),
                    badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200',
                    cardBorder: 'border-indigo-200 bg-indigo-50/20',
                    studentAnsText: formatVal(ans),
                    correctKeyText: formatKey()
                };
            }

            const isCorrectOrPartial = scoreRes.status === 'CORRECT' || scoreRes.status === 'PARTIAL';
            const badgeText = scoreRes.status === 'CORRECT'
                ? `Benar (+${scoreRes.earnedWeight})`
                : (scoreRes.status === 'PARTIAL' ? `Parsial (+${scoreRes.earnedWeight}/${scoreRes.maxWeight})` : 'Salah (0)');

            return {
                status: isCorrectOrPartial ? 'CORRECT' : 'WRONG',
                rawStatus: scoreRes.status,
                earnedWeight: scoreRes.earnedWeight,
                maxWeight: scoreRes.maxWeight,
                badgeText,
                badgeClass: scoreRes.status === 'CORRECT'
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                    : (scoreRes.status === 'PARTIAL' ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-red-100 text-red-700 border-red-300'),
                cardBorder: isCorrectOrPartial ? 'border-emerald-200 bg-emerald-50/20' : 'border-red-200 bg-red-50/20',
                studentAnsText: formatVal(ans),
                correctKeyText: formatKey()
            };
        }

        window.renderExamResultReviewPage = function(resObj) {
            isViewingResultReview = true;
            isExamWorkspaceActive = false;

            const examObj = appData.exams.find(e => e.id === resObj.examId) || currentActiveExam;
            let questionsList = [];
            if (examObj && Array.isArray(examObj.questionIds) && examObj.questionIds.length > 0) {
                questionsList = examObj.questionIds.map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            }
            if (questionsList.length === 0 && examObj && examObj.bankId) {
                questionsList = appData.questions.filter(q => q.bankId === examObj.bankId);
            }
            if (questionsList.length === 0 && currentExamQuestions.length > 0) {
                questionsList = [...currentExamQuestions];
            }
            if (questionsList.length === 0) {
                questionsList = [...appData.questions];
            }

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-4 sm:p-6 custom-scrollbar">
                    <div class="max-w-xl mx-auto w-full bg-white rounded-3xl shadow-xl p-6 sm:p-8 space-y-6 my-auto text-center">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <div class="space-y-1">
                            <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>
                            <p class="text-xs font-semibold text-indigo-700">${escapeHtml(resObj.examName || (examObj ? examObj.examName : 'Paket Ujian'))}</p>
                            <p class="text-xs text-slate-500">${escapeHtml(resObj.studentName)} (Kelas ${escapeHtml(resObj.className)}) • Disubmit pada ${escapeHtml(resObj.submittedAt)}</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                            <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200">
                                <p class="text-[11px] font-bold text-emerald-800 uppercase">Nilai Akhir</p>
                                <h3 class="text-3xl font-extrabold text-emerald-700 mt-1">${resObj.finalScore}</h3>
                            </div>
                            <div class="p-4 bg-blue-50 rounded-2xl border border-blue-200">
                                <p class="text-[11px] font-bold text-blue-800 uppercase">Jawaban Benar</p>
                                <h3 class="text-2xl font-extrabold text-blue-700 mt-1">${resObj.correctCount || 0} Soal</h3>
                            </div>
                            <div class="p-4 bg-red-50 rounded-2xl border border-red-200">
                                <p class="text-[11px] font-bold text-red-800 uppercase">Jawaban Salah</p>
                                <h3 class="text-2xl font-extrabold text-red-600 mt-1">${resObj.wrongCount || 0} Soal</h3>
                            </div>
                            <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200">
                                <p class="text-[11px] font-bold text-amber-800 uppercase">Kosong / Tab</p>
                                <h3 class="text-base font-extrabold text-amber-700 mt-1">${resObj.emptyCount || 0} Kosong • ${resObj.violationCount || 0}x</h3>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                            <button type="button" onclick="window.renderStudentPortal(false)" class="flex-1 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl font-extrabold text-xs sm:text-sm transition cursor-pointer">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i> Kembali ke Portal Siswa
                            </button>
                            <button type="button" onclick="window.logoutApp()" class="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-extrabold text-xs sm:text-sm shadow-md transition cursor-pointer">
                                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Keluar
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        // Simpan progres secara otomatis ketika tab/browser hendak ditutup atau di-refresh
        window.addEventListener('beforeunload', () => {
            if (isExamWorkspaceActive && currentActiveExam && !isSubmittingFinalExam) {
                window.persistExamSessionToCloud(true);
            }
        });

        window.onload = async function() {
            try {
                await initFirebaseProduction();
                startScheduleTransitionWatcher();
                window.renderLoginView();
            } catch (error) {
                startScheduleTransitionWatcher();
                window.renderLoginView();
                window.showModal(
                    'Koneksi Firebase Gagal',
                    'Aplikasi belum dapat terhubung ke Firebase. Periksa konfigurasi project, pastikan Firestore Database tersedia, dan sesuaikan Security Rules.',
                    'error'
                );
            }
        };
    </script>
</body>
</html>
