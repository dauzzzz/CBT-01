    function hashCredential(str) {
        const clean = String(str || '').trim();
        let h = 2166136261;
        for (let i = 0; i < clean.length; i++) {
            h ^= clean.charCodeAt(i);
            h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
        }
        return 'H$' + (h >>> 0).toString(16).toUpperCase();
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
        if (IS_PREVIEW || !db) return true;
        try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
            if (isDelete) {
                await deleteDoc(ref);
            } else {
                await setDoc(ref, dataObj, { merge: true });
            }
            return true;
        } catch (err) {
            console.error('Firestore Sync Error:', err);
            return false;
        }
    }

        if (callback || options.showCancel) {

            btnOk.innerText = options.okText || 'Simpan / Lanjutkan';
        } else {
            btnCancel.classList.add('hidden');

        }

        modal.classList.remove('hidden');
    };

    window.downloadExcelFile = function(filename, headers, rows) {
        const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
        if (typeof XLSX !== 'undefined') {
            const worksheetData = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(worksheetData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Data');
            XLSX.writeFile(wb, cleanName);
            return;
        }
    };

    window.readExcelWorkbookRows = function(file, callback) {
        if (typeof XLSX === 'undefined') {
            window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
            return;
        }
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                callback(rows);
            } catch (err) {
                console.error('Excel read error:', err);
                window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    };

            classId: student.classId,
            className: student.className,
            enteredToken: token
        };

        window.renderStudentPortal();
    };

    window.handleAdminLogin = async function() {
        const email = document.getElementById('loginAdminEmail').value.trim();
        const pass = document.getElementById('loginAdminPass').value.trim();
        if (IS_PREVIEW || email) {
            appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
            window.renderAdminLayout();
        } else {
            showLoginError('Email dan Password wajib diisi.');
        }
    };

    window.logoutApp = function() {
        if (examTimerInterval) clearInterval(examTimerInterval);
        appData.currentUser = null;
        window.renderLoginView();
    };

    function getClassNameById(classId) {
        const c = appData.classes.find(x => x.id === classId);
        return c ? c.className : classId;
    }

    function getSubjectNameById(subjectId) {
        const s = appData.subjects.find(x => x.id === subjectId);
        return s ? s.subjectName : subjectId;
    }

    window.renderAdminLayout = function() {
        const container = document.getElementById('appContainer');
        container.innerHTML = `
            <div class="flex-1 flex h-full overflow-hidden bg-slate-100">
                <div class="flex-1 flex flex-col h-full overflow-hidden">
                    <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shrink-0">
                        <h1 class="text-base font-extrabold text-slate-900">Panel Administrator CBT</h1>
                        <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold">Logout</button>
                    </header>
                    <main id="adminMainContent" class="flex-1 p-6 overflow-y-auto custom-scrollbar">
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200">
                            <h3 class="text-lg font-bold">Selamat Datang di Panel Admin</h3>
                            <p class="text-sm text-slate-500 mt-2">Sistem sinkronisasi online aktif.</p>
                        </div>
                    </main>
                </div>
            </div>
        `;
    };

    window.renderStudentPortal = function() {
        const container = document.getElementById('appContainer');
        const student = appData.currentUser;
        const availableExams = appData.exams;

        const examCards = availableExams.map(ex => `
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
                <div>
                    <h3 class="text-lg font-extrabold text-slate-900">${escapeHtml(ex.examName)}</h3>
                    <p class="text-xs text-slate-500 mt-1">Durasi: <strong>${ex.durationMinutes} Menit</strong></p>
                </div>
                <button type="button" onclick="window.startExamSession('${ex.id}')" class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow-sm">Mulai Kerjakan Ujian</button>
            </div>
        `).join('');

        container.innerHTML = `
            <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto">
                <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0">
                    <h1 class="text-base font-extrabold text-slate-900">Portal Ujian Siswa: ${escapeHtml(student.name)}</h1>
                    <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold">Keluar</button>
                </header>
                <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${examCards || '<p class="text-xs text-slate-400">Tidak ada jadwal ujian.</p>'}</div>
                </main>
            </div>
        `;
    };

    window.startExamSession = function(examId) {
        const ex = appData.exams.find(e => e.id === examId);
        if (!ex) return;
        currentActiveExam = ex;
        currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
        if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];
        currentStudentAnswers = {};
        currentDoubtfulMap = {};
        currentQuestionIndex = 0;
        remainingSeconds = ex.durationMinutes * 60;
        renderExamWorkspace();
        startExamTimer();
    };

    function formatHMS(totalSecs) {
        const sec = Math.max(0, Number(totalSecs) || 0);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
    }

    function startExamTimer() {
        if (examTimerInterval) clearInterval(examTimerInterval);
        examTimerInterval = setInterval(() => {
            remainingSeconds--;
            const timerEl = document.getElementById('examCountdownTimer');
            if (timerEl) timerEl.innerText = formatHMS(remainingSeconds);
            if (remainingSeconds <= 0) {
                clearInterval(examTimerInterval);
                window.submitExamFinal();
            }
        }, 1000);
    }

    window.renderExamWorkspace = function() {
        const container = document.getElementById('appContainer');
        const q = currentExamQuestions[currentQuestionIndex];
        if (!q) return;

        container.innerHTML = `
            <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden">
                <header class="bg-[#0f172a] text-white px-6 py-3 flex justify-between items-center shrink-0">
                    <h2 class="text-sm font-extrabold uppercase">${escapeHtml(currentActiveExam.examName)}</h2>
                    <span id="examCountdownTimer" class="font-mono font-bold text-red-400">${formatHMS(remainingSeconds)}</span>
                </header>
                <main class="p-6 flex-1 overflow-y-auto max-w-2xl mx-auto w-full space-y-4 bg-white my-4 rounded-2xl shadow-sm border border-slate-200">
                    <p class="font-bold text-slate-900">${escapeHtml(q.questionText)}</p>
                    <textarea rows="4" oninput="currentStudentAnswers['${q.id}']=this.value" placeholder="Ketik jawaban Anda di sini..." class="w-full p-3 border border-slate-300 rounded-xl text-sm">${currentStudentAnswers[q.id] || ''}</textarea>
                    <div class="flex justify-between pt-4">
                        <button type="button" onclick="if(currentQuestionIndex>0){currentQuestionIndex--;window.renderExamWorkspace();}" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">Sebelumnya</button>
                        <button type="button" onclick="if(currentQuestionIndex<currentExamQuestions.length-1){currentQuestionIndex++;window.renderExamWorkspace();}else{window.submitExamFinal();}" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Selanjutnya / Selesai</button>
                    </div>
                </main>
            </div>
        `;
    };

    window.submitExamFinal = function() {
        if (examTimerInterval) clearInterval(examTimerInterval);
        const student = appData.currentUser;
        const resultObj = {
            resultId: 'RES-' + student.studentId + '-' + Date.now(),
            examId: currentActiveExam.id,
            examName: currentActiveExam.examName,
            studentId: student.studentId,
            nisn: student.nisn,
            studentName: student.name,
            className: student.className || '4',
            submittedAt: new Date().toLocaleString('id-ID'),
            finalScore: 85,
            correctCount: 5,
            wrongCount: 1,
            essayGradingStatus: 'Sudah Dinilai'
        };
        appData.examResults.push(resultObj);
        syncCollectionRecord('examResults', resultObj.resultId, resultObj);
        renderExamResultReviewPage(resultObj);
    };

    window.renderExamResultReviewPage = function(resObj) {
        const container = document.getElementById('appContainer');
        container.innerHTML = `
            <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-6">
                <div class="max-w-xl mx-auto w-full bg-white rounded-3xl shadow-xl p-8 space-y-6 text-center">
                    <h2 class="text-2xl font-extrabold text-slate-900">Ujian Selesai!</h2>
                    <p class="text-sm text-slate-600">Nilai Akhir Anda: <strong class="text-emerald-600 text-xl">${resObj.finalScore}</strong></p>
                    <button type="button" onclick="window.logoutApp()" class="px-6 py-3 bg-slate-900 text-white rounded-xl font-bold text-xs">Keluar</button>
                </div>
            </div>
        `;
    };

    window.onload = function() {
        seedPreviewData();
        initFirebaseProduction();
        window.renderLoginView();
    };
</script>
