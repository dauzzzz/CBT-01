    <script type="module">

        function compressAndConvertImage(file, maxWidth = 280, maxHeight = 280, quality = 0.88) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                        const dataUrl = canvas.toDataURL(outType, quality);
                        canvas.toBlob((blob) => {
                            resolve({ dataUrl, blob: blob || file });
                        }, outType, quality);
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeFirestoreData(obj) {
            if (obj === null || obj === undefined) return null;
            return JSON.parse(JSON.stringify(obj));
        }

        let appData = {

        // Variabel Sesi Ujian, Auto-Save & Kontrol Perangkat
        let examTimerInterval = null;
        let periodicAutoSaveInterval = null;
        let sessionWatcherUnsubscribe = null;
        let globalRealtimeUnsubscribes = [];
        let fallbackPollingInterval = null;
        let scheduleTransitionInterval = null;
        let lastScheduleStateSignature = '';

        let isInitialRealtimeLoad = true;
        let remainingSeconds = 0;
        let currentExamEndTimeMs = 0;

        let currentSessionToken = '';

        // ============================================================================
        // FULLSCREEN API HELPERS (OTOMATIS FULLSCREEN SAAT LOGIN & UJIAN SISWA)
        // ============================================================================
        window.isDocumentFullscreen = function() {
            return Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
        };

        window.updateFullscreenButtonUI = function() {
            const isFs = window.isDocumentFullscreen();
            const btns = document.querySelectorAll('.student-fullscreen-toggle-btn');
            btns.forEach(btn => {
                if (isFs) {
                    btn.innerHTML = '<i class="fa-solid fa-compress"></i> <span class="hidden sm:inline">Layar Penuh Aktif</span>';
                    btn.title = 'Klik untuk keluar dari mode layar penuh';
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-expand"></i> <span class="hidden sm:inline">Layar Penuh</span>';
                    btn.title = 'Aktifkan tampilan layar penuh (Fullscreen)';
                }
            });
        };

        window.enterStudentFullscreen = async function() {
            try {
                if (window.isDocumentFullscreen()) {
                    window.updateFullscreenButtonUI();
                    return true;
                }
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                } else if (docEl.mozRequestFullScreen) {
                    await docEl.mozRequestFullScreen();
                } else if (docEl.msRequestFullscreen) {
                    await docEl.msRequestFullscreen();
                }
                window.updateFullscreenButtonUI();
                return true;
            } catch (err) {
                // Browser mungkin memblokir jika dipanggil di luar gesture klik langsung
                window.updateFullscreenButtonUI();
                return false;
            }
        };

        window.exitStudentFullscreen = async function() {
            try {
                if (!window.isDocumentFullscreen()) {
                    window.updateFullscreenButtonUI();
                    return true;
                }
                if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    await document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    await document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    await document.msExitFullscreen();
                }
                window.updateFullscreenButtonUI();
                return true;
            } catch (err) {
                window.updateFullscreenButtonUI();
                return false;
            }
        };

        window.toggleStudentFullscreen = async function() {
            if (window.isDocumentFullscreen()) {
                await window.exitStudentFullscreen();
            } else {
                await window.enterStudentFullscreen();
            }
        };

        ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evtName => {
            document.addEventListener(evtName, () => {
                window.updateFullscreenButtonUI();
            });
        });

        // ============================================================================
        // SINGLE-DEVICE & SINGLE-TAB LOGIN LOCK (ANTI MULTI-LOGIN SISWA)
        // ============================================================================
        const STUDENT_LOCK_TIMEOUT_MS = 90 * 1000; // 90 detik batas aktif heartbeat
        let studentHeartbeatInterval = null;
        let studentBroadcastChannel = null;

        function getOrCreateDeviceSessionId() {
            try {
                let sid = sessionStorage.getItem('cbt_device_session_id');
                if (!sid) {
                    sid = 'DEV-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                    sessionStorage.setItem('cbt_device_session_id', sid);
                }
                return sid;
            } catch (e) {
                if (!window._fallbackDeviceSessionId) {
                    window._fallbackDeviceSessionId = 'DEV-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                }
                return window._fallbackDeviceSessionId;
            }
        }

        const currentDeviceSessionId = getOrCreateDeviceSessionId();

        function isStudentRecordLockedByOther(studentDoc, mySessionId = currentDeviceSessionId) {
            if (!studentDoc) return false;
            if (!studentDoc.isLoggedIn || !studentDoc.activeSessionId) return false;
            if (studentDoc.activeSessionId === mySessionId) return false;
            const lastHb = Number(studentDoc.lastHeartbeatAt) || 0;
            const ageMs = Date.now() - lastHb;
            return lastHb > 0 && ageMs < STUDENT_LOCK_TIMEOUT_MS;
        }

        function isStudentCurrentlyLoggedIn(studentDoc) {
            if (!studentDoc || !studentDoc.isLoggedIn || !studentDoc.activeSessionId) return false;
            const lastHb = Number(studentDoc.lastHeartbeatAt) || 0;
            return lastHb > 0 && (Date.now() - lastHb) < STUDENT_LOCK_TIMEOUT_MS;
        }

        function startStudentHeartbeat() {
            stopStudentHeartbeat();
            if (!appData.currentUser || appData.currentUser.role !== 'student') return;

            try {
                if (typeof BroadcastChannel !== 'undefined') {
                    studentBroadcastChannel = new BroadcastChannel('cbt_student_session_channel');
                    studentBroadcastChannel.onmessage = (evt) => {
                        const msg = evt.data || {};
                        if (
                            msg.type === 'STUDENT_SESSION_CLAIM' &&
                            appData.currentUser &&
                            appData.currentUser.role === 'student' &&
                            msg.studentId === appData.currentUser.studentId &&
                            msg.sessionId !== currentDeviceSessionId
                        ) {
                            handleForcedStudentLogout('Akun Anda terdeteksi dibuka pada tab browser lain. Sesi pada tab ini dihentikan secara otomatis.');
                        }
                    };
                }
            } catch (e) {}

            studentHeartbeatInterval = setInterval(async () => {
                if (!appData.currentUser || appData.currentUser.role !== 'student') {
                    stopStudentHeartbeat();
                    return;
                }
                const studentId = appData.currentUser.studentId;
                const stdObj = appData.students.find(s => s.id === studentId);
                if (stdObj) {
                    if (
                        (stdObj.activeSessionId && stdObj.activeSessionId !== currentDeviceSessionId) ||
                        stdObj.isLoggedIn === false
                    ) {
                        handleForcedStudentLogout('Sesi login Anda telah direset oleh Pengawas/Administrator atau diakhiri dari perangkat lain.');
                        return;
                    }
                    stdObj.isLoggedIn = true;
                    stdObj.activeSessionId = currentDeviceSessionId;
                    stdObj.lastHeartbeatAt = Date.now();
                    stdObj.deviceInfo = (navigator.userAgent || getDeviceLabel()).slice(0, 120);
                    await syncCollectionRecord('students', stdObj.id, {
                        isLoggedIn: true,
                        activeSessionId: currentDeviceSessionId,
                        lastHeartbeatAt: stdObj.lastHeartbeatAt,
                        deviceInfo: stdObj.deviceInfo
                    });
                }
            }, 25000);
        }

        function stopStudentHeartbeat() {
            if (studentHeartbeatInterval) {
                clearInterval(studentHeartbeatInterval);
                studentHeartbeatInterval = null;
            }
            if (studentBroadcastChannel) {
                try { studentBroadcastChannel.close(); } catch (e) {}
                studentBroadcastChannel = null;
            }
        }

        async function handleForcedStudentLogout(reasonMsg) {
            if (!appData.currentUser || appData.currentUser.role !== 'student') return;
            if (isExamWorkspaceActive && currentActiveExam && !isSubmittingFinalExam) {
                await window.persistExamSessionToCloud(true);
            }
            stopStudentHeartbeat();
            window.stopAllExamTimersAndWatchers();
            isViewingResultReview = false;
            appData.currentUser = null;
            window.renderLoginView();
            window.switchLoginTab('student');
            window.showModal(
                'Sesi Login Berakhir',
                reasonMsg || 'Sesi login Anda telah direset oleh Administrator atau dihentikan karena konflik perangkat.',
                'error'
            );
        }

        function isResultValidAndActive(r) {
            if (!r) return false;
            // Pastikan paket ujian masih terdaftar di Manajemen Ujian
            const examExists = appData.exams.some(e => e.id === r.examId);
            if (!examExists) return false;

            // Abaikan hasil kosong (0 jawaban) yang sebelumnya terbuat otomatis dari sesi tanpa pengerjaan
            const isAutoEmpty = String(r.submittedAt || '').includes('Auto-Submit') &&
                Number(r.finalScore || 0) === 0 &&
                Number(r.correctCount || 0) === 0 &&
                Number(r.wrongCount || 0) === 0 &&
                (!r.answersSnapshot || Object.keys(r.answersSnapshot).length === 0);
            if (isAutoEmpty) return false;

            return true;
        }

        function getValidExamResults(examId = 'ALL') {
            return (appData.examResults || []).filter(r => {
                if (!isResultValidAndActive(r)) return false;
                if (examId && examId !== 'ALL' && r.examId !== examId) return false;
                return true;
            });
        }

        async function cleanupOrphanedResultsAndSessionsInCloud() {
            const validExamIds = new Set((appData.exams || []).map(e => e.id));
            const orphanedResults = (appData.examResults || []).filter(r => !isResultValidAndActive(r));
            const orphanedSessions = (appData.examSessions || []).filter(s => !validExamIds.has(s.examId));

            if (orphanedResults.length === 0 && orphanedSessions.length === 0) return 0;

            let removedCount = 0;
            for (const r of orphanedResults) {
                const docId = r.id || r.resultId;
                if (docId) {
                    await syncCollectionRecord('examResults', docId, null, true);
                    removedCount++;
                }
            }
            appData.examResults = (appData.examResults || []).filter(r => isResultValidAndActive(r));

            for (const s of orphanedSessions) {
                if (s.id) {
                    await syncCollectionRecord('examSessions', s.id, null, true);
                }
            }
            appData.examSessions = (appData.examSessions || []).filter(s => validExamIds.has(s.examId));

            return removedCount;
        }

        function getDeviceLabel() {
            const ua = navigator.userAgent || '';
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
            const platform = navigator.platform || (isMobile ? 'Perangkat Mobile/HP' : 'Laptop/PC');

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                updateLiveSyncIndicator('syncing', 'Menyinkronkan...');
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                    if (Array.isArray(appData[collectionName])) {
                        appData[collectionName] = appData[collectionName].filter(item => (item.id || item.resultId) !== docId);
                    }
                } else {
                    const cleanPayload = sanitizeFirestoreData(dataObj);
                    await setDoc(ref, cleanPayload, { merge: true });
                    if (Array.isArray(appData[collectionName])) {
                        const keyField = collectionName === 'examResults' ? 'resultId' : 'id';
                        const idx = appData[collectionName].findIndex(item => (item[keyField] || item.id) === docId);
                        const mergedObj = { id: docId, ...cleanPayload };
                        if (idx !== -1) {
                            appData[collectionName][idx] = { ...appData[collectionName][idx], ...mergedObj };
                        } else {
                            appData[collectionName].push(mergedObj);
                        }
                    }
                }
                updateLiveSyncIndicator('updated', 'Data Diperbarui');
                return true;
            } catch (err) {
                console.error(`Firestore Sync Error [${collectionName}/${docId}]:`, err);
                updateLiveSyncIndicator('error');
                return false;
            }
        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;

            // Bersihkan subscription lama bila ada
            globalRealtimeUnsubscribes.forEach(unsub => {
                try { unsub(); } catch (e) {}
            });
            globalRealtimeUnsubscribes = [];

            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examSessions', 'examResults'
            ];

            collectionsToWatch.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, (snapshot) => {
                    const docsList = snapshot.docs.map(d => {
                        const raw = d.data();
                        if (colName === 'examResults') {
                            return { id: d.id, resultId: raw.resultId || d.id, ...raw };
                        }
                        return { id: d.id, ...raw };
                    });

                    // Urutkan soal berdasarkan nomor urut agar konsisten
                    if (colName === 'questions') {
                        docsList.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));
                    }

                    appData[colName] = docsList;

                    // Proteksi Real-Time: Jika akun siswa yang sedang login direset oleh Admin atau diambil alih, langsung keluarkan
                    if (colName === 'students' && appData.currentUser && appData.currentUser.role === 'student') {
                        const myLatestDoc = docsList.find(s => s.id === appData.currentUser.studentId);
                        if (!myLatestDoc || myLatestDoc.status !== 'Aktif') {
                            handleForcedStudentLogout('Akun siswa Anda telah dinonaktifkan atau dihapus oleh Administrator.');
                            return;
                        }
                        if (
                            myLatestDoc.isLoggedIn === false ||
                            (myLatestDoc.activeSessionId && myLatestDoc.activeSessionId !== currentDeviceSessionId)
                        ) {
                            handleForcedStudentLogout('Sesi login akun Anda telah direset oleh Pengawas / Administrator atau dihentikan oleh sistem.');
                            return;
                        }
                    }

                    // Jika Admin menutup ujian saat siswa sedang mengerjakan soal, langsung hentikan ruang ujian siswa dan simpan progresnya
                    if (colName === 'exams' && appData.currentUser && appData.currentUser.role === 'student' && isExamWorkspaceActive && currentActiveExam) {
                        const updatedExam = docsList.find(x => x.id === currentActiveExam.id);
                        if (!updatedExam || !isExamStrictlyActive(updatedExam) || !checkExamScheduleAccess(updatedExam).allowed) {
                            window.forceCloseStudentExamByAdmin('Ujian ini baru saja ditutup atau dinonaktifkan oleh Administrator. Seluruh jawaban yang sudah Anda isi tetap tersimpan dengan aman.');
                            return;
                        }
                    }

                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh(colName);
                    }
                }, (err) => {
                    console.warn(`Realtime listener warning [${colName}]:`, err);
                    updateLiveSyncIndicator('error');
                });
                globalRealtimeUnsubscribes.push(unsub);
            });

            // Real-time listener untuk dokumen pengaturan global
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global');
            const unsubSettings = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    appData.settings = { ...appData.settings, ...snap.data() };
                    updateBrowserFaviconAndTitle();
                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh('appSettings');
                    }
                }
            }, (err) => {
                console.warn('Realtime settings listener warning:', err);
            });
            globalRealtimeUnsubscribes.push(unsubSettings);

            setTimeout(() => {
                isInitialRealtimeLoad = false;
            }, 800);

            // Pemantau transisi jadwal ujian berbasis waktu setiap 2 detik
            // Memastikan saat jam mulai tiba (misal 22:49 WIB) atau jam selesai lewat,
            // ujian langsung muncul/hilang otomatis di Portal Siswa & Admin tanpa perlu Edit/Simpan atau Login ulang
            startScheduleTransitionWatcher();

            // Fallback polling ringan setiap 15 detik untuk menjaga konsistensi jika koneksi sempat idle
            if (fallbackPollingInterval) clearInterval(fallbackPollingInterval);
            fallbackPollingInterval = setInterval(async () => {
                if (!db || document.hidden) return;
                try {
                    const dynamicCols = ['exams', 'examParticipants', 'examSessions', 'examResults'];
                    for (const cName of dynamicCols) {
                        const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', cName));
                        appData[cName] = snap.docs.map(d => {
                            const raw = d.data();
                            return cName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                        });
                    }
                } catch (pollErr) {
                    // Abaikan jika offline sementara
                }
            }, 15000);
        }

        function computeCurrentScheduleSignature() {
            return (appData.exams || []).map(ex => {
                const active = isExamStrictlyActive(ex) ? '1' : '0';

                return `${ex.id}:${active}:${schedState}`;
            }).join('|');
        }

        function startScheduleTransitionWatcher() {
            if (scheduleTransitionInterval) clearInterval(scheduleTransitionInterval);
            lastScheduleStateSignature = computeCurrentScheduleSignature();

            scheduleTransitionInterval = setInterval(() => {
                const currentSig = computeCurrentScheduleSignature();
                if (currentSig !== lastScheduleStateSignature) {
                    lastScheduleStateSignature = currentSig;

                    // Jika siswa sedang mengerjakan ujian dan jadwal baru saja berakhir (EXPIRED), hentikan otomatis
                    if (appData.currentUser && appData.currentUser.role === 'student' && isExamWorkspaceActive && currentActiveExam) {

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
                return;
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            // Aktifkan mode layar penuh (Fullscreen) segera saat tombol login siswa ditekan
            window.enterStudentFullscreen();

            // Cek status login real-time langsung dari Firestore untuk mencegah login ganda di perangkat/tab lain
            let latestStudentDoc = student;
            if (!IS_PREVIEW && db) {
                try {
                    const cloudStudent = await fetchSingleFirestoreDoc('students', student.id);
                    if (cloudStudent) {
                        latestStudentDoc = cloudStudent;
                        const sIdx = appData.students.findIndex(s => s.id === student.id);
                        if (sIdx !== -1) appData.students[sIdx] = { ...appData.students[sIdx], ...cloudStudent };
                    }
                    const sessSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examSessions'));
                    appData.examSessions = sessSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (err) {
                    console.warn('Gagal memeriksa kunci sesi siswa:', err);
                }
            }

            // Cek apakah ada sesi ujian IN_PROGRESS yang sedang dikunci oleh perangkat lain dalam 90 detik terakhir
            const activeOtherExamSess = (appData.examSessions || []).find(ss =>
                ss.studentId === student.id &&
                ss.status === 'IN_PROGRESS' &&
                ss.deviceSessionId &&
                ss.deviceSessionId !== currentDeviceSessionId &&
                ss.updatedAtMs &&
                (Date.now() - Number(ss.updatedAtMs)) < STUDENT_LOCK_TIMEOUT_MS
            );

            if (isStudentRecordLockedByOther(latestStudentDoc, currentDeviceSessionId) || activeOtherExamSess) {
                const lockedDevInfo = latestStudentDoc.deviceInfo || (activeOtherExamSess ? activeOtherExamSess.deviceInfo : 'Perangkat / Tab Lain');
                showLoginError('Akun ini sedang aktif digunakan di perangkat atau tab browser lain!');
                window.showModal(
                    'Akun Sedang Aktif di Perangkat Lain!',
                    `Akun siswa atas nama ${student.fullName} (NISN: ${student.nisn}) saat ini sedang login di perangkat atau tab browser lain (${lockedDevInfo}). Silakan keluar (Logout) terlebih dahulu dari perangkat sebelumnya, atau hubungi Pengawas / Administrator untuk melakukan Reset Login.`,
                    'error'
                );
                return;
            }

            const nowMs = Date.now();
            const devInfoStr = (navigator.userAgent || getDeviceLabel()).slice(0, 120);
            student.isLoggedIn = true;
            student.activeSessionId = currentDeviceSessionId;
            student.loginAt = new Date(nowMs).toISOString();
            student.lastHeartbeatAt = nowMs;
            student.deviceInfo = devInfoStr;

            await syncCollectionRecord('students', student.id, {
                isLoggedIn: true,
                activeSessionId: currentDeviceSessionId,
                loginAt: student.loginAt,
                lastHeartbeatAt: nowMs,
                deviceInfo: devInfoStr
            });

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token,
                sessionId: currentDeviceSessionId
            };

            startStudentHeartbeat();

            // Muat ulang exams, examSessions & examResults terbaru dari Firestore saat login agar status aktif ujian & progres lintas perangkat 100% akurat
            if (!IS_PREVIEW && db) {
                try {
                    const [examsSnap, sessSnap, resSnap, partSnap] = await Promise.all([
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'exams')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examSessions')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examResults')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'examParticipants'))
                    ]);
                    appData.exams = examsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appData.examSessions = sessSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                    appData.examResults = resSnap.docs.map(d => ({ id: d.id, resultId: d.data().resultId || d.id, ...d.data() }));
                    appData.examParticipants = partSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (err) {
                    console.warn('Gagal menyegarkan sesi terbaru:', err);
                }
            }

            window.renderStudentPortal(true);
        };

            const filteredStudents = appData.students.filter(s => {
                const schoolStr = s.asalSekolah !== undefined ? s.asalSekolah : (appData.settings.schoolName || '');

                if (isChecked) selectedStudentIds.add(s.id);
                else selectedStudentIds.delete(s.id);
            });
            renderStudentsContent(document.getElementById('adminMainContent'));

        window.deleteSelectedStudents = function() {
            const idsToDelete = Array.from(selectedStudentIds);
            if (idsToDelete.length === 0) {
                window.showModal('Pilih Siswa Terlebih Dahulu', 'Silakan centang minimal satu siswa pada tabel untuk dihapus secara bersamaan.', 'info');
                return;
            }

            window.showModal(
                'Hapus Data Siswa Terpilih',
                `Apakah Anda yakin ingin menghapus ${idsToDelete.length} data siswa yang dicentang secara bersamaan? Tindakan ini tidak dapat dibatalkan.`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    updateLiveSyncIndicator('syncing', `Menghapus ${idsToDelete.length} Siswa...`);
                    const idSet = new Set(idsToDelete);
                    appData.students = appData.students.filter(s => !idSet.has(s.id));
                    selectedStudentIds.clear();

                    for (const sid of idsToDelete) {
                        await syncCollectionRecord('students', sid, null, true);
                    }

                    logActivity(`Administrator menghapus ${idsToDelete.length} data siswa secara bersamaan.`);
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Berhasil Dihapus', `${idsToDelete.length} data siswa berhasil dihapus secara bersamaan.`, 'success');
                    return true;

                { showCancel: true, okText: `Ya, Hapus ${idsToDelete.length} Siswa` }

        window.deleteAllFilteredStudents = function() {

            const filterCls = appData.filters.studentClass || 'ALL';
            const filteredStudents = appData.students.filter(s => {
                const schoolStr = s.asalSekolah !== undefined ? s.asalSekolah : (appData.settings.schoolName || '');
                const matchSearch = !search || s.fullName.toLowerCase().includes(search) || s.nisn.toLowerCase().includes(search) || (s.nis || '').toLowerCase().includes(search) || schoolStr.toLowerCase().includes(search);

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Tahun Pelajaran', 'Status'];
            const rows = appData.students.map((s, idx) => {
                const schoolVal = s.asalSekolah !== undefined ? (s.asalSekolah || '-') : (appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG');
                return [idx + 1, s.nisn, s.nis || '-', s.fullName, schoolVal, s.gender || 'L', s.className, s.academicYear, s.status];
            });
            window.downloadExcelFile('Data_Siswa_CBT_Sekolah.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa di bawah baris judul (header).', 'error');
                        return;
                    }

                    const headerRow = (rows[0] || []).map(h => String(h ?? '').trim().toLowerCase());
                    const hasAsalSekolahHeader = headerRow.some(h => h.includes('asal sekolah') || h.includes('asalsekolah') || h.includes('sekolah'));

                    const parsedStudents = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;
                        const nisn = String(cols[0] ?? '').trim();
                        const nis = String(cols[1] ?? '').trim();
                        const fullName = String(cols[2] ?? '').trim();

                        let asalSekolah = '';
                        let gender = 'L';
                        let className = '4';
                        let pin = '123456';

                        if (hasAsalSekolahHeader || cols.length >= 7) {
                            asalSekolah = String(cols[3] ?? '').trim();
                            gender = String(cols[4] ?? 'L').trim().toUpperCase();
                            className = String(cols[5] ?? '4').trim();
                            pin = String(cols[6] ?? '123456').trim() || '123456';
                        } else {
                            asalSekolah = '';
                            gender = String(cols[3] ?? 'L').trim().toUpperCase();
                            className = String(cols[4] ?? '4').trim();
                            pin = String(cols[5] ?? '123456').trim() || '123456';
                        }

                        if (!nisn || !fullName) continue;

                        const isDuplicate = appData.students.some(s => s.nisn === nisn) || parsedStudents.some(s => s.nisn === nisn);
                        parsedStudents.push({
                            nisn,
                            nis: nis || '-',
                            fullName,
                            asalSekolah,
                            gender: gender === 'P' ? 'P' : 'L',
                            className: className || '4',
                            pin,
                            isDuplicate
                        });
                    }

                    if (parsedStudents.length === 0) {
                        window.showModal('Tidak Ada Data Valid', 'Pastikan kolom NISN dan Nama Lengkap terisi sesuai Template_Impor_Siswa.xlsx.', 'error');
                        return;
                    }

                    const validList = parsedStudents.filter(s => !s.isDuplicate);
                    const previewRowsHtml = parsedStudents.map((s, idx) => `
                        <tr class="border-b border-slate-100 ${s.isDuplicate ? 'bg-amber-50/70 text-slate-400' : 'hover:bg-slate-50'}">
                            <td class="px-3 py-2 text-xs">${idx + 1}</td>
                            <td class="px-3 py-2 text-xs font-mono font-bold">${escapeHtml(s.nisn)}</td>
                            <td class="px-3 py-2 text-xs">${escapeHtml(s.nis)}</td>

        function getQuestionTypeBadgeLabel(type) {
            if (type === 'pg') return 'Pilihan Ganda';
            if (type === 'pg_complex') return 'Pilihan Ganda Kompleks';
            if (type === 'true_false') return 'Benar / Salah';
            if (type === 'matching') return 'Menjodohkan';
            if (type === 'short_answer') return 'Isian Singkat';
            if (type === 'essay') return 'Uraian / Esai';
            return type || 'Pilihan Ganda';
        }

        function normalizeImportedQuestionType(rawVal) {
            const raw = String(rawVal ?? '').trim();
            if (!raw) return { valid: false, code: '', rawLabel: '(Kosong)' };
            const clean = raw.toLowerCase().replace(/\s+/g, ' ').trim();
            const compact = clean.replace(/[^a-z0-9]/g, '');

            if (
                clean === 'pg_complex' ||
                clean.includes('kompleks') ||
                clean.includes('complex') ||
                clean.includes('multi') ||
                compact === 'pgk' ||
                compact === 'pilganmultijawaban' ||
                compact === 'pilihangandakompleks'
            ) {
                return { valid: true, code: 'pg_complex', rawLabel: raw };
            }
            if (
                clean === 'pg' ||
                clean === 'pilihan ganda' ||
                clean === 'pg (pilihan ganda)' ||
                clean === 'pilihan ganda (pg)' ||
                compact === 'pgpilihanganda' ||
                compact === 'pilihanganda' ||
                compact === 'pilgan' ||
                compact === 'multiplechoice'
            ) {
                return { valid: true, code: 'pg', rawLabel: raw };
            }
            if (
                clean === 'true_false' ||
                clean === 'true/false' ||
                clean === 'true false' ||
                clean === 'b/s' ||
                clean === 'bs' ||
                clean === 't/f' ||
                clean === 'tf' ||
                clean.includes('benar') ||
                clean.includes('salah') ||
                compact === 'benarsalah' ||
                compact === 'truefalse'
            ) {
                return { valid: true, code: 'true_false', rawLabel: raw };
            }
            if (
                clean === 'matching' ||
                clean.includes('jodoh') ||
                clean.includes('pasangan') ||
                clean.includes('match')
            ) {
                return { valid: true, code: 'matching', rawLabel: raw };
            }
            if (
                clean === 'short_answer' ||
                clean === 'short answer' ||
                clean.includes('isian') ||
                clean.includes('singkat')
            ) {
                return { valid: true, code: 'short_answer', rawLabel: raw };
            }
            if (
                clean === 'essay' ||
                clean.includes('uraian') ||
                clean.includes('esai') ||
                clean.includes('essay')
            ) {
                return { valid: true, code: 'essay', rawLabel: raw };
            }
            return { valid: false, code: '', rawLabel: raw };
        }

        function parseTrueFalseStatementsAndKey(optList, keyRaw) {
            const statements = (optList || []).map(s => String(s ?? '').trim()).filter(s => s !== '');
            const isDefaultBS = statements.length === 2 && statements[0].toLowerCase() === 'benar' && statements[1].toLowerCase() === 'salah';
            const rawKeyStr = String(keyRaw ?? '').trim();
            const keyTokens = rawKeyStr
                .split(/[,;|/\s\-]+/)
                .map(t => t.trim())
                .filter(Boolean)
                .map(t => {
                    const low = t.toLowerCase();
                    if (low === 'b' || low === 'benar' || low === 'true' || low === 't' || low === '1') return 'Benar';
                    if (low === 's' || low === 'salah' || low === 'false' || low === 'f' || low === '0') return 'Salah';
                    return t;
                });

            if (!isDefaultBS && (statements.length >= 1 && (statements.length > 2 || keyTokens.length > 1 || !['benar', 'salah'].includes(statements[0].toLowerCase())))) {
                const normalizedKeys = statements.map((_, idx) => keyTokens[idx] || keyTokens[0] || 'Benar');
                return {
                    isMultiStatement: true,
                    options: statements,
                    correctAnswer: normalizedKeys
                };
            }

            const singleAns = keyTokens[0] || (rawKeyStr.toLowerCase().startsWith('s') ? 'Salah' : 'Benar');
            return {
                isMultiStatement: false,
                options: ['Benar', 'Salah'],
                correctAnswer: singleAns
            };
        }

        function isChoiceOptionEmpty(optVal, idx = -1) {
            if (optVal === null || optVal === undefined) return true;
            const s = String(optVal).trim();
            if (!s || s === '-' || s === '—' || s === '--') return true;
            if (idx >= 0 && s.toLowerCase() === `opsi ${String.fromCharCode(65 + idx).toLowerCase()}`) return true;
            return false;
        }

        function formatMatchingKeyReadable(matchingPairs, correctAnswerObj = null) {
            if (Array.isArray(matchingPairs) && matchingPairs.length > 0) {
                return matchingPairs
                    .map((p, idx) => {
                        const letter = String.fromCharCode(65 + idx);
                        return `${letter}. ${p.left} = ${p.right}`;
                    })
                    .join('; ');
            }
            if (correctAnswerObj && typeof correctAnswerObj === 'object' && !Array.isArray(correctAnswerObj)) {
                return Object.entries(correctAnswerObj)
                    .map(([k, v], idx) => {
                        const letter = String.fromCharCode(65 + (isNaN(Number(k)) ? idx : Number(k)));
                        return `${letter}. ${v}`;
                    })
                    .join('; ');
            }
            return String(correctAnswerObj || '');
        }

        function parseMatchingOptionsAndKey(rawOptsList, rawKeyStr = '') {
            const opts = [0, 1, 2, 3].map(i => String((rawOptsList && rawOptsList[i]) ?? '').trim());
            const keyStr = String(rawKeyStr ?? '').trim();

            let parsedJsonKey = null;
            if (keyStr.startsWith('{') && keyStr.endsWith('}')) {
                try {
                    parsedJsonKey = JSON.parse(keyStr);
                } catch (e) {
                    parsedJsonKey = null;
                }
            }

            const keySegments = keyStr
                ? keyStr.split(/\s*[;|]\s*/).map(s => s.trim()).filter(Boolean)
                : [];
            const commaSegments = (keyStr && keySegments.length <= 1 && !keyStr.includes('='))
                ? keyStr.split(/\s*,\s*/).map(s => s.trim()).filter(Boolean)
                : [];

            const splitPairText = (txt) => {
                const s = String(txt || '').trim();
                if (!s) return null;
                const cleaned = s.replace(/^[A-Da-d1-4][\.\)]\s*/, '').trim();
                const eqIdx = cleaned.indexOf('=');
                if (eqIdx !== -1) {
                    return {
                        left: cleaned.slice(0, eqIdx).trim(),
                        right: cleaned.slice(eqIdx + 1).trim()
                    };
                }
                const colonIdx = cleaned.indexOf(':');
                if (colonIdx !== -1 && !cleaned.slice(0, colonIdx).toLowerCase().startsWith('http')) {
                    return {
                        left: cleaned.slice(0, colonIdx).trim(),
                        right: cleaned.slice(colonIdx + 1).trim()
                    };
                }
                const dashMatch = cleaned.match(/^(.+?)\s+-\s+(.+)$/);
                if (dashMatch) {
                    return {
                        left: dashMatch[1].trim(),
                        right: dashMatch[2].trim()
                    };
                }
                return null;
            };

            const matchingPairs = [];
            const formattedOptions = ['', '', '', ''];
            const answerMap = {};

            for (let i = 0; i < 4; i++) {
                const cellVal = opts[i];
                const keySeg = keySegments[i] || '';
                const commaSeg = commaSegments[i] || '';
                const jsonVal = parsedJsonKey && parsedJsonKey[String(i)] !== undefined ? String(parsedJsonKey[String(i)]).trim() : '';

                let left = '';
                let right = '';

                const fromCell = splitPairText(cellVal);
                const fromKeySeg = splitPairText(keySeg);

                if (fromCell) {
                    left = fromCell.left;
                    right = fromCell.right;
                } else if (cellVal) {
                    left = cellVal.replace(/^[A-Da-d1-4][\.\)]\s*/, '').trim();
                    if (jsonVal) {
                        right = jsonVal;
                    } else if (fromKeySeg) {
                        right = fromKeySeg.right || fromKeySeg.left;
                    } else if (keySeg) {
                        right = keySeg.replace(/^[A-Da-d1-4][\.\)]\s*/, '').trim();
                    } else if (commaSeg) {
                        right = commaSeg.replace(/^[A-Da-d1-4][\.\)]\s*/, '').trim();
                    } else if (keySegments.length === 1 && i === 0) {
                        right = keySegments[0].replace(/^[A-Da-d1-4][\.\)]\s*/, '').trim();
                    }
                } else if (fromKeySeg) {
                    left = fromKeySeg.left;
                    right = fromKeySeg.right;
                }

                if (!left && !right) continue;
                if (!left) left = `Pernyataan ${String.fromCharCode(65 + i)}`;
                if (!right) right = `Pasangan ${String.fromCharCode(65 + i)}`;

                const pairIndex = matchingPairs.length;
                matchingPairs.push({ left, right });
                formattedOptions[i] = `${left} = ${right}`;
                answerMap[String(pairIndex)] = right;
            }

            return {
                matchingPairs,
                options: formattedOptions,
                correctAnswer: answerMap,
                readableKey: formatMatchingKeyReadable(matchingPairs, answerMap)
            };
        }

        function extractFourMatchingOptionStrings(q) {
            const result = ['', '', '', ''];
            if (!q) return result;
            if (Array.isArray(q.matchingPairs) && q.matchingPairs.length > 0) {
                for (let i = 0; i < 4; i++) {
                    if (q.matchingPairs[i]) {
                        result[i] = `${q.matchingPairs[i].left} = ${q.matchingPairs[i].right}`;
                    } else if (Array.isArray(q.options) && q.options[i]) {
                        result[i] = String(q.options[i]);
                    }
                }
                return result;
            }
            if (Array.isArray(q.options) && q.options.length > 0) {
                for (let i = 0; i < 4; i++) {
                    const rawOpt = String(q.options[i] ?? '').trim();
                    if (!rawOpt) continue;
                    if (rawOpt.includes('=')) {
                        result[i] = rawOpt;
                    } else if (q.correctAnswer && typeof q.correctAnswer === 'object' && q.correctAnswer[String(i)]) {
                        result[i] = `${rawOpt} = ${q.correctAnswer[String(i)]}`;
                    } else {
                        result[i] = rawOpt;
                    }
                }
            }
            return result;
        }

        window.confirmDeleteQuestionBank = function() {
            if (isDeletingQuestionBank) return;
            const selectedBankId = appData.filters.questionBankId || 'ALL';
            if (selectedBankId === 'ALL') {
                window.showModal('Pilih Paket Terlebih Dahulu', 'Silakan pilih salah satu paket bank soal pada dropdown untuk dihapus.', 'error');
                return;
            }
            const bankObj = appData.questionBanks.find(b => b.id === selectedBankId);
            if (!bankObj) return;

            const relatedQuestions = appData.questions.filter(q => q.bankId === selectedBankId);
            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-3.5 bg-red-50 border border-red-200 rounded-2xl text-red-900 space-y-1">
                        <p class="font-extrabold text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-red-600"></i> Konfirmasi Hapus Paket Bank Soal</p>
                        <p class="text-[11px] text-red-700">Tindakan ini akan menghapus paket beserta seluruh soal di dalamnya secara permanen dari Firebase Firestore.</p>
                    </div>
                    <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
                        <div class="flex justify-between"><span>Nama Paket:</span> <strong class="text-slate-900">${escapeHtml(bankObj.title)}</strong></div>
                        <div class="flex justify-between"><span>Jumlah Soal Terhubung:</span> <strong class="text-red-600">${relatedQuestions.length} Butir Soal</strong></div>
                    </div>
                </div>
            `;

            window.showModal('Hapus Paket Bank Soal', '', 'error', async (confirmed) => {
                if (!confirmed) return true;
                return await window.executeDeleteQuestionBank(selectedBankId);
            }, { html, showCancel: true, okText: 'Ya, Hapus Paket & Soal' });
        };

        window.executeDeleteQuestionBank = async function(bankId) {
            if (isDeletingQuestionBank) return false;
            isDeletingQuestionBank = true;
            try {
                const questionsInBank = appData.questions.filter(q => q.bankId === bankId);
                const qIdsToRemove = new Set(questionsInBank.map(q => q.id));

                for (const q of questionsInBank) {
                    await syncCollectionRecord('questions', q.id, null, true);
                }

                appData.questions = appData.questions.filter(q => !qIdsToRemove.has(q.id));
                appData.questionBanks = appData.questionBanks.filter(b => b.id !== bankId);

                await syncCollectionRecord('questionBanks', bankId, null, true);

                for (const ex of appData.exams) {
                    if (Array.isArray(ex.questionIds)) {
                        ex.questionIds = ex.questionIds.filter(qid => !qIdsToRemove.has(qid));
                        await syncCollectionRecord('exams', ex.id, ex);
                    }
                }

                appData.filters.questionBankId = 'ALL';
                logActivity(`Paket bank soal (ID: ${bankId}) beserta ${questionsInBank.length} soal berhasil dihapus permanen.`);
                window.showModal('Berhasil Dihapus', `Paket bank soal dan ${questionsInBank.length} soal terkait berhasil dihapus dari database.`, 'success');
                renderQuestionBanksContent(document.getElementById('adminMainContent'));
                isDeletingQuestionBank = false;
                return true;
            } catch (err) {
                console.error('Delete Bank Error:', err);
                window.showModal('Gagal Menghapus', 'Terjadi kesalahan saat menghapus paket soal dari server.', 'error');
                isDeletingQuestionBank = false;
                return false;
            }
        };

        window.updateQuestionLivePreview = function() {
            const num = document.getElementById('qFormNum')?.value || '1';
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = document.getElementById('qFormWeight')?.value || '10';
            const stimulus = document.getElementById('qFormStimulus')?.value || '';
            const stimImgUrl = document.getElementById('qFormStimulusImg')?.value || '';
            const text = document.getElementById('qFormText')?.value || '';
            const qImgUrl = document.getElementById('qFormQuestionImg')?.value || '';
            const key = document.getElementById('qFormKey')?.value || '-';
            const expl = document.getElementById('qFormExplanation')?.value || '-';

            const optA = document.getElementById('qOptA')?.value || '';
            const optB = document.getElementById('qOptB')?.value || '';
            const optC = document.getElementById('qOptC')?.value || '';
            const optD = document.getElementById('qOptD')?.value || '';

            const numLabel = document.getElementById('previewNumLabel');
            const weightLabel = document.getElementById('previewWeightLabel');
            const typeBadge = document.getElementById('previewTypeBadge');
            const stimBox = document.getElementById('previewStimulusBox');
            const stimText = document.getElementById('previewStimulusText');
            const stimImg = document.getElementById('previewStimulusImg');
            const qText = document.getElementById('previewQuestionText');
            const qImg = document.getElementById('previewQuestionImg');
            const optList = document.getElementById('previewOptionsList');
            const keyText = document.getElementById('previewKeyText');
            const explText = document.getElementById('previewExplText');

            if (!numLabel) return;
            numLabel.innerText = `Soal Nomor ${num}`;
            weightLabel.innerText = `Bobot: ${weight} Poin`;
            if (typeBadge) typeBadge.innerText = getQuestionTypeBadgeLabel(type);

            if (stimulus.trim() || stimImgUrl.trim()) {
                stimText.innerText = stimulus;
                if (stimImg) {
                    if (stimImgUrl.trim()) {
                        stimImg.src = stimImgUrl.trim();
                        stimImg.classList.remove('hidden');
                    } else {
                        stimImg.classList.add('hidden');
                    }
                }
                stimBox.classList.remove('hidden');
            } else {
                stimBox.classList.add('hidden');
            }

            qText.innerText = text.trim() ? text : '(Teks pertanyaan akan tampil di sini)';
            if (qImg) {
                if (qImgUrl.trim()) {
                    qImg.src = qImgUrl.trim();
                    qImg.classList.remove('hidden');
                } else {
                    qImg.classList.add('hidden');
                }
            }

            if (type === 'matching') {
                const parsedMatch = parseMatchingOptionsAndKey([optA, optB, optC, optD], key);
                keyText.innerText = parsedMatch.readableKey || (key.trim() ? key : '-');
            } else {
                keyText.innerText = key.trim() ? key : '-';
            }
            explText.innerText = expl.trim() ? expl : '-';

            if (type === 'pg' || type === 'pg_complex') {
                const badgeType = type === 'pg_complex' ? 'checkbox' : 'radio';
                const rawInputs = [optA, optB, optC, optD];
                const hasAnyFilled = rawInputs.some((val, i) => !isChoiceOptionEmpty(val, i));
                const renderedOptions = rawInputs.map((o, idx) => {
                    if (hasAnyFilled && isChoiceOptionEmpty(o, idx)) return '';
                    const dispText = !isChoiceOptionEmpty(o, idx) ? o.trim() : `Opsi ${String.fromCharCode(65 + idx)}`;
                    return `
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200 text-xs flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2"><span class="font-bold w-5">${String.fromCharCode(65 + idx)}.</span> <span>${escapeHtml(dispText)}</span></div>
                            <span class="text-[10px] text-slate-400 uppercase font-mono">${badgeType}</span>
                        </div>
                    `;
                }).filter(Boolean).join('');
                optList.innerHTML = renderedOptions;
            } else if (type === 'matching') {
                const parsedMatch = parseMatchingOptionsAndKey([optA, optB, optC, optD], key);

        window.loadQuestionIntoForm = function(qId) {
            const delBtn = document.getElementById('btnDeleteCurrentQuestion');
            if (!qId) {
                if (delBtn) delBtn.classList.add('hidden');
                return;
            }
            const q = appData.questions.find(x => x.id === qId);
            if (!q) return;

            if (delBtn) delBtn.classList.remove('hidden');
            const editEl = document.getElementById('editQuestionId');
            if (editEl) editEl.value = q.id;
            const numEl = document.getElementById('qFormNum');
            if (numEl) numEl.value = q.orderNum || 1;
            const typeEl = document.getElementById('qFormType');
            if (typeEl) typeEl.value = q.type || 'pg';
            const weightEl = document.getElementById('qFormWeight');
            if (weightEl) weightEl.value = q.weight || 10;
            const stimEl = document.getElementById('qFormStimulus');
            if (stimEl) stimEl.value = q.stimulusText || '';
            const stimImgEl = document.getElementById('qFormStimulusImg');
            if (stimImgEl) stimImgEl.value = q.stimulusImage || '';
            const txtEl = document.getElementById('qFormText');
            if (txtEl) txtEl.value = q.questionText || '';
            const qImgEl = document.getElementById('qFormQuestionImg');
            if (qImgEl) qImgEl.value = q.questionImage || '';

            window.handleQuestionTypeChange();
            if (q.type === 'matching') {
                const fourOpts = extractFourMatchingOptionStrings(q);
                const ids = ['qOptA', 'qOptB', 'qOptC', 'qOptD'];
                ids.forEach((id, idx) => {
                    const el = document.getElementById(id);
                    if (el) el.value = fourOpts[idx] || '';
                });
                const parsedMatch = parseMatchingOptionsAndKey(fourOpts, '');
                const keyEl = document.getElementById('qFormKey');
                if (keyEl) {
                    keyEl.value = parsedMatch.readableKey || formatMatchingKeyReadable(q.matchingPairs, q.correctAnswer);
                }
            } else {
                if (q.options && q.options.length >= 1) {
                    const cleanOpt = (val, i) => isChoiceOptionEmpty(val, i) ? '' : String(val).trim();
                    if (document.getElementById('qOptA')) document.getElementById('qOptA').value = cleanOpt(q.options[0], 0);
                    if (document.getElementById('qOptB')) document.getElementById('qOptB').value = cleanOpt(q.options[1], 1);
                    if (document.getElementById('qOptC')) document.getElementById('qOptC').value = cleanOpt(q.options[2], 2);
                    if (document.getElementById('qOptD')) document.getElementById('qOptD').value = cleanOpt(q.options[3], 3);
                }
                const keyEl = document.getElementById('qFormKey');
                if (keyEl) {
                    keyEl.value = Array.isArray(q.correctAnswer)
                        ? q.correctAnswer.join(', ')
                        : (typeof q.correctAnswer === 'object' && q.correctAnswer !== null ? JSON.stringify(q.correctAnswer) : (q.correctAnswer || ''));
                }
            }
            const explEl = document.getElementById('qFormExplanation');
            if (explEl) explEl.value = q.explanation || '';
            window.updateQuestionLivePreview();
        };

        window.saveQuestionRecord = function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const stimulusImage = (document.getElementById('qFormStimulusImg')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const questionImage = (document.getElementById('qFormQuestionImg')?.value || '').trim();
            const correctAnswerRaw = (document.getElementById('qFormKey')?.value || '').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi Soal', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }

            let options = [];
            let matchingPairs = [];
            let correctAnswer = correctAnswerRaw || 'A';

            if (type === 'pg' || type === 'pg_complex') {
                const rawChoiceOpts = [
                    (document.getElementById('qOptA')?.value || '').trim(),
                    (document.getElementById('qOptB')?.value || '').trim(),
                    (document.getElementById('qOptC')?.value || '').trim(),
                    (document.getElementById('qOptD')?.value || '').trim()
                ];
                options = rawChoiceOpts.map((val, idx) => isChoiceOptionEmpty(val, idx) ? '' : val);
                if (options.filter(Boolean).length < 2) {
                    window.showModal('Validasi Opsi Pilihan', 'Harap isi minimal 2 pilihan jawaban (misal Pilihan A dan B). Pilihan yang tidak digunakan (seperti D) boleh dikosongkan.', 'error');
                    return;
                }
                if (type === 'pg_complex') {
                    correctAnswer = correctAnswerRaw
                        ? correctAnswerRaw.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean)
                        : ['A'];
                } else {
                    correctAnswer = (correctAnswerRaw || 'A').trim().toUpperCase();
                }
            } else if (type === 'matching') {
                const rawPairInputs = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ];
                const parsedMatch = parseMatchingOptionsAndKey(rawPairInputs, correctAnswerRaw);
                if (parsedMatch.matchingPairs.length === 0) {
                    window.showModal('Validasi Soal Menjodohkan', 'Harap isi minimal 1 pasangan pada kolom Opsi A s.d D (contoh: Es dipanaskan = Mencair).', 'error');
                    return;
                }
                matchingPairs = parsedMatch.matchingPairs;
                options = parsedMatch.options;
                correctAnswer = parsedMatch.correctAnswer;
            } else if (type === 'true_false') {
                const rawStmts = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ];
                const parsedTF = parseTrueFalseStatementsAndKey(rawStmts, correctAnswerRaw);
                options = parsedTF.options;
                correctAnswer = parsedTF.correctAnswer;
            }

            const selectedBank = appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL'
                ? appData.filters.questionBankId
                : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    existing.orderNum = orderNum;
                    existing.type = type;
                    existing.weight = weight;
                    existing.stimulusText = stimulusText;
                    existing.stimulusImage = stimulusImage;
                    existing.questionText = questionText;
                    existing.questionImage = questionImage;
                    existing.options = options;
                    if (type === 'matching') existing.matchingPairs = matchingPairs;
                    existing.correctAnswer = correctAnswer;
                    existing.explanation = explanation;
                    syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = {
                    id: 'Q-' + Date.now(),
                    bankId: selectedBank,
                    subjectId: appData.subjects[0] ? appData.subjects[0].id : 'SUB-IPAS',
                    classLevel: '4',
                    orderNum,
                    type,
                    weight,
                    stimulusText,
                    stimulusImage,
                    questionText,
                    questionImage,
                    options,
                    matchingPairs: type === 'matching' ? matchingPairs : [],
                    correctAnswer,
                    partialScoring: true,
                    explanation,
                    difficulty: 'Sedang'
                };
                appData.questions.push(newQ);
                syncCollectionRecord('questions', newQ.id, newQ);
                if (appData.exams[0] && Array.isArray(appData.exams[0].questionIds)) {
                    appData.exams[0].questionIds.push(newQ.id);
                    syncCollectionRecord('exams', appData.exams[0].id, appData.exams[0]);
                }
            }

            window.showModal('Berhasil', 'Butir soal berhasil disimpan ke bank soal.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

        window.executeExportQuestionsExcel = function(mode = 'ALL', bankId = '') {
            let questionsToExport = mode === 'PACKAGE'
                ? appData.questions.filter(q => q.bankId === bankId)
                : [...appData.questions];

            if (questionsToExport.length === 0) {
                window.showModal('Bank Soal Kosong', 'Tidak ada butir soal untuk diekspor.', 'error');
                return false;
            }

            const headers = [
                'No', 'Jenis Soal (pg/pg_complex/true_false/matching/short_answer/essay)', 'Bobot Poin',

            ];

            const rows = questionsToExport.map((q, idx) => {
                const qType = q.type || 'pg';

                    q.orderNum || (idx + 1), qType, Number(q.weight) || 10,

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris soal.', 'error');
                        return;
                    }

                    const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                        ? appData.filters.questionBankId
                        : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-DEFAULT');

                    const headerRow = (rows[0] || []).map(h => String(h ?? '').trim().toLowerCase());
                    const hasImageColumns = headerRow.some(h => h.includes('gambar') || h.includes('url')) || (rows[0] && rows[0].length >= 12);

                    const parsedQuestions = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;

                        let typeRaw = String(cols[1] ?? '').trim();
                        let weight = Number(cols[2]) || 10;
                        let stimulusText = '';
                        let stimulusImage = '';
                        let questionText = '';
                        let questionImage = '';
                        let optA = '';
                        let optB = '';
                        let optC = '';
                        let optD = '';
                        let keyRaw = '';
                        let explanation = '';

                        if (hasImageColumns) {
                            stimulusText = String(cols[3] ?? '').trim();
                            stimulusImage = String(cols[4] ?? '').trim();
                            questionText = String(cols[5] ?? '').trim();
                            questionImage = String(cols[6] ?? '').trim();
                            optA = String(cols[7] ?? '').trim();
                            optB = String(cols[8] ?? '').trim();
                            optC = String(cols[9] ?? '').trim();
                            optD = String(cols[10] ?? '').trim();
                            keyRaw = String(cols[11] ?? '').trim();
                            explanation = String(cols[12] ?? '').trim();
                        } else {
                            stimulusText = String(cols[3] ?? '').trim();
                            questionText = String(cols[4] ?? '').trim();
                            optA = String(cols[5] ?? '').trim();
                            optB = String(cols[6] ?? '').trim();
                            optC = String(cols[7] ?? '').trim();
                            optD = String(cols[8] ?? '').trim();
                            keyRaw = String(cols[9] ?? '').trim();
                            explanation = String(cols[10] ?? '').trim();
                        }

                        if (!questionText && !typeRaw) continue;
                        if (!questionText) continue;

                        const normType = normalizeImportedQuestionType(typeRaw);
                        const finalType = normType.code;

                        let options = [];
                        let matchingPairs = [];
                        let correctAnswer = keyRaw;

                        if (finalType === 'pg') {
                            options = [optA, optB, optC, optD].map((val, idx) => isChoiceOptionEmpty(val, idx) ? '' : String(val).trim());
                            correctAnswer = (keyRaw || 'A').trim().toUpperCase();
                        } else if (finalType === 'pg_complex') {
                            options = [optA, optB, optC, optD].map((val, idx) => isChoiceOptionEmpty(val, idx) ? '' : String(val).trim());
                            correctAnswer = keyRaw
                                ? keyRaw.split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean)
                                : ['A'];
                        } else if (finalType === 'true_false') {
                            const parsedTF = parseTrueFalseStatementsAndKey([optA, optB, optC, optD], keyRaw);
                            options = parsedTF.options;
                            correctAnswer = parsedTF.correctAnswer;
                        } else if (finalType === 'matching') {
                            const parsedMatch = parseMatchingOptionsAndKey([optA, optB, optC, optD], keyRaw);
                            matchingPairs = parsedMatch.matchingPairs;
                            options = parsedMatch.options;
                            correctAnswer = parsedMatch.correctAnswer;
                        }

                        const keyDisplayStr = finalType === 'matching'
                            ? formatMatchingKeyReadable(matchingPairs, correctAnswer)
                            : (Array.isArray(correctAnswer) ? correctAnswer.join(', ') : (typeof correctAnswer === 'object' ? JSON.stringify(correctAnswer) : String(correctAnswer)));

                        parsedQuestions.push({
                            orderNum: parsedQuestions.length + 1,
                            type: finalType,
                            isValidType: normType.valid,
                            rawTypeLabel: normType.rawLabel,
                            weight,
                            stimulusText,
                            stimulusImage,
                            questionText,
                            questionImage,
                            options,
                            matchingPairs,
                            correctAnswer,
                            keyDisplay: keyDisplayStr,
                            explanation
                        });
                    }

                    const validQuestions = parsedQuestions.filter(q => q.isValidType);
                    const previewRowsHtml = parsedQuestions.map((q, idx) => `
                        <tr class="border-b border-slate-100 hover:bg-slate-50 align-top">
                            <td class="px-3 py-2 text-xs font-bold text-slate-600">${idx + 1}</td>
                            <td class="px-3 py-2 text-xs font-bold text-indigo-700">${escapeHtml(getQuestionTypeBadgeLabel(q.type))}</td>
                            <td class="px-3 py-2 text-xs text-center font-bold">${q.weight}</td>
                            <td class="px-3 py-2 text-xs text-slate-800">${escapeHtml(q.questionText)}</td>
                            <td class="px-3 py-2 text-xs font-mono font-extrabold text-emerald-700">${escapeHtml(q.keyDisplay)}</td>
                        </tr>
                    `).join('');

                    const html = `
                        <div class="space-y-3">
                            <div class="max-h-80 overflow-y-auto border border-slate-200 rounded-xl custom-scrollbar">
                                <table class="w-full text-left border-collapse">
