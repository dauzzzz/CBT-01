    <script type="module">

        let db = null;

        let appData = {

                academicYear: '2026/2027',
                semester: 'Ganjil',

            },

            teachers: [],

            questionBanks: [],

            exams: [],
            examParticipants: [],
            examSessions: [],

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function updateBrowserFaviconAndTitle() {
            const logoUrl = appData.settings.schoolLogo || DEFAULT_SCHOOL_LOGO;
            let link = document.getElementById('dynamicFavicon') || document.querySelector("link[rel*='icon']");
            if (!link) {
                link = document.createElement('link');
                link.id = 'dynamicFavicon';
                link.rel = 'icon';
                document.head.appendChild(link);
            }
            link.href = logoUrl;
            if (appData.settings.appName) {
                document.title = `${appData.settings.appName} – ${appData.settings.schoolName || 'CBT SEKOLAH'}`;
            }
        }

        function logActivity(text) {
            const now = new Date();
            const timeStr = now.toTimeString().slice(0, 5) + ' WIB';
            appData.activityLogs.unshift({ id: 'LOG-' + Date.now(), time: timeStr, text });
            if (appData.activityLogs.length > 15) appData.activityLogs.pop();
        }

        function getClassNameById(classId) {
            if (!classId || classId === 'ALL') return 'Semua Kelas';
            const c = appData.classes.find(x => x.id === classId || String(x.className) === String(classId));
            return c ? c.className : classId;
        }

        function getSubjectNameById(subjectId) {
            const s = appData.subjects.find(x => x.id === subjectId);
            return s ? s.subjectName : (subjectId || '-');
        }

        // --- VALIDASI TUNGGAL STATUS UJIAN & JADWAL WIB (SINGLE SOURCE OF TRUTH) ---
        function isExamStrictlyActive(examObj) {
            if (!examObj || typeof examObj !== 'object') return false;
            const rawStatus = String(examObj.status || '').trim().toLowerCase();
            return rawStatus === 'aktif';
        }

        function matchesStudentClass(examObj, studentObj) {
            if (!examObj || !studentObj) return false;
            if (!examObj.classId || examObj.classId === 'ALL') return true;
            const examClsName = String(getClassNameById(examObj.classId) || '').trim().toLowerCase().replace(/^kelas\s+/i, '');
            const studentClsName = String(studentObj.className || getClassNameById(studentObj.classId) || '').trim().toLowerCase().replace(/^kelas\s+/i, '');
            return (
                examObj.classId === studentObj.classId ||
                examObj.classId === studentObj.className ||
                (examClsName !== '' && examClsName === studentClsName)
            );
        }

        function parseExamDateTimeWIB(dateStr, timeStr, isEnd = false) {
            const rawDate = String(dateStr || '').trim();
            if (!rawDate) return null;
            let year, month, day;
            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(rawDate)) {
                const p = rawDate.split('-');
                year = Number(p[0]); month = Number(p[1]); day = Number(p[2]);
            } else if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(rawDate)) {
                const p = rawDate.split(/[\/\-]/);
                day = Number(p[0]); month = Number(p[1]); year = Number(p[2]);
            } else {
                return null;
            }
            if (!year || !month || !day || month < 1 || month > 12 || day < 1 || day > 31) return null;
            const defaultTime = isEnd ? '23:59' : '00:00';
            const rawTime = String(timeStr || defaultTime).trim();
            const tp = rawTime.split(':');
            const hh = Math.min(23, Math.max(0, Number(tp[0]) || (isEnd ? 23 : 0)));
            const mm = Math.min(59, Math.max(0, Number(tp[1]) || (isEnd ? 59 : 0)));
            const ss = isEnd ? '59' : '00';
            const isoWIB = `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${ss}+07:00`;
            const ms = Date.parse(isoWIB);
            return isNaN(ms) ? null : ms;
        }

        function checkExamScheduleAccess(examObj, nowMs = Date.now()) {
            if (!examObj) {
                return { allowed: false, reason: 'NOT_FOUND', message: 'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.' };
            }
            const startMs = parseExamDateTimeWIB(examObj.startDate, examObj.startTime || '00:00', false);
            const endMs = parseExamDateTimeWIB(examObj.endDate, examObj.endTime || '23:59', true);

            if (startMs !== null && nowMs < startMs) {
                return { allowed: false, reason: 'BEFORE_START', message: `Waktu ujian belum dimulai. Jadwal mulai: ${examObj.startDate} pukul ${examObj.startTime || '07:00'} WIB.` };
            }
            if (endMs !== null && nowMs > endMs) {
                return { allowed: false, reason: 'AFTER_END', message: `Waktu pelaksanaan ujian telah berakhir pada ${examObj.endDate} pukul ${examObj.endTime || '23:59'} WIB.` };
            }
            return { allowed: true, reason: 'OK', message: '' };
        }

        function isExamEligibleForStudent(examObj, studentObj, nowMs = Date.now()) {
            if (!examObj || !studentObj) return false;
            if (!isExamStrictlyActive(examObj)) return false;
            if (!matchesStudentClass(examObj, studentObj)) return false;
            return checkExamScheduleAccess(examObj, nowMs).allowed;
        }

        async function verifyExamAccessFromFirestore(examId, studentObj) {
            const defaultBlockedMsg = 'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.';
            if (!examId || !studentObj) return { allowed: false, message: defaultBlockedMsg };
            if (!db) return { allowed: false, message: 'Koneksi database belum terhubung. Periksa koneksi internet Anda.' };

            try {
                const examRef = doc(db, 'artifacts', appId, 'public', 'data', 'exams', examId);
                let snap;
                try {
                    snap = await getDocFromServer(examRef);
                } catch (serverErr) {
                    snap = await getDoc(examRef);
                }
                if (!snap.exists()) {
                    appData.exams = appData.exams.filter(x => x.id !== examId);
                    return { allowed: false, message: defaultBlockedMsg };
                }
                const liveExam = { id: snap.id, ...snap.data() };
                const idx = appData.exams.findIndex(x => x.id === examId);
                if (idx >= 0) appData.exams[idx] = liveExam;
                else appData.exams.push(liveExam);

                if (!isExamStrictlyActive(liveExam)) {
                    return { allowed: false, message: defaultBlockedMsg };
                }
                if (!matchesStudentClass(liveExam, studentObj)) {
                    return { allowed: false, message: defaultBlockedMsg };
                }
                const sched = checkExamScheduleAccess(liveExam, Date.now());
                if (!sched.allowed) {
                    return { allowed: false, message: defaultBlockedMsg };
                }
                return { allowed: true, exam: liveExam };
            } catch (err) {
                console.error('verifyExamAccessFromFirestore Error:', err);
                return { allowed: false, message: 'Gagal memverifikasi status ujian terbaru dari server.' };
            }
        }

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    const cleanObj = JSON.parse(JSON.stringify(dataObj, (k, v) => v === undefined ? null : v));
                    await setDoc(ref, cleanObj, { merge: true });
                }
                return true;
            } catch (err) {
                console.error(`Firestore Sync Error [${collectionName}/${docId}]:`, err);
                return false;
            }
        }

        async function persistStudentExamProgressToCloud() {
            const student = appData.currentUser;
            if (!student || student.role !== 'student' || !currentActiveExam) return;
            const sessionId = `SES_${currentActiveExam.id}_${student.studentId}`;
            const sessionData = {
                id: sessionId,
                examId: currentActiveExam.id,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                className: student.className || '6',
                answers: currentStudentAnswers || {},
                doubtfulMap: currentDoubtfulMap || {},
                remainingSeconds: remainingSeconds,
                violationCount: currentViolationCount,
                updatedAt: new Date().toISOString()
            };
            const idx = appData.examSessions.findIndex(s => s.id === sessionId);
            if (idx >= 0) appData.examSessions[idx] = sessionData;
            else appData.examSessions.push(sessionData);

            await syncCollectionRecord('examSessions', sessionId, sessionData);
        }

        // --- ANTI-CHEAT & PENGHENTIAN SESI UJIAN REAL-TIME ---
        function onVisibilityChangeHandler() {
            if (document.hidden && isExamWorkspaceActive && currentActiveExam && !isViolationModalOpen) {
                window.recordStudentViolation('Berpindah tab atau meminimalkan jendela ujian.');
            }
        }

        window.attachAntiCheatListeners = function() {
            window.detachAntiCheatListeners();
            isExamWorkspaceActive = true;
            isViolationModalOpen = false;
            document.addEventListener('visibilitychange', onVisibilityChangeHandler);
        };

        window.detachAntiCheatListeners = function() {
            isExamWorkspaceActive = false;
            document.removeEventListener('visibilitychange', onVisibilityChangeHandler);
        };

        window.stopAllExamTimersAndWatchers = function() {
            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            window.detachAntiCheatListeners();
        };

        window.forceTerminateActiveStudentExam = async function(noticeMsg) {
            if (!currentActiveExam) return;
            const closedExamId = currentActiveExam.id;
            window.stopAllExamTimersAndWatchers();
            await persistStudentExamProgressToCloud();

            const student = appData.currentUser;
            if (student) {
                const part = appData.examParticipants.find(p => p.examId === closedExamId && p.studentId === student.studentId);
                if (part && part.status !== 'Selesai') {
                    part.status = 'Dihentikan (Ujian Ditutup Admin)';
                    syncCollectionRecord('examParticipants', part.id, part);
                }
            }

            currentActiveExam = null;
            currentExamQuestions = [];
            window.renderStudentPortal(false);
            window.showModal(
                'Ujian Ditutup oleh Administrator',
                noticeMsg || 'Ujian telah ditutup oleh administrator. Jawaban yang sudah Anda isi tetap tersimpan.',
                'error'
            );
        };

        async function initFirebaseProduction() {
            if (IS_PREVIEW) return true;
            const firebaseConfig = {
                apiKey: "AIzaSyDw_1kWRnt7dQHnSLerhevPw65TY64QW5s",
                authDomain: "cbt-01-9ff05.firebaseapp.com",
                projectId: "cbt-01-9ff05",
                storageBucket: "cbt-01-9ff05.firebasestorage.app",
                messagingSenderId: "511625667431",
                appId: "1:511625667431:web:784fbc26a20e8b81ef45c2"
            };

            db = getFirestore(app);

                    });

                }
            } catch (setErr) {
                console.warn('Gagal memuat appSettings:', setErr.message);
            }

            updateBrowserFaviconAndTitle();
            setupGlobalRealtimeSubscriptions();

        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;
            globalRealtimeUnsubscribes.forEach(unsub => { try { unsub(); } catch (e) {} });
            globalRealtimeUnsubscribes = [];

            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examSessions', 'examResults'
            ];

            collectionsToWatch.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, { includeMetadataChanges: true }, (snapshot) => {
                    if (!isGlobalSyncActive && colName === 'questions' && appData.currentUser?.role === 'admin') return;
                    const list = snapshot.docs.map(d => {
                        const raw = d.data();
                        return colName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                    });
                    if (colName === 'questions') {
                        list.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));
                    }
                    appData[colName] = list;

                    // Deteksi real-time apabila Admin menutup ujian saat siswa sedang mengerjakan
                    if (colName === 'exams' && appData.currentUser?.role === 'student' && isExamWorkspaceActive && currentActiveExam) {
                        const latestEx = list.find(x => x.id === currentActiveExam.id);
                        if (!latestEx || !isExamStrictlyActive(latestEx) || !checkExamScheduleAccess(latestEx).allowed) {
                            window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator. Jawaban yang sudah Anda isi tetap tersimpan.');
                            return;
                        }
                    }

                    if (!isInitialRealtimeLoad) {
                        window.triggerRealtimeUIRefresh();
                    }
                }, (err) => {
                    console.warn(`Realtime listener warning [${colName}]:`, err.message);
                });
                globalRealtimeUnsubscribes.push(unsub);
            });

            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global');
            const unsubSet = onSnapshot(settingsRef, (snap) => {
                if (snap.exists()) {
                    appData.settings = { ...appData.settings, ...snap.data() };
                    updateBrowserFaviconAndTitle();
                    if (!isInitialRealtimeLoad) window.triggerRealtimeUIRefresh();
                }
            });
            globalRealtimeUnsubscribes.push(unsubSet);

            setTimeout(() => { isInitialRealtimeLoad = false; }, 600);
        }

        window.triggerRealtimeUIRefresh = function() {
            const badge = document.getElementById('liveSyncBadge');
            if (badge) {
                badge.innerHTML = '<i class="fa-solid fa-circle-dot text-emerald-500 animate-pulse"></i> Tersinkronisasi';
                setTimeout(() => {
                    if (badge) badge.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i> Live Sync Aktif';
                }, 1500);
            }

            if (!appData.currentUser) {
                window.renderLoginView();
                return;
            }
            if (appData.currentUser.role === 'student') {
                if (!isExamWorkspaceActive) {
                    window.renderStudentPortal(false);
                }
            } else if (appData.currentUser.role === 'admin') {
                if (appData.activeAdminMenu === 'questionBanks') return;
                const mainEl = document.getElementById('adminMainContent');
                const scrollPos = mainEl ? mainEl.scrollTop : 0;
                window.renderAdminCurrentSection();
                if (mainEl) mainEl.scrollTop = scrollPos;
            }
        };

        // --- MODAL & UTILITAS EXCEL ---
        window.showModal = function(title, message, type = 'info', callback = null, options = {}) {
            const modal = document.getElementById('customModal');
            const dialogBox = document.getElementById('modalDialogBox');
            const header = document.getElementById('modalHeader');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const bodyEl = document.getElementById('modalDynamicBody');
            const btnOk = document.getElementById('modalBtnOk');
            const btnCancel = document.getElementById('modalBtnCancel');

            dialogBox.className = `bg-white rounded-2xl shadow-2xl ${options.wide ? 'max-w-3xl' : 'max-w-lg'} w-full mx-auto overflow-hidden transform transition-all my-8 flex flex-col max-h-[90vh]`;
            header.className = `px-6 py-4 text-white flex items-center justify-between shrink-0 ${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`;
            const icon = type === 'error' ? 'triangle-exclamation' : type === 'success' ? 'circle-check' : 'info-circle';

            if (message) {
                msgEl.innerText = message;
                msgEl.classList.remove('hidden');
            } else {
                msgEl.innerText = '';
                msgEl.classList.add('hidden');
            }

            bodyEl.innerHTML = options.html || '';
            currentModalCallback = callback;

            if (callback || options.showCancel) {
                btnCancel.classList.remove('hidden');
                btnCancel.innerText = options.cancelText || 'Batal';
                btnOk.innerText = options.okText || 'Simpan / Lanjutkan';

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 55) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat pustaka Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file berformat .xlsx atau .xls yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) { showLoginError('NISN dan PIN wajib diisi.'); return; }

            // Muat status ujian terbaru langsung dari Firestore sebelum masuk ke Portal Siswa
            if (db) {
                try {
                    const snap = await getDocsFromServer(collection(db, 'artifacts', appId, 'public', 'data', 'exams'));
                    appData.exams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                } catch (e) {
                    try {
                        const snapFallback = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'exams'));
                        appData.exams = snapFallback.docs.map(d => ({ id: d.id, ...d.data() }));
                    } catch (err2) {}
                }
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) { showLoginError('Akun siswa tidak ditemukan atau tidak aktif.'); return; }
            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') { showLoginError('PIN / Password siswa tidak sesuai.'); return; }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token

        window.downloadStudentTemplate = function() {
            const headers = ['NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin (L/P)', 'Kelas (1-6)', 'PIN Login'];
            const sampleRows = [['3150494333', '1001', 'NADIA IRENDRA PUTRI', appData.settings.schoolName, 'P', '6', '123456']];

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Tahun Pelajaran', 'Status'];
            const rows = appData.students.map((s, idx) => [idx + 1, s.nisn, s.nis || '-', s.fullName, s.asalSekolah || appData.settings.schoolName, s.gender || 'L', s.className, s.academicYear, s.status]);
            window.downloadExcelFile('Data_Siswa_CBT_Sekolah.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    let added = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || !cols[0] || !cols[2]) continue;
                        const nisn = String(cols[0]).trim();
                        if (appData.students.some(s => s.nisn === nisn)) continue;
                        const clsName = String(cols[5] ?? '6').trim();
                        const clsObj = appData.classes.find(c => String(c.className) === clsName) || appData.classes[0];
                        const newStd = {
                            id: 'STD-' + Date.now() + '-' + i,
                            nisn,
                            nis: String(cols[1] ?? '-').trim(),
                            fullName: String(cols[2]).trim(),
                            asalSekolah: String(cols[3] ?? appData.settings.schoolName).trim(),
                            gender: String(cols[4] ?? 'L').trim().toUpperCase() === 'P' ? 'P' : 'L',
                            classId: clsObj ? clsObj.id : 'CLS-6',
                            className: clsObj ? clsObj.className : clsName,
                            academicYear: appData.settings.academicYear,
                            username: nisn,
                            passwordHash: hashCredential(String(cols[6] ?? '123456').trim()),
                            status: 'Aktif'
                        };
                        appData.students.push(newStd);
                        syncCollectionRecord('students', newStd.id, newStd);
                        added++;
                    }
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil menambahkan ${added} data siswa baru.`, 'success');
                });
            };
            fileInput.click();
        };

            `;
            window.showModal(existing ? 'Edit Siswa' : 'Tambah Siswa', '', 'info', (confirmed) => {
                if (!confirmed) return true;
                const nisn = document.getElementById('stdFormNisn').value.trim();

                const fullName = document.getElementById('stdFormName').value.trim();
                const asalSekolah = document.getElementById('stdFormSchool').value.trim();
                const gender = document.getElementById('stdFormGender').value;
                const classId = document.getElementById('stdFormClass').value;
                const pin = document.getElementById('stdFormPin').value.trim() || '123456';
                if (!nisn || !fullName) return false;
                const clsObj = appData.classes.find(c => c.id === classId);
                const className = clsObj ? clsObj.className : classId;
                if (existing) {
                    Object.assign(existing, { nisn, nis, fullName, asalSekolah, gender, classId, className, passwordHash: hashCredential(pin) });

                return true;
            }, { html, okText: 'Simpan', wide: true });

        window.saveQuestionRecord = function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const correctAnswer = (document.getElementById('qFormKey')?.value || 'A').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();
            if (!questionText) {
                window.showModal('Validasi', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }
            const options = [
                document.getElementById('qOptA')?.value || '',
                document.getElementById('qOptB')?.value || '',
                document.getElementById('qOptC')?.value || '',
                document.getElementById('qOptD')?.value || ''
            ];
            const selectedBank = appData.filters.questionBankId !== 'ALL' ? appData.filters.questionBankId : (appData.questionBanks[0]?.id || 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    Object.assign(existing, { orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation });
                    syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = { id: 'Q-' + Date.now(), bankId: selectedBank, orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation };
                appData.questions.push(newQ);
                syncCollectionRecord('questions', newQ.id, newQ);
            }
            window.showModal('Berhasil', 'Butir soal berhasil disimpan.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

        window.executeExportQuestionsExcel = function() {
            const selectedBank = appData.filters.questionBankId || 'ALL';
            const bankObj = appData.questionBanks.find(b => b.id === selectedBank);
            const bankTitle = bankObj ? bankObj.title.replace(/[^a-zA-Z0-9_-]/g, '_') : 'Semua_Paket';
            const list = selectedBank === 'ALL' ? appData.questions : appData.questions.filter(q => q.bankId === selectedBank);
            if (list.length === 0) {
                window.showModal('Data Soal Kosong', 'Tidak ada butir soal pada paket yang dipilih untuk diekspor.', 'error');
                return;
            }
            const headers = ['No', 'Jenis Soal (pg/pg_complex/true_false/matching/short_answer/essay)', 'Bobot Poin', 'Teks Stimulus', 'URL Gambar Stimulus', 'Teks Pertanyaan', 'URL Gambar Soal', 'Opsi A / Pasangan 1', 'Opsi B / Pasangan 2', 'Opsi C / Pasangan 3', 'Opsi D / Pasangan 4', 'Kunci Jawaban', 'Pembahasan'];
            const rows = list.map((q, i) => [
                q.orderNum || (i + 1),
                q.type || 'pg',
                q.weight || 10,
                q.stimulusText || '',
                q.stimulusImage || '',
                q.questionText || '',
                q.questionImage || '',
                q.options?.[0] || '',
                q.options?.[1] || '',
                q.options?.[2] || '',

                q.explanation || ''

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    const bankId = appData.filters.questionBankId !== 'ALL' ? appData.filters.questionBankId : (appData.questionBanks[0]?.id || 'QB-DEFAULT');
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || !cols[5]) continue;
                        const newQ = {
                            id: 'Q-' + Date.now() + '-' + i,
                            bankId,
                            orderNum: Number(cols[0]) || i,
                            type: String(cols[1] || 'pg').trim().toLowerCase(),
                            weight: Number(cols[2]) || 10,
                            stimulusText: String(cols[3] || '').trim(),
                            stimulusImage: String(cols[4] || '').trim(),
                            questionText: String(cols[5] || '').trim(),
                            questionImage: String(cols[6] || '').trim(),
                            options: [String(cols[7] ?? ''), String(cols[8] ?? ''), String(cols[9] ?? ''), String(cols[10] ?? '')],
                            correctAnswer: String(cols[11] || 'A').trim(),
                            explanation: String(cols[12] || '').trim()

        function resolveResultRecordDetails(r) {
            const std = appData.students.find(s => s.id === r.studentId || s.nisn === r.nisn);
            const ex = appData.exams.find(e => e.id === r.examId || e.examName === r.examName);
            const subName = ex ? getSubjectNameById(ex.subjectId) : (r.subjectId ? getSubjectNameById(r.subjectId) : '-');
            const clsName = r.className || (std ? std.className : (ex ? getClassNameById(ex.classId) : '-'));
            const schoolName = std && std.asalSekolah ? std.asalSekolah : (appData.settings.schoolName || '-');
            return {
                nisn: r.nisn || (std ? std.nisn : '-'),
                studentName: r.studentName || (std ? std.fullName : '-'),
                schoolName,
                className: clsName,
                examName: r.examName || (ex ? ex.examName : '-'),

        // --- RUANG PENGERJAAN SOAL SISWA ---
        window.startExamSession = async function(examId) {
            const student = appData.currentUser;
            const verification = await verifyExamAccessFromFirestore(examId, student);
            if (!verification.allowed) {
                window.renderStudentPortal(false);
                window.showModal(
                    'Akses Ujian Ditolak',
                    'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.',
                    'error'
                );
                return;
            }

            const ex = verification.exam;
            const alreadyDone = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
            if (alreadyDone) {
                window.showModal('Sudah Selesai', 'Anda sudah menyelesaikan paket ujian ini.', 'info');
                return;
            }

            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = appData.questions.filter(q => q.bankId === ex.bankId);
            }
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = [...appData.questions];
            }

            const sessionId = `SES_${ex.id}_${student.studentId}`;
            const savedSession = appData.examSessions.find(s => s.id === sessionId);
            if (savedSession) {
                currentStudentAnswers = savedSession.answers || {};
                currentDoubtfulMap = savedSession.doubtfulMap || {};
                remainingSeconds = typeof savedSession.remainingSeconds === 'number' && savedSession.remainingSeconds > 0
                    ? savedSession.remainingSeconds
                    : ex.durationMinutes * 60;
                currentViolationCount = savedSession.violationCount || 0;
            } else {
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                remainingSeconds = ex.durationMinutes * 60;
                currentViolationCount = 0;
            }

            currentQuestionIndex = 0;
            lastViolationTimestamp = 0;

            let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + Date.now(),
                    examId: ex.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '6',
                    status: 'Sedang Mengerjakan',
                    violationCount: currentViolationCount
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Sedang Mengerjakan';
            }
            syncCollectionRecord('examParticipants', p.id, p);

            window.attachAntiCheatListeners();
            window.renderExamWorkspace();
            startExamTimer();
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                if (!currentActiveExam) {
                    clearInterval(examTimerInterval);
                    return;
                }
                const latestEx = appData.exams.find(x => x.id === currentActiveExam.id);
                if (!latestEx || !isExamStrictlyActive(latestEx) || !checkExamScheduleAccess(latestEx).allowed) {
                    window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator. Jawaban yang sudah Anda isi tetap tersimpan.');
                    return;
                }
                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) timerEl.innerText = formatHMS(remainingSeconds);
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.detachAntiCheatListeners();
                    window.showModal('Waktu Habis', 'Waktu pengerjaan ujian telah berakhir. Jawaban Anda akan dikirim otomatis.', 'info', () => {
                        window.submitExamFinal();
                    });
                }
            }, 1000);
        }

            const now = Date.now();
            if (now - lastViolationTimestamp < 3500 || isViolationModalOpen || !isExamWorkspaceActive) return;
            lastViolationTimestamp = now;
            isViolationModalOpen = true;
            currentViolationCount++;
            const badgeEl = document.getElementById('examViolationCounter');
            if (badgeEl) badgeEl.innerText = `Pelanggaran: ${currentViolationCount}x`;
            window.showModal('PERINGATAN PELANGGARAN!', `Sistem mendeteksi Anda keluar dari halaman ujian (${reasonText}). Total pelanggaran: ${currentViolationCount}x`, 'error', () => {
                isViolationModalOpen = false;
            }, { okText: 'Saya Mengerti' });
        };

                            <div class="px-4 py-1.5 bg-red-600 text-white rounded-xl font-mono font-extrabold text-xs sm:text-sm">

                        <section class="lg:col-span-3 bg-white border-b lg:border-r border-slate-200 p-4 space-y-3 overflow-y-auto custom-scrollbar">
                            <h3 class="text-xs font-extrabold uppercase text-slate-600"><i class="fa-solid fa-book-open text-blue-600 mr-1"></i> Stimulus</h3>
                            ${q.stimulusText ? `<div class="p-3 bg-blue-50/60 rounded-xl text-xs text-slate-700">${escapeHtml(q.stimulusText)}</div>` : '<p class="text-xs text-slate-400 italic">Tidak ada stimulus.</p>'}
                        </section>

                        <section class="lg:col-span-6 flex flex-col lg:h-full lg:overflow-hidden bg-slate-50">
                            <div class="px-6 py-3 bg-white border-b border-slate-200 flex justify-between items-center shrink-0">
                                <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-xl">Soal #${currentQuestionIndex + 1}</span>
                                <span class="text-xs font-bold text-emerald-700">Bobot: ${q.weight || 10} Poin</span>
                            </div>
                            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
                                    <p class="text-sm sm:text-base font-bold text-slate-900">${escapeHtml(q.questionText)}</p>
                                </div>
                                <div class="space-y-3">${answerInputHtml}</div>
                            </div>
                            <div class="px-6 py-4 bg-white border-t border-slate-200 flex justify-between items-center shrink-0">
                                <button type="button" onclick="window.prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">Sebelumnya</button>
                                <button type="button" onclick="window.toggleDoubtful('${q.id}')" class="px-4 py-2 bg-amber-400 text-slate-950 rounded-xl text-xs font-bold">Ragu-Ragu</button>
                                <button type="button" onclick="window.nextQuestion()" ${currentQuestionIndex === currentExamQuestions.length - 1 ? 'disabled' : ''} class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Selanjutnya</button>
                            </div>
                        </section>

                        <aside class="lg:col-span-3 bg-white border-t lg:border-l border-slate-200 p-4 flex flex-col justify-between">
                            <div class="space-y-3">
                                <h3 class="text-xs font-extrabold uppercase text-slate-700">Penjelajah Soal</h3>
                                <div class="grid grid-cols-5 gap-2">${gridNav}</div>
                            </div>
                            <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-extrabold text-xs shadow-md mt-4">Kirim & Selesai</button>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswer = function(qId, val) {
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            currentStudentAnswers[qId] = val;
            persistStudentExamProgressToCloud();
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            currentStudentAnswers[qId] = val;
            persistStudentExamProgressToCloud();
            window.renderExamWorkspace();
        };

        window.toggleDoubtful = function(qId) {
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            persistStudentExamProgressToCloud();
            window.renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; window.renderExamWorkspace(); }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) { currentQuestionIndex++; window.renderExamWorkspace(); }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) { currentQuestionIndex = idx; window.renderExamWorkspace(); }
        };

        window.confirmSubmitExam = function() {
            window.showModal('Konfirmasi Selesai', 'Apakah Anda yakin ingin mengirim jawaban dan mengakhiri ujian?', 'info', (confirmed) => {
                if (confirmed) window.submitExamFinal();
                return true;
            }, { showCancel: true, okText: 'Ya, Kirim' });
        };

        window.submitExamFinal = async function() {
            const student = appData.currentUser;
            if (!currentActiveExam || !student) return;

            const check = await verifyExamAccessFromFirestore(currentActiveExam.id, student);
            if (!check.allowed) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator sebelum pengiriman dilakukan. Jawaban terakhir Anda tetap tersimpan.');
                return;
            }

            window.stopAllExamTimersAndWatchers();

            let totalScore = 0, maxScore = 0, correct = 0, wrong = 0, empty = 0;
            currentExamQuestions.forEach(q => {
                const weight = Number(q.weight) || 10;
                maxScore += weight;
                const ans = currentStudentAnswers[q.id];
                if (ans === undefined || ans === '') {
                    empty++;
                    return;
                }
                if (String(ans).trim().toLowerCase() === String(q.correctAnswer || '').trim().toLowerCase()) {
                    totalScore += weight;
                    correct++;
                } else {
                    wrong++;
                }
            });

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id + '-' + Date.now(),
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                subjectId: currentActiveExam.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId,
                className: student.className || '6',
                submittedAt: new Date().toLocaleString('id-ID'),
                totalScoreObtained: totalScore,
                maxPossibleScore: maxScore,
                finalScore: Math.round((totalScore / (maxScore || 100)) * 100) || 0,
                correctCount: correct,
                wrongCount: wrong,
                emptyCount: empty,
                violationCount: currentViolationCount,
                essayGradingStatus: 'Sudah Dinilai',
                answersSnapshot: JSON.parse(JSON.stringify(currentStudentAnswers || {}))
            };

            appData.examResults.push(resultObj);
            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            let p = appData.examParticipants.find(x => x.examId === currentActiveExam.id && x.studentId === student.studentId);
            if (!p) {
                p = { id: 'PRT-' + student.studentId, examId: currentActiveExam.id, studentId: student.studentId, nisn: student.nisn, studentName: student.name, status: 'Selesai', violationCount: currentViolationCount };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
            }
            await syncCollectionRecord('examParticipants', p.id, p);

            currentActiveExam = null;
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-6">
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl p-8 space-y-6 text-center">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>
                        <p class="text-xs text-slate-500">${escapeHtml(resultObj.studentName)} • Nilai Akhir: <strong class="text-emerald-700 text-lg">${resultObj.finalScore}</strong></p>
                        <button type="button" onclick="window.renderStudentPortal(false)" class="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-sm shadow-md">Kembali ke Portal Siswa</button>
                    </div>
                </div>
            `;
        };

        window.onload = async function() {
            try {
                await initFirebaseProduction();
                window.renderLoginView();
            } catch (e) {
                window.renderLoginView();
            }
        };
    </script>
</body>
</html>
