        function withTimeoutPromise(promise, ms, timeoutMessage) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                    reject(new Error(timeoutMessage || `Operasi melebihi batas waktu (${ms}ms)`));
                }, ms);
                promise
                    .then((res) => { clearTimeout(timer); resolve(res); })
                    .catch((err) => { clearTimeout(timer); reject(err); });
            });
        }

        function compressAndConvertImage(file, maxWidth = 240, maxHeight = 240, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => {
                    reject(new Error('Waktu pemrosesan gambar habis (timeout).'));
                }, 8000);
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width || 200;
                            let height = img.height || 200;
                            if (width > height) {
                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width = Math.round((width * maxHeight) / height);
                                    height = maxHeight;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                            const dataUrl = canvas.toDataURL(outType, quality);
                            let settled = false;
                            const blobTimer = setTimeout(() => {
                                if (!settled) {
                                    settled = true;
                                    clearTimeout(timeoutId);
                                    resolve({ dataUrl, blob: file });
                                }
                            }, 2000);
                            canvas.toBlob((blob) => {
                                if (!settled) {
                                    settled = true;
                                    clearTimeout(blobTimer);
                                    clearTimeout(timeoutId);
                                    resolve({ dataUrl, blob: blob || file });
                                }
                            }, outType, quality);
                        } catch (convErr) {
                            clearTimeout(timeoutId);
                            reject(convErr);
                        }
                    };
                    img.onerror = function() {
                        clearTimeout(timeoutId);
                        reject(new Error('Gagal memuat elemen gambar.'));
                    };
                    img.src = evt.target.result;
                };
                reader.onerror = function() {
                    clearTimeout(timeoutId);
                    reject(new Error('Gagal membaca file dari perangkat.'));
                };
                reader.readAsDataURL(file);
            });
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                if (!auth?.currentUser) {
                    try { await signInAnonymously(auth); } catch (e) {}
                }
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    const cleanObj = JSON.parse(JSON.stringify(dataObj, (k, v) => v === undefined ? null : v));
                    await setDoc(ref, cleanObj, { merge: true });
                }
                return true;
            } catch (err) {
                console.error('Firestore Sync Error:', collectionName, docId, err);
                return false;
            }
        }

                projectId: "cbt-01-9ff05",
                storageBucket: "cbt-01-9ff05.firebasestorage.app",

        function isUserTypingInQuestionBank() {

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;
            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examResults', 'examSessions'
            ];

            collectionsToWatch.forEach(colName => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                    appData[colName] = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));

                    // Deteksi real-time apabila Admin menutup/menonaktifkan ujian saat siswa berada di Portal atau Ruang Ujian
                    if (colName === 'exams' && appData.currentUser?.role === 'student') {
                        if (currentActiveExam) {
                            const liveExam = appData.exams.find(e => e.id === currentActiveExam.id);
                            const check = evaluateExamEligibilityLocal(liveExam, appData.currentUser, { ignoreFinished: true });

                                forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                                return;
                            }
                            currentActiveExam = liveExam;
                        } else {
                            window.renderStudentPortal();
                            return;
                        }
                    }

                    // Deteksi real-time apabila sesi siswa direset oleh pengawas
                    if (colName === 'examParticipants' && appData.currentUser?.role === 'student' && currentActiveExam) {
                        const myPart = appData.examParticipants.find(p => p.studentId === appData.currentUser.studentId && p.examId === currentActiveExam.id);

                    // Pengecualian khusus halaman Bank Soal agar form tidak ter-reset saat Admin mengetik
                    if (appData.currentUser?.role === 'admin' && appData.activeAdminMenu === 'questionBanks') {
                        return;
                    }
                    triggerRealtimeUIRefresh();
                }, (err) => {
                    console.warn('Realtime subscription error on ' + colName, err);
                });
            });

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global'), (docSnap) => {
                if (docSnap.exists()) {
                    const newSettings = docSnap.data();
                    if (newSettings.schoolLogo && newSettings.schoolLogo !== appData.settings.schoolLogo) {
                        updateFaviconAndLogo(newSettings.schoolLogo);

                    appData.settings = { ...appData.settings, ...newSettings };
                    if (appData.activeAdminMenu !== 'questionBanks' && !isUploadingLogo) {

        // --- FUNGSI ZONA WAKTU WIB (UTC+7) & VALIDASI AKSES UJIAN ---
        function getClassNameById(classId) {
            const c = appData.classes.find(x => x.id === classId);
            return c ? c.className : (classId || '-');

        function getSubjectNameById(subjectId) {

        function getCurrentTimeWIBMs() {
            return Date.now();
        }

        function parseExamDateTimeWIB(dateStr, timeStr, isEnd = false) {
            const rawDate = String(dateStr || '').trim();
            if (!rawDate) return null;

            let year, month, day;
            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(rawDate)) {
                const parts = rawDate.split('-');
                year = Number(parts[0]);
                month = Number(parts[1]);
                day = Number(parts[2]);
            } else if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(rawDate)) {
                const parts = rawDate.split(/[\/\-]/);
                day = Number(parts[0]);
                month = Number(parts[1]);
                year = Number(parts[2]);
            } else {
                return null;
            }

            if (!year || !month || !day || month < 1 || month > 12 || day < 1 || day > 31) {
                return null;
            }

            const defaultTime = isEnd ? '23:59' : '00:00';
            const rawTime = String(timeStr || defaultTime).trim();
            const timeParts = rawTime.split(':');
            const hours = Math.min(23, Math.max(0, Number(timeParts[0]) || (isEnd ? 23 : 0)));
            const minutes = Math.min(59, Math.max(0, Number(timeParts[1]) || (isEnd ? 59 : 0)));
            const seconds = isEnd ? 59 : 0;
            const ms = isEnd ? 999 : 0;

            const isoWIB = `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(ms).padStart(3, '0')}+07:00`;
            const parsedMs = Date.parse(isoWIB);
            return isNaN(parsedMs) ? null : parsedMs;
        }

        function formatDateDisplayDDMMYYYY(dateStr) {
            const raw = String(dateStr || '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
                const [y, m, d] = raw.split('-');
                return `${d}/${m}/${y}`;
            }
            return raw || '-';
        }

        function checkExamScheduleWindowWIB(examObj, nowMs = getCurrentTimeWIBMs()) {
            if (!examObj) {
                return { withinSchedule: false, reasonCode: 'NOT_FOUND', message: BLOCKED_EXAM_MESSAGE };
            }
            const startMs = parseExamDateTimeWIB(examObj.startDate, examObj.startTime || '00:00', false);
            const endMs = parseExamDateTimeWIB(examObj.endDate, examObj.endTime || '23:59', true);

            if (startMs !== null && nowMs < startMs) {
                return {
                    withinSchedule: false,
                    reasonCode: 'BEFORE_SCHEDULE',
                    message: BLOCKED_EXAM_MESSAGE
                };
            }
            if (endMs !== null && nowMs > endMs) {
                return {
                    withinSchedule: false,
                    reasonCode: 'AFTER_SCHEDULE',
                    message: BLOCKED_EXAM_MESSAGE
                };
            }
            return { withinSchedule: true, reasonCode: 'OK', message: 'Dalam rentang jadwal WIB.' };
        }

        function normalizeClassIdentifier(val) {
            return String(val || '').trim().toLowerCase().replace(/^kelas\s+/i, '').replace(/^cls[\-_]/i, '').trim();
        }

        function matchesStudentClass(examObj, studentObj) {
            if (!examObj || !studentObj) return false;
            if (!examObj.classId || examObj.classId === 'ALL') return true;

            const examClassId = String(examObj.classId || '').trim();
            const examClassName = getClassNameById(examClassId);
            const studentClassId = String(studentObj.classId || '').trim();
            const studentClassName = String(studentObj.className || getClassNameById(studentClassId) || '').trim();

            if (examClassId && studentClassId && examClassId === studentClassId) return true;

            const normExam = normalizeClassIdentifier(examClassName || examClassId);
            const normStudent = normalizeClassIdentifier(studentClassName || studentClassId);
            if (normExam && normStudent && normExam === normStudent) return true;

            return false;
        }

        function isExamStrictlyActive(examObj) {
            if (!examObj) return false;
            return String(examObj.status || '').trim().toLowerCase() === 'aktif';
        }

        function evaluateExamEligibilityLocal(examObj, studentObj, options = {}) {
            if (!examObj || !examObj.id) {
                return { allowed: false, code: 'EXAM_NOT_FOUND', reason: BLOCKED_EXAM_MESSAGE };
            }
            if (!studentObj || studentObj.role !== 'student' || !studentObj.studentId) {
                return { allowed: false, code: 'INVALID_STUDENT', reason: BLOCKED_EXAM_MESSAGE };
            }
            const registeredStudent = appData.students.find(s => s.id === studentObj.studentId && String(s.status || 'Aktif').trim().toLowerCase() === 'aktif');
            if (!registeredStudent) {
                return { allowed: false, code: 'STUDENT_INACTIVE', reason: BLOCKED_EXAM_MESSAGE };
            }
            if (!isExamStrictlyActive(examObj)) {
                return { allowed: false, code: 'EXAM_INACTIVE', reason: BLOCKED_EXAM_MESSAGE };
            }
            if (!matchesStudentClass(examObj, studentObj)) {
                return { allowed: false, code: 'CLASS_MISMATCH', reason: BLOCKED_EXAM_MESSAGE };
            }
            const scheduleCheck = checkExamScheduleWindowWIB(examObj);
            if (!scheduleCheck.withinSchedule) {
                return { allowed: false, code: scheduleCheck.reasonCode, reason: BLOCKED_EXAM_MESSAGE };
            }
            if (!options.ignoreFinished) {
                const alreadyFinished = appData.examResults.some(r => r.studentId === studentObj.studentId && r.examId === examObj.id);
                if (alreadyFinished) {
                    return { allowed: false, code: 'ALREADY_FINISHED', reason: 'Anda sudah menyelesaikan dan mengirim jawaban untuk ujian ini.' };
                }
            }
            return { allowed: true, code: 'OK', exam: examObj };
        }

        async function verifyExamAccessFromFirestore(examId, options = {}) {
            const student = appData.currentUser;
            if (!student || student.role !== 'student' || !student.studentId || !examId) {
                return { allowed: false, code: 'INVALID_CONTEXT', reason: BLOCKED_EXAM_MESSAGE };
            }

            if (!IS_PREVIEW) {
                if (!db || (typeof navigator !== 'undefined' && navigator.onLine === false)) {
                    return { allowed: false, code: 'OFFLINE', reason: BLOCKED_EXAM_MESSAGE };
                }
                try {
                    const examRef = doc(db, 'artifacts', appId, 'public', 'data', 'exams', examId);
                    const examSnap = await withTimeoutPromise(getDoc(examRef), 6000, 'Timeout verifikasi status ujian');

                    if (!examSnap.exists()) {
                        appData.exams = appData.exams.filter(e => e.id !== examId);
                        return { allowed: false, code: 'EXAM_DELETED', reason: BLOCKED_EXAM_MESSAGE };
                    }

                    const freshExam = { ...examSnap.data(), id: examSnap.id };
                    const idx = appData.exams.findIndex(e => e.id === examId);
                    if (idx >= 0) appData.exams[idx] = freshExam;
                    else appData.exams.push(freshExam);

                    const studentRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', student.studentId);
                    const studentSnap = await withTimeoutPromise(getDoc(studentRef), 5000, 'Timeout verifikasi peserta').catch(() => null);
                    if (studentSnap && studentSnap.exists()) {
                        const freshStd = { ...studentSnap.data(), id: studentSnap.id };
                        const sIdx = appData.students.findIndex(s => s.id === student.studentId);
                        if (sIdx >= 0) appData.students[sIdx] = freshStd;
                    }

                    return evaluateExamEligibilityLocal(freshExam, student, options);
                } catch (err) {
                    console.error('verifyExamAccessFromFirestore error:', err);
                    return { allowed: false, code: 'VERIFICATION_ERROR', reason: BLOCKED_EXAM_MESSAGE };
                }
            }

            const localExam = appData.exams.find(e => e.id === examId);
            return evaluateExamEligibilityLocal(localExam, student, options);
        }

        async function persistStudentExamProgressToCloud(examId, statusLabel = 'Dijeda Sementara') {
            const student = appData.currentUser;
            if (!student || !student.studentId || !examId) return;
            const sessionId = `SES_${examId}_${student.studentId}`;
            const sessionPayload = {
                id: sessionId,
                examId: examId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                className: student.className || '6',
                answersSnapshot: JSON.parse(JSON.stringify(currentStudentAnswers || {})),
                doubtfulSnapshot: JSON.parse(JSON.stringify(currentDoubtfulMap || {})),
                remainingSeconds: Math.max(0, Number(remainingSeconds) || 0),
                currentQuestionIndex: Number(currentQuestionIndex) || 0,
                violationCount: Number(currentViolationCount) || 0,
                status: statusLabel,
                updatedAt: new Date().toISOString()
            };
            const existingIdx = appData.examSessions.findIndex(s => s.id === sessionId);
            if (existingIdx >= 0) appData.examSessions[existingIdx] = sessionPayload;
            else appData.examSessions.push(sessionPayload);
            await syncCollectionRecord('examSessions', sessionId, sessionPayload);

            let p = appData.examParticipants.find(x => x.examId === examId && x.studentId === student.studentId);
            if (p && p.status !== 'Selesai') {
                p.status = statusLabel;
                p.violationCount = Number(currentViolationCount) || 0;
                await syncCollectionRecord('examParticipants', p.id, p);
            }
        }

        // --- UTILITAS EXCEL (.XLSX) ---
        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            if (!IS_PREVIEW && db) {
                try {
                    const [stdSnap, exSnap] = await Promise.all([
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'students')),
                        getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'exams'))
                    ]);
                    appData.students = stdSnap.docs.map(d => ({ ...d.data(), id: d.id }));
                    appData.exams = exSnap.docs.map(d => ({ ...d.data(), id: d.id }));
                } catch (e) {
                    console.warn('Refresh login data warning:', e);
                }
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            window.renderStudentPortal();
        };

        window.downloadStudentTemplate = function() {
            const headers = ['NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin (L/P)', 'Kelas (1-6)', 'PIN Login'];
            const defaultSchool = appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG';
            const sampleRows = [
                ['0145678905', '1005', 'Budi Raharjo', defaultSchool, 'L', '6', '123456'],
                ['0145678906', '1006', 'Putri Maharani', defaultSchool, 'P', '6', '123456']
            ];
            window.downloadExcelFile('Template_Impor_Siswa.xlsx', headers, sampleRows);
        };

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Status'];
            const rows = appData.students.map((s, idx) => [
                idx + 1, s.nisn, s.nis || '-', s.fullName, s.asalSekolah || '-', s.gender || 'L', s.className, s.status || 'Aktif'
            ]);
            window.downloadExcelFile('Data_Siswa_CBT.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa.', 'error');
                        return;
                    }
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 3) continue;
                        const nisn = String(cols[0] ?? '').trim();
                        const nis = String(cols[1] ?? '-').trim();
                        const fullName = String(cols[2] ?? '').trim();
                        const asalSekolah = String(cols[3] ?? appData.settings.schoolName).trim();
                        const gender = String(cols[4] ?? 'L').trim().toUpperCase();
                        const className = String(cols[5] ?? '6').trim();
                        const pin = String(cols[6] ?? '123456').trim() || '123456';
                        if (!nisn || !fullName) continue;
                        if (appData.students.some(s => s.nisn === nisn)) continue;

                        const clsObj = appData.classes.find(c => String(c.className) === className) || appData.classes[0];
                        const newStd = {
                            id: 'STD-' + Date.now() + '-' + i,
                            nisn, nis, fullName, asalSekolah,
                            gender: gender === 'P' ? 'P' : 'L',
                            classId: clsObj ? clsObj.id : 'CLS-6',
                            className: clsObj ? clsObj.className : className,
                            academicYear: appData.settings.academicYear,
                            username: nisn,
                            passwordHash: hashCredential(pin),
                            status: 'Aktif'
                        };
                        appData.students.push(newStd);
                        syncCollectionRecord('students', newStd.id, newStd);
                        count++;
                    }
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil menambahkan ${count} data siswa baru.`, 'success');
                });
            };
            fileInput.click();
        };

                    <div><label class="block font-bold text-slate-700 mb-1">Kelas *</label><select id="stdFormClass" class="w-full px-3 py-2 border border-slate-300 rounded-xl">${classOpts || '<option value="6">Kelas 6</option>'}</select></div>

                </div>

            window.showModal(existing ? 'Edit Siswa' : 'Tambah Siswa', '', 'info', (confirmed) => {
                if (!confirmed) return true;
                const asalSekolah = document.getElementById('stdFormSchool').value.trim();

                const clsObj = appData.classes.find(c => c.id === classId);

                    existing.nisn = nisn;
                    existing.nis = nis;
                    existing.fullName = fullName;
                    existing.asalSekolah = asalSekolah;
                    existing.gender = gender;
                    existing.classId = classId;
                    existing.className = className;
                    existing.passwordHash = hashCredential(pin);
                    syncCollectionRecord('students', existing.id, existing);
                } else {
                    const newStd = {
                        id: 'STD-' + Date.now(),
                        nisn, nis, fullName, asalSekolah, gender, classId, className,
                        academicYear: appData.settings.academicYear,
                        username: nisn,
                        passwordHash: hashCredential(pin),
                        status: 'Aktif'
                    };
                    appData.students.push(newStd);
                    syncCollectionRecord('students', newStd.id, newStd);
                }

        window.saveQuestionRecord = async function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const stimulusImage = (document.getElementById('qFormStimulusImg')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const questionImage = (document.getElementById('qFormQuestionImg')?.value || '').trim();
            const rawOptions = [
                document.getElementById('qOptA')?.value || '',
                document.getElementById('qOptB')?.value || '',
                document.getElementById('qOptC')?.value || '',
                document.getElementById('qOptD')?.value || ''
            ];
            const correctAnswerRaw = (document.getElementById('qFormKey')?.value || 'A').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi', 'Teks pertanyaan wajib diisi!', 'error');
                return;
            }

            let options = rawOptions;
            let matchingPairs = undefined;
            let correctAnswer = correctAnswerRaw;

            if (type === 'matching') {
                matchingPairs = [];
                const ansObj = {};
                rawOptions.filter(x => x.trim() !== '').forEach((rp, idx) => {
                    const parts = rp.split('=');
                    const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                    const right = (parts[1] || correctAnswerRaw || `Pasangan ${idx + 1}`).trim();
                    matchingPairs.push({ left, right });
                    ansObj[String(idx)] = right;
                });
                correctAnswer = ansObj;
            }

            const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                ? appData.filters.questionBankId
                : (appData.questionBanks[0]?.id || 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    Object.assign(existing, { orderNum, type, weight, stimulusText, stimulusImage, questionText, questionImage, options, matchingPairs, correctAnswer, explanation });
                    await syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = { id: 'Q-' + Date.now(), bankId, orderNum, type, weight, stimulusText, stimulusImage, questionText, questionImage, options, matchingPairs, correctAnswer, explanation };
                appData.questions.push(newQ);
                await syncCollectionRecord('questions', newQ.id, newQ);
            }

            window.showModal('Tersimpan', 'Butir soal berhasil disimpan ke Bank Soal.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

        function serializeQuestionRowForExcel(q, fallbackNum) {
            const orderNum = Number(q.orderNum) || fallbackNum;
            const type = String(q.type || 'pg').trim();
            const weight = Number(q.weight) || 10;
            const stimulusText = q.stimulusText !== undefined && q.stimulusText !== null ? String(q.stimulusText) : '';
            const stimulusImage = q.stimulusImage !== undefined && q.stimulusImage !== null ? String(q.stimulusImage) : '';
            const questionText = q.questionText !== undefined && q.questionText !== null ? String(q.questionText) : '';
            const questionImage = q.questionImage !== undefined && q.questionImage !== null ? String(q.questionImage) : '';

            let optA = '', optB = '', optC = '', optD = '';
            if (type === 'matching' && Array.isArray(q.matchingPairs) && q.matchingPairs.length > 0) {
                const formattedPairs = q.matchingPairs.map(p => (p && typeof p === 'object') ? `${p.left ?? ''} = ${p.right ?? ''}` : String(p ?? ''));
                optA = formattedPairs[0] || '';
                optB = formattedPairs[1] || '';
                optC = formattedPairs[2] || '';
                optD = formattedPairs[3] || '';
            } else if (Array.isArray(q.options)) {
                optA = q.options[0] !== undefined && q.options[0] !== null ? String(q.options[0]) : '';
                optB = q.options[1] !== undefined && q.options[1] !== null ? String(q.options[1]) : '';
                optC = q.options[2] !== undefined && q.options[2] !== null ? String(q.options[2]) : '';
                optD = q.options[3] !== undefined && q.options[3] !== null ? String(q.options[3]) : '';
            }

            let keyStr = '';
            if (Array.isArray(q.correctAnswer)) {
                keyStr = q.correctAnswer.map(k => String(k ?? '').trim()).filter(Boolean).join(', ');
            } else if (q.correctAnswer && typeof q.correctAnswer === 'object') {
                if (type === 'matching' && Array.isArray(q.matchingPairs) && q.matchingPairs.length > 0) {
                    keyStr = q.matchingPairs.map(p => `${p.left ?? ''}=${p.right ?? ''}`).join('; ');
                } else {
                    const keys = Object.keys(q.correctAnswer).sort((a, b) => Number(a) - Number(b));
                    keyStr = keys.map(k => q.correctAnswer[k]).join(', ');
                }
            } else if (q.correctAnswer !== undefined && q.correctAnswer !== null) {
                keyStr = String(q.correctAnswer);
            }

            const explanation = q.explanation !== undefined && q.explanation !== null ? String(q.explanation) : '';
            return [orderNum, type, weight, stimulusText, stimulusImage, questionText, questionImage, optA, optB, optC, optD, keyStr, explanation];
        }

        window.executeExportQuestionsExcel = function(mode = 'ALL', bankId = '') {
            let questionsToExport = [];
            let packageLabel = 'Semua_Paket_Soal';

            if (mode === 'PACKAGE') {
                if (!bankId) {
                    window.showModal('Pilih Paket Soal', 'Silakan pilih paket bank soal yang ingin diekspor.', 'error');
                    return false;
                }
                const bankObj = appData.questionBanks.find(b => b.id === bankId);
                packageLabel = bankObj && bankObj.title ? bankObj.title : bankId;
                questionsToExport = appData.questions.filter(q => q.bankId === bankId);
            } else {
                questionsToExport = [...appData.questions];
            }

            if (questionsToExport.length === 0) {
                window.showModal('Data Soal Kosong', 'Tidak ada butir soal pada pilihan tersebut untuk diekspor.', 'error');
                return false;
            }

            questionsToExport.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));

            const headers = [
                'No', 'Jenis Soal (pg/pg_complex/true_false/matching/short_answer/essay)', 'Bobot Poin',
                'Teks Stimulus', 'URL Gambar Stimulus', 'Teks Pertanyaan', 'URL Gambar Soal',
                'Opsi A', 'Opsi B', 'Opsi C', 'Opsi D', 'Kunci Jawaban', 'Pembahasan'
            ];

            const rows = questionsToExport.map((q, idx) => serializeQuestionRowForExcel(q, idx + 1));
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const safePkgName = String(packageLabel).replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '') || 'Bank_Soal';
            const filename = `Bank_Soal_${safePkgName}_${dateStr}.xlsx`;

            window.downloadExcelFile(filename, headers, rows);
            logActivity(`Administrator mengekspor ${questionsToExport.length} butir soal (${packageLabel}) ke file ${filename}.`);
            return true;
        };

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, async (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data soal.', 'error');
                        return;
                    }
                    const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                        ? appData.filters.questionBankId
                        : (appData.questionBanks[0]?.id || 'QB-DEFAULT');
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;
                        const qText = String(cols[5] ?? cols[4] ?? '').trim();
                        if (!qText) continue;
                        const rawType = String(cols[1] ?? 'pg').trim().toLowerCase();
                        let type = 'pg';
                        if (rawType === 'pg_complex' || rawType.includes('kompleks') || rawType.includes('complex') || rawType.includes('multi')) type = 'pg_complex';
                        else if (rawType === 'true_false' || rawType.includes('benar') || rawType.includes('true') || rawType === 'bs' || rawType === 'b/s') type = 'true_false';
                        else if (rawType === 'matching' || rawType.includes('jodoh') || rawType.includes('pasangan') || rawType.includes('match')) type = 'matching';
                        else if (rawType === 'short_answer' || rawType.includes('isian') || rawType.includes('singkat') || rawType.includes('short')) type = 'short_answer';
                        else if (rawType === 'essay' || rawType.includes('uraian') || rawType.includes('esai')) type = 'essay';

                        const rawOpts = [
                            String(cols[7] ?? '').trim(),
                            String(cols[8] ?? '').trim(),
                            String(cols[9] ?? '').trim(),
                            String(cols[10] ?? '').trim()
                        ];

                        let matchingPairs = undefined;
                        let correctAnswer = String(cols[11] ?? 'A').trim();

                        if (type === 'matching') {
                            matchingPairs = [];
                            const ansObj = {};
                            rawOpts.filter(Boolean).forEach((rp, idx) => {
                                const parts = rp.split('=');
                                const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                                const right = (parts[1] || `Pasangan ${idx + 1}`).trim();
                                matchingPairs.push({ left, right });
                                ansObj[String(idx)] = right;
                            });
                            correctAnswer = ansObj;
                        }

                        const newQ = {
                            id: 'Q-' + Date.now() + '-' + i,
                            bankId,
                            orderNum: Number(cols[0]) || (count + 1),
                            type,
                            weight: Number(cols[2]) || 10,
                            stimulusText: String(cols[3] ?? '').trim(),
                            stimulusImage: String(cols[4] ?? '').trim(),
                            questionText: qText,
                            questionImage: String(cols[6] ?? '').trim(),
                            options: rawOpts,
                            matchingPairs,
                            correctAnswer,
                            explanation: String(cols[12] ?? '').trim()
                        };
                        appData.questions.push(newQ);
                        await syncCollectionRecord('questions', newQ.id, newQ);
                        count++;
                    }
                    renderQuestionBanksContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil mengimpor ${count} butir soal ke paket Bank Soal.`, 'success');
                });
            };
            fileInput.click();
        };

        function normalizeDateInputToISO(dateVal, fallbackISO) {
            const raw = String(dateVal || '').trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(raw)) {
                const [d, m, y] = raw.split(/[\/\-]/);
                return `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }
            return fallbackISO;
        }

        window.openExamFormModal = function(examId = null) {
            const existing = examId ? appData.exams.find(x => x.id === examId) : null;
            const subOpts = appData.subjects.map(s => `<option value="${s.id}" ${existing && existing.subjectId === s.id ? 'selected' : ''}>${escapeHtml(s.subjectName)}</option>`).join('');

            const bankOpts = appData.questionBanks.map(b => `<option value="${b.id}" ${existing && existing.bankId === b.id ? 'selected' : ''}>${escapeHtml(b.title)}</option>`).join('');

                    <div><label class="block font-bold text-slate-700 mb-1">Kelas Peserta</label><select id="exFormClass" class="w-full px-3 py-2 border border-slate-300 rounded-xl">${clsOpts || '<option value="6">Kelas 6</option>'}</select></div>
                    <div class="sm:col-span-2"><label class="block font-bold text-slate-700 mb-1">Paket Bank Soal</label><select id="exFormBank" class="w-full px-3 py-2 border border-slate-300 rounded-xl">${bankOpts}</select></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Durasi (Menit) *</label><input type="number" id="exFormDuration" value="${existing ? existing.durationMinutes : 60}" class="w-full px-3 py-2 border border-slate-300 rounded-xl"></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Token Ujian *</label><input type="text" id="exFormToken" value="${escapeHtml(existing ? existing.token : 'UJIAN4A')}" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono uppercase"></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Tanggal Mulai</label><input type="date" id="exFormStartDate" value="${escapeHtml(startDateISO)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl"></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Tanggal Selesai</label><input type="date" id="exFormEndDate" value="${escapeHtml(endDateISO)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl"></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Jam Mulai (WIB)</label><input type="time" id="exFormStartTime" value="${escapeHtml(existing ? existing.startTime : '07:00')}" class="w-full px-3 py-2 border border-slate-300 rounded-xl"></div>
                    <div><label class="block font-bold text-slate-700 mb-1">Jam Selesai (WIB)</label><input type="time" id="exFormEndTime" value="${escapeHtml(existing ? existing.endTime : '23:59')}" class="w-full px-3 py-2 border border-slate-300 rounded-xl"></div>
                </div>
            `;

            window.showModal(existing ? 'Edit Paket Ujian' : 'Buat Paket Ujian Baru', '', 'info', async (confirmed) => {
                if (!confirmed) return true;
                const examName = document.getElementById('exFormName').value.trim();
                const subjectId = document.getElementById('exFormSubject').value;
                const classId = document.getElementById('exFormClass').value;
                const bankId = document.getElementById('exFormBank').value;
                const durationMinutes = Number(document.getElementById('exFormDuration').value) || 60;
                const token = document.getElementById('exFormToken').value.trim().toUpperCase() || 'UJIAN4A';
                const startDate = document.getElementById('exFormStartDate').value || '2026-11-04';
                const endDate = document.getElementById('exFormEndDate').value || '2026-12-04';
                const startTime = document.getElementById('exFormStartTime').value || '07:00';
                const endTime = document.getElementById('exFormEndTime').value || '23:59';

                if (!examName) {
                    window.showModal('Validasi Ujian', 'Nama ujian wajib diisi!', 'error');
                    return false;
                }

                const matchedQuestions = appData.questions.filter(q => q.bankId === bankId).map(q => q.id);
                const questionIds = matchedQuestions.length > 0 ? matchedQuestions : appData.questions.map(q => q.id);

                        durationMinutes, token, status: 'Aktif',
                        questionIds, partialScoring: true, isPublished: true,
                        updatedAt: new Date().toISOString()
                    };
                    appData.exams.push(newEx);
                    await syncCollectionRecord('exams', newEx.id, newEx);
                }
                renderExamsContent(document.getElementById('adminMainContent'));
                return true;
            }, { html, okText: 'Simpan Ujian', wide: true });

        window.toggleExamStatus = async function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;

            const btn = document.getElementById(`btnToggleExam_${examId}`);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Menyimpan...';
            }

            const prevStatus = ex.status;
            const nextStatus = isExamStrictlyActive(ex) ? 'Ditutup' : 'Aktif';
            ex.status = nextStatus;
            ex.updatedAt = new Date().toISOString();

            const synced = await syncCollectionRecord('exams', ex.id, ex);
            if (!synced) {
                ex.status = prevStatus;
                window.showModal('Gagal Menyimpan Status', 'Perubahan status ujian gagal disimpan ke server Firebase. Periksa koneksi internet Anda.', 'error');
            } else {
                logActivity(`Administrator mengubah status ujian "${ex.examName}" menjadi ${nextStatus}.`);
            }
            renderExamsContent(document.getElementById('adminMainContent'));
        };

        window.deleteExamRecord = function(examId) {
            window.showModal('Hapus Paket Ujian', 'Yakin ingin menghapus paket ujian ini secara permanen?', 'error', async (confirmed) => {
                if (confirmed) {
                    appData.exams = appData.exams.filter(x => x.id !== examId);
                    await syncCollectionRecord('exams', examId, null, true);
                    renderExamsContent(document.getElementById('adminMainContent'));
                }
                return true;
            }, { showCancel: true, okText: 'Hapus' });
        };

                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        window.regenerateExamToken = async function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newToken = '';
            for (let i = 0; i < 6; i++) newToken += chars.charAt(Math.floor(Math.random() * chars.length));
            ex.token = newToken;
            await syncCollectionRecord('exams', ex.id, ex);
            logActivity(`Token ujian ${ex.examName} diperbarui menjadi ${newToken}.`);
            renderSchedulesContent(document.getElementById('adminMainContent'));
        };

        // --- 9. PESERTA UJIAN ---

            const activeExamId = (appData.filters.participantExam && appData.filters.participantExam !== 'ALL')
                ? appData.filters.participantExam
                : (appData.exams[0]?.id || '');

            const rows = appData.students.map((s, idx) => {
                const res = appData.examResults.find(r => r.studentId === s.id && (!activeExamId || r.examId === activeExamId));
                const part = appData.examParticipants.find(p => p.studentId === s.id && (!activeExamId || p.examId === activeExamId));
                const status = res ? 'Selesai' : (part?.status || 'Belum Mulai');
                const violations = res?.violationCount ?? part?.violationCount ?? 0;
                return `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">

                        <td class="px-4 py-3 text-xs"><span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${status === 'Selesai' ? 'bg-emerald-50 text-emerald-700' : status === 'Sedang Mengerjakan' ? 'bg-blue-50 text-blue-700' : 'bg-amber-50 text-amber-700'}">${escapeHtml(status)}</span></td>
                        <td class="px-4 py-3 text-xs font-bold">${violations}x</td>
                        <td class="px-4 py-3 text-xs whitespace-nowrap">
                            <button type="button" onclick="window.resetStudentExamSession('${s.id}', '${escapeHtml(activeExamId)}')" class="px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-bold text-xs"><i class="fa-solid fa-rotate-left mr-1"></i> Reset Sesi</button>

                        <div>
                            <h3 class="font-bold text-sm text-slate-800">Pemantauan Peserta Ujian & Reset Sesi</h3>

                                ${examOptions || '<option value="">Belum Ada Paket</option>'}
                            </select>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                        <div class="table-responsive-wrapper">
                            <table class="w-full text-left border-collapse min-w-[750px]">
                                <thead><tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase"><th class="px-4 py-3">No</th><th class="px-4 py-3">NISN</th><th class="px-4 py-3">Nama Peserta</th><th class="px-4 py-3">Asal Sekolah</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Pelanggaran</th><th class="px-4 py-3">Aksi</th></tr></thead>
                                <tbody>${rows || '<tr><td colspan="8" class="px-4 py-6 text-center text-xs text-slate-400">Belum ada peserta.</td></tr>'}</tbody>
                            </table>
                        </div>

        }

        window.filterParticipantExam = function(examId) {
            appData.filters.participantExam = examId;
            renderParticipantsContent(document.getElementById('adminMainContent'));
        };

        window.resetStudentExamSession = async function(studentId, examId = '') {
            const toRemove = appData.examResults.filter(r => r.studentId === studentId && (!examId || r.examId === examId));
            for (const r of toRemove) {
                await syncCollectionRecord('examResults', r.resultId || r.id, null, true);
            }
            appData.examResults = appData.examResults.filter(r => !(r.studentId === studentId && (!examId || r.examId === examId)));
            const part = appData.examParticipants.find(p => p.studentId === studentId && (!examId || p.examId === examId));
            if (part) {
                part.status = 'Belum Mulai';
                part.violationCount = 0;
                await syncCollectionRecord('examParticipants', part.id, part);
            }
            if (examId) {
                await syncCollectionRecord('examSessions', `SES_${examId}_${studentId}`, null, true);
            }
            renderParticipantsContent(document.getElementById('adminMainContent'));
            window.showModal('Reset Berhasil', 'Sesi ujian siswa telah direset.', 'success');
        };

        // --- 10. HASIL & KOREKSI + CETAK REKAP A4 ---
        function resolveResultRecordDetails(r) {
            const stdObj = appData.students.find(s =>
                (r.studentId && s.id === r.studentId) ||
                (r.nisn && String(s.nisn).trim() === String(r.nisn).trim()) ||
                (r.studentName && String(s.fullName || '').trim().toLowerCase() === String(r.studentName || '').trim().toLowerCase())
            );
            const examObj = appData.exams.find(e =>
                (r.examId && e.id === r.examId) ||
                (r.examName && String(e.examName || '').trim().toLowerCase() === String(r.examName || '').trim().toLowerCase())
            ) || appData.exams[0] || null;

            const classId = r.classId || stdObj?.classId || examObj?.classId || '';
            const clsObj = appData.classes.find(c => c.id === classId || String(c.className).trim() === String(r.className || stdObj?.className || '').trim());
            const className = clsObj ? clsObj.className : (r.className || stdObj?.className || getClassNameById(classId) || '-');

            const subjectId = r.subjectId || examObj?.subjectId || '';
            const subjectName = subjectId ? getSubjectNameById(subjectId) : (appData.subjects[0]?.subjectName || '-');

            const nisn = r.nisn || stdObj?.nisn || '-';
            const studentName = r.studentName || stdObj?.fullName || '-';
            const schoolDisplay = (stdObj && stdObj.asalSekolah) ? stdObj.asalSekolah : (r.asalSekolah || '-');
            const examName = r.examName || examObj?.examName || '-';
            const finalScore = Number(r.finalScore ?? 0);
            const essayGradingStatus = r.essayGradingStatus || 'Sudah Dinilai';

            return {
                raw: r, stdObj, examObj,
                examId: examObj ? examObj.id : (r.examId || ''),
                classId: clsObj ? clsObj.id : classId,
                nisn, studentName, schoolDisplay, className, examName, subjectName, finalScore, essayGradingStatus
            };
        }

        function getFilteredResultsList() {
            const filterExam = appData.filters.resultExam || 'ALL';
            const filterClass = appData.filters.resultClass || 'ALL';

            return appData.examResults
                .map(r => resolveResultRecordDetails(r))
                .filter(item => {
                    const matchExam = filterExam === 'ALL' || item.examId === filterExam || item.raw.examId === filterExam;
                    const matchClass = filterClass === 'ALL' || item.classId === filterClass || String(item.className) === String(filterClass) || String(getClassNameById(filterClass)) === String(item.className);
                    return matchExam && matchClass;
                });
        }

        window.filterResultsView = function(examVal, classVal) {
            if (examVal !== null) appData.filters.resultExam = examVal;
            if (classVal !== null) appData.filters.resultClass = classVal;
            renderResultsContent(document.getElementById('adminMainContent'));
        };

            const classFilterOpts = appData.classes.map(c => `<option value="${escapeHtml(c.id)}" ${filterClass === c.id ? 'selected' : ''}>Kelas ${escapeHtml(c.className)}</option>`).join('');

            const rows = resolvedList.map((item, idx) => `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="px-4 py-3 text-xs text-slate-500">${idx + 1}</td>
                    <td class="px-4 py-3 text-xs font-mono">${escapeHtml(item.nisn)}</td>

            const avgScore = resolvedList.length > 0
                ? (resolvedList.reduce((acc, cur) => acc + (Number(cur.finalScore) || 0), 0) / resolvedList.length).toFixed(2)

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap justify-between items-center gap-3">

        window.openEssayGradingModal = function(resultId) {
            const res = appData.examResults.find(r => (r.resultId || r.id) === resultId);
            if (!res) return;
            const essayQuestions = appData.questions.filter(q => q.type === 'essay');
            const q = essayQuestions[0] || appData.questions[appData.questions.length - 1];
            const studentAns = (res.answersSnapshot && q) ? (res.answersSnapshot[q.id] || '(Tidak dijawab)') : '(Tidak dijawab)';
            const currentScore = (res.essayScores && q) ? (res.essayScores[q.id] || 0) : 0;

            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <p class="font-bold text-slate-700">Siswa: ${escapeHtml(res.studentName)} (Kelas ${escapeHtml(res.className)})</p>
                        <p class="text-slate-500 mt-1">Pertanyaan: ${escapeHtml(q ? q.questionText : 'Soal Uraian')}</p>
                        <p class="mt-2 p-2 bg-white rounded border border-slate-200 font-semibold text-slate-800">Jawaban Siswa: "${escapeHtml(studentAns)}"</p>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Skor Uraian (Maksimal ${q ? q.weight : 25} Poin)</label>
                        <input type="number" id="essayGradeScoreInput" value="${currentScore}" min="0" max="${q ? q.weight : 25}" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold">
                    </div>
                </div>
            `;

            window.showModal('Koreksi & Penilaian Soal Uraian', '', 'info', async (confirmed) => {
                if (!confirmed) return true;
                const givenScore = Number(document.getElementById('essayGradeScoreInput').value) || 0;
                if (q) {
                    const prevScore = (res.essayScores && res.essayScores[q.id]) ? Number(res.essayScores[q.id]) : 0;
                    if (!res.essayScores) res.essayScores = {};
                    res.essayScores[q.id] = givenScore;
                    res.totalScoreObtained = Math.max(0, (res.totalScoreObtained - prevScore) + givenScore);
                    res.finalScore = Math.min(100, Math.round((res.totalScoreObtained / (res.maxPossibleScore || 100)) * 100));
                }
                res.essayGradingStatus = 'Sudah Dinilai';
                await syncCollectionRecord('examResults', res.resultId || res.id, res);
                renderResultsContent(document.getElementById('adminMainContent'));
                return true;
            }, { html, showCancel: true, okText: 'Simpan Nilai Uraian' });
        };

        window.previewLogoFile = async function(input) {
            const notice = document.getElementById('logoStatusNotice');
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];

            if (!['image/png', 'image/jpeg', 'image/jpg'].includes(file.type)) {
                window.showModal('Format Tidak Didukung', 'Harap pilih file gambar berformat PNG, JPG, atau JPEG.', 'error');
                input.value = '';
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                window.showModal('Ukuran File Terlalu Besar', 'Ukuran file logo maksimal 2MB.', 'error');
                input.value = '';
                return;
            }

            try {
                const processed = await compressAndConvertImage(file, 240, 240, 0.88);
                pendingLogoFile = processed.blob;
                pendingLogoDataUrl = processed.dataUrl;
                const img = document.getElementById('logoPreviewImg');
                if (img) img.src = pendingLogoDataUrl;
                if (notice) {
                    notice.className = 'p-3 rounded-xl text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200';
                    notice.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i> Pratinjau logo siap. Klik tombol <strong>Simpan Logo</strong> untuk menyimpan ke Cloud.';
                    notice.classList.remove('hidden');
                }
            } catch (err) {
                window.showModal('Gagal Memproses Gambar', err.message || 'File gambar tidak dapat diproses.', 'error');
            }
        };

        window.saveLogoToCloud = async function() {
            if (isUploadingLogo) return;
            if (!pendingLogoDataUrl) {
                window.showModal('Pilih Logo Terlebih Dahulu', 'Silakan klik tombol "Ganti Logo" dan pilih file gambar dari perangkat Anda sebelum menekan Simpan Logo.', 'error');
                return;
            }

            const btn = document.getElementById('btnSaveLogo');
            const notice = document.getElementById('logoStatusNotice');
            const previousLogo = appData.settings.schoolLogo;
            isUploadingLogo = true;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Menyimpan...';
            }

            try {
                if (!auth?.currentUser && auth) {
                    try { await withTimeoutPromise(signInAnonymously(auth), 4000, 'Timeout login anonim'); } catch (e) {}
                }

                let finalLogoUrl = pendingLogoDataUrl;
                if (storage && pendingLogoFile && !IS_PREVIEW) {
                    try {
                        const ext = pendingLogoFile.type === 'image/png' ? 'png' : 'jpg';
                        const fileRef = storageRef(storage, `artifacts/${appId}/public/branding/school_logo_${Date.now()}.${ext}`);
                        const snap = await withTimeoutPromise(
                            uploadBytes(fileRef, pendingLogoFile, { contentType: pendingLogoFile.type || 'image/png' }),
                            5500,
                            'Waktu unggah Firebase Storage habis'
                        );
                        finalLogoUrl = await withTimeoutPromise(getDownloadURL(snap.ref), 4000, 'Timeout mengambil URL');
                    } catch (storageErr) {
                        finalLogoUrl = pendingLogoDataUrl;
                    }
                }

                const updatedSettings = {
                    ...appData.settings,
                    schoolLogo: finalLogoUrl,
                    updatedAt: new Date().toISOString()
                };

                const savedOk = await withTimeoutPromise(
                    syncCollectionRecord('appSettings', 'global', updatedSettings),
                    7000,
                    'Waktu penyimpanan ke Firestore habis.'
                );

                if (!savedOk) {
                    throw new Error('Gagal menulis URL logo ke dokumen Firestore.');
                }

                appData.settings.schoolLogo = finalLogoUrl;
                updateFaviconAndLogo(finalLogoUrl);
                const sidebarLogo = document.getElementById('sidebarSchoolLogo');
                if (sidebarLogo) sidebarLogo.src = finalLogoUrl;
                const previewImg = document.getElementById('logoPreviewImg');
                if (previewImg) previewImg.src = finalLogoUrl;

                pendingLogoFile = null;
                pendingLogoDataUrl = null;

                if (notice) {
                    notice.className = 'p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200';
                    notice.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Logo berhasil disimpan secara online dan disinkronkan ke semua perangkat!';
                    notice.classList.remove('hidden');
                }
                logActivity('Administrator memperbarui logo identitas visual sekolah.');
                window.showModal('Logo Berhasil Disimpan', 'Logo sekolah berhasil disimpan ke Cloud dan diterapkan di seluruh halaman aplikasi.', 'success');
            } catch (err) {
                appData.settings.schoolLogo = previousLogo;
                const previewImg = document.getElementById('logoPreviewImg');
                if (previewImg) previewImg.src = previousLogo;
                window.showModal('Gagal Menyimpan Logo', `Penyimpanan gagal: ${err.message || 'Periksa koneksi.'}. Logo lama tetap dipertahankan.`, 'error');
            } finally {
                isUploadingLogo = false;
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Simpan Logo';
                }
            }
        };

        // --- PORTAL UJIAN SISWA (PENAMPILAN & VALIDASI KETAT REAL-TIME) ---

                            </span>
                            <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-power-off mr-1"></i> Keluar</button>
