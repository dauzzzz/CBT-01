        function getTodayIsoWIB() {
            const now = new Date(Date.now() + (7 * 3600 * 1000));
            return now.toISOString().slice(0, 10);
        }

        function formatIsoToDDMMYYYY(isoStr) {
            if (!isoStr) return '';
            const clean = String(isoStr).trim();
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                return `${p[0].padStart(2, '0')}/${p[1].padStart(2, '0')}/${p[2]}`;
            }
            const parts = clean.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
            }
            return clean;
        }

        function parseDDMMYYYYToIso(valStr) {
            if (!valStr) return '';
            const clean = String(valStr).trim();
            if (/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                const yyyy = p[0];
                const mm = p[1].padStart(2, '0');
                const dd = p[2].padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }
            if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(clean)) {
                const p = clean.split(/[\/\-]/);
                const dd = p[0].padStart(2, '0');
                const mm = p[1].padStart(2, '0');
                const yyyy = p[2];
                return `${yyyy}-${mm}-${dd}`;
            }
            return '';
        }

        function normalizeTimeHHMM(valStr, fallback = '07:00') {
            if (!valStr) return fallback;
            const clean = String(valStr).trim().replace(/\./g, ':');
            const m = clean.match(/^(\d{1,2}):(\d{1,2})/);
            if (!m) return fallback;
            const hh = Math.min(23, Math.max(0, Number(m[1]) || 0));
            const mm = Math.min(59, Math.max(0, Number(m[2]) || 0));
            return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
        }

        window.syncDateDisplayFromPicker = function(pickerEl, textInputId) {
            const txtEl = document.getElementById(textInputId);
            if (txtEl && pickerEl.value) {
                txtEl.value = formatIsoToDDMMYYYY(pickerEl.value);
            }
        };

        window.syncDatePickerFromDisplay = function(textEl, pickerId) {
            let v = textEl.value.replace(/[^0-9/]/g, '');
            if (v.length === 2 && !v.includes('/')) v += '/';
            else if (v.length === 5 && v.split('/').length === 2) v += '/';
            textEl.value = v.slice(0, 10);
            const iso = parseDDMMYYYYToIso(textEl.value);
            const pickerEl = document.getElementById(pickerId);
            if (pickerEl && iso) {
                pickerEl.value = iso;
            }
        };

            let v = textEl.value.replace(/[^0-9:]/g, '');
            if (v.length === 2 && !v.includes(':')) v += ':';
            textEl.value = v.slice(0, 5);

        function isExamStrictlyActive(exam) {
            if (!exam) return false;
            return String(exam.status || '').trim().toLowerCase() === 'aktif';
        }

        function isExamMatchingStudentClass(exam, student) {
            if (!exam || !student) return false;
            if (!exam.classId || exam.classId === 'ALL') return true;
            const examClassName = String(getClassNameById(exam.classId) || '').trim().toLowerCase();
            const studentClassName = String(student.className || getClassNameById(student.classId) || '').trim().toLowerCase();
            return (
                exam.classId === student.classId ||
                exam.classId === student.className ||
                (examClassName !== '' && examClassName === studentClassName)
            );
        }

        function checkExamScheduleAccess(exam) {
            if (!exam) return { allowed: false, state: 'INVALID', message: 'Data ujian tidak ditemukan.' };
            const todayIso = getTodayIsoWIB();
            const startIso = parseDDMMYYYYToIso(exam.startDate) || todayIso;
            const endIso = parseDDMMYYYYToIso(exam.endDate) || todayIso;
            const startTime = normalizeTimeHHMM(exam.startTime, '00:00');
            const endTime = normalizeTimeHHMM(exam.endTime, '23:59');

            const startParts = startIso.split('-').map(Number);
            const endParts = endIso.split('-').map(Number);
            const startT = startTime.split(':').map(Number);
            const endT = endTime.split(':').map(Number);

            // Hitung timestamp absolut dalam zona waktu WIB (UTC+7) tanpa bergantung pada timezone lokal browser
            const startMs = Date.UTC(startParts[0], startParts[1] - 1, startParts[2], startT[0] - 7, startT[1], 0, 0);
            const endMs = Date.UTC(endParts[0], endParts[1] - 1, endParts[2], endT[0] - 7, endT[1], 59, 999);
            const nowMs = Date.now();

            if (!isNaN(startMs) && nowMs < startMs) {
                return {
                    allowed: false,
                    state: 'UPCOMING',
                    message: `Ujian belum dimulai. Jadwal mulai: ${formatIsoToDDMMYYYY(startIso)} pukul ${startTime} WIB.`
                };
            }
            if (!isNaN(endMs) && nowMs > endMs) {
                return {
                    allowed: false,
                    state: 'EXPIRED',
                    message: `Waktu pelaksanaan ujian telah berakhir pada ${formatIsoToDDMMYYYY(endIso)} pukul ${endTime} WIB.`
                };
            }
            return { allowed: true, state: 'ONGOING', message: '' };
        }

        function isExamEligibleForStudent(exam, student) {
            if (!exam || !student) return false;
            if (!isExamStrictlyActive(exam)) return false;
            if (!isExamMatchingStudentClass(exam, student)) return false;
            if (!checkExamScheduleAccess(exam).allowed) return false;
            return true;
        }

        async function verifyExamEligibilityFromServer(examId, student) {
            const blockedMsg = 'Ujian ini sudah ditutup atau melewati jadwal pelaksanaan. Silakan hubungi administrator sekolah.';
            if (!examId || !student) return { allowed: false, message: blockedMsg };
            let targetExam = appData.exams.find(e => e.id === examId) || null;
            if (!IS_PREVIEW && db) {
                const cloudExam = await fetchSingleFirestoreDoc('exams', examId);
                if (!cloudExam) {
                    appData.exams = appData.exams.filter(e => e.id !== examId);
                    return { allowed: false, message: blockedMsg };
                }
                targetExam = cloudExam;
                const idx = appData.exams.findIndex(e => e.id === examId);
                if (idx !== -1) appData.exams[idx] = cloudExam;
                else appData.exams.push(cloudExam);
            }
            if (!targetExam || !isExamStrictlyActive(targetExam)) {
                return { allowed: false, message: blockedMsg };
            }
            if (!isExamMatchingStudentClass(targetExam, student)) {
                return { allowed: false, message: 'Ujian ini tidak diperuntukkan bagi kelas Anda.' };
            }
            const sched = checkExamScheduleAccess(targetExam);
            if (!sched.allowed) {
                return { allowed: false, message: sched.message || blockedMsg };
            }
            return { allowed: true, exam: targetExam };
        }

        window.deleteExamRecord = function(examId) {
            window.showModal('Hapus Paket Ujian', 'Yakin ingin menghapus paket ujian ini beserta riwayat sesi dan hasil nilainya?', 'error', async (confirmed) => {
                if (confirmed) {
                    appData.exams = appData.exams.filter(x => x.id !== examId);
                    await syncCollectionRecord('exams', examId, null, true);

                    // Hapus juga riwayat examResults, examSessions, dan examParticipants milik paket ujian yang dihapus agar tidak menyisakan data yatim
                    const orphanedRes = appData.examResults.filter(r => r.examId === examId);
                    for (const r of orphanedRes) {
                        await syncCollectionRecord('examResults', r.id || r.resultId, null, true);
                    }
                    appData.examResults = appData.examResults.filter(r => r.examId !== examId);

                    const orphanedSess = appData.examSessions.filter(s => s.examId === examId);
                    for (const s of orphanedSess) {
                        await syncCollectionRecord('examSessions', s.id, null, true);
                    }
                    appData.examSessions = appData.examSessions.filter(s => s.examId !== examId);

                    const orphanedParts = appData.examParticipants.filter(p => p.examId === examId);
                    for (const p of orphanedParts) {
                        await syncCollectionRecord('examParticipants', p.id, null, true);
                    }
                    appData.examParticipants = appData.examParticipants.filter(p => p.examId !== examId);

                    if (appData.filters.resultExam === examId) appData.filters.resultExam = 'ALL';
                    if (appData.filters.analysisExam === examId) appData.filters.analysisExam = 'ALL';
                    if (appData.filters.participantExam === examId) appData.filters.participantExam = 'ALL';

                    renderExamsContent(document.getElementById('adminMainContent'));
                }
            }, { showCancel: true, okText: 'Hapus Paket & Riwayat' });
        };

        window.deleteSingleExamResult = function(resultKey) {
            if (!resultKey) return;
            const target = appData.examResults.find(r => (r.resultId || r.id) === resultKey);
            const studentLabel = target ? `${target.studentName} (${target.examName || 'Ujian'})` : resultKey;
            window.showModal(
                'Hapus Riwayat Nilai',
                `Apakah Anda yakin ingin menghapus data riwayat nilai "${studentLabel}" dari daftar Hasil & Koreksi?`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    selectedResultIds.delete(resultKey);
                    if (target) {
                        const sessId = getSessionDocId(target.examId, target.studentId);
                        await syncCollectionRecord('examSessions', sessId, null, true);
                        appData.examSessions = appData.examSessions.filter(s => s.id !== sessId);
                    }
                    await syncCollectionRecord('examResults', resultKey, null, true);
                    appData.examResults = appData.examResults.filter(r => (r.resultId || r.id) !== resultKey);
                    renderResultsContent(document.getElementById('adminMainContent'));
                    return true;
                },
                { showCancel: true, okText: 'Ya, Hapus Nilai' }
            );

        window.deleteSelectedExamResults = function() {
            const idsToDelete = Array.from(selectedResultIds);
            if (idsToDelete.length === 0) return;
            window.showModal(
                'Hapus Riwayat Nilai Terpilih',
                `Apakah Anda yakin ingin menghapus ${idsToDelete.length} riwayat nilai ujian yang dicentang secara bersamaan?`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    const idSet = new Set(idsToDelete);
                    const targets = appData.examResults.filter(r => idSet.has(r.resultId || r.id));
                    for (const t of targets) {
                        const rKey = t.resultId || t.id;
                        const sessId = getSessionDocId(t.examId, t.studentId);
                        await syncCollectionRecord('examSessions', sessId, null, true);
                        await syncCollectionRecord('examResults', rKey, null, true);
                    }
                    appData.examResults = appData.examResults.filter(r => !idSet.has(r.resultId || r.id));
                    selectedResultIds.clear();
                    renderResultsContent(document.getElementById('adminMainContent'));
                    window.showModal('Berhasil Dihapus', `${idsToDelete.length} riwayat nilai berhasil dihapus.`, 'success');
                    return true;
                },
                { showCancel: true, okText: `Ya, Hapus ${idsToDelete.length} Nilai` }
            );
        };

        window.deleteAllFilteredExamResults = function() {
            const filterExamId = appData.filters.resultExam || 'ALL';
            const filteredResults = getValidExamResults(filterExamId);
            if (filteredResults.length === 0) return;

            window.showModal(
                'Bersihkan Riwayat Nilai Ujian',
                `Apakah Anda yakin ingin menghapus seluruh (${filteredResults.length}) riwayat nilai yang tampil pada daftar ini?`,
                'error',
                async (confirmed) => {
                    if (!confirmed) return true;
                    for (const t of filteredResults) {
                        const rKey = t.resultId || t.id;
                        const sessId = getSessionDocId(t.examId, t.studentId);
                        await syncCollectionRecord('examSessions', sessId, null, true);
                        await syncCollectionRecord('examResults', rKey, null, true);
                        selectedResultIds.delete(rKey);
                    }
                    const delSet = new Set(filteredResults.map(r => r.resultId || r.id));
                    appData.examResults = appData.examResults.filter(r => !delSet.has(r.resultId || r.id));
                    await cleanupOrphanedResultsAndSessionsInCloud();
                    renderResultsContent(document.getElementById('adminMainContent'));
                    window.showModal('Riwayat Dibersihkan', 'Seluruh riwayat nilai pada daftar ini telah berhasil dibersihkan.', 'success');
                    return true;
                },
                { showCancel: true, okText: `Ya, Bersihkan (${filteredResults.length} Hasil)` }
            );
        };

        function autoFinalizeExpiredSessions() {
            const nowMs = Date.now();
            let addedCount = 0;

            appData.examSessions.forEach(sess => {
                if (sess.status === 'IN_PROGRESS') {
                    const ex = appData.exams.find(e => e.id === sess.examId);
                    // Hanya proses jika paket ujiannya masih benar-benar ada di Manajemen Ujian
                    if (!ex) return;

                    // Hanya proses jika siswa benar-benar memiliki jawaban yang dikerjakan (bukan sesi kosong)
                    const studentAns = sess.answers || {};
                    const answeredKeys = Object.keys(studentAns).filter(k => isQuestionAnswered(studentAns[k]));
                    if (answeredKeys.length === 0) return;

                    const isTimeUp = sess.endTimeMs && nowMs >= sess.endTimeMs;
                    const isExamClosedOrExpired = !isExamStrictlyActive(ex) || checkExamScheduleAccess(ex).state === 'EXPIRED';

                    if (isTimeUp || isExamClosedOrExpired) {
                        const existingRes = appData.examResults.find(r => r.studentId === sess.studentId && r.examId === sess.examId);
                        if (!existingRes) {
                            let qList = [];
                            if (Array.isArray(ex.questionIds) && ex.questionIds.length > 0) {
                                qList = ex.questionIds.map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
                            }
                            if (qList.length === 0 && ex.bankId) {
                                qList = appData.questions.filter(q => q.bankId === ex.bankId);
                            }
                            if (qList.length === 0) return;

                            const calc = window.calculateExamSubmissionScore(qList, studentAns, {});

                            const resultObj = {
                                resultId: 'RES-' + sess.studentId + '-' + sess.examId,
                                examId: sess.examId,
                                examName: ex.examName,
                                subjectId: ex.subjectId || sess.subjectId || '',
                                studentId: sess.studentId,
                                nisn: sess.nisn,
                                studentName: sess.studentName,
                                classId: sess.classId || '',
                                className: sess.className || '4',
                                submittedAt: new Date().toLocaleString('id-ID') + ' (Auto-Submit Waktu Habis)',
                                totalScoreObtained: calc.totalScoreObtained,
                                maxPossibleScore: calc.maxPossibleScore || 100,
                                finalScore: calc.finalScore,
                                correctCount: calc.correctCount,
                                wrongCount: calc.wrongCount,
                                emptyCount: calc.emptyCount,
                                violationCount: sess.violationCount || 0,
                                essayGradingStatus: calc.hasEssayQuestion ? 'Belum Dinilai' : 'Sudah Dinilai',
                                essayScores: calc.essayScores,
                                answersSnapshot: studentAns
                            };

                            appData.examResults.push(resultObj);
                            syncCollectionRecord('examResults', resultObj.resultId, resultObj);

                            sess.status = 'SUBMITTED';
                            syncCollectionRecord('examSessions', sess.id, sess);
                            addedCount++;
                        }
                    }
                }
            });

            if (addedCount > 0) {
                logActivity(`Sistem otomatis menarik dan menyelesaikan ${addedCount} sesi siswa yang kehabisan waktu.`);
            }
        }

        window.renderAndTriggerPrint = function(fullHtmlDoc, bodyContentOnly, docTitle = 'Cetak Laporan CBT') {
            window._lastPrintFullHtml = fullHtmlDoc;
            window._lastPrintBodyHtml = bodyContentOnly;
            window._lastPrintTitle = docTitle;

            // 1. Pasang ke #printableArea sebagai fallback @media print langsung di halaman utama
            const printableEl = document.getElementById('printableArea');
            if (printableEl) {
                printableEl.innerHTML = bodyContentOnly;
            }

            // 2. Siapkan hidden iframe khusus cetak agar dialog print selalu memiliki DOM lengkap (anti layar kosong)
            let printFrame = document.getElementById('cbtPrintFrame');
            if (!printFrame) {
                printFrame = document.createElement('iframe');
                printFrame.id = 'cbtPrintFrame';
                printFrame.style.position = 'fixed';
                printFrame.style.right = '0';
                printFrame.style.bottom = '0';
                printFrame.style.width = '0';
                printFrame.style.height = '0';
                printFrame.style.border = '0';
                document.body.appendChild(printFrame);
            }

            const frameDoc = printFrame.contentWindow || printFrame.contentDocument;
            const targetDoc = frameDoc.document || frameDoc;
            targetDoc.open();
            targetDoc.write(fullHtmlDoc);
            targetDoc.close();

            // 3. Tampilkan Pratinjau Cetak Interaktif di dalam Modal Aplikasi + Tombol Cetak Langsung & Tab Baru
            const previewHtml = `
                <div class="space-y-3 text-xs">
                    <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-2xl flex flex-wrap items-center justify-between gap-2">
                        <div class="text-indigo-900">

                            <p class="text-[11px] text-indigo-700 mt-0.5">Dialog cetak otomatis dibuka. Anda juga dapat menekan tombol di kanan untuk mencetak ulang atau membuka di tab baru.</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button type="button" onclick="window.triggerIframePrintNow()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-extrabold text-xs shadow-sm transition cursor-pointer">
                                <i class="fa-solid fa-print mr-1"></i> Cetak Sekarang / Simpan PDF
                            </button>
                            <button type="button" onclick="window.openPrintInNewTabNow()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-xs shadow-sm transition cursor-pointer">
                                <i class="fa-solid fa-up-right-from-square mr-1"></i> Cetak via Tab Baru
                            </button>
                        </div>
                    </div>
                    <div class="border border-slate-300 rounded-2xl bg-white p-4 sm:p-6 max-h-[62vh] overflow-y-auto custom-scrollbar shadow-inner">
                        ${bodyContentOnly}
                    </div>
                </div>
            `;

            window.showModal(docTitle, '', 'info', null, {
                html: previewHtml,
                wide: true,
                okText: 'Tutup Pratinjau'
            });

            setTimeout(() => {
                window.triggerIframePrintNow();
            }, 350);
        };

        window.triggerIframePrintNow = function() {
            try {
                const printFrame = document.getElementById('cbtPrintFrame');
                if (printFrame && printFrame.contentWindow) {
                    printFrame.contentWindow.focus();
                    printFrame.contentWindow.print();
                    return;
                }
            } catch (e) {
                console.warn('Iframe print fallback:', e);
            }
            const printableEl = document.getElementById('printableArea');
            if (printableEl) {
                printableEl.classList.remove('hidden');
                window.print();
                setTimeout(() => printableEl.classList.add('hidden'), 1000);
            }
        };

        window.openPrintInNewTabNow = function() {
            if (!window._lastPrintFullHtml) return;
            const printWin = window.open('', '_blank');
            if (!printWin) {
                window.triggerIframePrintNow();
                return;
            }
            printWin.document.open();
            printWin.document.write(window._lastPrintFullHtml);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => {
                try { printWin.print(); } catch (e) {}
            }, 350);
        };

        window.openEssayGradingModal = function(resultId) {
            const res = appData.examResults.find(r => (r.resultId || r.id) === resultId);
            if (!res) return;
            const examQuestions = getQuestionsForExamAnalysis(res.examId);
            const essayQuestions = examQuestions.filter(q => q.type === 'essay');
            const targetList = essayQuestions.length > 0
                ? essayQuestions
                : (appData.questions.filter(q => q.type === 'essay').slice(0, 1));

            if (targetList.length === 0) {
                window.showModal('Tidak Ada Soal Uraian', 'Paket ujian ini tidak memiliki butir soal bertipe Uraian / Esai.', 'info');
                return;
            }

            const itemsHtml = targetList.map((q, idx) => {
                const maxW = Math.max(0, Number(q.weight) || 10);
                const studentAns = (res.answersSnapshot && res.answersSnapshot[q.id] !== undefined)
                    ? res.answersSnapshot[q.id]
                    : '(Tidak dijawab)';
                const existingManual = (res.essayScores && res.essayScores[q.id] !== undefined)
                    ? Number(res.essayScores[q.id])
                    : window.evaluateQuestionScore(q, studentAns, undefined).earnedWeight;
                const clampedCurrent = Math.min(maxW, Math.max(0, Number.isFinite(existingManual) ? existingManual : 0));

                return `
                    <div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="font-extrabold text-indigo-700">Soal Uraian #${q.orderNum || (idx + 1)}</span>
                            <span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg font-bold text-[11px]">Bobot Maks: ${maxW} Poin</span>
                        </div>
                        <p class="text-slate-700 font-semibold">${escapeHtml(q.questionText || 'Soal Uraian')}</p>
                        <div class="p-2.5 bg-white rounded-xl border border-slate-200">
                            <span class="text-[10px] font-bold uppercase text-slate-400 block mb-0.5">Jawaban Siswa:</span>
                            <p class="font-semibold text-slate-800 whitespace-pre-line">${escapeHtml(String(studentAns || '(Tidak dijawab)'))}</p>
                        </div>
                        ${q.correctAnswer ? `<p class="text-[11px] text-amber-800 bg-amber-50 px-2.5 py-1.5 rounded-lg border border-amber-200"><strong>Kata Kunci / Pedoman:</strong> ${escapeHtml(String(q.correctAnswer))}</p>` : ''}
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Input Skor Guru (Rentang 0 s.d ${maxW} Poin)</label>
                            <input type="number" step="0.01" min="0" max="${maxW}" data-essay-qid="${escapeHtml(q.id)}" data-essay-max="${maxW}" value="${clampedCurrent}" oninput="if(Number(this.value) > ${maxW}) this.value = ${maxW}; if(Number(this.value) < 0) this.value = 0;" class="essay-grade-input w-full px-3 py-2 bg-white border border-slate-300 rounded-xl font-extrabold text-indigo-700">
                        </div>
                    </div>
                `;
            }).join('');

            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-200 text-indigo-900 flex items-center justify-between">
                        <div>
                            <p class="font-extrabold">${escapeHtml(res.studentName)} (Kelas ${escapeHtml(res.className)})</p>
                            <p class="text-[11px] text-indigo-700">Paket Ujian: ${escapeHtml(res.examName || '-')}</p>
                        </div>
                        <span class="font-mono font-bold text-xs bg-white px-2.5 py-1 rounded-lg border border-indigo-200">Nilai Saat Ini: ${res.finalScore}</span>
                    </div>
                    <div class="space-y-3 max-h-[55vh] overflow-y-auto custom-scrollbar pr-1">
                        ${itemsHtml}
                    </div>
                </div>
            `;

            window.showModal('Koreksi & Penilaian Soal Uraian', '', 'info', (confirmed) => {
                if (!confirmed) return true;
                if (!res.essayScores || typeof res.essayScores !== 'object') res.essayScores = {};

                const inputs = document.querySelectorAll('.essay-grade-input');
                inputs.forEach(inp => {
                    const qid = inp.getAttribute('data-essay-qid');
                    const maxW = Math.max(0, Number(inp.getAttribute('data-essay-max')) || 10);
                    const rawVal = Number(inp.value);
                    const clampedVal = safeRoundTwoDecimals(Math.min(maxW, Math.max(0, Number.isFinite(rawVal) ? rawVal : 0)));
                    if (qid) {
                        res.essayScores[qid] = clampedVal;
                    }
                });

                const allExamQuestions = examQuestions.length > 0 ? examQuestions : appData.questions;
                const recalc = window.calculateExamSubmissionScore(allExamQuestions, res.answersSnapshot || {}, res.essayScores);
                res.totalScoreObtained = recalc.totalScoreObtained;
                res.maxPossibleScore = recalc.maxPossibleScore;
                res.finalScore = recalc.finalScore;
                res.correctCount = recalc.correctCount;
                res.wrongCount = recalc.wrongCount;
                res.emptyCount = recalc.emptyCount;
                res.essayGradingStatus = 'Sudah Dinilai';

                syncCollectionRecord('examResults', res.resultId || res.id, res);
                renderResultsContent(document.getElementById('adminMainContent'));
                return true;

        function getQuestionsForExamAnalysis(examId) {
            if (!examId || examId === 'ALL') {
                return [...appData.questions];
            }
            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) return [];
            let list = [];
            if (Array.isArray(ex.questionIds) && ex.questionIds.length > 0) {
                list = ex.questionIds.map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            }
            if (list.length === 0 && ex.bankId) {
                list = appData.questions.filter(q => q.bankId === ex.bankId);
            }
            return list;
        }

        function computeQuestionItemAnalysis(q, relevantResults) {
            let correctCount = 0;
            let wrongCount = 0;
            let emptyCount = 0;
            const totalRespondents = Array.isArray(relevantResults) ? relevantResults.length : 0;

            (relevantResults || []).forEach(res => {
                const ans = res.answersSnapshot ? res.answersSnapshot[q.id] : undefined;
                const evalRes = evaluateSingleQuestionForReview(q, ans, res);
                if (evalRes.status === 'EMPTY') {
                    emptyCount++;
                } else if (evalRes.status === 'CORRECT') {
                    correctCount++;
                } else if (evalRes.status === 'ESSAY') {
                    const givenScore = (res.essayScores && res.essayScores[q.id]) ? Number(res.essayScores[q.id]) : 0;
                    if (givenScore >= (Number(q.weight) || 10) * 0.5) correctCount++;
                    else wrongCount++;
                } else {
                    wrongCount++;
                }
            });

            let difficultyLabel = q.difficulty || 'Sedang';
            let difficultyBadgeClass = 'bg-indigo-50 text-indigo-700 border border-indigo-200';
            let pctCorrect = null;

            if (totalRespondents > 0) {
                pctCorrect = Math.round((correctCount / totalRespondents) * 100);
                if (pctCorrect >= 70) {
                    difficultyLabel = `Mudah (${pctCorrect}%)`;
                    difficultyBadgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                } else if (pctCorrect >= 35) {
                    difficultyLabel = `Sedang (${pctCorrect}%)`;
                    difficultyBadgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                } else {
                    difficultyLabel = `Sulit (${pctCorrect}%)`;
                    difficultyBadgeClass = 'bg-red-50 text-red-700 border border-red-200';
                }
            }

            return {
                correctCount,
                wrongCount,
                emptyCount,
                totalRespondents,
                pctCorrect,
                difficultyLabel,
                difficultyBadgeClass
            };
        }

        window.exportAnalysisExcel = function() {
            const filterExamId = appData.filters.analysisExam || 'ALL';
            const selectedExam = filterExamId !== 'ALL' ? appData.exams.find(e => e.id === filterExamId) : null;
            const questionsToAnalyze = getQuestionsForExamAnalysis(filterExamId);
            const relevantResults = selectedExam
                ? appData.examResults.filter(r => r.examId === selectedExam.id)
                : appData.examResults;

            if (questionsToAnalyze.length === 0) {
                window.showModal('Data Soal Kosong', 'Tidak ada butir soal pada paket ujian ini untuk diekspor.', 'error');
                return;
            }

            const headers = ['No Soal', 'Paket Ujian / Bank Soal', 'Pertanyaan Soal', 'Jenis Soal', 'Bobot Poin', 'Dijawab Benar', 'Dijawab Salah', 'Tidak Dijawab (Kosong)', 'Total Peserta', 'Tingkat Kesulitan'];
            const rows = questionsToAnalyze.map((q, idx) => {
                const stats = computeQuestionItemAnalysis(q, relevantResults);
                const bankObj = appData.questionBanks.find(b => b.id === q.bankId);
                const packLabel = selectedExam ? selectedExam.examName : (bankObj ? bankObj.title : '-');
                return [
                    q.orderNum || (idx + 1),
                    packLabel,
                    q.questionText || '',
                    getQuestionTypeBadgeLabel(q.type),
                    q.weight || 10,
                    stats.correctCount,
                    stats.wrongCount,
                    stats.emptyCount,
                    stats.totalRespondents,
                    stats.difficultyLabel
                ];
            });

            const fileSuffix = selectedExam ? `_${selectedExam.examName.replace(/[^a-zA-Z0-9]/g, '_')}` : '_Semua_Paket';
            window.downloadExcelFile(`Analisis_Butir_Soal${fileSuffix}.xlsx`, headers, rows);
        };

        window.handleLogoFileSelected = async function(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!validTypes.includes(file.type.toLowerCase())) {
                window.showModal('Format File Tidak Didukung', 'Silakan pilih file gambar logo dengan format PNG, JPG, atau JPEG.', 'error');
                event.target.value = '';
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                window.showModal('Ukuran File Terlalu Besar', 'Ukuran file logo maksimal 2 MB agar cepat dimuat pada jaringan HP.', 'error');
                event.target.value = '';
                return;
            }

            try {
                // Kompresi cepat ukuran optimal 180x180px (~10KB) agar pratinjau dan simpan ke Cloud instan (< 1 detik)
                const compressed = await compressAndConvertImage(file, 180, 180, 0.82);
                pendingLogoFile = compressed.blob;
                pendingLogoDataUrl = compressed.dataUrl;
                const mainEl = document.getElementById('adminMainContent');
                if (mainEl && appData.activeAdminMenu === 'settings') {
                    renderSettingsContent(mainEl);
                }
            } catch (err) {
                console.error('Logo preview error:', err);
                window.showModal('Gagal Memuat Pratinjau', 'File gambar tidak dapat diproses. Silakan pilih file gambar lain.', 'error');

        window.regenerateExamToken = function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newToken = '';
            for (let i = 0; i < 6; i++) newToken += chars.charAt(Math.floor(Math.random() * chars.length));
            ex.token = newToken;
            syncCollectionRecord('exams', ex.id, ex);
            logActivity(`Token ujian ${ex.examName} diperbarui menjadi ${newToken}.`);
            renderSchedulesContent(document.getElementById('adminMainContent'));
        };

        function renderParticipantsContent(container) {
            const isExamOngoingNow = (ex) => {
                if (!ex) return false;
                const activeAndInSchedule = isExamStrictlyActive(ex) && checkExamScheduleAccess(ex).allowed;
                const hasRunningSession = (appData.examSessions || []).some(ss => ss.examId === ex.id && ss.status === 'IN_PROGRESS');
                const hasRunningParticipant = (appData.examParticipants || []).some(p => p.examId === ex.id && p.status === 'Sedang Mengerjakan');
                return activeAndInSchedule || hasRunningSession || hasRunningParticipant;
            };

            const defaultOngoingExam = appData.exams.find(e => isExamOngoingNow(e));
            const activeExamId = (appData.filters.participantExam && appData.filters.participantExam !== 'ALL' && appData.exams.some(e => e.id === appData.filters.participantExam))
                ? appData.filters.participantExam
                : (defaultOngoingExam ? defaultOngoingExam.id : (appData.exams[0] ? appData.exams[0].id : ''));

            const selectedExamObj = appData.exams.find(e => e.id === activeExamId) || null;
            const isSelectedExamOngoing = isExamOngoingNow(selectedExamObj);

            const examOptions = appData.exams.map(e => {
                const ongoing = isExamOngoingNow(e);
                const ongoingLabel = ongoing ? ' — Ujian Sedang Berlangsung' : '';
                const prefixIcon = ongoing ? '🟢 ' : '';
                return `<option value="${escapeHtml(e.id)}" ${e.id === activeExamId ? 'selected' : ''}>${prefixIcon}${escapeHtml(e.examName)} (Kelas ${escapeHtml(getClassNameById(e.classId))})${ongoingLabel}</option>`;
            }).join('');

            const rows = appData.students.map((s, idx) => {

        window.resetStudentExamSession = function(studentId, examId = '') {
            window.showModal('Konfirmasi Reset Sesi', 'Mereset sesi akan menghapus progres aktif, jawaban tersimpan, hasil ujian, dan hitungan pelanggaran siswa ini agar siswa dapat mengerjakan ujian kembali dari awal. Lanjutkan?', 'error', async (confirmed) => {
                if (confirmed) {
                    updateLiveSyncIndicator('syncing', 'Mereset Sesi...');
                    const toRemoveRes = appData.examResults.filter(r => r.studentId === studentId && (!examId || r.examId === examId));
                    for (const r of toRemoveRes) {
                        const docId = r.id || r.resultId;
                        await syncCollectionRecord('examResults', docId, null, true);
                    }
                    appData.examResults = appData.examResults.filter(r => !(r.studentId === studentId && (!examId || r.examId === examId)));

                    // Hapus sesi dari daftar examSessions & pastikan ID deterministik SES_{examId}_{studentId} juga dihapus dari Firestore
                    const toRemoveSess = appData.examSessions.filter(ss => ss.studentId === studentId && (!examId || ss.examId === examId));
                    const deletedSessIds = new Set();
                    for (const ss of toRemoveSess) {
                        deletedSessIds.add(ss.id);
                        await syncCollectionRecord('examSessions', ss.id, null, true);
                    }
                    const targetExams = examId ? [examId] : appData.exams.map(e => e.id);
                    for (const exId of targetExams) {
                        const deterministicSessId = getSessionDocId(exId, studentId);
                        if (!deletedSessIds.has(deterministicSessId)) {
                            await syncCollectionRecord('examSessions', deterministicSessId, null, true);
                        }
                    }
                    appData.examSessions = appData.examSessions.filter(ss => !(ss.studentId === studentId && (!examId || ss.examId === examId)));

                    const matchingParts = appData.examParticipants.filter(p => p.studentId === studentId && (!examId || p.examId === examId));
                    if (matchingParts.length > 0) {
                        for (const part of matchingParts) {
                            part.status = 'Belum Mulai';
                            part.violationCount = 0;
                            await syncCollectionRecord('examParticipants', part.id, part);
                        }
                    } else if (examId) {
                        const stdObj = appData.students.find(s => s.id === studentId);
                        if (stdObj) {
                            const newPart = {
                                id: 'PRT-' + stdObj.id + '-' + examId,
                                examId,
                                studentId: stdObj.id,
                                nisn: stdObj.nisn,
                                studentName: stdObj.fullName,
                                className: stdObj.className || '4',
                                status: 'Belum Mulai',
                                violationCount: 0,
                                extraTimeMinutes: 0
                            };
                            appData.examParticipants.push(newPart);
                            await syncCollectionRecord('examParticipants', newPart.id, newPart);
                        }
                    }

                    const stdObj = appData.students.find(s => s.id === studentId);
                    if (stdObj) {
                        stdObj.isLoggedIn = false;
                        stdObj.activeSessionId = '';
                        stdObj.lastHeartbeatAt = 0;
                        await syncCollectionRecord('students', stdObj.id, {
                            isLoggedIn: false,
                            activeSessionId: '',
                            lastHeartbeatAt: 0
                        });
                    }
                    logActivity(`Sesi ujian siswa ${stdObj ? stdObj.fullName : studentId} telah direset oleh Administrator.`);
                    window.renderAdminCurrentSection();
                    updateLiveSyncIndicator('updated', 'Sesi Direset');
                }
            }, { okText: 'Ya, Reset Sesi' });
        };

        window.resetAllExamSessions = function(examId) {
            if (!examId) {
                window.showModal('Pilih Paket Ujian', 'Tidak ada paket ujian aktif yang dipilih untuk direset.', 'error');
                return;
            }
            const activeExam = appData.exams.find(e => e.id === examId);
            const examName = activeExam ? activeExam.examName : 'Paket Ujian Ini';

            window.showModal(
                'Konfirmasi Reset Semua Sesi',
                `Apakah Anda yakin ingin mereset sesi seluruh peserta pada paket ujian "${examName}"? Semua siswa dapat memulai ulang ujian dari awal.`,
                'error',
                async (confirmed) => {
                    if (confirmed) {
                        updateLiveSyncIndicator('syncing', 'Mereset Semua Sesi...');
                        let successCount = 0;
                        for (const s of appData.students) {
                            const toRemove = appData.examResults.filter(r => r.studentId === s.id && r.examId === examId);
                            for (const r of toRemove) {
                                await syncCollectionRecord('examResults', r.id || r.resultId, null, true);
                            }
                            appData.examResults = appData.examResults.filter(r => !(r.studentId === s.id && r.examId === examId));

                            const sessRemove = appData.examSessions.filter(ss => ss.studentId === s.id && ss.examId === examId);
                            const removedIds = new Set();
                            for (const ss of sessRemove) {
                                removedIds.add(ss.id);
                                await syncCollectionRecord('examSessions', ss.id, null, true);
                            }
                            const detId = getSessionDocId(examId, s.id);
                            if (!removedIds.has(detId)) {
                                await syncCollectionRecord('examSessions', detId, null, true);
                            }
                            appData.examSessions = appData.examSessions.filter(ss => !(ss.studentId === s.id && ss.examId === examId));

                            let part = appData.examParticipants.find(p => p.studentId === s.id && p.examId === examId);
                            if (part) {
                                part.status = 'Belum Mulai';
                                part.violationCount = 0;
                                await syncCollectionRecord('examParticipants', part.id, part);
                            } else {
                                const newPart = {
                                    id: 'PRT-' + s.id + '-' + examId,
                                    examId,
                                    studentId: s.id,
                                    nisn: s.nisn,
                                    studentName: s.fullName,
                                    className: s.className || '4',
                                    status: 'Belum Mulai',
                                    violationCount: 0,
                                    extraTimeMinutes: 0
                                };
                                appData.examParticipants.push(newPart);
                                await syncCollectionRecord('examParticipants', newPart.id, newPart);
                            }
                            successCount++;
                        }

                        logActivity(`Administrator mereset sesi seluruh peserta (${successCount} siswa) untuk paket ujian ${examName}.`);
                        window.renderAdminCurrentSection();
                        updateLiveSyncIndicator('updated', 'Semua Sesi Direset');
                        window.showModal('Reset Sesi Berhasil', `Berhasil mereset sesi ujian untuk ${successCount} peserta. Seluruh siswa kini dapat mengikuti ujian kembali dari awal.`, 'success');
                    }
                    return true;
                },
                { showCancel: true, okText: 'Ya, Reset Semua Sesi' }
            );
        };

        // FITUR AUTO-SAVE & LANJUTKAN UJIAN ANTARPERANGKAT (RESUME EXAM)
        // ============================================================================
        function getSessionDocId(examId, studentId) {
            return `SES_${examId}_${studentId}`;
        }

        function computeProgressMetrics() {
            let answeredCount = 0;
            let doubtfulCount = 0;
            const questionStatusMap = {};
            currentExamQuestions.forEach(q => {
                const ans = currentStudentAnswers[q.id];
                const isAns = isQuestionAnswered(ans);
                const isDoubt = !!currentDoubtfulMap[q.id];
                if (isAns) answeredCount++;
                if (isDoubt) doubtfulCount++;
                questionStatusMap[q.id] = isDoubt ? 'ragu-ragu' : (isAns ? 'dijawab' : 'belum_dijawab');
            });
            return { answeredCount, doubtfulCount, questionStatusMap };
        }

        function setAutosaveIndicator(status) {
            const badge = document.getElementById('autosaveBadge');
            if (!badge) return;
            if (status === 'saving') {
                badge.className = 'text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-rotate fa-spin"></i> Menyimpan...';
            } else if (status === 'error') {
                badge.className = 'text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gangguan Sinyal';
            } else {
                badge.className = 'text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Tersimpan Cloud';
            }
        }

        window.persistExamSessionToCloud = async function(immediate = false) {
            if (!isExamWorkspaceActive || !currentActiveExam || !appData.currentUser || isSubmittingFinalExam) return false;
            const student = appData.currentUser;
            const sessId = getSessionDocId(currentActiveExam.id, student.studentId);
            const nowMs = Date.now();
            const realRemSecs = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
            remainingSeconds = realRemSecs;

            const { answeredCount, doubtfulCount, questionStatusMap } = computeProgressMetrics();

            const sessionPayload = {
                id: sessId,
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                bankId: currentActiveExam.bankId || '',
                subjectId: currentActiveExam.subjectId || '',
                subjectName: getSubjectNameById(currentActiveExam.subjectId),
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId || '',
                className: student.className || '4',
                answers: sanitizeFirestoreData(currentStudentAnswers || {}),
                doubtfulMap: sanitizeFirestoreData(currentDoubtfulMap || {}),
                questionStatusMap,
                lastQuestionIndex: currentQuestionIndex,
                answeredCount,
                doubtfulCount,
                totalQuestions: currentExamQuestions.length,
                startedAtMs: currentExamStartedAtMs,
                endTimeMs: currentExamEndTimeMs,
                remainingSeconds: realRemSecs,
                violationCount: currentViolationCount,
                violationLogs: currentViolationLogs,
                status: 'IN_PROGRESS',
                sessionToken: currentSessionToken,
                deviceSessionId: currentDeviceSessionId,
                deviceInfo: getDeviceLabel(),
                updatedAtMs: nowMs,
                updatedAtFormatted: new Date(nowMs).toLocaleString('id-ID')
            };

            const existingIdx = appData.examSessions.findIndex(s => s.id === sessId);
            if (existingIdx !== -1) {
                appData.examSessions[existingIdx] = sessionPayload;
            } else {
                appData.examSessions.push(sessionPayload);
            }

            setAutosaveIndicator('saving');
            const ok = await syncCollectionRecord('examSessions', sessId, sessionPayload);
            setAutosaveIndicator(ok ? 'saved' : 'error');
            return ok;
        };

        window.scheduleAutoSave = function(immediate = false) {
            if (autoSaveDebounceTimer) clearTimeout(autoSaveDebounceTimer);
            if (immediate) {
                window.persistExamSessionToCloud(true);
            } else {
                setAutosaveIndicator('saving');
                autoSaveDebounceTimer = setTimeout(() => {
                    window.persistExamSessionToCloud(false);
                }, 350);
            }
        };

        function attachRealtimeSessionTokenListener(sessId) {
            if (sessionWatcherUnsubscribe) {
                sessionWatcherUnsubscribe();
                sessionWatcherUnsubscribe = null;
            }
            if (IS_PREVIEW || !db) return;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'examSessions', sessId);
                sessionWatcherUnsubscribe = onSnapshot(ref, (snap) => {
                    if (!isExamWorkspaceActive) return;
                    if (!snap.exists()) {
                        // Dokumen sesi dihapus oleh Admin (Reset Sesi saat siswa sedang membuka ruang ujian)
                        window.stopAllExamTimersAndWatchers();
                        window.showModal(
                            'Sesi Ujian Direset Pengawas',
                            'Sesi ujian Anda telah direset oleh Pengawas / Administrator. Silakan mulai kembali ujian dari halaman Portal Siswa.',
                            'info',
                            () => {
                                window.renderStudentPortal(false);
                            }
                        );
                        return;
                    }
                    const remoteData = snap.data();
                    if (remoteData.status === 'SUBMITTED') {
                        window.stopAllExamTimersAndWatchers();
                        window.autoLogoutStudentToInitialLogin(
                            'Ujian Telah Selesai',
                            'Sesi ujian ini telah diselesaikan dan dikirim. Akun Anda otomatis keluar (Logout) kembali ke halaman awal login.',
                            'info'
                        );
                        return;
                    }
                    if (remoteData.sessionToken && currentSessionToken && remoteData.sessionToken !== currentSessionToken) {
                        window.stopAllExamTimersAndWatchers();
                        window.autoLogoutStudentToInitialLogin(
                            'Sesi Berpindah ke Perangkat Lain',
                            `Ujian Anda baru saja dibuka dan diambil alih pada perangkat lain (${remoteData.deviceInfo || 'Perangkat Baru'}). Akun pada perangkat ini otomatis keluar (Logout).`,
                            'error'
                        );
                    }
                }, (err) => {
                    console.warn('Realtime session listener warning:', err);
                });
            } catch (e) {
                console.warn('Gagal memasang listener sesi:', e);
            }
        }

                const idx = appData.examSessions.findIndex(s => s.id === sessId);

            if (existingSess && existingSess.status === 'IN_PROGRESS') {
                window.showUnfinishedExamNotificationModal(examId);

                window.startExamSession(examId, null);
