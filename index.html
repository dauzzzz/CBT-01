        let db = null;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cbt-sekolah-sd-app';

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function logActivity(text) {
            const now = new Date();
            const timeStr = now.toTimeString().slice(0, 5) + ' WIB';
            appData.activityLogs.unshift({ id: 'LOG-' + Date.now(), time: timeStr, text });
            if (appData.activityLogs.length > 15) appData.activityLogs.pop();
        }

        function getClassNameById(classId) {
            const c = appData.classes.find(x => x.id === classId);
            return c ? c.className : (classId || '-');
        }

        function getSubjectNameById(subjectId) {
            const s = appData.subjects.find(x => x.id === subjectId);
            return s ? s.subjectName : (subjectId || '-');
        }

        // SINGLE SOURCE OF TRUTH: VALIDASI STATUS AKTIF, KELAS & JADWAL UJIAN (WIB UTC+7)
        function isExamStrictlyActive(examObj) {
            if (!examObj) return false;
            return String(examObj.status || '').trim().toLowerCase() === 'aktif';
        }

        function matchesStudentClass(examObj, studentObj) {
            if (!examObj || !studentObj) return false;
            if (!examObj.classId || examObj.classId === 'ALL') return true;
            const examClsRaw = String(examObj.classId || '').trim().toLowerCase();
            const examClsName = String(getClassNameById(examObj.classId) || '').trim().toLowerCase();
            const stdClsId = String(studentObj.classId || '').trim().toLowerCase();
            const stdClsName = String(studentObj.className || getClassNameById(studentObj.classId) || '').trim().toLowerCase();

            return (
                (examClsRaw && (examClsRaw === stdClsId || examClsRaw === stdClsName)) ||
                (examClsName && (examClsName === stdClsName || examClsName === stdClsId))
            );
        }

        function parseExamDateTimeWIB(dateStr, timeStr, isEnd = false) {
            const rawDate = String(dateStr || '').trim();
            if (!rawDate) return null;
            let year, month, day;
            if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(rawDate)) {
                const parts = rawDate.split('-');
                year = Number(parts[0]);
                month = Number(parts[1]);
                day = Number(parts[2]);
            } else if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(rawDate)) {
                const parts = rawDate.split(/[\/\-]/);
                day = Number(parts[0]);
                month = Number(parts[1]);
                year = Number(parts[2]);
            } else {
                return null;
            }
            if (!year || !month || !day || month < 1 || month > 12 || day < 1 || day > 31) return null;

            const defaultTime = isEnd ? '23:59' : '00:00';
            const rawTime = String(timeStr || defaultTime).trim();
            const timeParts = rawTime.split(':');
            const hours = Math.min(23, Math.max(0, Number(timeParts[0]) || (isEnd ? 23 : 0)));
            const minutes = Math.min(59, Math.max(0, Number(timeParts[1]) || (isEnd ? 59 : 0)));
            const seconds = isEnd ? '59' : '00';
            const ms = isEnd ? '999' : '000';

            const isoWIB = `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${seconds}.${ms}+07:00`;
            const parsedMs = Date.parse(isoWIB);
            return isNaN(parsedMs) ? null : parsedMs;
        }

        function checkExamScheduleWindowWIB(examObj, nowMs = Date.now()) {
            const closedMsg = 'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.';
            if (!examObj) {
                return { withinSchedule: false, reasonCode: 'NOT_FOUND', message: closedMsg };
            }
            const startMs = parseExamDateTimeWIB(examObj.startDate, examObj.startTime || '00:00', false);
            const endMs = parseExamDateTimeWIB(examObj.endDate, examObj.endTime || '23:59', true);

            if (startMs !== null && nowMs < startMs) {
                return { withinSchedule: false, reasonCode: 'BEFORE_SCHEDULE', message: closedMsg };
            }
            if (endMs !== null && nowMs > endMs) {
                return { withinSchedule: false, reasonCode: 'AFTER_SCHEDULE', message: closedMsg };
            }
            return { withinSchedule: true, reasonCode: 'OK', message: '' };
        }

        function evaluateExamEligibilityLocal(examObj, studentObj, nowMs = Date.now()) {
            if (!examObj || !studentObj) return { eligible: false, reason: 'INVALID' };
            if (!isExamStrictlyActive(examObj)) return { eligible: false, reason: 'INACTIVE' };
            if (!matchesStudentClass(examObj, studentObj)) return { eligible: false, reason: 'CLASS_MISMATCH' };
            const sched = checkExamScheduleWindowWIB(examObj, nowMs);
            if (!sched.withinSchedule) return { eligible: false, reason: sched.reasonCode };
            return { eligible: true, reason: 'OK' };
        }

        async function fetchCollectionDocsFresh(colName) {
            if (IS_PREVIEW || !db) return [];
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
            try {
                const snap = await getDocsFromServer(colRef);
                return snap.docs.map(d => {
                    const raw = d.data();
                    return colName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                });
            } catch (serverErr) {
                const fallbackSnap = await getDocs(colRef);
                return fallbackSnap.docs.map(d => {
                    const raw = d.data();
                    return colName === 'examResults' ? { id: d.id, resultId: raw.resultId || d.id, ...raw } : { id: d.id, ...raw };
                });
            }
        }

        async function fetchSingleFirestoreDocFresh(collectionName, docId) {
            if (IS_PREVIEW || !db || !docId) return null;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
            try {
                const snap = await getDocFromServer(ref);
                if (snap.exists()) return { id: snap.id, ...snap.data() };
                return null;
            } catch (serverErr) {
                try {
                    const fallbackSnap = await getDoc(ref);
                    if (fallbackSnap.exists()) return { id: fallbackSnap.id, ...fallbackSnap.data() };
                    return null;
                } catch (err) {
                    console.error(`Fetch Doc Error [${collectionName}/${docId}]:`, err);
                    return null;
                }
            }
        }

        async function verifyExamAccessFromFirestore(examId, studentObj) {
            const blockedMessage = 'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.';
            if (!examId || !studentObj) {
                return { allowed: false, message: blockedMessage };
            }
            if (IS_PREVIEW) {
                const localEx = appData.exams.find(x => x.id === examId);
                const elig = evaluateExamEligibilityLocal(localEx, studentObj, Date.now());
                return { allowed: elig.eligible, exam: localEx, message: elig.eligible ? '' : blockedMessage };
            }
            if (!db) {
                return { allowed: false, message: blockedMessage };
            }

            try {
                const [liveExam, liveStudent] = await Promise.all([
                    fetchSingleFirestoreDocFresh('exams', examId),
                    studentObj.studentId ? fetchSingleFirestoreDocFresh('students', studentObj.studentId) : Promise.resolve(null)
                ]);

                if (!liveExam) {
                    appData.exams = appData.exams.filter(x => x.id !== examId);
                    return { allowed: false, message: blockedMessage };
                }

                const exIdx = appData.exams.findIndex(x => x.id === examId);
                if (exIdx !== -1) appData.exams[exIdx] = liveExam;
                else appData.exams.push(liveExam);

                if (!isExamStrictlyActive(liveExam)) {
                    return { allowed: false, message: blockedMessage };
                }

                const schedCheck = checkExamScheduleWindowWIB(liveExam, Date.now());
                if (!schedCheck.withinSchedule) {
                    return { allowed: false, message: blockedMessage };
                }

                if (!matchesStudentClass(liveExam, studentObj)) {
                    return { allowed: false, message: blockedMessage };
                }

                if (liveStudent && String(liveStudent.status || 'Aktif').trim().toLowerCase() !== 'aktif') {
                    return { allowed: false, message: blockedMessage };
                }

                return { allowed: true, exam: liveExam, message: '' };
            } catch (err) {
                console.error('verifyExamAccessFromFirestore error:', err);
                return { allowed: false, message: blockedMessage };
            }
        }

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW) return true;
            if (!db || !auth?.currentUser) return false;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    const cleanObj = JSON.parse(JSON.stringify(dataObj, (k, v) => v === undefined ? null : v));
                    await setDoc(ref, cleanObj, { merge: true });
                }
                return true;
            } catch (err) {
                console.error('Firestore Sync Error:', err);
                return false;
            }
        }

        async function persistStudentExamProgressToCloud() {
            const student = appData.currentUser;
            if (!student || student.role !== 'student' || !currentActiveExam) return;
            const sessionId = `SES_${currentActiveExam.id}_${student.studentId}`;
            const sessionData = {
                id: sessionId,
                examId: currentActiveExam.id,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                className: student.className || '4',
                answers: currentStudentAnswers || {},
                doubtfulMap: currentDoubtfulMap || {},
                remainingSeconds: remainingSeconds,
                violationCount: currentViolationCount,
                status: 'IN_PROGRESS',
                updatedAt: new Date().toISOString()
            };
            const existingIdx = appData.examSessions.findIndex(s => s.id === sessionId);
            if (existingIdx >= 0) appData.examSessions[existingIdx] = sessionData;
            else appData.examSessions.push(sessionData);

            await syncCollectionRecord('examSessions', sessionId, sessionData);
        }

        let isTerminatingStudentExam = false;
        window.forceTerminateActiveStudentExam = async function(customNotice) {
            if (!currentActiveExam || isTerminatingStudentExam) return;
            isTerminatingStudentExam = true;
            const closedExamId = currentActiveExam.id;

            if (examTimerInterval) {
                clearInterval(examTimerInterval);
                examTimerInterval = null;
            }
            window.detachAntiCheatListeners();

            await persistStudentExamProgressToCloud();

            const student = appData.currentUser;
            if (student) {
                const part = appData.examParticipants.find(p => p.examId === closedExamId && p.studentId === student.studentId);
                if (part && part.status !== 'Selesai') {
                    part.status = 'Ujian Ditutup Admin';
                    syncCollectionRecord('examParticipants', part.id, part);
                }
            }

            currentActiveExam = null;
            currentExamQuestions = [];
            isTerminatingStudentExam = false;

            window.renderStudentPortal();
            window.showModal(
                'Ujian Ditutup oleh Administrator',
                customNotice || 'Ujian telah ditutup oleh administrator. Jawaban dan riwayat pengerjaan Anda yang sudah terisi tetap tersimpan dengan aman.',
                'error'
            );
        };

        async function initFirebaseProduction() {
            if (IS_PREVIEW) return true;
            const firebaseConfig = {
                apiKey: "AIzaSyDw_1kWRnt7dQHnSLerhevPw65TY64QW5s",
                authDomain: "cbt-01-9ff05.firebaseapp.com",
                projectId: "cbt-01-9ff05",
                storageBucket: "cbt-01-9ff05.firebasestorage.app",
                messagingSenderId: "511625667431",
                appId: "1:511625667431:web:784fbc26a20e8b81ef45c2"
            };

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (tokenErr) {
                        try {
                            await signInAnonymously(auth);
                        } catch (anonErr) {
                            console.warn('Anonymous sign-in restricted or failed. Continuing in offline standalone mode.', anonErr);
                        }
                    }
                } else {
                    try {
                        await signInAnonymously(auth);
                    } catch (anonErr) {
                        console.warn('Anonymous sign-in restricted or failed. Continuing in offline standalone mode.', anonErr);
                    }
                }

                const collectionsToLoad = [
                    'students', 'teachers', 'classes', 'subjects',
                    'questionBanks', 'questions', 'exams',
                    'examParticipants', 'examSessions', 'examResults'
                ];

                for (const colName of collectionsToLoad) {
                    try {
                        appData[colName] = await fetchCollectionDocsFresh(colName);
                    } catch (e) {
                        console.warn(`Could not load collection ${colName}:`, e);
                    }
                }

                try {
                    const settingsDoc = await fetchSingleFirestoreDocFresh('appSettings', 'global');
                    if (settingsDoc) {
                        appData.settings = { ...appData.settings, ...settingsDoc };
                        if (appData.settings.schoolLogo) updateFaviconAndLogo(appData.settings.schoolLogo);
                    }
                } catch (e) {}

                setupGlobalRealtimeSubscriptions();
                isInitialRealtimeLoad = false;
                return true;
            } catch (e) {
                console.warn('Init Firebase warning (running in standalone mode):', e);
                db = null;
                auth = null;
                return true;
            }
        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;

            globalRealtimeUnsubscribes.forEach(unsub => {
                try { unsub(); } catch (e) {}
            });
            globalRealtimeUnsubscribes = [];

            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examSessions', 'examResults'
            ];

            collectionsToWatch.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                const unsub = onSnapshot(colRef, { includeMetadataChanges: true }, (snapshot) => {
                    if (!isGlobalSyncActive && colName === 'questions') return;

                    const docsList = snapshot.docs.map(d => {
                        const raw = d.data();
                        if (colName === 'examResults') {
                            return { id: d.id, resultId: raw.resultId || d.id, ...raw };
                        }
                        return { id: d.id, ...raw };
                    });

                    if (colName === 'questions') {
                        docsList.sort((a, b) => (Number(a.orderNum) || 0) - (Number(b.orderNum) || 0));
                    }

                    appData[colName] = docsList;

                    if (colName === 'exams' && appData.currentUser?.role === 'student' && currentActiveExam) {
                        const liveActiveExam = docsList.find(x => x.id === currentActiveExam.id);
                        const schedCheck = liveActiveExam ? checkExamScheduleWindowWIB(liveActiveExam, Date.now()) : { withinSchedule: false };
                        if (!liveActiveExam || !isExamStrictlyActive(liveActiveExam) || !schedCheck.withinSchedule) {
                            window.forceTerminateActiveStudentExam(
                                'Ujian telah ditutup oleh administrator. Jawaban dan riwayat pengerjaan Anda yang sudah terisi tetap tersimpan dengan aman.'
                            );
                            return;
                        }
                    }

                    if (!isInitialRealtimeLoad) {
                        triggerRealtimeUIRefresh();
                    }
                }, (err) => {
                    console.warn('Realtime subscription warning on ' + colName, err);
                });
                globalRealtimeUnsubscribes.push(unsub);
            });

            const unsubSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global'), (docSnap) => {
                if (docSnap.exists()) {
                    const newSettings = docSnap.data();
                    if (newSettings.schoolLogo && newSettings.schoolLogo !== appData.settings.schoolLogo) {
                        updateFaviconAndLogo(newSettings.schoolLogo);
                    }
                    appData.settings = { ...appData.settings, ...newSettings };
                    if (!isInitialRealtimeLoad) triggerRealtimeUIRefresh();
                }
            });
            globalRealtimeUnsubscribes.push(unsubSettings);

            if (fallbackPollingInterval) clearInterval(fallbackPollingInterval);
            fallbackPollingInterval = setInterval(async () => {
                if (!db || document.hidden) return;
                try {
                    const freshExams = await fetchCollectionDocsFresh('exams');
                    appData.exams = freshExams;
                    if (appData.currentUser?.role === 'student') {
                        if (currentActiveExam) {
                            const liveEx = freshExams.find(x => x.id === currentActiveExam.id);
                            if (!liveEx || !isExamStrictlyActive(liveEx) || !checkExamScheduleWindowWIB(liveEx, Date.now()).withinSchedule) {
                                window.forceTerminateActiveStudentExam(
                                    'Ujian telah ditutup oleh administrator. Jawaban dan riwayat pengerjaan Anda yang sudah terisi tetap tersimpan dengan aman.'
                                );
                            }
                        } else {
                            const modalEl = document.getElementById('customModal');
                            const isModalOpen = modalEl && !modalEl.classList.contains('hidden');
                            if (!isModalOpen) window.renderStudentPortal();
                        }
                    }
                } catch (e) {}
            }, 10000);
        }

        function triggerRealtimeUIRefresh() {
            const indicator = document.getElementById('liveSyncBadge');
            if (indicator) {
                indicator.innerHTML = '<i class="fa-solid fa-circle-dot text-emerald-400 animate-pulse"></i> Data Diperbarui';
                setTimeout(() => {
                    if (indicator) indicator.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i> Live Sync Aktif';
                }, 2000);
            }

            if (appData.currentUser?.role === 'admin') {

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = async function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            if (!IS_PREVIEW && db) {
                try {
                    const [freshStudents, freshExams, freshSess, freshRes] = await Promise.all([
                        fetchCollectionDocsFresh('students'),
                        fetchCollectionDocsFresh('exams'),
                        fetchCollectionDocsFresh('examSessions'),
                        fetchCollectionDocsFresh('examResults')
                    ]);
                    appData.students = freshStudents;
                    appData.exams = freshExams;
                    appData.examSessions = freshSess;
                    appData.examResults = freshRes;
                } catch (e) {
                    console.warn('Could not refresh data on student login:', e);
                }
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            window.renderStudentPortal();
        };

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Tahun Pelajaran', 'Status'];
            const rows = appData.students.map((s, idx) => {
                const schoolVal = s.asalSekolah !== undefined ? (s.asalSekolah || '-') : (appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG');
                return [idx + 1, s.nisn, s.nis || '-', s.fullName, schoolVal, s.gender || 'L', s.className, s.academicYear, s.status];
            });

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa.', 'error');
                        return;
                    }
                    let added = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || !cols[0] || !cols[2]) continue;
                        const nisn = String(cols[0]).trim();
                        if (appData.students.some(s => s.nisn === nisn)) continue;
                        const clsName = String(cols[5] ?? '6').trim();
                        const clsObj = appData.classes.find(c => String(c.className) === clsName) || appData.classes[0];
                        const newStd = {
                            id: 'STD-' + Date.now() + '-' + i,
                            nisn,
                            nis: String(cols[1] ?? '-').trim(),
                            fullName: String(cols[2]).trim(),
                            asalSekolah: String(cols[3] ?? appData.settings.schoolName).trim(),
                            gender: String(cols[4] ?? 'L').trim().toUpperCase() === 'P' ? 'P' : 'L',
                            classId: clsObj ? clsObj.id : 'CLS-6',
                            className: clsObj ? clsObj.className : clsName,
                            academicYear: appData.settings.academicYear,
                            username: nisn,
                            passwordHash: hashCredential(String(cols[6] ?? '123456').trim()),
                            status: 'Aktif'
                        };
                        appData.students.push(newStd);
                        syncCollectionRecord('students', newStd.id, newStd);
                        added++;
                    }
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil menyimpan ${added} data siswa baru.`, 'success');
                });
            };
            fileInput.click();
        };

        window.saveQuestionRecord = function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const correctAnswer = (document.getElementById('qFormKey')?.value || 'A').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();
            if (!questionText) {
                window.showModal('Validasi', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }
            const options = [
                document.getElementById('qOptA')?.value || '',
                document.getElementById('qOptB')?.value || '',
                document.getElementById('qOptC')?.value || '',
                document.getElementById('qOptD')?.value || ''
            ];
            const selectedBank = appData.filters.questionBankId !== 'ALL' ? appData.filters.questionBankId : (appData.questionBanks[0]?.id || 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    Object.assign(existing, { orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation });
                    syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = { id: 'Q-' + Date.now(), bankId: selectedBank, orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation };
                appData.questions.push(newQ);
                syncCollectionRecord('questions', newQ.id, newQ);
            }
            window.showModal('Berhasil', 'Butir soal berhasil disimpan ke Bank Soal.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

            const sample = [[1, 'pg', 10, '', '', 'Hasil dari 12 x 5 adalah ...', '', '50', '60', '70', '80', 'B', '12 x 5 = 60']];
            window.downloadExcelFile('Template_Impor_Bank_Soal.xlsx', headers, sample);

        window.executeExportQuestionsExcel = function() {
            const selectedBank = appData.filters.questionBankId || 'ALL';
            const list = selectedBank === 'ALL' ? appData.questions : appData.questions.filter(q => q.bankId === selectedBank);
            if (list.length === 0) {
                window.showModal('Kosong', 'Tidak ada soal untuk diekspor.', 'error');
                return;
            }
            const headers = ['No', 'Jenis Soal', 'Bobot Poin', 'Teks Stimulus', 'URL Gambar Stimulus', 'Teks Pertanyaan', 'URL Gambar Soal', 'Opsi A', 'Opsi B', 'Opsi C', 'Opsi D', 'Kunci Jawaban', 'Pembahasan'];
            const rows = list.map((q, i) => [
                q.orderNum || (i + 1), q.type || 'pg', q.weight || 10, q.stimulusText || '', q.stimulusImage || '', q.questionText || '', q.questionImage || '',
                q.options?.[0] || '', q.options?.[1] || '', q.options?.[2] || '', q.options?.[3] || '',
                Array.isArray(q.correctAnswer) ? q.correctAnswer.join(',') : (q.correctAnswer || 'A'), q.explanation || ''
            ]);
            window.downloadExcelFile(`Bank_Soal_${new Date().toISOString().slice(0, 10)}.xlsx`, headers, rows);
        };

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    const bankId = appData.filters.questionBankId !== 'ALL' ? appData.filters.questionBankId : (appData.questionBanks[0]?.id || 'QB-DEFAULT');
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || !cols[5]) continue;
                        const newQ = {
                            id: 'Q-' + Date.now() + '-' + i,
                            bankId,
                            orderNum: Number(cols[0]) || i,
                            type: String(cols[1] || 'pg').trim().toLowerCase(),
                            weight: Number(cols[2]) || 10,
                            stimulusText: String(cols[3] || '').trim(),
                            questionText: String(cols[5] || '').trim(),

            ex.updatedAt = new Date().toISOString();

            renderExamsContent(document.getElementById('adminMainContent'));

                logActivity(`Administrator mengubah status ujian "${ex.examName}" menjadi ${nextStatus}.`);

        window.regenerateExamToken = async function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newToken = '';
            for (let i = 0; i < 6; i++) newToken += chars.charAt(Math.floor(Math.random() * chars.length));
            ex.token = newToken;
            await syncCollectionRecord('exams', ex.id, ex);
            renderSchedulesContent(document.getElementById('adminMainContent'));
        };

        let currentActiveExam = null;
        let currentExamQuestions = [];
        let examTimerInterval = null;
        let remainingSeconds = 0;
        let currentQuestionIndex = 0;
        let currentStudentAnswers = {};
        let currentDoubtfulMap = {};
        let currentViolationCount = 0;
        let lastViolationTimestamp = 0;
        let isExamWorkspaceActive = false;
        let isViolationModalOpen = false;

        // VALIDASI BERLAPIS SAAT SISWA MEMULAI UJIAN
        window.startExamSession = async function(examId) {
            const student = appData.currentUser;
            const verification = await verifyExamAccessFromFirestore(examId, student);

            if (!verification.allowed) {
                window.renderStudentPortal();
                window.showModal(
                    'Akses Ujian Ditolak',
                    'Ujian ini sudah ditutup atau belum tersedia. Silakan hubungi administrator sekolah.',
                    'error'
                );
                return;
            }

            const ex = verification.exam;
            const alreadyDone = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
            if (alreadyDone) {
                window.showModal('Sudah Selesai', 'Anda sudah menyelesaikan paket ujian ini.', 'info');
                return;
            }

            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = appData.questions.filter(q => q.bankId === ex.bankId);
            }
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = [...appData.questions];
            }

            const sessionId = `SES_${ex.id}_${student.studentId}`;
            const savedSession = appData.examSessions.find(s => s.id === sessionId);
            if (savedSession) {
                currentStudentAnswers = savedSession.answers || {};
                currentDoubtfulMap = savedSession.doubtfulMap || {};
                remainingSeconds = typeof savedSession.remainingSeconds === 'number' && savedSession.remainingSeconds > 0
                    ? savedSession.remainingSeconds
                    : ex.durationMinutes * 60;
                currentViolationCount = savedSession.violationCount || 0;
            } else {
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                remainingSeconds = ex.durationMinutes * 60;
                currentViolationCount = 0;
            }

            currentQuestionIndex = 0;
            lastViolationTimestamp = 0;

            let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + Date.now(),
                    examId: ex.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '6',
                    status: 'Sedang Mengerjakan',
                    violationCount: currentViolationCount
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Sedang Mengerjakan';
            }
            syncCollectionRecord('examParticipants', p.id, p);

            renderExamWorkspace();
            startExamTimer();
            window.attachAntiCheatListeners();
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                if (!currentActiveExam) {
                    clearInterval(examTimerInterval);
                    return;
                }
                const latestLocalExam = appData.exams.find(x => x.id === currentActiveExam.id);
                if (!latestLocalExam || !isExamStrictlyActive(latestLocalExam) || !checkExamScheduleWindowWIB(latestLocalExam).withinSchedule) {
                    window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator. Jawaban yang sudah Anda isi tetap tersimpan.');
                    return;
                }

                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) timerEl.innerText = formatHMS(remainingSeconds);
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.detachAntiCheatListeners();
                    window.showModal('Waktu Habis', 'Waktu pengerjaan ujian telah berakhir. Jawaban Anda akan dikirim.', 'info', () => {
                        window.submitExamFinal();
                    });
                }
            }, 1000);
        }

        window.attachAntiCheatListeners = function() {
            window.detachAntiCheatListeners();
            isExamWorkspaceActive = true;
            isViolationModalOpen = false;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isExamWorkspaceActive && currentActiveExam && !isViolationModalOpen) {
                    window.recordStudentViolation('Berpindah tab atau keluar dari halaman ujian.');
                }
            });
        };

        window.detachAntiCheatListeners = function() {
            isExamWorkspaceActive = false;
        };

        window.recordStudentViolation = function(reasonText) {
            const now = Date.now();
            if (now - lastViolationTimestamp < 3500 || isViolationModalOpen || !isExamWorkspaceActive) return;
            lastViolationTimestamp = now;
            isViolationModalOpen = true;
            currentViolationCount++;

            const badgeEl = document.getElementById('examViolationCounter');
            if (badgeEl) badgeEl.innerText = `Pelanggaran: ${currentViolationCount}x`;

            window.showModal('PERINGATAN PELANGGARAN!', `Sistem mendeteksi Anda keluar dari halaman ujian (${reasonText}). Total pelanggaran: ${currentViolationCount}x`, 'error', () => {
                isViolationModalOpen = false;
            }, { okText: 'Saya Mengerti' });
        };

        window.renderExamWorkspace = function() {
            const container = document.getElementById('appContainer');
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            const q = currentExamQuestions[currentQuestionIndex];
            if (!q) return;

            const gridNav = currentExamQuestions.map((item, idx) => {
                const ans = currentStudentAnswers[item.id];
                const isDoubt = !!currentDoubtfulMap[item.id];
                const isAns = ans !== undefined && ans !== '' && (typeof ans !== 'object' || Object.keys(ans).length > 0);

                let btnStyle = 'bg-slate-100 text-slate-700 border border-slate-200';
                if (idx === currentQuestionIndex) btnStyle = 'bg-white text-slate-900 border-2 border-blue-600 ring-2 ring-blue-100 font-extrabold';
                else if (isDoubt) btnStyle = 'bg-amber-400 text-slate-950 font-bold';
                else if (isAns) btnStyle = 'bg-blue-600 text-white font-bold';

                return `<button type="button" onclick="window.jumpToQuestion(${idx})" class="h-10 rounded-xl text-xs flex items-center justify-center transition ${btnStyle}">${idx + 1}</button>`;
            }).join('');

            let answerInputHtml = '';
            if (q.type === 'pg' || !q.type) {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur === letter;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${letter}')" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                            </div>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'true_false') {
                const rawStatements = Array.isArray(q.options) && q.options.filter(Boolean).length > 0 && !(q.options.length === 2 && q.options[0] === 'Benar' && q.options[1] === 'Salah')
                    ? q.options.filter(Boolean)
                    : [q.questionText];
                const curObj = (typeof currentStudentAnswers[q.id] === 'object' && currentStudentAnswers[q.id] !== null) ? currentStudentAnswers[q.id] : {};

                const rowsHtml = rawStatements.map((stmt, sIdx) => {
                    const selVal = curObj[String(sIdx)] || '';
                    return `
                        <tr class="border-b border-slate-100">
                            <td class="p-3.5 text-xs sm:text-sm text-slate-800"><span class="font-extrabold mr-1.5">${String.fromCharCode(65 + sIdx)}.</span> ${escapeHtml(stmt)}</td>
                            <td class="p-3 text-center">
                                <button type="button" onclick="window.saveTfRowAnswer('${q.id}', '${sIdx}', 'Benar')" class="px-4 py-1.5 rounded-full text-xs font-bold border transition ${selVal === 'Benar' ? 'bg-emerald-50 border-emerald-500 text-emerald-700 shadow-xs' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}">Benar</button>
                            </td>
                            <td class="p-3 text-center">
                                <button type="button" onclick="window.saveTfRowAnswer('${q.id}', '${sIdx}', 'Salah')" class="px-4 py-1.5 rounded-full text-xs font-bold border transition ${selVal === 'Salah' ? 'bg-red-50 border-red-500 text-red-700 shadow-xs' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}">Salah</button>
                            </td>
                        </tr>
                    `;
                }).join('');

                answerInputHtml = `
                    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 border-b border-slate-200 text-[11px] font-extrabold text-slate-600 uppercase">
                                    <th class="p-3.5">Pernyataan</th>
                                    <th class="p-3.5 text-center w-24 sm:w-28">Benar</th>
                                    <th class="p-3.5 text-center w-24 sm:w-28">Salah</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;
            } else {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<textarea rows="4" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban Anda di sini..." class="w-full p-4 bg-white border border-slate-300 rounded-2xl text-sm">${escapeHtml(cur)}</textarea>`;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden select-none">
                    <header class="min-h-16 bg-[#0f172a] text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-3 shrink-0 border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <img src="${escapeHtml(appData.settings.schoolLogo)}" onerror="this.src='${DEFAULT_SCHOOL_LOGO}'" class="w-9 h-9 rounded-xl object-cover bg-white" alt="Logo">
                            <div>
                                <h2 class="text-xs sm:text-sm font-extrabold uppercase truncate">${escapeHtml(currentActiveExam.examName)}</h2>
                                <p class="text-[11px] text-slate-400">${escapeHtml(appData.settings.schoolName)}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="examViolationCounter" class="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-600/60 rounded-xl text-xs font-bold">Pelanggaran: ${currentViolationCount}x</span>
                            <div class="px-4 py-1.5 bg-red-600 text-white rounded-xl font-mono font-extrabold text-xs sm:text-sm">
                                <span id="examCountdownTimer">${formatHMS(remainingSeconds)}</span>
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-y-auto lg:overflow-hidden bg-slate-50">
                        <section class="lg:col-span-3 bg-white border-b lg:border-r border-slate-200 p-4 space-y-3 overflow-y-auto custom-scrollbar">
                            <h3 class="text-xs font-extrabold uppercase text-slate-600"><i class="fa-solid fa-book-open text-blue-600 mr-1"></i> Panel Stimulus & Informasi</h3>
                            ${q.stimulusText ? `<div class="p-3 bg-blue-50/60 rounded-xl text-xs text-slate-700 leading-relaxed">${escapeHtml(q.stimulusText)}</div>` : '<p class="text-xs text-slate-400 italic">Tidak ada stimulus.</p>'}
                        </section>

                        <section class="lg:col-span-6 flex flex-col lg:h-full lg:overflow-hidden bg-slate-50">
                            <div class="px-6 py-3 bg-white border-b border-slate-200 flex justify-between items-center shrink-0">
                                <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-xl">Soal Nomor ${currentQuestionIndex + 1}</span>
                                <span class="text-xs font-bold text-emerald-700">Bobot: ${q.weight || 10} Poin</span>
                            </div>
                            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
                                    <p class="text-sm sm:text-base font-bold text-slate-900">${escapeHtml(q.questionText)}</p>
                                </div>
                                <div class="space-y-3">${answerInputHtml}</div>
                            </div>
                            <div class="px-6 py-4 bg-white border-t border-slate-200 flex justify-between items-center shrink-0">
                                <button type="button" onclick="window.prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">← Sebelumnya</button>
                                <button type="button" onclick="window.toggleDoubtful('${q.id}')" class="px-4 py-2 bg-amber-400 text-slate-950 rounded-xl text-xs font-bold"><i class="fa-solid fa-flag mr-1"></i> Ragu-Ragu</button>
                                <button type="button" onclick="window.nextQuestion()" ${currentQuestionIndex === currentExamQuestions.length - 1 ? 'disabled' : ''} class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Selanjutnya →</button>
                            </div>
                        </section>

                        <aside class="lg:col-span-3 bg-white border-t lg:border-l border-slate-200 p-4 flex flex-col justify-between">
                            <div class="space-y-3">
                                <h3 class="text-xs font-extrabold uppercase text-slate-700">Penjelajah Soal</h3>
                                <div class="grid grid-cols-5 gap-2">${gridNav}</div>
                            </div>
                            <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-extrabold text-xs shadow-md mt-4"><i class="fa-solid fa-paper-plane mr-1"></i> Kirim & Selesai</button>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswer = function(qId, val) {
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            currentStudentAnswers[qId] = val;
            persistStudentExamProgressToCloud();
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            currentStudentAnswers[qId] = val;
            persistStudentExamProgressToCloud();
            renderExamWorkspace();
        };

        window.saveTfRowAnswer = function(qId, rowIdx, val) {
            if (!currentActiveExam || !isExamStrictlyActive(currentActiveExam)) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator.');
                return;
            }
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            currentStudentAnswers[qId][String(rowIdx)] = val;
            persistStudentExamProgressToCloud();
            renderExamWorkspace();
        };

        window.toggleDoubtful = function(qId) {
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            persistStudentExamProgressToCloud();
            renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; renderExamWorkspace(); }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) { currentQuestionIndex++; renderExamWorkspace(); }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) { currentQuestionIndex = idx; renderExamWorkspace(); }
        };

        window.confirmSubmitExam = function() {
            window.showModal('Konfirmasi Selesai', 'Apakah Anda yakin ingin mengirim jawaban dan mengakhiri ujian?', 'info', (confirmed) => {
                if (confirmed) window.submitExamFinal();
                return true;
            }, { showCancel: true, okText: 'Ya, Kirim' });
        };

        window.submitExamFinal = async function() {
            const student = appData.currentUser;
            if (!currentActiveExam || !student) return;

            const check = await verifyExamAccessFromFirestore(currentActiveExam.id, student);
            if (!check.allowed) {
                window.forceTerminateActiveStudentExam('Ujian telah ditutup oleh administrator sebelum pengiriman dilakukan. Jawaban terakhir Anda tetap tersimpan.');
                return;
            }

            if (examTimerInterval) clearInterval(examTimerInterval);
            window.detachAntiCheatListeners();

            let totalScore = 0, maxScore = 0, correct = 0, wrong = 0, empty = 0;

            currentExamQuestions.forEach(q => {
                const weight = Number(q.weight) || 10;
                maxScore += weight;
                const ans = currentStudentAnswers[q.id];
                if (ans === undefined || ans === '' || (typeof ans === 'object' && Object.keys(ans).length === 0)) {
                    empty++;
                    return;
                }
                const cleanAns = typeof ans === 'object' ? Object.values(ans).join(',').toLowerCase() : String(ans).trim().toLowerCase();
                const cleanKey = String(q.correctAnswer || '').trim().toLowerCase();
                if (cleanAns === cleanKey) {
                    totalScore += weight;
                    correct++;
                } else {
                    wrong++;
                }
            });

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id + '-' + Date.now(),
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                subjectId: currentActiveExam.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId,
                className: student.className || '6',
                submittedAt: new Date().toLocaleString('id-ID'),
                totalScoreObtained: totalScore,
                maxPossibleScore: maxScore,
                finalScore: Math.round((totalScore / (maxScore || 100)) * 100) || 0,
                correctCount: correct,
                wrongCount: wrong,
                emptyCount: empty,
                violationCount: currentViolationCount,
                essayGradingStatus: 'Sudah Dinilai',
                answersSnapshot: JSON.parse(JSON.stringify(currentStudentAnswers || {}))
            };

            appData.examResults.push(resultObj);
            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            let p = appData.examParticipants.find(x => x.examId === currentActiveExam.id && x.studentId === student.studentId);
            if (!p) {
                p = { id: 'PRT-' + student.studentId, examId: currentActiveExam.id, studentId: student.studentId, nisn: student.nisn, studentName: student.name, status: 'Selesai', violationCount: currentViolationCount };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
            }
            await syncCollectionRecord('examParticipants', p.id, p);

            currentActiveExam = null;
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-6">
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl p-8 space-y-6 text-center">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>
                        <p class="text-xs text-slate-500">${escapeHtml(resultObj.studentName)} • Nilai Akhir: <strong class="text-emerald-700 text-lg">${resultObj.finalScore}</strong></p>
                        <button type="button" onclick="window.renderStudentPortal()" class="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-sm shadow-md">Kembali ke Portal Siswa</button>
                    </div>
                </div>
            `;
        };

        window.onload = async function() {
            try {
                await initFirebaseProduction();
                window.renderLoginView();
            } catch (error) {
                window.renderLoginView();
            }
        };
    </script>
</body>
</html>
