                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (!db) {
                console.warn('Firestore DB belum terinisialisasi.');
                return false;
            }
            firebaseSyncStatus = 'Menyimpan ke Cloud...';
            updateSyncIndicator();
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    await setDoc(ref, dataObj, { merge: true });
                }
                firebaseSyncStatus = 'Tersinkronisasi';
                updateSyncIndicator();
                return true;
            } catch (err) {
                console.error(`Firestore Sync Error [${collectionName}/${docId}]:`, err);
                firebaseSyncStatus = 'Gagal Sinkron!';
                updateSyncIndicator();
                window.showModal('Kesalahan Jaringan / Database', `Gagal menyimpan data ke Firebase Firestore untuk ${collectionName}. Periksa koneksi internet Anda.`, 'error');
                return false;
            }
        }

        function updateSyncIndicator() {
            const indicator = document.getElementById('firebaseSyncBadge');
            if (indicator) {
                const isSynced = firebaseSyncStatus === 'Tersinkronisasi';
                indicator.className = `px-2.5 py-1 rounded-xl text-[11px] font-bold flex items-center gap-1.5 ${isSynced ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200 animate-pulse'}`;
                indicator.innerHTML = `<span class="w-2 h-2 rounded-full ${isSynced ? 'bg-emerald-500' : 'bg-amber-500'}"></span> ${firebaseSyncStatus}`;
            }
        }

        async function initFirebaseProduction() {
            const statusText = document.getElementById('loadingStatusText');
            try {
                if (statusText) statusText.innerText = 'Menginisialisasi Firebase SDK...';
                const app = initializeApp(FIREBASE_CONFIG);
                auth = getAuth(app);
                db = getFirestore(app);

                if (statusText) statusText.innerText = 'Autentikasi sesi aman...';
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (authErr) {
                    console.warn('Authentication restricted or failed (e.g. Anonymous Auth disabled in Firebase console). Continuing without blocking:', authErr);
                }

                if (statusText) statusText.innerText = 'Mengunduh database utama dari Firestore...';
                const collectionsToLoad = ['students', 'teachers', 'classes', 'subjects', 'questionBanks', 'questions', 'exams', 'examParticipants', 'answers', 'examResults', 'appSettings'];
                for (const colName of collectionsToLoad) {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', colName));
                    if (!snap.empty) {
                        if (colName === 'appSettings') {
                            const globalSett = snap.docs.find(d => d.id === 'global');
                            if (globalSett) appData.settings = { ...appData.settings, ...globalSett.data() };
                        } else {
                            appData[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        }
                    }
                }

                // Jika database kosong sama sekali di cloud, sediakan data default awal
                if (appData.classes.length === 0) {
                    await seedDefaultDatabaseToFirestore();
                }

                firebaseSyncStatus = 'Tersinkronisasi';
                window.renderLoginView();
            } catch (e) {
                console.error('Init Firebase Error:', e);
                if (statusText) statusText.innerText = 'Gagal terhubung ke Firebase. Periksa konfigurasi API Key!';
                window.showModal('Koneksi Gagal', 'Gagal memuat database dari Firebase Firestore. Pastikan API Key dan koneksi internet Anda benar.', 'error');
            }
        }

        let currentModalCallback = null;

        window.showModal = function(title, message, type = 'info', callback = null, options = {}) {
            const modal = document.getElementById('customModal');
            const dialogBox = document.getElementById('modalDialogBox');
            const header = document.getElementById('modalHeader');
            const titleEl = document.getElementById('modalTitle');
            const msgEl = document.getElementById('modalMessage');
            const bodyEl = document.getElementById('modalDynamicBody');
            const btnOk = document.getElementById('modalBtnOk');
            const btnCancel = document.getElementById('modalBtnCancel');

            if (header && header.parentElement) {
                header.parentElement.classList.remove('hidden');
            }
            if (header) header.classList.remove('hidden');

            dialogBox.className = `bg-white rounded-2xl shadow-2xl ${options.wide ? 'max-w-3xl' : 'max-w-lg'} w-full mx-auto overflow-hidden transform transition-all my-8 flex flex-col max-h-[90vh]`;
            header.className = `px-6 py-4 text-white flex items-center justify-between shrink-0 ${type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-indigo-600'}`;

            const icon = type === 'error' ? 'triangle-exclamation' : type === 'success' ? 'circle-check' : 'info-circle';
            titleEl.innerHTML = `<i class="fa-solid fa-${icon}"></i> <span>${escapeHtml(title)}</span>`;

            if (message) {
                msgEl.innerText = message;
                msgEl.classList.remove('hidden');
            } else {
                msgEl.innerText = '';
                msgEl.classList.add('hidden');
            }

            bodyEl.innerHTML = options.html || '';
            currentModalCallback = callback;

            const footerEl = document.getElementById('modalFooter');
            if (footerEl) footerEl.classList.remove('hidden');

            if (callback || options.showCancel) {
                btnCancel.classList.remove('hidden');
                btnOk.innerText = options.okText || 'Simpan / Lanjutkan';
            } else {
                btnCancel.classList.add('hidden');
                btnOk.innerText = options.okText || 'OK';
            }

            modal.classList.remove('hidden');
        };

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
                return;
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    console.error('Excel read error:', err);
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function showLoginError(msg) {
            const box = document.getElementById('loginErrorAlert');

        window.handleStudentLogin = function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif di database.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            window.renderStudentPortal();
        };

        window.handleAdminLogin = async function() {
            const email = document.getElementById('loginAdminEmail').value.trim();
            const pass = document.getElementById('loginAdminPass').value.trim();

            if (!email || !pass) {
                showLoginError('Email dan Password Administrator wajib diisi.');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
                window.renderAdminLayout();
            } catch (e) {
                // Fallback demo admin jika belum terdaftar di Firebase Auth
                if (email.toLowerCase() === 'admin@sdngedongboyountung.sch.id' && pass === 'admin123') {
                    appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
                    window.renderAdminLayout();
                } else {
                    showLoginError('Autentikasi gagal: Periksa kredensial email & password Anda.');
                }
            }
        };

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Tahun Pelajaran', 'Status'];
            const rows = appData.students.map((s, idx) => {
                const schoolVal = s.asalSekolah !== undefined ? (s.asalSekolah || '-') : (appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG');
                return [idx + 1, s.nisn, s.nis || '-', s.fullName, schoolVal, s.gender || 'L', s.className, s.academicYear, s.status];
            });
            window.downloadExcelFile('Data_Siswa_CBT_Sekolah.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, async (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa di bawah baris judul (header).', 'error');
                        return;
                    }

                    const headerRow = (rows[0] || []).map(h => String(h ?? '').trim().toLowerCase());
                    const hasAsalSekolahHeader = headerRow.some(h => h.includes('asal sekolah') || h.includes('asalsekolah') || h.includes('sekolah'));

                    const parsedStudents = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length === 0) continue;
                        const nisn = String(cols[0] ?? '').trim();
                        const nis = String(cols[1] ?? '').trim();
                        const fullName = String(cols[2] ?? '').trim();

                        let asalSekolah = '';
                        let gender = 'L';
                        let className = '4';
                        let pin = '123456';

                        if (hasAsalSekolahHeader || cols.length >= 7) {
                            asalSekolah = String(cols[3] ?? '').trim();
                            gender = String(cols[4] ?? 'L').trim().toUpperCase();
                            className = String(cols[5] ?? '4').trim();
                            pin = String(cols[6] ?? '123456').trim() || '123456';
                        } else {
                            asalSekolah = '';
                            gender = String(cols[3] ?? 'L').trim().toUpperCase();
                            className = String(cols[4] ?? '4').trim();
                            pin = String(cols[5] ?? '123456').trim() || '123456';
                        }

                        if (!nisn || !fullName) continue;

                        const isDuplicate = appData.students.some(s => s.nisn === nisn) || parsedStudents.some(s => s.nisn === nisn);
                        parsedStudents.push({
                            nisn,
                            nis: nis || '-',
                            fullName,
                            asalSekolah,
                            gender: gender === 'P' ? 'P' : 'L',
                            className: className || '4',
                            pin,
                            isDuplicate
                        });
                    }

                    const validList = parsedStudents.filter(s => !s.isDuplicate);
                    if (validList.length === 0) {
                        window.showModal('Info', 'Tidak ada siswa baru untuk disimpan karena seluruh NISN sudah terdaftar.', 'info');
                        return;
                    }

                    for (const item of validList) {
                        const clsObj = appData.classes.find(c => String(c.className).toLowerCase() === String(item.className).toLowerCase()) || appData.classes[0];
                        const newStd = {
                            id: 'STD-' + Date.now() + '-' + Math.floor(Math.random() * 10000),
                            nisn: item.nisn,
                            nis: item.nis,
                            fullName: item.fullName,
                            asalSekolah: item.asalSekolah,
                            gender: item.gender,
                            classId: clsObj ? clsObj.id : 'CLS-4A',
                            className: clsObj ? clsObj.className : item.className,
                            academicYear: appData.settings.academicYear,
                            username: item.nisn,
                            passwordHash: hashCredential(item.pin),
                            status: 'Aktif'
                        };
                        appData.students.push(newStd);
                        await syncCollectionRecord('students', newStd.id, newStd);
                    }

                    logActivity(`Impor Excel Siswa selesai: ${validList.length} data siswa berhasil disimpan ke Firestore.`);
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil menyimpan ${validList.length} data siswa ke Firebase Firestore.`, 'success');
                });
            };
            fileInput.click();
        };

            const stimEl = document.getElementById('qFormStimulus');
            if (stimEl) stimEl.value = q.stimulusText || '';
            const stimImgEl = document.getElementById('qFormStimulusImg');
            if (stimImgEl) stimImgEl.value = q.stimulusImage || '';
            const txtEl = document.getElementById('qFormText');
            if (txtEl) txtEl.value = q.questionText || '';
            const qImgEl = document.getElementById('qFormQuestionImg');
            if (qImgEl) qImgEl.value = q.questionImage || '';

            const keyEl = document.getElementById('qFormKey');
            if (keyEl) {
                if (q.type === 'matching' && q.matchingPairs) {
                    keyEl.value = q.matchingPairs.map(p => `${p.left}=${p.right}`).join('; ');
                } else {
                    keyEl.value = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(',') : (typeof q.correctAnswer === 'object' ? JSON.stringify(q.correctAnswer) : (q.correctAnswer || ''));
                }
            }

            if (explEl) explEl.value = q.explanation || '';

            window.handleQuestionTypeChange();
            if (q.type === 'matching' && Array.isArray(q.matchingPairs)) {
                const ids = ['qOptA', 'qOptB', 'qOptC', 'qOptD'];
                q.matchingPairs.forEach((p, idx) => {
                    if (ids[idx] && document.getElementById(ids[idx])) {
                        document.getElementById(ids[idx]).value = `${p.left} = ${p.right}`;
                    }
                });
            } else if (q.options && q.options.length >= 2) {
                if (document.getElementById('qOptA')) document.getElementById('qOptA').value = q.options[0] || '';
                if (document.getElementById('qOptB')) document.getElementById('qOptB').value = q.options[1] || '';
                if (document.getElementById('qOptC')) document.getElementById('qOptC').value = q.options[2] || '';
                if (document.getElementById('qOptD')) document.getElementById('qOptD').value = q.options[3] || '';
            }
            window.updateQuestionLivePreview();
        };

        window.saveQuestionRecord = async function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const stimulusImage = (document.getElementById('qFormStimulusImg')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const questionImage = (document.getElementById('qFormQuestionImg')?.value || '').trim();
            const correctAnswerRaw = (document.getElementById('qFormKey')?.value || '').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi Soal', 'Teks pertanyaan soal wajib diisi!', 'error');
                return;
            }

            let options = [];
            let matchingPairs = [];
            let correctAnswer = correctAnswerRaw || 'A';

            if (type === 'pg' || type === 'pg_complex') {
                options = [
                    document.getElementById('qOptA')?.value || 'Opsi A',
                    document.getElementById('qOptB')?.value || 'Opsi B',
                    document.getElementById('qOptC')?.value || 'Opsi C',
                    document.getElementById('qOptD')?.value || 'Opsi D'
                ];
                if (type === 'pg_complex') {
                    correctAnswer = correctAnswerRaw ? correctAnswerRaw.split(',').map(x => x.trim().toUpperCase()) : ['A'];
                } else {
                    correctAnswer = (correctAnswerRaw || 'A').toUpperCase();
                }
            } else if (type === 'matching') {
                const rawPairs = [
                    document.getElementById('qOptA')?.value || '',
                    document.getElementById('qOptB')?.value || '',
                    document.getElementById('qOptC')?.value || '',
                    document.getElementById('qOptD')?.value || ''
                ].filter(x => x.trim() !== '');
                const ansObj = {};
                rawPairs.forEach((rp, idx) => {
                    const parts = rp.split('=');
                    const left = (parts[0] || `Pernyataan ${idx + 1}`).trim();
                    const right = (parts[1] || correctAnswerRaw || `Pasangan ${idx + 1}`).trim();
                    matchingPairs.push({ left, right });
                    ansObj[String(idx)] = right;
                });
                correctAnswer = ansObj;
            } else if (type === 'true_false') {
                options = ['Benar', 'Salah'];
            }

            const selectedBank = appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL'
                ? appData.filters.questionBankId
                : (appData.questionBanks[0] ? appData.questionBanks[0].id : 'QB-IPAS4');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    existing.orderNum = orderNum;
                    existing.type = type;
                    existing.weight = weight;
                    existing.stimulusText = stimulusText;
                    existing.stimulusImage = stimulusImage;
                    existing.questionText = questionText;
                    existing.questionImage = questionImage;
                    existing.options = options;
                    if (type === 'matching') existing.matchingPairs = matchingPairs;
                    existing.correctAnswer = correctAnswer;
                    existing.explanation = explanation;
                    await syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = {
                    id: 'Q-' + Date.now(),
                    bankId: selectedBank,
                    subjectId: 'SUB-IPAS',
                    classLevel: '4',
                    orderNum,
                    type,
                    weight,
                    stimulusText,
                    stimulusImage,
                    questionText,
                    questionImage,
                    options,
                    matchingPairs: type === 'matching' ? matchingPairs : undefined,
                    correctAnswer,
                    explanation,
                    difficulty: 'Sedang'
                };
                appData.questions.push(newQ);
                await syncCollectionRecord('questions', newQ.id, newQ);
                if (appData.exams[0] && Array.isArray(appData.exams[0].questionIds)) {
                    appData.exams[0].questionIds.push(newQ.id);
                    await syncCollectionRecord('exams', appData.exams[0].id, appData.exams[0]);
                }
            }

            window.showModal('Berhasil', 'Butir soal berhasil disimpan ke Firebase Firestore.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

            `;
        }

        window.saveAppSettings = async function() {
            const name = document.getElementById('settingSchoolName')?.value.trim();
            if (name) appData.settings.schoolName = name;
            await syncCollectionRecord('appSettings', 'global', appData.settings);
            window.showModal('Tersimpan', 'Pengaturan berhasil diperbarui ke Firestore.', 'success');
            window.renderAdminLayout();
        };

        window.renderStudentPortal = function() {
            const container = document.getElementById('appContainer');
            const student = appData.currentUser;
            const availableExams = appData.exams.filter(e => e.classId === student.classId || e.status === 'Aktif');

            const examCards = availableExams.map(ex => {
                const finishedRes = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-4">
                        <div>
                            <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold">${escapeHtml(getSubjectNameById(ex.subjectId))}</span>
                            <h3 class="text-lg font-extrabold text-slate-900 mt-2">${escapeHtml(ex.examName)}</h3>
                            <p class="text-xs text-slate-500 mt-1">Durasi: <strong>${ex.durationMinutes} Menit</strong></p>
                        </div>
                        <div>
                            ${finishedRes
                                ? `<span class="px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-xl text-xs font-bold">Selesai (Nilai: ${finishedRes.finalScore})</span>`
                                : `<button type="button" onclick="window.startExamSession('${ex.id}')" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">Mulai Ujian</button>`}
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto">
                    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0">
                        <div>
                            <h1 class="text-base font-extrabold text-slate-900">Portal Ujian Siswa</h1>
                            <p class="text-xs text-slate-500">Siswa: <strong>${escapeHtml(student.name)}</strong> (${escapeHtml(appData.settings.schoolName)})</p>
                        </div>
                        <button type="button" onclick="window.logoutApp()" class="px-3 py-1.5 bg-red-50 text-red-600 rounded-xl text-xs font-bold">Keluar</button>
                    </header>
                    <main class="p-6 max-w-4xl mx-auto w-full space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${examCards || '<p class="text-xs text-slate-400">Tidak ada ujian aktif.</p>'}</div>
                    </main>
                </div>
            `;
        };

        let currentActiveExam = null;
        let currentExamQuestions = [];

        window.recordStudentViolation = function(reasonText) {
            currentViolationCount++;
            const student = appData.currentUser;
            if (student) {
                logActivity(`Pelanggaran siswa ${student.name}: ${reasonText}`);
            }
        };

        window.startExamSession = function(examId) {
            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) return;
            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];
            currentStudentAnswers = {};
            currentDoubtfulMap = {};
            currentQuestionIndex = 0;
            remainingSeconds = ex.durationMinutes * 60;
            renderExamWorkspace();
            startExamTimer();
        };

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) timerEl.innerText = `${Math.floor(remainingSeconds/60)}m ${remainingSeconds%60}s`;
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.submitExamFinal();
                }
            }, 1000);
        }

        window.renderExamWorkspace = function() {
            const container = document.getElementById('appContainer');
            const student = appData.currentUser;
            const q = currentExamQuestions[currentQuestionIndex];
            if (!q) return;

            const gridNav = currentExamQuestions.map((item, idx) => {
                const isAns = currentStudentAnswers[item.id] !== undefined;
                let btnStyle = 'bg-slate-100 text-slate-700';
                if (idx === currentQuestionIndex) btnStyle = 'bg-blue-600 text-white font-bold ring-2 ring-blue-300';
                else if (isAns) btnStyle = 'bg-emerald-600 text-white';
                return `<button type="button" onclick="window.jumpToQuestion(${idx})" class="h-10 rounded-xl text-xs flex items-center justify-center font-bold ${btnStyle}">${idx + 1}</button>`;
            }).join('');

            let answerInputHtml = '';
            if (q.type === 'pg') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur === letter;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${letter}')" class="flex items-center gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-600 bg-blue-50' : 'bg-white'} cursor-pointer">
                            <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100'}">${letter}</span>
                            <span class="text-xs font-medium">${escapeHtml(opt)}</span>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'short_answer' || q.type === 'essay') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<textarea rows="4" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban Anda..." class="w-full p-4 border rounded-2xl text-xs">${escapeHtml(cur)}</textarea>`;
            } else {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<input type="text" value="${escapeHtml(cur)}" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Jawaban..." class="w-full p-3 border rounded-xl text-xs">`;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden">
                    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center shrink-0">
                        <div><h2 class="text-xs font-bold uppercase">${escapeHtml(currentActiveExam.examName)}</h2><p class="text-[10px] text-slate-400">${escapeHtml(student.name)} • ${escapeHtml(appData.settings.schoolName)}</p></div>
                        <div class="px-3 py-1 bg-red-600 rounded-lg text-xs font-mono font-bold" id="examCountdownTimer">60m 00s</div>
                    </header>
                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                        <section class="lg:col-span-9 p-6 overflow-y-auto space-y-4">
                            <div class="bg-white p-6 rounded-2xl border space-y-3">
                                <span class="px-2.5 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold">Soal Nomor ${currentQuestionIndex + 1}</span>
                                <p class="text-sm font-bold text-slate-900 leading-relaxed">${escapeHtml(q.questionText)}</p>
                            </div>
                            <div class="space-y-2">${answerInputHtml}</div>
                            <div class="flex justify-between pt-4">
                                <button type="button" onclick="window.prevQuestion()" class="px-4 py-2 bg-slate-200 rounded-xl text-xs font-bold">Sebelumnya</button>
                                <button type="button" onclick="window.nextQuestion()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Selanjutnya</button>
                            </div>
                        </section>
                        <aside class="lg:col-span-3 bg-white border-l p-5 flex flex-col justify-between">
                            <div class="space-y-3">
                                <h3 class="text-xs font-bold text-slate-700">PENJELAJAH SOAL</h3>
                                <div class="grid grid-cols-5 gap-2">${gridNav}</div>
                            </div>
                            <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3 bg-emerald-600 text-white rounded-xl text-xs font-extrabold shadow-md">Kirim & Selesai</button>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswer = function(qId, val) {
            currentStudentAnswers[qId] = val;
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            currentStudentAnswers[qId] = val;
            renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) { currentQuestionIndex--; renderExamWorkspace(); }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) { currentQuestionIndex++; renderExamWorkspace(); }
        };

        window.jumpToQuestion = function(idx) {
            currentQuestionIndex = idx;
            renderExamWorkspace();
        };

        window.confirmSubmitExam = function() {
            window.showModal('Konfirmasi Selesai', 'Kirim jawaban ujian sekarang?', 'info', (confirmed) => {
                if (confirmed) window.submitExamFinal();
                return true;
            }, { showCancel: true, okText: 'Kirim' });
        };

        window.submitExamFinal = async function() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const student = appData.currentUser;
            let correct = 0, totalScore = 0, maxScore = 0;

            currentExamQuestions.forEach(q => {
                maxScore += q.weight;
                const ans = currentStudentAnswers[q.id];
                if (ans !== undefined && String(ans).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase()) {
                    totalScore += q.weight;
                    correct++;
                }
            });

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id + '-' + Date.now(),
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                className: student.className || '4',
                submittedAt: new Date().toLocaleString('id-ID'),
                finalScore: Math.round((totalScore / maxScore) * 100) || 0,
                correctCount: correct,
                wrongCount: currentExamQuestions.length - correct,
                violationCount: currentViolationCount,
                essayGradingStatus: 'Sudah Dinilai',
                answersSnapshot: { ...currentStudentAnswers }
            };

            appData.examResults.push(resultObj);
            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            logActivity(`Siswa ${student.name} menyelesaikan ujian ${currentActiveExam.examName}.`);
            window.showModal('Ujian Selesai', `Jawaban berhasil dikirim dan disinkronkan ke Firestore. Nilai Akhir: ${resultObj.finalScore}`, 'success', () => {
                window.logoutApp();
            });
        };

        window.onload = function() {
            initFirebaseProduction();
        };
    </script>
</body>
</html>
