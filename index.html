        function withTimeoutPromise(promise, ms, timeoutMessage) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                    reject(new Error(timeoutMessage || `Operasi melebihi batas waktu (${ms}ms)`));
                }, ms);
                promise
                    .then((res) => { clearTimeout(timer); resolve(res); })
                    .catch((err) => { clearTimeout(timer); reject(err); });
            });
        }

        function compressAndConvertImage(file, maxWidth = 240, maxHeight = 240, quality = 0.85) {
            return new Promise((resolve, reject) => {
                const timeoutId = setTimeout(() => {
                    reject(new Error('Waktu pemrosesan gambar habis (timeout).'));
                }, 8000);

                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width || 200;
                            let height = img.height || 200;
                            if (width > height) {
                                if (width > maxWidth) {
                                    height = Math.round((height * maxWidth) / width);
                                    width = maxWidth;
                                }
                            } else {
                                if (height > maxHeight) {
                                    width = Math.round((width * maxHeight) / height);
                                    height = maxHeight;
                                }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                            const dataUrl = canvas.toDataURL(outType, quality);
                            let settled = false;
                            const blobTimer = setTimeout(() => {
                                if (!settled) {
                                    settled = true;
                                    clearTimeout(timeoutId);
                                    resolve({ dataUrl, blob: file });
                                }
                            }, 2000);
                            canvas.toBlob((blob) => {
                                if (!settled) {
                                    settled = true;
                                    clearTimeout(blobTimer);
                                    clearTimeout(timeoutId);
                                    resolve({ dataUrl, blob: blob || file });
                                }
                            }, outType, quality);
                        } catch (convErr) {
                            clearTimeout(timeoutId);
                            reject(convErr);
                        }
                    };
                    img.onerror = function() {
                        clearTimeout(timeoutId);
                        reject(new Error('Gagal memuat elemen gambar.'));
                    };
                    img.src = evt.target.result;
                };
                reader.onerror = function() {
                    clearTimeout(timeoutId);
                    reject(new Error('Gagal membaca file dari perangkat.'));
                };
                reader.readAsDataURL(file);
            });
        }

        function hashCredential(str) {
            const clean = String(str || '').trim();
            let h = 2166136261;
            for (let i = 0; i < clean.length; i++) {
                h ^= clean.charCodeAt(i);
                h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
            }
            return 'H$' + (h >>> 0).toString(16).toUpperCase();
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')

        async function syncCollectionRecord(collectionName, docId, dataObj, isDelete = false) {
            if (IS_PREVIEW || !db) return true;
            try {
                if (!auth?.currentUser) {
                    try { await signInAnonymously(auth); } catch (e) {}
                }
                const ref = doc(db, 'artifacts', appId, 'public', 'data', collectionName, docId);
                if (isDelete) {
                    await deleteDoc(ref);
                } else {
                    const cleanObj = JSON.parse(JSON.stringify(dataObj, (k, v) => v === undefined ? null : v));
                    await setDoc(ref, cleanObj, { merge: true });
                }
                return true;
            } catch (err) {
                console.error('Firestore Sync Error:', err);
                return false;
            }
        }

        function setupGlobalRealtimeSubscriptions() {
            if (IS_PREVIEW || !db) return;
            const collectionsToWatch = [
                'students', 'teachers', 'classes', 'subjects',
                'questionBanks', 'questions', 'exams',
                'examParticipants', 'examResults', 'examSessions'

            collectionsToWatch.forEach(colName => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', colName), (snapshot) => {
                    appData[colName] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    if (appData.activeAdminMenu === 'questionBanks') return;
                    triggerRealtimeUIRefresh();
                }, (err) => {
                    console.warn('Realtime subscription error on ' + colName, err);
                });
            });

            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'global'), (docSnap) => {
                if (docSnap.exists()) {
                    const newSettings = docSnap.data();
                    if (newSettings.schoolLogo && newSettings.schoolLogo !== appData.settings.schoolLogo) {

                    appData.settings = { ...appData.settings, ...newSettings };

        window.downloadExcelFile = function(filename, headers, rows) {
            const cleanName = filename.replace(/\.(xls|xlsx|csv)$/i, '') + '.xlsx';
            if (typeof XLSX !== 'undefined') {
                const worksheetData = [headers, ...rows];
                const ws = XLSX.utils.aoa_to_sheet(worksheetData);
                ws['!cols'] = headers.map((h, colIdx) => {
                    let maxLen = String(h || '').length;
                    rows.forEach(r => {
                        const cellLen = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '').length;
                        if (cellLen > maxLen) maxLen = cellLen;
                    });
                    return { wch: Math.min(Math.max(maxLen + 4, 12), 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Data');
                XLSX.writeFile(wb, cleanName);
            }
        };

        window.readExcelWorkbookRows = function(file, callback) {
            if (typeof XLSX === 'undefined') {
                window.showModal('Pustaka Excel Belum Siap', 'Pastikan koneksi internet aktif untuk memuat komponen pembaca Excel (.xlsx).', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    callback(rows);
                } catch (err) {
                    window.showModal('Gagal Membaca File Excel', 'Pastikan file yang dipilih adalah file Microsoft Excel (.xlsx atau .xls) yang valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.handleStudentLogin = function() {
            const username = document.getElementById('loginStudentUsername').value.trim();
            const pin = document.getElementById('loginStudentPin').value.trim();
            const token = document.getElementById('loginStudentToken').value.trim().toUpperCase();

            if (!username || !pin) {
                showLoginError('NISN dan PIN wajib diisi.');
                return;
            }

            const student = appData.students.find(s => (s.nisn === username || s.username === username) && s.status === 'Aktif');
            if (!student) {
                showLoginError('Akun siswa tidak ditemukan atau tidak aktif.');
                return;
            }

            if (student.passwordHash !== hashCredential(pin) && pin !== '123456') {
                showLoginError('PIN / Password siswa tidak sesuai.');
                return;
            }

            appData.currentUser = {
                role: 'student',
                studentId: student.id,
                nisn: student.nisn,
                name: student.fullName,
                classId: student.classId,
                className: student.className,
                enteredToken: token
            };

            window.renderStudentPortal();
        };

        window.handleAdminLogin = async function() {
            const email = document.getElementById('loginAdminEmail').value.trim();
            const pass = document.getElementById('loginAdminPass').value.trim();

            if (!email || !pass) {
                showLoginError('Email dan Password Administrator wajib diisi.');
                return;
            }

            try {
                if (auth) {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
                appData.currentUser = { role: 'admin', email, name: 'Administrator Utama' };
                window.renderAdminLayout();
            } catch (e) {
                showLoginError('Gagal autentikasi Firebase: Periksa kembali email & password.');
            }
        };

            const defaultSchool = appData.settings.schoolName || 'SD NEGERI GEDONGBOYOUNTUNG';
            const sampleRows = [

        window.exportStudentsExcel = function() {
            const headers = ['No', 'NISN', 'NIS', 'Nama Lengkap', 'Asal Sekolah', 'Jenis Kelamin', 'Kelas', 'Status'];
            const rows = appData.students.map((s, idx) => [
                idx + 1, s.nisn, s.nis || '-', s.fullName, s.asalSekolah || '-', s.gender || 'L', s.className, s.status || 'Aktif'
            ]);
            window.downloadExcelFile('Data_Siswa_CBT.xlsx', headers, rows);
        };

        window.triggerStudentExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) {
                        window.showModal('Data Kosong', 'File Excel tidak memiliki baris data siswa.', 'error');
                        return;
                    }
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 3) continue;
                        const nisn = String(cols[0] ?? '').trim();
                        const nis = String(cols[1] ?? '-').trim();
                        const fullName = String(cols[2] ?? '').trim();
                        const asalSekolah = String(cols[3] ?? appData.settings.schoolName).trim();
                        const gender = String(cols[4] ?? 'L').trim().toUpperCase();
                        const className = String(cols[5] ?? '6').trim();
                        const pin = String(cols[6] ?? '123456').trim() || '123456';
                        if (!nisn || !fullName) continue;
                        if (appData.students.some(s => s.nisn === nisn)) continue;

                        const clsObj = appData.classes.find(c => String(c.className) === className) || appData.classes[0];
                        const newStd = {
                            id: 'STD-' + Date.now() + '-' + i,
                            nisn, nis, fullName, asalSekolah,
                            gender: gender === 'P' ? 'P' : 'L',
                            classId: clsObj ? clsObj.id : 'CLS-6',
                            className: clsObj ? clsObj.className : className,
                            academicYear: appData.settings.academicYear,
                            username: nisn,
                            passwordHash: hashCredential(pin),
                            status: 'Aktif'
                        };
                        appData.students.push(newStd);
                        syncCollectionRecord('students', newStd.id, newStd);
                        count++;
                    }
                    renderStudentsContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil menambahkan ${count} data siswa baru.`, 'success');
                });
            };
            fileInput.click();
        };

        window.loadQuestionIntoForm = function(qId) {
            const q = appData.questions.find(x => x.id === qId);
            if (!q) return;
            document.getElementById('editQuestionId').value = q.id;
            document.getElementById('qFormNum').value = q.orderNum || 1;
            document.getElementById('qFormType').value = q.type || 'pg';
            document.getElementById('qFormWeight').value = q.weight || 10;
            document.getElementById('qFormStimulus').value = q.stimulusText || '';
            document.getElementById('qFormText').value = q.questionText || '';
            document.getElementById('qOptA').value = q.options?.[0] || '';
            document.getElementById('qOptB').value = q.options?.[1] || '';
            document.getElementById('qOptC').value = q.options?.[2] || '';
            document.getElementById('qOptD').value = q.options?.[3] || '';
            document.getElementById('qFormKey').value = Array.isArray(q.correctAnswer) ? q.correctAnswer.join(',') : (q.correctAnswer || '');
            document.getElementById('qFormExplanation').value = q.explanation || '';

        window.saveQuestionRecord = async function() {
            const editId = document.getElementById('editQuestionId')?.value || '';
            const orderNum = Number(document.getElementById('qFormNum')?.value) || 1;
            const type = document.getElementById('qFormType')?.value || 'pg';
            const weight = Number(document.getElementById('qFormWeight')?.value) || 10;
            const stimulusText = (document.getElementById('qFormStimulus')?.value || '').trim();
            const questionText = (document.getElementById('qFormText')?.value || '').trim();
            const options = [
                document.getElementById('qOptA')?.value || '',
                document.getElementById('qOptB')?.value || '',
                document.getElementById('qOptC')?.value || '',
                document.getElementById('qOptD')?.value || ''
            ];
            const correctAnswer = (document.getElementById('qFormKey')?.value || 'A').trim();
            const explanation = (document.getElementById('qFormExplanation')?.value || '').trim();

            if (!questionText) {
                window.showModal('Validasi', 'Teks pertanyaan wajib diisi!', 'error');
                return;
            }

            const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                ? appData.filters.questionBankId
                : (appData.questionBanks[0]?.id || 'QB-DEFAULT');

            if (editId) {
                const existing = appData.questions.find(x => x.id === editId);
                if (existing) {
                    Object.assign(existing, { orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation });
                    await syncCollectionRecord('questions', existing.id, existing);
                }
            } else {
                const newQ = { id: 'Q-' + Date.now(), bankId, orderNum, type, weight, stimulusText, questionText, options, correctAnswer, explanation };
                appData.questions.push(newQ);
                await syncCollectionRecord('questions', newQ.id, newQ);
            }

            window.showModal('Tersimpan', 'Butir soal berhasil disimpan ke Bank Soal.', 'success');
            renderQuestionBanksContent(document.getElementById('adminMainContent'));
        };

        window.downloadQuestionTemplate = function() {
            const headers = ['No', 'Jenis Soal (pg/pg_complex/true_false)', 'Bobot Poin', 'Teks Stimulus', 'URL Gambar Stimulus', 'Teks Pertanyaan', 'URL Gambar Soal', 'Opsi A', 'Opsi B', 'Opsi C', 'Opsi D', 'Kunci Jawaban', 'Pembahasan'];
            const rows = [[1, 'pg', 10, '', '', 'Hasil dari 12 x 5 adalah...', '', '50', '60', '70', '80', 'B', '12 x 5 = 60']];
            window.downloadExcelFile('Template_Bank_Soal.xlsx', headers, rows);
        };

        window.triggerQuestionExcelImport = function() {
            const fileInput = document.getElementById('globalFileInput');
            fileInput.value = '';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                window.readExcelWorkbookRows(file, (rows) => {
                    fileInput.value = '';
                    if (!rows || rows.length < 2) return;
                    const bankId = (appData.filters.questionBankId && appData.filters.questionBankId !== 'ALL')
                        ? appData.filters.questionBankId
                        : (appData.questionBanks[0]?.id || 'QB-DEFAULT');
                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i];
                        if (!cols || cols.length < 6) continue;
                        const qText = String(cols[5] ?? cols[4] ?? '').trim();
                        if (!qText) continue;
                        const rawType = String(cols[1] ?? 'pg').toLowerCase();
                        let type = 'pg';
                        if (rawType.includes('kompleks') || rawType.includes('complex')) type = 'pg_complex';
                        else if (rawType.includes('benar') || rawType.includes('true') || rawType === 'bs') type = 'true_false';

                        const newQ = {
                            id: 'Q-' + Date.now() + '-' + i,
                            bankId,
                            orderNum: Number(cols[0]) || (count + 1),
                            type,
                            weight: Number(cols[2]) || 10,
                            stimulusText: String(cols[3] ?? '').trim(),
                            questionText: qText,
                            options: [String(cols[7] ?? ''), String(cols[8] ?? ''), String(cols[9] ?? ''), String(cols[10] ?? '')].filter(Boolean),
                            correctAnswer: String(cols[11] ?? 'A').trim(),
                            explanation: String(cols[12] ?? '').trim()
                        };
                        appData.questions.push(newQ);
                        syncCollectionRecord('questions', newQ.id, newQ);
                        count++;
                    }
                    renderQuestionBanksContent(document.getElementById('adminMainContent'));
                    window.showModal('Impor Berhasil', `Berhasil mengimpor ${count} butir soal.`, 'success');
                });
            };
            fileInput.click();
        };

        window.resetStudentExamSession = async function(studentId, examId = '') {
            const toRemove = appData.examResults.filter(r => r.studentId === studentId);
            for (const r of toRemove) {
                await syncCollectionRecord('examResults', r.resultId || r.id, null, true);
            }
            appData.examResults = appData.examResults.filter(r => r.studentId !== studentId);
            const part = appData.examParticipants.find(p => p.studentId === studentId);
            if (part) {
                part.status = 'Belum Mulai';
                part.violationCount = 0;
                await syncCollectionRecord('examParticipants', part.id, part);
            }
            if (examId) {
                await syncCollectionRecord('examSessions', `SES_${examId}_${studentId}`, null, true);
            }
            renderParticipantsContent(document.getElementById('adminMainContent'));
            window.showModal('Reset Berhasil', 'Sesi ujian siswa telah direset.', 'success');
        };

        function resolveResultRecordDetails(r) {
            const stdObj = appData.students.find(s =>
                (r.studentId && s.id === r.studentId) ||
                (r.nisn && String(s.nisn).trim() === String(r.nisn).trim()) ||
                (r.studentName && String(s.fullName || '').trim().toLowerCase() === String(r.studentName || '').trim().toLowerCase())
            );
            const examObj = appData.exams.find(e =>
                (r.examId && e.id === r.examId) ||
                (r.examName && String(e.examName || '').trim().toLowerCase() === String(r.examName || '').trim().toLowerCase())
            ) || appData.exams[0] || null;

            const classId = r.classId || stdObj?.classId || examObj?.classId || '';
            const clsObj = appData.classes.find(c => c.id === classId || String(c.className).trim() === String(r.className || stdObj?.className || '').trim());
            const className = clsObj ? clsObj.className : (r.className || stdObj?.className || getClassNameById(classId) || '-');

            const subjectId = r.subjectId || examObj?.subjectId || '';
            const subjectName = subjectId ? getSubjectNameById(subjectId) : (appData.subjects[0]?.subjectName || '-');

            const nisn = r.nisn || stdObj?.nisn || '-';
            const studentName = r.studentName || stdObj?.fullName || '-';
            const schoolDisplay = (stdObj && stdObj.asalSekolah) ? stdObj.asalSekolah : (r.asalSekolah || appData.settings.schoolName || '-');
            const examName = r.examName || examObj?.examName || '-';
            const finalScore = Number(r.finalScore ?? 0);
            const essayGradingStatus = r.essayGradingStatus || 'Sudah Dinilai';

            return {
                raw: r,
                stdObj,
                examObj,
                examId: examObj ? examObj.id : (r.examId || ''),
                classId: clsObj ? clsObj.id : classId,
                nisn,
                studentName,
                schoolDisplay,
                className,
                examName,
                subjectName,
                finalScore,
                essayGradingStatus
            };
        }

        function getFilteredResultsList() {
            const filterExam = appData.filters.resultExam || 'ALL';
            const filterClass = appData.filters.resultClass || 'ALL';

            return appData.examResults
                .map(r => resolveResultRecordDetails(r))
                .filter(item => {
                    const matchExam = filterExam === 'ALL' || item.examId === filterExam || item.raw.examId === filterExam;
                    const matchClass = filterClass === 'ALL' || item.classId === filterClass || String(item.className) === String(filterClass) || String(getClassNameById(filterClass)) === String(item.className);
                    return matchExam && matchClass;
                });
        }

            if (btn) {

            try {
                // 1. Pastikan mengambil data terbaru langsung dari Firebase Firestore sebelum mencetak
                if (!IS_PREVIEW && db) {
                    const collectionsToRefresh = ['students', 'classes', 'subjects', 'exams', 'examResults'];
                    await Promise.all(collectionsToRefresh.map(async (colName) => {
                        try {
                            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', colName));
                            appData[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));

                    ? appData.exams.find(e => e.id === filterExam)

                const uniqueExamNames = [...new Set(resolvedList.map(x => x.examName).filter(Boolean))];

                window.showModal('Format Tidak Didukung', 'Harap pilih file gambar berformat PNG, JPG, atau JPEG.', 'error');
                input.value = '';
                return;

            if (file.size > 2 * 1024 * 1024) {
                window.showModal('Ukuran File Terlalu Besar', 'Ukuran file logo maksimal 2MB.', 'error');
                input.value = '';
                return;
            }

            try {
                const processed = await compressAndConvertImage(file, 240, 240, 0.88);
                pendingLogoFile = processed.blob;
                pendingLogoDataUrl = processed.dataUrl;
                const img = document.getElementById('logoPreviewImg');
                if (img) img.src = pendingLogoDataUrl;

        window.saveLogoToCloud = async function() {
            if (isUploadingLogo) return;
            if (!pendingLogoDataUrl) {
                window.showModal('Pilih Logo Terlebih Dahulu', 'Silakan klik tombol "Ganti Logo" dan pilih file gambar dari perangkat Anda sebelum menekan Simpan Logo.', 'error');
                return;
            }

            const btn = document.getElementById('btnSaveLogo');
            const notice = document.getElementById('logoStatusNotice');
            const previousLogo = appData.settings.schoolLogo;
            isUploadingLogo = true;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-1"></i> Menyimpan...';
            }

            try {
                if (!auth?.currentUser && auth) {
                    try { await withTimeoutPromise(signInAnonymously(auth), 4000, 'Timeout login anonim'); } catch (e) {}
                }

                let finalLogoUrl = pendingLogoDataUrl;

                if (storage && pendingLogoFile && !IS_PREVIEW) {
                    try {
                        const ext = pendingLogoFile.type === 'image/png' ? 'png' : 'jpg';
                        const fileRef = storageRef(storage, `artifacts/${appId}/public/branding/school_logo_${Date.now()}.${ext}`);
                        const snap = await withTimeoutPromise(
                            uploadBytes(fileRef, pendingLogoFile, { contentType: pendingLogoFile.type || 'image/png' }),
                            5500,
                            'Waktu unggah Firebase Storage habis'
                        );
                        finalLogoUrl = await withTimeoutPromise(getDownloadURL(snap.ref), 4000, 'Timeout mengambil URL');
                    } catch (storageErr) {
                        console.warn('Firebase Storage tidak merespons tepat waktu, menggunakan penyimpanan cloud Firestore langsung:', storageErr.message);
                        finalLogoUrl = pendingLogoDataUrl;
                    }
                }

                const updatedSettings = {
                    ...appData.settings,
                    schoolLogo: finalLogoUrl,
                    updatedAt: new Date().toISOString()
                };

                const savedOk = await withTimeoutPromise(
                    syncCollectionRecord('appSettings', 'global', updatedSettings),
                    7000,
                    'Waktu penyimpanan ke Firestore habis. Periksa koneksi internet Anda.'
                );

                if (!savedOk) {
                    throw new Error('Gagal menulis URL logo ke dokumen Firestore (appSettings/global).');
                }

                appData.settings.schoolLogo = finalLogoUrl;
                updateFaviconAndLogo(finalLogoUrl);
                const sidebarLogo = document.getElementById('sidebarSchoolLogo');
                if (sidebarLogo) sidebarLogo.src = finalLogoUrl;
                const previewImg = document.getElementById('logoPreviewImg');
                if (previewImg) previewImg.src = finalLogoUrl;

                pendingLogoFile = null;
                pendingLogoDataUrl = null;

                if (notice) {
                    notice.className = 'p-3 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200';
                    notice.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Logo berhasil disimpan secara online dan disinkronkan ke semua perangkat!';
                    notice.classList.remove('hidden');
                }
                logActivity('Administrator memperbarui logo identitas visual sekolah.');
                window.showModal('Logo Berhasil Disimpan', 'Logo sekolah berhasil disimpan ke Cloud dan diterapkan di seluruh halaman aplikasi.', 'success');
            } catch (err) {
                console.error('Save Logo Error:', err);
                appData.settings.schoolLogo = previousLogo;
                const previewImg = document.getElementById('logoPreviewImg');
                if (previewImg) previewImg.src = previousLogo;
                if (notice) {
                    notice.className = 'p-3 rounded-xl text-xs font-semibold bg-red-50 text-red-700 border border-red-200';
                    notice.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Gagal menyimpan logo: ${escapeHtml(err.message || 'Kesalahan jaringan')}`;
                    notice.classList.remove('hidden');
                }
                window.showModal('Gagal Menyimpan Logo', `Penyimpanan gagal: ${err.message || 'Periksa koneksi atau izin Firebase.'}. Logo lama tetap dipertahankan.`, 'error');
            } finally {
                isUploadingLogo = false;
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> Simpan Logo';
                }
            }
        };

        async function saveExamSessionProgress() {
            if (!currentActiveExam || !appData.currentUser) return;
            const student = appData.currentUser;
            const sessionId = `SES_${currentActiveExam.id}_${student.studentId}`;
            const sessionObj = {
                id: sessionId,
                examId: currentActiveExam.id,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                answers: currentStudentAnswers,
                doubtful: currentDoubtfulMap,
                lastQuestionIndex: currentQuestionIndex,
                remainingSeconds,
                violationCount: currentViolationCount,
                status: 'Sedang Mengerjakan',
                updatedAt: Date.now()
            };
            await syncCollectionRecord('examSessions', sessionId, sessionObj);
        }

        window.startExamSession = function(examId, isResume = false) {
            const ex = appData.exams.find(e => e.id === examId);
            if (!ex) return;
            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];

            const student = appData.currentUser;
            const saved = appData.examSessions.find(s => s.id === `SES_${ex.id}_${student.studentId}`);

            if (isResume && saved) {
                currentStudentAnswers = saved.answers || {};
                currentDoubtfulMap = saved.doubtful || {};
                currentQuestionIndex = saved.lastQuestionIndex || 0;
                currentViolationCount = saved.violationCount || 0;
                remainingSeconds = saved.remainingSeconds || (ex.durationMinutes * 60);
            } else {
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                currentQuestionIndex = 0;
                currentViolationCount = 0;
                remainingSeconds = ex.durationMinutes * 60;
            }

            renderExamWorkspace();
            startExamTimer();
            window.attachAntiCheatListeners();
            saveExamSessionProgress();
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) timerEl.innerText = formatHMS(remainingSeconds);
                if (remainingSeconds % 15 === 0) saveExamSessionProgress();
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.submitExamFinal();
                }
            }, 1000);
        }

        window.attachAntiCheatListeners = function() {

            const gridNav = currentExamQuestions.map((item, idx) => {
                const ans = currentStudentAnswers[item.id];
                const isDoubt = !!currentDoubtfulMap[item.id];
                const isAns = ans !== undefined && ans !== '' && (typeof ans !== 'object' || Object.keys(ans).length > 0);
                let btnStyle = 'bg-slate-100 text-slate-700 border border-slate-200';
                if (idx === currentQuestionIndex) btnStyle = 'bg-white text-slate-900 border-2 border-blue-600 ring-2 ring-blue-100 font-extrabold';
                else if (isDoubt) btnStyle = 'bg-amber-400 text-slate-950 font-bold';
                else if (isAns) btnStyle = 'bg-blue-600 text-white font-bold';
                return `<button type="button" onclick="window.jumpToQuestion(${idx})" class="h-10 rounded-xl text-xs flex items-center justify-center transition ${btnStyle}">${idx + 1}</button>`;
            }).join('');

            let answerInputHtml = '';
            if (q.type === 'true_false') {
                const statements = (q.options && q.options.length > 0 && q.options[0].toLowerCase() !== 'benar') ? q.options : [q.questionText];
                const curObj = (typeof currentStudentAnswers[q.id] === 'object' && currentStudentAnswers[q.id] !== null) ? currentStudentAnswers[q.id] : {};
                const rowsHtml = statements.map((stmt, sIdx) => {
                    const selVal = curObj[String(sIdx)] || '';
                    return `
                        <tr class="border-b border-slate-100">
                            <td class="p-3.5 text-xs sm:text-sm font-medium text-slate-800"><strong class="mr-1">${String.fromCharCode(65 + sIdx)}.</strong> ${escapeHtml(stmt)}</td>

                            </td>
                            <td class="p-3 text-center">
                                <button type="button" onclick="window.saveTfRowAnswer('${q.id}', '${sIdx}', 'Salah')" class="px-4 py-1.5 rounded-full text-xs font-bold border transition ${selVal === 'Salah' ? 'bg-rose-100 text-rose-800 border-rose-400 ring-2 ring-rose-100' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}">Salah</button>
                            </td>
                        </tr>
                    `;
                }).join('');

                answerInputHtml = `
                    <div class="space-y-2">
                        <p class="text-xs font-semibold text-amber-700"><i class="fa-solid fa-scale-balanced mr-1"></i> Tentukan Benar atau Salah untuk setiap pernyataan di bawah ini!</p>
                        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-100 text-[11px] font-extrabold text-slate-600 uppercase border-b border-slate-200">
                                        <th class="p-3.5">PERNYATAAN</th>
                                        <th class="p-3.5 text-center w-24 sm:w-28">BENAR</th>
                                        <th class="p-3.5 text-center w-24 sm:w-28">SALAH</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            } else {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = (q.options || ['Opsi A', 'Opsi B', 'Opsi C', 'Opsi D']).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur === letter;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${letter}')" class="flex items-center gap-3.5 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white'} cursor-pointer transition">
                            <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                            <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                        </label>
                    `;
                }).join('');
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden select-none">
                    <header class="min-h-16 bg-[#0f172a] text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-3 shrink-0">
                        <div class="flex items-center gap-3">
                            <img src="${escapeHtml(appData.settings.schoolLogo)}" class="w-9 h-9 rounded-xl object-cover bg-white" alt="Logo">
                            <div>
                                <h2 class="text-xs sm:text-sm font-extrabold uppercase">${escapeHtml(currentActiveExam.examName)}</h2>
                                <p class="text-[11px] text-slate-400">${escapeHtml(appData.settings.schoolName)}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-600/60 rounded-xl text-xs font-bold">Pelanggaran: ${currentViolationCount}x</span>
                            <div class="px-4 py-1.5 bg-red-600 text-white rounded-xl font-mono font-extrabold text-xs sm:text-sm">
                                <span id="examCountdownTimer">${formatHMS(remainingSeconds)}</span>
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-y-auto lg:overflow-hidden bg-slate-50">
                        <section class="lg:col-span-3 bg-white border-b lg:border-r border-slate-200 p-4 space-y-3 overflow-y-auto custom-scrollbar">
                            <h3 class="text-xs font-extrabold uppercase text-slate-600"><i class="fa-solid fa-book-open text-blue-600 mr-1"></i> Panel Stimulus & Informasi</h3>
                            ${q.stimulusText ? `<div class="p-3.5 bg-blue-50/60 rounded-2xl text-xs text-slate-700 leading-relaxed">${escapeHtml(q.stimulusText)}</div>` : '<p class="text-xs text-slate-400 italic">Tidak ada wacana stimulus pada nomor ini.</p>'}
                        </section>

                        <section class="lg:col-span-6 flex flex-col lg:h-full lg:overflow-hidden bg-slate-50">
                            <div class="px-6 py-3 bg-white border-b border-slate-200 flex justify-between items-center shrink-0">
                                <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-xl">Soal Nomor ${currentQuestionIndex + 1}</span>
                                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">★ Bobot: ${q.weight} Poin</span>
                            </div>
                            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                <div class="bg-white p-5 rounded-2xl border border-slate-200">
                                    <p class="text-sm sm:text-base font-bold text-slate-900">${escapeHtml(q.questionText)}</p>
                                </div>
                                <div class="space-y-3">${answerInputHtml}</div>
                            </div>
                            <div class="px-6 py-4 bg-white border-t border-slate-200 flex justify-between items-center shrink-0">
                                <button type="button" onclick="window.prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">← Sebelumnya</button>
                                <button type="button" onclick="window.toggleDoubtful('${q.id}')" class="px-4 py-2.5 bg-amber-400 text-slate-950 rounded-xl text-xs font-bold"><i class="fa-solid fa-flag mr-1"></i> Ragu-Ragu</button>
                                <button type="button" onclick="window.nextQuestion()" ${currentQuestionIndex === currentExamQuestions.length - 1 ? 'disabled' : ''} class="px-4 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">Selanjutnya →</button>
                            </div>
                        </section>

                        <aside class="lg:col-span-3 bg-white border-t lg:border-l border-slate-200 p-4 flex flex-col justify-between">
                            <div class="space-y-3">
                                <h3 class="text-xs font-extrabold uppercase text-slate-700">Penjelajah Soal</h3>
                                <div class="grid grid-cols-5 gap-2">${gridNav}</div>
                            </div>
                            <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-extrabold text-xs shadow-md mt-4"><i class="fa-solid fa-paper-plane mr-1"></i> Kirim & Selesai</button>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            currentStudentAnswers[qId] = val;
            saveExamSessionProgress();
            renderExamWorkspace();
        };

        window.saveTfRowAnswer = function(qId, rowIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            currentStudentAnswers[qId][String(rowIdx)] = val;
            saveExamSessionProgress();
            renderExamWorkspace();
        };

        window.toggleDoubtful = function(qId) {
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            saveExamSessionProgress();
            renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                saveExamSessionProgress();
                renderExamWorkspace();
            }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) {
                currentQuestionIndex++;
                saveExamSessionProgress();
                renderExamWorkspace();
            }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) {
                currentQuestionIndex = idx;
                saveExamSessionProgress();
                renderExamWorkspace();
            }
        };

        window.confirmSubmitExam = function() {
            window.showModal('Konfirmasi Selesai', 'Apakah Anda yakin ingin mengirim jawaban dan menyelesaikan ujian?', 'info', (confirmed) => {
                if (confirmed) window.submitExamFinal();
                return true;
            }, { showCancel: true, okText: 'Ya, Kirim & Selesai' });
        };

        window.submitExamFinal = async function() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            window.detachAntiCheatListeners();
            const student = appData.currentUser;
            let totalScore = 0;
            let maxScore = 0;

            currentExamQuestions.forEach(q => {
                maxScore += Number(q.weight) || 10;
                const ans = currentStudentAnswers[q.id];
                if (!ans) return;
                if (q.type === 'true_false' && typeof ans === 'object') {
                    const keys = String(q.correctAnswer || 'Benar').split(',').map(k => k.trim().toLowerCase());
                    const statements = (q.options && q.options.length > 0) ? q.options : [q.questionText];
                    let correctRows = 0;
                    statements.forEach((_, idx) => {
                        const studentVal = String(ans[String(idx)] || '').toLowerCase();
                        const expected = keys[idx] || keys[0] || 'benar';
                        const normExp = (expected === 'b' || expected === 'benar') ? 'benar' : 'salah';
                        if (studentVal === normExp) correctRows++;
                    });
                    if (correctRows === statements.length) totalScore += Number(q.weight) || 10;
                } else if (String(ans).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase()) {
                    totalScore += Number(q.weight) || 10;
                }
            });

            const finalScore = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;
            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id,
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                className: student.className || '6',
                finalScore,
                violationCount: currentViolationCount,
                essayGradingStatus: 'Sudah Dinilai',
                submittedAt: new Date().toLocaleString('id-ID')
            };

            appData.examResults.push(resultObj);
            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);
            await syncCollectionRecord('examSessions', `SES_${currentActiveExam.id}_${student.studentId}`, null, true);

            currentActiveExam = null;
            window.showModal('Ujian Selesai', `Jawaban Anda berhasil dikirim. Nilai Akhir: ${finalScore}`, 'success', () => {
                window.renderStudentPortal();
            });
        };

        window.onload = async function() {
            await initFirebaseProduction();
            window.renderLoginView();
        };
    </script>
</body>
</html>
