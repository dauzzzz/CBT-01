        window.startExamSession = async function(examId) {
            const verification = await verifyExamAccessFromFirestore(examId, { ignoreFinished: false });
            if (!verification.allowed) {
                window.showModal(
                    'Akses Ujian Ditolak',
                    verification.code === 'ALREADY_FINISHED' ? verification.reason : BLOCKED_EXAM_MESSAGE,
                    'error'
                );
                window.renderStudentPortal();
                return;
            }

            const ex = verification.exam;
            currentActiveExam = ex;

            let bankQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (bankQuestions.length === 0 && ex.bankId) {
                bankQuestions = appData.questions.filter(q => q.bankId === ex.bankId);
            }
            if (bankQuestions.length === 0) {
                bankQuestions = [...appData.questions];
            }
            currentExamQuestions = bankQuestions;

            const student = appData.currentUser;
            const sessionId = `SES_${ex.id}_${student.studentId}`;
            let savedSession = appData.examSessions.find(s => s.id === sessionId);

            if (!IS_PREVIEW && db) {
                try {
                    const sesSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'examSessions', sessionId));
                    if (sesSnap.exists()) {
                        savedSession = { ...sesSnap.data(), id: sesSnap.id };
                    }
                } catch (e) {}
            }

            if (savedSession && savedSession.answersSnapshot) {
                currentStudentAnswers = JSON.parse(JSON.stringify(savedSession.answersSnapshot || {}));
                currentDoubtfulMap = JSON.parse(JSON.stringify(savedSession.doubtfulSnapshot || {}));
                remainingSeconds = (typeof savedSession.remainingSeconds === 'number' && savedSession.remainingSeconds > 0)
                    ? savedSession.remainingSeconds
                    : (ex.durationMinutes * 60);
                currentQuestionIndex = Math.min(
                    Math.max(0, Number(savedSession.currentQuestionIndex) || 0),
                    Math.max(0, currentExamQuestions.length - 1)
                );
                currentViolationCount = Number(savedSession.violationCount) || 0;
            } else {
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                currentQuestionIndex = 0;
                currentViolationCount = 0;
                remainingSeconds = (Number(ex.durationMinutes) || 60) * 60;
            }

            lastViolationTimestamp = 0;

            if (student) {
                let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
                if (!p) {
                    p = {
                        id: 'PRT-' + student.studentId + '-' + ex.id,
                        examId: ex.id,
                        studentId: student.studentId,
                        nisn: student.nisn,
                        studentName: student.name,
                        className: student.className || '6',
                        status: 'Sedang Mengerjakan',
                        violationCount: currentViolationCount,
                        extraTimeMinutes: 0
                    };
                    appData.examParticipants.push(p);
                } else {
                    p.status = 'Sedang Mengerjakan';
                    currentViolationCount = p.violationCount || currentViolationCount;
                }
                syncCollectionRecord('examParticipants', p.id, p);
            }

            renderExamWorkspace();
            startExamTimer();
            window.attachAntiCheatListeners();
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(async () => {
                if (!currentActiveExam) {
                    clearInterval(examTimerInterval);
                    return;
                }

                // Evaluasi lokal setiap detik terhadap status & jadwal ujian
                const localCheck = evaluateExamEligibilityLocal(
                    appData.exams.find(e => e.id === currentActiveExam.id) || currentActiveExam,
                    appData.currentUser,
                    { ignoreFinished: true }
                );
                if (!localCheck.allowed) {
                    clearInterval(examTimerInterval);
                    await forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                    return;
                }

                remainingSeconds--;
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) timerEl.innerText = formatHMS(remainingSeconds);
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.detachAntiCheatListeners();
                    window.showModal('Waktu Habis', 'Waktu ujian telah berakhir. Jawaban Anda dikirim otomatis.', 'info', () => {
                        window.submitExamFinal();
                    });
                }
            }, 1000);
        }

        window.attachAntiCheatListeners = function() {
            window.detachAntiCheatListeners();
            isExamWorkspaceActive = true;
            isViolationModalOpen = false;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isExamWorkspaceActive && currentActiveExam && !isViolationModalOpen) {
                    window.recordStudentViolation('Berpindah tab atau keluar dari halaman ujian.');
                }
            });
        };

        window.detachAntiCheatListeners = function() {
            isExamWorkspaceActive = false;
        };

        window.recordStudentViolation = function(reasonText) {
            const now = Date.now();
            if (now - lastViolationTimestamp < 3500 || isViolationModalOpen || !isExamWorkspaceActive || !currentActiveExam) return;
            lastViolationTimestamp = now;
            isViolationModalOpen = true;
            currentViolationCount++;
            const badgeEl = document.getElementById('examViolationCounter');
            if (badgeEl) badgeEl.innerText = `Pelanggaran: ${currentViolationCount}x`;

            const student = appData.currentUser;
            if (student && currentActiveExam) {
                let p = appData.examParticipants.find(x => x.examId === currentActiveExam.id && x.studentId === student.studentId);
                if (p) {
                    p.violationCount = currentViolationCount;
                    syncCollectionRecord('examParticipants', p.id, p);
                }
            }

            window.showModal('PERINGATAN PELANGGARAN!', `Sistem mendeteksi Anda keluar dari halaman ujian (${reasonText}). Total pelanggaran: ${currentViolationCount}x`, 'error', () => {
                isViolationModalOpen = false;
            }, { okText: 'Saya Mengerti' });
        };

        function isQuestionAnswered(ans) {
            if (ans === undefined || ans === null || ans === '') return false;
            if (Array.isArray(ans)) return ans.length > 0;
            if (typeof ans === 'object') return Object.keys(ans).length > 0;
            return true;
        }

        window.renderExamWorkspace = function() {
            if (!currentActiveExam) {
                window.renderStudentPortal();
                return;
            }
            const liveExam = appData.exams.find(e => e.id === currentActiveExam.id) || currentActiveExam;
            const eligibility = evaluateExamEligibilityLocal(liveExam, appData.currentUser, { ignoreFinished: true });
            if (!eligibility.allowed) {
                forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                return;
            }

            const container = document.getElementById('appContainer');
            const q = currentExamQuestions[currentQuestionIndex];
            if (!q) return;

            const gridNav = currentExamQuestions.map((item, idx) => {
                const ans = currentStudentAnswers[item.id];
                const isDoubt = !!currentDoubtfulMap[item.id];
                const isAns = isQuestionAnswered(ans);

                let btnStyle = 'bg-slate-100 text-slate-700 border border-slate-200';
                if (idx === currentQuestionIndex) btnStyle = 'bg-white text-slate-900 border-2 border-blue-600 ring-2 ring-blue-100 font-extrabold';
                else if (isDoubt) btnStyle = 'bg-amber-400 text-slate-950 font-bold';
                else if (isAns) btnStyle = 'bg-blue-600 text-white font-bold';

                return `<button type="button" onclick="window.jumpToQuestion(${idx})" class="h-10 rounded-xl text-xs flex items-center justify-center transition ${btnStyle}">${idx + 1}</button>`;
            }).join('');

            let answerInputHtml = '';
            if (q.type === 'pg') {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = cur === letter;
                    return `
                        <label onclick="window.saveAnswerAndRefresh('${q.id}', '${letter}')" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-blue-500 bg-blue-50/40 ring-2 ring-blue-100' : 'border-slate-200 bg-white'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                            </div>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'pg_complex') {
                const curArr = Array.isArray(currentStudentAnswers[q.id]) ? currentStudentAnswers[q.id] : [];
                answerInputHtml = (q.options || []).map((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const selected = curArr.includes(letter);
                    return `
                        <label onclick="window.togglePgComplexAnswer('${q.id}', '${letter}')" class="flex items-center justify-between gap-3 p-3.5 rounded-2xl border ${selected ? 'border-indigo-500 bg-indigo-50/40 ring-2 ring-indigo-100' : 'border-slate-200 bg-white'} cursor-pointer transition">
                            <div class="flex items-center gap-3.5">
                                <span class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-extrabold ${selected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">${letter}</span>
                                <span class="text-sm font-medium text-slate-800">${escapeHtml(opt)}</span>
                            </div>
                            <i class="fa-solid ${selected ? 'fa-square-check text-indigo-600' : 'fa-square text-slate-300'} text-lg"></i>
                        </label>
                    `;
                }).join('');
            } else if (q.type === 'true_false') {
                const statements = (Array.isArray(q.options) && q.options.some(Boolean))
                    ? q.options.filter(Boolean)
                    : [q.questionText];
                const curObj = (typeof currentStudentAnswers[q.id] === 'object' && currentStudentAnswers[q.id] !== null) ? currentStudentAnswers[q.id] : {};
                const rowsHtml = statements.map((stmt, sIdx) => {
                    const selVal = curObj[String(sIdx)] || '';
                    return `
                        <tr class="border-b border-slate-100">
                            <td class="p-3 text-xs font-semibold text-slate-800">${String.fromCharCode(65 + sIdx)}. ${escapeHtml(stmt)}</td>
                            <td class="p-3 text-center"><button type="button" onclick="window.saveTfRowAnswer('${q.id}', '${sIdx}', 'Benar')" class="px-4 py-1.5 rounded-full text-xs font-bold transition ${selVal === 'Benar' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700'}">Benar</button></td>
                            <td class="p-3 text-center"><button type="button" onclick="window.saveTfRowAnswer('${q.id}', '${sIdx}', 'Salah')" class="px-4 py-1.5 rounded-full text-xs font-bold transition ${selVal === 'Salah' ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-100 text-slate-700'}">Salah</button></td>
                        </tr>
                    `;
                }).join('');
                answerInputHtml = `
                    <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-100 text-[11px] font-extrabold text-slate-600 uppercase border-b border-slate-200"><th class="p-3">Pernyataan</th><th class="p-3 text-center w-28">Benar</th><th class="p-3 text-center w-28">Salah</th></tr></thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;
            } else {
                const cur = currentStudentAnswers[q.id] || '';
                answerInputHtml = `<textarea rows="4" oninput="window.saveAnswer('${q.id}', this.value)" placeholder="Ketik jawaban Anda di sini..." class="w-full p-4 bg-white border border-slate-300 rounded-2xl text-sm">${escapeHtml(cur)}</textarea>`;
            }

            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden select-none">
                    <header class="min-h-16 bg-[#0f172a] text-white px-4 py-2.5 flex flex-wrap justify-between items-center gap-3 shrink-0 border-b border-slate-800">
                        <div class="flex items-center gap-3">
                            <img src="${escapeHtml(appData.settings.schoolLogo)}" onerror="this.src='https://placehold.co/80x80/4f46e5/ffffff?text=SD'" class="w-9 h-9 rounded-xl object-cover bg-white" alt="Logo">
                            <div>
                                <h2 class="text-xs sm:text-sm font-extrabold uppercase truncate max-w-[200px] sm:max-w-none">${escapeHtml(currentActiveExam.examName)}</h2>
                                <p class="text-[11px] text-slate-400">${escapeHtml(appData.settings.schoolName)}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span id="examViolationCounter" class="px-3 py-1 bg-amber-950 text-amber-400 border border-amber-600/60 rounded-xl text-xs font-bold">Pelanggaran: ${currentViolationCount}x</span>
                            <div class="px-4 py-1.5 bg-red-600 text-white rounded-xl font-mono font-extrabold text-xs sm:text-sm">
                                <span id="examCountdownTimer">${formatHMS(remainingSeconds)}</span>
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-y-auto lg:overflow-hidden bg-slate-50">
                        <section class="lg:col-span-3 bg-white border-b lg:border-r border-slate-200 p-4 space-y-3 overflow-y-auto custom-scrollbar">
                            <h3 class="text-xs font-extrabold uppercase text-slate-600"><i class="fa-solid fa-book-open text-blue-600 mr-1"></i> Stimulus / Wacana</h3>
                            ${q.stimulusText ? `<div class="p-3 bg-blue-50/60 rounded-xl text-xs text-slate-700 leading-relaxed">${escapeHtml(q.stimulusText)}</div>` : '<p class="text-xs text-slate-400 italic">Tidak ada teks stimulus.</p>'}
                            ${q.stimulusImage ? `<img src="${escapeHtml(q.stimulusImage)}" class="rounded-xl max-h-48 mx-auto object-contain border border-slate-200" alt="Stimulus">` : ''}
                        </section>

                        <section class="lg:col-span-6 flex flex-col lg:h-full lg:overflow-hidden bg-slate-50">
                            <div class="px-6 py-3 bg-white border-b border-slate-200 flex justify-between items-center shrink-0">
                                <span class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded-xl">Soal #${currentQuestionIndex + 1}</span>
                                <span class="text-xs font-bold text-emerald-700">Bobot: ${q.weight} Poin</span>
                            </div>
                            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
                                    <p class="text-sm sm:text-base font-bold text-slate-900">${escapeHtml(q.questionText)}</p>
                                    ${q.questionImage ? `<img src="${escapeHtml(q.questionImage)}" class="rounded-xl max-h-52 mx-auto object-contain border border-slate-200" alt="Soal">` : ''}
                                </div>
                                <div class="space-y-3">${answerInputHtml}</div>
                            </div>
                            <div class="px-6 py-4 bg-white border-t border-slate-200 flex justify-between items-center shrink-0">
                                <button type="button" onclick="window.prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">Sebelumnya</button>
                                <button type="button" onclick="window.toggleDoubtful('${q.id}')" class="px-4 py-2 bg-amber-400 text-slate-950 rounded-xl text-xs font-bold">Ragu-Ragu</button>
                                <button type="button" onclick="window.nextQuestion()" ${currentQuestionIndex === currentExamQuestions.length - 1 ? 'disabled' : ''} class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">Selanjutnya</button>
                            </div>
                        </section>

                        <aside class="lg:col-span-3 bg-white border-t lg:border-l border-slate-200 p-4 flex flex-col justify-between">
                            <div class="space-y-3">
                                <h3 class="text-xs font-extrabold uppercase text-slate-700">Penjelajah Soal</h3>
                                <div class="grid grid-cols-5 gap-2">${gridNav}</div>
                            </div>
                            <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-extrabold text-xs shadow-md mt-4">Kirim & Selesai</button>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswer = async function(qId, val) {
            if (!currentActiveExam) return;
            currentStudentAnswers[qId] = val;
            const liveExam = appData.exams.find(e => e.id === currentActiveExam.id) || currentActiveExam;
            if (!evaluateExamEligibilityLocal(liveExam, appData.currentUser, { ignoreFinished: true }).allowed) {
                await forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                return;
            }
            persistStudentExamProgressToCloud(currentActiveExam.id, 'Sedang Mengerjakan');
        };

        window.saveAnswerAndRefresh = async function(qId, val) {
            if (!currentActiveExam) return;
            currentStudentAnswers[qId] = val;
            const verification = await verifyExamAccessFromFirestore(currentActiveExam.id, { ignoreFinished: true });
            if (!verification.allowed) {
                await forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                return;
            }
            persistStudentExamProgressToCloud(currentActiveExam.id, 'Sedang Mengerjakan');
            renderExamWorkspace();
        };

        window.togglePgComplexAnswer = async function(qId, letter) {
            if (!currentActiveExam) return;
            let arr = Array.isArray(currentStudentAnswers[qId]) ? [...currentStudentAnswers[qId]] : [];
            if (arr.includes(letter)) arr = arr.filter(x => x !== letter);
            else arr.push(letter);
            arr.sort();
            currentStudentAnswers[qId] = arr;

            const verification = await verifyExamAccessFromFirestore(currentActiveExam.id, { ignoreFinished: true });
            if (!verification.allowed) {
                await forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                return;
            }
            persistStudentExamProgressToCloud(currentActiveExam.id, 'Sedang Mengerjakan');
            renderExamWorkspace();
        };

        window.saveTfRowAnswer = async function(qId, rowIdx, val) {
            if (!currentActiveExam) return;
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            currentStudentAnswers[qId][String(rowIdx)] = val;

            const verification = await verifyExamAccessFromFirestore(currentActiveExam.id, { ignoreFinished: true });
            if (!verification.allowed) {
                await forceTerminateActiveStudentExam(CLOSED_WHILE_WORKING_MESSAGE, true);
                return;
            }
            persistStudentExamProgressToCloud(currentActiveExam.id, 'Sedang Mengerjakan');
            renderExamWorkspace();
        };

        window.toggleDoubtful = function(qId) {
            if (!currentActiveExam) return;
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            persistStudentExamProgressToCloud(currentActiveExam.id, 'Sedang Mengerjakan');
            renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderExamWorkspace();
            }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) {
                currentQuestionIndex++;
                renderExamWorkspace();
            }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) {
                currentQuestionIndex = idx;
                renderExamWorkspace();
            }
        };

        window.confirmSubmitExam = function() {
            window.showModal('Konfirmasi Selesai', 'Apakah Anda yakin ingin mengirim jawaban dan mengakhiri ujian?', 'info', (confirmed) => {
                if (confirmed) window.submitExamFinal();
                return true;
            }, { showCancel: true, okText: 'Ya, Kirim Jawaban' });
        };

        window.submitExamFinal = async function() {
            if (!currentActiveExam) return;
            const verification = await verifyExamAccessFromFirestore(currentActiveExam.id, { ignoreFinished: false });
            if (!verification.allowed) {
                await forceTerminateActiveStudentExam(
                    verification.code === 'ALREADY_FINISHED' ? verification.reason : CLOSED_WHILE_WORKING_MESSAGE,
                    true
                );
                return;
            }

            if (examTimerInterval) clearInterval(examTimerInterval);
            window.detachAntiCheatListeners();
            const student = appData.currentUser;
            const finishedExam = currentActiveExam;

            let totalScore = 0;
            let maxScore = 0;
            let correct = 0;
            let wrong = 0;
            let empty = 0;

            currentExamQuestions.forEach(q => {
                maxScore += Number(q.weight) || 10;
                const ans = currentStudentAnswers[q.id];
                if (!isQuestionAnswered(ans)) {
                    empty++;
                    return;
                }
                if (q.type === 'pg_complex') {
                    const studentArr = Array.isArray(ans) ? ans.map(x => String(x).trim().toUpperCase()).sort() : [];
                    const keyArr = Array.isArray(q.correctAnswer)
                        ? q.correctAnswer.map(x => String(x).trim().toUpperCase()).sort()
                        : String(q.correctAnswer || '').split(',').map(x => x.trim().toUpperCase()).filter(Boolean).sort();
                    if (JSON.stringify(studentArr) === JSON.stringify(keyArr)) {
                        totalScore += Number(q.weight) || 10;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'true_false') {
                    const keyParts = String(q.correctAnswer || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                    let allCorrect = true;
                    keyParts.forEach((kVal, idx) => {
                        const sVal = String((ans && typeof ans === 'object') ? (ans[String(idx)] || '') : '').trim().toLowerCase();
                        const normK = (kVal === 'b' || kVal === 'benar' || kVal === 'true') ? 'benar' : 'salah';
                        const normS = (sVal === 'b' || sVal === 'benar' || sVal === 'true') ? 'benar' : 'salah';
                        if (normK !== normS) allCorrect = false;
                    });
                    if (allCorrect) {
                        totalScore += Number(q.weight) || 10;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else {
                    const cleanAns = String(ans).trim().toLowerCase();
                    const cleanKey = String(q.correctAnswer).trim().toLowerCase();
                    if (cleanAns === cleanKey) {
                        totalScore += Number(q.weight) || 10;
                        correct++;
                    } else {
                        wrong++;
                    }
                }
            });

            const stdMaster = appData.students.find(s => s.id === student.studentId);
            const resultObj = {
                resultId: `RES-${student.studentId}-${finishedExam.id}`,
                examId: finishedExam.id,
                examName: finishedExam.examName,
                subjectId: finishedExam.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                asalSekolah: stdMaster?.asalSekolah || '-',
                classId: student.classId,
                className: student.className || '6',
                submittedAt: new Date().toLocaleString('id-ID'),
                totalScoreObtained: totalScore,
                maxPossibleScore: maxScore || 100,
                finalScore: Math.round((totalScore / (maxScore || 100)) * 100) || 0,
                correctCount: correct,
                wrongCount: wrong,
                emptyCount: empty,
                violationCount: currentViolationCount,
                essayGradingStatus: 'Sudah Dinilai',
                answersSnapshot: JSON.parse(JSON.stringify(currentStudentAnswers || {}))
            };

            currentActiveExam = null;
            currentExamQuestions = [];

            const existingResIdx = appData.examResults.findIndex(r => r.resultId === resultObj.resultId);
            if (existingResIdx >= 0) appData.examResults[existingResIdx] = resultObj;
            else appData.examResults.push(resultObj);

            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            let p = appData.examParticipants.find(x => x.examId === finishedExam.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + finishedExam.id,
                    examId: finishedExam.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    status: 'Selesai',
                    violationCount: currentViolationCount
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
            }
            await syncCollectionRecord('examParticipants', p.id, p);
            await syncCollectionRecord('examSessions', `SES_${finishedExam.id}_${student.studentId}`, null, true);

            window.renderExamResultReviewPage(resultObj);
        };

        window.renderExamResultReviewPage = function(resObj) {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-6">
                    <div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl p-8 space-y-6 text-center my-auto">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>
                        <p class="text-xs text-slate-500">${escapeHtml(resObj.studentName)} • ${escapeHtml(resObj.examName)} • Nilai Akhir: <strong class="text-emerald-700 text-lg">${resObj.finalScore}</strong></p>
                        <div class="flex justify-center gap-3">
                            <button type="button" onclick="window.renderStudentPortal()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-xs shadow-md">Kembali ke Portal Siswa</button>
                            <button type="button" onclick="window.logoutApp()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-bold text-xs shadow-md">Keluar</button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.onload = async function() {
            await initFirebaseProduction();
            window.renderLoginView();
        };
    </script>
</body>
</html>
