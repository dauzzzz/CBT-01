            const bankOpts = appData.questionBanks.map(b => `<option value="${b.id}" ${existing && existing.bankId === b.id ? 'selected' : ''}>${escapeHtml(b.title)}</option>`).join('');

            const todayIso = getTodayIsoWIB();
            const startIso = existing && existing.startDate ? (parseDDMMYYYYToIso(existing.startDate) || todayIso) : todayIso;
            const endIso = existing && existing.endDate ? (parseDDMMYYYYToIso(existing.endDate) || todayIso) : todayIso;
            const startDisplay = formatIsoToDDMMYYYY(startIso);
            const endDisplay = formatIsoToDDMMYYYY(endIso);
            const startTimeVal = existing && existing.startTime ? normalizeTimeHHMM(existing.startTime, '07:00') : '07:00';
            const endTimeVal = existing && existing.endTime ? normalizeTimeHHMM(existing.endTime, '23:59') : '23:59';

            const html = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs">
                    <div class="sm:col-span-2">
                        <label class="block font-bold text-slate-700 mb-1">Nama Ujian *</label>
                        <input type="text" id="exFormName" value="${escapeHtml(existing ? existing.examName : '')}" placeholder="Contoh: Ujian Tes" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Mata Pelajaran</label>
                        <select id="exFormSubject" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">${subOpts}</select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Kelas Peserta</label>
                        <select id="exFormClass" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">${clsOpts}</select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block font-bold text-slate-700 mb-1">Paket Bank Soal</label>
                        <select id="exFormBank" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">${bankOpts}</select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Durasi (Menit) *</label>
                        <input type="number" id="exFormDuration" value="${existing ? existing.durationMinutes : 60}" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Token Ujian *</label>
                        <input type="text" id="exFormToken" value="${escapeHtml(existing ? existing.token : 'UJIAN4A')}" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-mono uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Tanggal Mulai</label>
                        <div class="relative flex items-center">
                            <input type="text" id="exFormStartDateDisplay" value="${escapeHtml(startDisplay)}" placeholder="DD/MM/YYYY" oninput="window.syncDatePickerFromDisplay(this, 'exFormStartDate')" class="w-full pl-3 pr-9 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                            <button type="button" onclick="window.openNativePicker('exFormStartDate')" class="absolute right-2.5 text-slate-600 hover:text-indigo-600 cursor-pointer" title="Pilih Tanggal Mulai">
                                <i class="fa-regular fa-calendar"></i>
                            </button>
                            <input type="date" id="exFormStartDate" value="${escapeHtml(startIso)}" onchange="window.syncDateDisplayFromPicker(this, 'exFormStartDateDisplay')" class="sr-only">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Tanggal Selesai</label>
                        <div class="relative flex items-center">
                            <input type="text" id="exFormEndDateDisplay" value="${escapeHtml(endDisplay)}" placeholder="DD/MM/YYYY" oninput="window.syncDatePickerFromDisplay(this, 'exFormEndDate')" class="w-full pl-3 pr-9 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                            <button type="button" onclick="window.openNativePicker('exFormEndDate')" class="absolute right-2.5 text-slate-600 hover:text-indigo-600 cursor-pointer" title="Pilih Tanggal Selesai">
                                <i class="fa-regular fa-calendar"></i>
                            </button>
                            <input type="date" id="exFormEndDate" value="${escapeHtml(endIso)}" onchange="window.syncDateDisplayFromPicker(this, 'exFormEndDateDisplay')" class="sr-only">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Jam Mulai</label>
                        <div class="relative flex items-center">
                            <input type="text" id="exFormStartTimeDisplay" value="${escapeHtml(startTimeVal)}" placeholder="07:00" oninput="window.syncTimePickerFromDisplay(this, 'exFormStartTime')" class="w-full pl-3 pr-9 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                            <button type="button" onclick="window.openNativePicker('exFormStartTime')" class="absolute right-2.5 text-slate-600 hover:text-indigo-600 cursor-pointer" title="Pilih Jam Mulai">
                                <i class="fa-regular fa-clock"></i>
                            </button>
                            <input type="time" id="exFormStartTime" value="${escapeHtml(startTimeVal)}" onchange="window.syncTimeDisplayFromPicker(this, 'exFormStartTimeDisplay')" class="sr-only">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Jam Selesai</label>
                        <div class="relative flex items-center">
                            <input type="text" id="exFormEndTimeDisplay" value="${escapeHtml(endTimeVal)}" placeholder="23:59" oninput="window.syncTimePickerFromDisplay(this, 'exFormEndTime')" class="w-full pl-3 pr-9 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800">
                            <button type="button" onclick="window.openNativePicker('exFormEndTime')" class="absolute right-2.5 text-slate-600 hover:text-indigo-600 cursor-pointer" title="Pilih Jam Selesai">
                                <i class="fa-regular fa-clock"></i>
                            </button>
                            <input type="time" id="exFormEndTime" value="${escapeHtml(endTimeVal)}" onchange="window.syncTimeDisplayFromPicker(this, 'exFormEndTimeDisplay')" class="sr-only">
                        </div>
                    </div>
                    <div id="exFormValidationAlert" class="sm:col-span-2 hidden p-2.5 rounded-xl bg-red-50 border border-red-200 text-red-600 text-[11px] font-semibold"></div>
                </div>
            `;

            window.showModal(existing ? 'Edit Paket Ujian' : 'Buat Paket Ujian Baru', '', 'info', async (confirmed) => {
                if (!confirmed) return true;
                const examName = document.getElementById('exFormName').value.trim();
                const subjectId = document.getElementById('exFormSubject').value;
                const classId = document.getElementById('exFormClass').value;
                const bankId = document.getElementById('exFormBank').value;
                const durationMinutes = Number(document.getElementById('exFormDuration').value) || 60;
                const token = document.getElementById('exFormToken').value.trim().toUpperCase() || 'UJIAN4A';

                const rawStartDisp = document.getElementById('exFormStartDateDisplay').value.trim();
                const rawEndDisp = document.getElementById('exFormEndDateDisplay').value.trim();
                const startDate = parseDDMMYYYYToIso(rawStartDisp) || parseDDMMYYYYToIso(document.getElementById('exFormStartDate').value);
                const endDate = parseDDMMYYYYToIso(rawEndDisp) || parseDDMMYYYYToIso(document.getElementById('exFormEndDate').value);

                const rawStartTime = document.getElementById('exFormStartTimeDisplay').value.trim() || document.getElementById('exFormStartTime').value || '07:00';
                const rawEndTime = document.getElementById('exFormEndTimeDisplay').value.trim() || document.getElementById('exFormEndTime').value || '23:59';
                const startTime = normalizeTimeHHMM(rawStartTime, '07:00');
                const endTime = normalizeTimeHHMM(rawEndTime, '23:59');

                const alertEl = document.getElementById('exFormValidationAlert');
                const showFormErr = (msg) => {
                    if (alertEl) {
                        alertEl.innerText = msg;
                        alertEl.classList.remove('hidden');
                    }
                };

                if (!examName) {
                    showFormErr('Nama Ujian wajib diisi!');
                    return false;
                }

                if (!startDate || !endDate) {
                    showFormErr('Tanggal Mulai dan Tanggal Selesai wajib diisi dengan format DD/MM/YYYY yang benar!');
                    return false;
                }

                const sParts = startDate.split('-').map(Number);
                const eParts = endDate.split('-').map(Number);
                const sT = startTime.split(':').map(Number);
                const eT = endTime.split(':').map(Number);
                const startMs = Date.UTC(sParts[0], sParts[1] - 1, sParts[2], sT[0] - 7, sT[1], 0, 0);
                const endMs = Date.UTC(eParts[0], eParts[1] - 1, eParts[2], eT[0] - 7, eT[1], 59, 999);

                if (isNaN(startMs) || isNaN(endMs)) {
                    showFormErr('Format Tanggal (DD/MM/YYYY) atau Jam (HH:mm) tidak valid.');
                    return false;
                }
                if (endMs < startMs) {
                    showFormErr('Waktu Selesai (Tanggal & Jam Selesai) tidak boleh lebih awal dari Waktu Mulai!');
                    return false;
                }

                const matchedQuestions = appData.questions.filter(q => q.bankId === bankId).map(q => q.id);
                const questionIds = matchedQuestions.length > 0 ? matchedQuestions : appData.questions.map(q => q.id);

                if (existing) {
                    existing.examName = examName;
                    existing.subjectId = subjectId;
                    existing.classId = classId;
                    existing.bankId = bankId;
                    existing.durationMinutes = durationMinutes;
                    existing.token = token;
                    existing.startDate = startDate;
                    existing.endDate = endDate;
                    existing.startTime = startTime;
                    existing.endTime = endTime;
                    existing.questionIds = questionIds;
                    existing.updatedAtMs = Date.now();
                    await syncCollectionRecord('exams', existing.id, existing);
                } else {
                    const newEx = {
                        id: 'EX-' + Date.now(),
                        examName, bankId, subjectId, classId,
                        semester: appData.settings.semester,
                        academicYear: appData.settings.academicYear,
                        startDate, endDate,
                        startTime, endTime,
                        durationMinutes, token, status: 'Aktif',
                        questionIds, partialScoring: true, isPublished: true,
                        updatedAtMs: Date.now()
                    };
                    appData.exams.push(newEx);
                    await syncCollectionRecord('exams', newEx.id, newEx);
                }
                logActivity(`Jadwal & pengaturan paket ujian "${examName}" diperbarui (${formatIsoToDDMMYYYY(startDate)} ${startTime} s.d ${formatIsoToDDMMYYYY(endDate)} ${endTime} WIB).`);
                renderExamsContent(document.getElementById('adminMainContent'));
                return true;
            }, { html, showCancel: true, cancelText: 'Batal', okText: 'Simpan Ujian' });
        };

        window.toggleExamStatus = async function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            ex.status = isExamStrictlyActive(ex) ? 'Ditutup' : 'Aktif';
            ex.updatedAtMs = Date.now();
            renderExamsContent(document.getElementById('adminMainContent'));
            await syncCollectionRecord('exams', ex.id, ex);
            logActivity(`Status paket ujian "${ex.examName}" diubah menjadi ${ex.status}.`);
        };

        window.deleteExamRecord = function(examId) {
            window.showModal('Hapus Paket Ujian', 'Yakin ingin menghapus paket ujian ini?', 'error', (confirmed) => {
                if (confirmed) {
                    appData.exams = appData.exams.filter(x => x.id !== examId);
                    syncCollectionRecord('exams', examId, null, true);
                    renderExamsContent(document.getElementById('adminMainContent'));
                }
            }, { okText: 'Hapus' });
        };

        function renderResultsContent(container) {
            const filterExamId = appData.filters.resultExam || 'ALL';
            const filteredResults = appData.examResults.filter(r => filterExamId === 'ALL' || r.examId === filterExamId);

            const examFilterOpts = appData.exams.map(ex => {
                const subName = getSubjectNameById(ex.subjectId);
                const count = appData.examResults.filter(r => r.examId === ex.id).length;
                return `<option value="${escapeHtml(ex.id)}" ${filterExamId === ex.id ? 'selected' : ''}>${escapeHtml(ex.examName)} - ${escapeHtml(subName)} (${count} Siswa)</option>`;
            }).join('');

            const rows = filteredResults.map((r, idx) => {
                const stdObj = appData.students.find(s => s.id === r.studentId || s.nisn === r.nisn);
                const schoolVal = stdObj && stdObj.asalSekolah !== undefined ? (stdObj.asalSekolah || '-') : (r.asalSekolah || '-');
                const exObj = appData.exams.find(e => e.id === r.examId);
                const mapelLabel = exObj ? `${exObj.examName} (${getSubjectNameById(exObj.subjectId)})` : (r.examName || '-');
                return `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="px-4 py-3 text-xs text-slate-500">${idx + 1}</td>
                    <td class="px-4 py-3 text-xs font-mono">${escapeHtml(r.nisn)}</td>
                    <td class="px-4 py-3 text-xs font-bold">${escapeHtml(r.studentName)}</td>
                    <td class="px-4 py-3 text-xs font-semibold ${schoolVal === '-' ? 'text-slate-400 italic' : 'text-indigo-700'}">${escapeHtml(schoolVal)}</td>
                    <td class="px-4 py-3 text-xs">${escapeHtml(r.className)}</td>
                    <td class="px-4 py-3 text-xs font-semibold text-slate-700">${escapeHtml(mapelLabel)}</td>
                    <td class="px-4 py-3 text-xs font-extrabold text-emerald-700">${r.finalScore}</td>
                    <td class="px-4 py-3 text-xs"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${r.essayGradingStatus === 'Sudah Dinilai' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}">${escapeHtml(r.essayGradingStatus)}</span></td>
                    <td class="px-4 py-3 text-xs space-x-1">
                        <button type="button" onclick="window.openEssayGradingModal('${r.resultId}')" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg font-bold"><i class="fa-solid fa-pen-clip mr-1"></i> Koreksi Uraian</button>
                    </td>
                </tr>
            `;
            }).join('');

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <h3 class="font-bold text-sm text-slate-800">Rekapitulasi Hasil Ujian & Koreksi Uraian</h3>
                            <p class="text-xs text-slate-500">Daftar nilai akhir siswa, koreksi manual soal esai/uraian, dan cetak rekap per paket ujian / mata pelajaran.</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1">
                                <i class="fa-solid fa-filter text-indigo-600 text-xs"></i>
                                <select id="resultExamFilterSelect" onchange="window.filterResultsByExam(this.value)" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none py-1">
                                    <option value="ALL">Semua Paket Ujian (${appData.examResults.length} Hasil)</option>
                                    ${examFilterOpts}
                                </select>
                            </div>
                            <button type="button" onclick="window.exportResultsExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer">
                                <i class="fa-solid fa-file-excel mr-1"></i> Ekspor Nilai Excel
                            </button>
                            <button type="button" onclick="window.printResultsByCurrentFilter()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer" title="Langsung cetak sesuai paket ujian yang dipilih">
                                <i class="fa-solid fa-file-pdf mr-1"></i> Cetak Rekap Per Paket Ujian
                            </button>
                            <button type="button" onclick="window.printResultsReport()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer">
                                <i class="fa-solid fa-print mr-1"></i> Cetak Rekap
                            </button>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <div class="table-responsive-wrapper custom-scrollbar">
                            <table class="w-full min-w-[780px] text-left border-collapse">
                                <thead><tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase"><th class="px-4 py-3">No</th><th class="px-4 py-3">NISN</th><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Asal Sekolah</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Paket Ujian / Mapel</th><th class="px-4 py-3">Nilai Akhir</th><th class="px-4 py-3">Status Uraian</th><th class="px-4 py-3">Aksi</th></tr></thead>
                                <tbody>${rows || '<tr><td colspan="9" class="px-4 py-6 text-center text-xs text-slate-400">Belum ada hasil ujian yang sesuai filter.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        window.filterResultsByExam = function(examId) {
            appData.filters.resultExam = examId || 'ALL';
            renderResultsContent(document.getElementById('adminMainContent'));
        };

        window.printResultsByCurrentFilter = function() {
            const currentExamFilter = appData.filters.resultExam || 'ALL';
            if (currentExamFilter !== 'ALL' && appData.exams.some(e => e.id === currentExamFilter)) {
                window.executePrintResultsReport('PACKAGE', currentExamFilter);
            } else {
                window.printResultsReport();
            }
        };

        window.openEssayGradingModal = function(resultId) {
            const res = appData.examResults.find(r => r.resultId === resultId);
            if (!res) return;
            const essayQuestions = appData.questions.filter(q => q.type === 'essay');
            const q = essayQuestions[0] || appData.questions[appData.questions.length - 1];
            const studentAns = (res.answersSnapshot && q) ? (res.answersSnapshot[q.id] || '(Tidak dijawab)') : '(Tidak dijawab)';
            const currentScore = (res.essayScores && q) ? (res.essayScores[q.id] || 0) : 0;

            const html = `
                <div class="space-y-3 text-xs">
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <p class="font-bold text-slate-700">Siswa: ${escapeHtml(res.studentName)} (${escapeHtml(res.className)})</p>
                        <p class="text-slate-500 mt-1">Pertanyaan Uraian: ${escapeHtml(q ? q.questionText : 'Soal Uraian')}</p>
                        <p class="mt-2 p-2 bg-white rounded border border-slate-200 font-semibold text-slate-800">Jawaban Siswa: "${escapeHtml(studentAns)}"</p>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Skor Uraian (Maksimal ${q ? q.weight : 25} Poin)</label>
                        <input type="number" id="essayGradeScoreInput" value="${currentScore}" min="0" max="${q ? q.weight : 25}" class="w-full px-3 py-2 border border-slate-300 rounded-xl font-bold">
                    </div>
                </div>
            `;

            window.showModal('Koreksi & Penilaian Soal Uraian', '', 'info', (confirmed) => {
                if (!confirmed) return true;
                const givenScore = Number(document.getElementById('essayGradeScoreInput').value) || 0;
                if (q) {
                    const prevScore = (res.essayScores && res.essayScores[q.id]) ? Number(res.essayScores[q.id]) : 0;
                    if (!res.essayScores) res.essayScores = {};
                    res.essayScores[q.id] = givenScore;
                    res.totalScoreObtained = Math.max(0, (res.totalScoreObtained - prevScore) + givenScore);
                    res.finalScore = Math.min(100, Math.round((res.totalScoreObtained / (res.maxPossibleScore || 100)) * 100));
                }
                res.essayGradingStatus = 'Sudah Dinilai';
                syncCollectionRecord('examResults', res.resultId, res);
                renderResultsContent(document.getElementById('adminMainContent'));
                return true;
            }, { html, okText: 'Simpan Nilai Uraian' });
        };

        window.exportResultsExcel = function() {
            const currentExamFilter = appData.filters.resultExam || 'ALL';
            const defaultExamId = (currentExamFilter !== 'ALL' && appData.exams.some(e => e.id === currentExamFilter))
                ? currentExamFilter
                : (appData.exams[0] ? appData.exams[0].id : '');

            const examOpts = appData.exams.map(ex => {
                const subName = getSubjectNameById(ex.subjectId);
                const count = appData.examResults.filter(r => r.examId === ex.id).length;
                return `<option value="${escapeHtml(ex.id)}" ${ex.id === defaultExamId ? 'selected' : ''}>${escapeHtml(ex.examName)} — Mapel: ${escapeHtml(subName)} (${count} Siswa)</option>`;
            }).join('');

            const html = `
                <div class="space-y-4 text-xs">
                    <div class="space-y-2.5">
                        <label class="flex items-start gap-3 p-3.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-white cursor-pointer transition">
                            <input type="radio" name="exportResultMode" value="PACKAGE" ${currentExamFilter !== 'ALL' || appData.exams.length > 0 ? 'checked' : ''} onchange="document.getElementById('exportResultExamSelectWrap').classList.remove('hidden')" class="mt-0.5 w-4 h-4 text-indigo-600">
                            <div class="w-full">
                                <span class="font-extrabold text-slate-900 block">Ekspor Per Paket Ujian / Mata Pelajaran</span>
                                <span class="text-[11px] text-slate-500 block mt-0.5">Unduh nilai khusus satu mata pelajaran agar tidak tercampur dengan mapel lain.</span>
                                <div id="exportResultExamSelectWrap" class="mt-2.5">
                                    <select id="exportResultTargetExamId" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl font-bold text-slate-800">
                                        ${examOpts || '<option value="">-- Belum Ada Paket Ujian --</option>'}
                                    </select>
                                </div>
                            </div>
                        </label>
                        <label class="flex items-start gap-3 p-3.5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-white cursor-pointer transition">
                            <input type="radio" name="exportResultMode" value="ALL" ${currentExamFilter === 'ALL' && appData.exams.length === 0 ? 'checked' : ''} onchange="document.getElementById('exportResultExamSelectWrap').classList.add('hidden')" class="mt-0.5 w-4 h-4 text-indigo-600">
                            <div>
                                <span class="font-extrabold text-slate-900 block">Ekspor Semua Paket Ujian Sekaligus (${appData.examResults.length} Hasil)</span>
                                <span class="text-[11px] text-slate-500 block mt-0.5">Gabungkan seluruh hasil ujian ke dalam satu file Excel.</span>
                            </div>
                        </label>
                    </div>
                </div>
            `;

            window.showModal('Ekspor Rekap Nilai ke Excel (.xlsx)', '', 'info', (confirmed) => {
                if (!confirmed) return true;
                const modeEl = document.querySelector('input[name="exportResultMode"]:checked');
                const mode = modeEl ? modeEl.value : 'ALL';
                const targetExamId = document.getElementById('exportResultTargetExamId')?.value || '';
                const list = (mode === 'PACKAGE' && targetExamId)

        window.handleLogoFileSelected = async function(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const validTypes = ['image/png', 'image/jpeg', 'image/jpg'];
            if (!validTypes.includes(file.type.toLowerCase())) {
                window.showModal('Format File Tidak Didukung', 'Silakan pilih file gambar logo dengan format PNG, JPG, atau JPEG.', 'error');
                event.target.value = '';
                return;
            }

            if (file.size > 2 * 1024 * 1024) {
                window.showModal('Ukuran File Terlalu Besar', 'Ukuran file logo maksimal 2 MB agar cepat dimuat pada jaringan HP.', 'error');
                event.target.value = '';
                return;
            }

            try {
                // Kompresi cepat ukuran optimal 180x180px (~10KB) agar pratinjau dan simpan ke Cloud instan (< 1 detik)
                const compressed = await compressAndConvertImage(file, 180, 180, 0.82);
                pendingLogoFile = compressed.blob;
                pendingLogoDataUrl = compressed.dataUrl;
                const mainEl = document.getElementById('adminMainContent');
                if (mainEl && appData.activeAdminMenu === 'settings') {
                    renderSettingsContent(mainEl);
                }
            } catch (err) {
                console.error('Logo preview error:', err);
                window.showModal('Gagal Memuat Pratinjau', 'File gambar tidak dapat diproses. Silakan pilih file gambar lain.', 'error');
            }
        };

        window.saveSchoolLogoToCloud = async function() {
            if (!pendingLogoDataUrl || isUploadingLogo) return;
            isUploadingLogo = true;
            const previousLogoUrl = appData.settings.schoolLogo || DEFAULT_SCHOOL_LOGO;
            const finalLogoUrl = pendingLogoDataUrl;

            // Terapkan secara optimis ke UI agar terasa instan tanpa jeda
            appData.settings.schoolLogo = finalLogoUrl;
            updateBrowserFaviconAndTitle();

            const mainEl = document.getElementById('adminMainContent');
            if (mainEl && appData.activeAdminMenu === 'settings') {
                renderSettingsContent(mainEl);
            }

            try {
                const updatedSettings = {
                    ...appData.settings,
                    schoolLogo: finalLogoUrl,
                    updatedAtMs: Date.now()
                };

                // Simpan langsung ke Firestore (tanpa menunggu timeout retry Firebase Storage yang memakan waktu lama)
                const savedOk = await syncCollectionRecord('appSettings', 'global', updatedSettings);
                if (!savedOk) {
                    throw new Error('Gagal menyinkronkan logo ke dokumen Firestore.');
                }

                pendingLogoFile = null;
                pendingLogoDataUrl = null;
                isUploadingLogo = false;

        window.regenerateExamToken = function(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex) return;
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let newToken = '';
            for (let i = 0; i < 6; i++) newToken += chars.charAt(Math.floor(Math.random() * chars.length));
            ex.token = newToken;
            syncCollectionRecord('exams', ex.id, ex);
            logActivity(`Token ujian ${ex.examName} diperbarui menjadi ${newToken}.`);
            renderSchedulesContent(document.getElementById('adminMainContent'));

        window.resetStudentExamSession = function(studentId, examId = '') {
            window.showModal('Konfirmasi Reset Sesi', 'Mereset sesi akan menghapus progres aktif, jawaban tersimpan, hasil ujian, dan hitungan pelanggaran siswa ini agar siswa dapat mengerjakan ujian kembali dari awal. Lanjutkan?', 'error', async (confirmed) => {
                if (confirmed) {
                    updateLiveSyncIndicator('syncing', 'Mereset Sesi...');
                    const toRemoveRes = appData.examResults.filter(r => r.studentId === studentId && (!examId || r.examId === examId));
                    for (const r of toRemoveRes) {
                        const docId = r.id || r.resultId;
                        await syncCollectionRecord('examResults', docId, null, true);
                    }
                    appData.examResults = appData.examResults.filter(r => !(r.studentId === studentId && (!examId || r.examId === examId)));

                    // Hapus sesi dari daftar examSessions & pastikan ID deterministik SES_{examId}_{studentId} juga dihapus dari Firestore
                    const toRemoveSess = appData.examSessions.filter(ss => ss.studentId === studentId && (!examId || ss.examId === examId));
                    const deletedSessIds = new Set();
                    for (const ss of toRemoveSess) {
                        deletedSessIds.add(ss.id);
                        await syncCollectionRecord('examSessions', ss.id, null, true);
                    }
                    const targetExams = examId ? [examId] : appData.exams.map(e => e.id);
                    for (const exId of targetExams) {
                        const deterministicSessId = getSessionDocId(exId, studentId);
                        if (!deletedSessIds.has(deterministicSessId)) {
                            await syncCollectionRecord('examSessions', deterministicSessId, null, true);
                        }
                    }
                    appData.examSessions = appData.examSessions.filter(ss => !(ss.studentId === studentId && (!examId || ss.examId === examId)));

                    const matchingParts = appData.examParticipants.filter(p => p.studentId === studentId && (!examId || p.examId === examId));
                    if (matchingParts.length > 0) {
                        for (const part of matchingParts) {
                            part.status = 'Belum Mulai';
                            part.violationCount = 0;
                            await syncCollectionRecord('examParticipants', part.id, part);
                        }
                    } else if (examId) {
                        const stdObj = appData.students.find(s => s.id === studentId);
                        if (stdObj) {
                            const newPart = {
                                id: 'PRT-' + stdObj.id + '-' + examId,
                                examId,
                                studentId: stdObj.id,
                                nisn: stdObj.nisn,
                                studentName: stdObj.fullName,
                                className: stdObj.className || '4',
                                status: 'Belum Mulai',
                                violationCount: 0,
                                extraTimeMinutes: 0
                            };
                            appData.examParticipants.push(newPart);
                            await syncCollectionRecord('examParticipants', newPart.id, newPart);
                        }
                    }

                    const stdObj = appData.students.find(s => s.id === studentId);
                    logActivity(`Sesi ujian siswa ${stdObj ? stdObj.fullName : studentId} telah direset oleh Administrator.`);
                    window.renderAdminCurrentSection();
                    updateLiveSyncIndicator('updated', 'Sesi Direset');
                }
            }, { okText: 'Ya, Reset Sesi' });
        };

        window.resetAllExamSessions = function(examId) {
            if (!examId) {
                window.showModal('Pilih Paket Ujian', 'Tidak ada paket ujian aktif yang dipilih untuk direset.', 'error');
                return;
            }
            const activeExam = appData.exams.find(e => e.id === examId);
            const examName = activeExam ? activeExam.examName : 'Paket Ujian Ini';

            window.showModal(
                'Konfirmasi Reset Semua Sesi',
                `Apakah Anda yakin ingin mereset sesi seluruh peserta pada paket ujian "${examName}"? Semua siswa dapat memulai ulang ujian dari awal.`,
                'error',
                async (confirmed) => {
                    if (confirmed) {
                        updateLiveSyncIndicator('syncing', 'Mereset Semua Sesi...');
                        let successCount = 0;
                        for (const s of appData.students) {
                            const toRemove = appData.examResults.filter(r => r.studentId === s.id && r.examId === examId);
                            for (const r of toRemove) {
                                await syncCollectionRecord('examResults', r.id || r.resultId, null, true);
                            }
                            appData.examResults = appData.examResults.filter(r => !(r.studentId === s.id && r.examId === examId));

                            const sessRemove = appData.examSessions.filter(ss => ss.studentId === s.id && ss.examId === examId);
                            const removedIds = new Set();
                            for (const ss of sessRemove) {
                                removedIds.add(ss.id);
                                await syncCollectionRecord('examSessions', ss.id, null, true);
                            }
                            const detId = getSessionDocId(examId, s.id);
                            if (!removedIds.has(detId)) {
                                await syncCollectionRecord('examSessions', detId, null, true);
                            }
                            appData.examSessions = appData.examSessions.filter(ss => !(ss.studentId === s.id && ss.examId === examId));

                            let part = appData.examParticipants.find(p => p.studentId === s.id && p.examId === examId);
                            if (part) {
                                part.status = 'Belum Mulai';
                                part.violationCount = 0;
                                await syncCollectionRecord('examParticipants', part.id, part);
                            } else {
                                const newPart = {
                                    id: 'PRT-' + s.id + '-' + examId,
                                    examId,
                                    studentId: s.id,
                                    nisn: s.nisn,
                                    studentName: s.fullName,
                                    className: s.className || '4',
                                    status: 'Belum Mulai',
                                    violationCount: 0,
                                    extraTimeMinutes: 0
                                };
                                appData.examParticipants.push(newPart);
                                await syncCollectionRecord('examParticipants', newPart.id, newPart);
                            }
                            successCount++;
                        }

                        logActivity(`Administrator mereset sesi seluruh peserta (${successCount} siswa) untuk paket ujian ${examName}.`);
                        window.renderAdminCurrentSection();
                        updateLiveSyncIndicator('updated', 'Semua Sesi Direset');
                        window.showModal('Reset Sesi Berhasil', `Berhasil mereset sesi ujian untuk ${successCount} peserta. Seluruh siswa kini dapat mengikuti ujian kembali dari awal.`, 'success');
                    }
                    return true;
                },
                { showCancel: true, okText: 'Ya, Reset Semua Sesi' }
            );
        };

        // FITUR AUTO-SAVE & LANJUTKAN UJIAN ANTARPERANGKAT (RESUME EXAM)
        // ============================================================================
        function getSessionDocId(examId, studentId) {
            return `SES_${examId}_${studentId}`;
        }

        function computeProgressMetrics() {
            let answeredCount = 0;
            let doubtfulCount = 0;
            const questionStatusMap = {};
            currentExamQuestions.forEach(q => {
                const ans = currentStudentAnswers[q.id];
                const isAns = isQuestionAnswered(ans);
                const isDoubt = !!currentDoubtfulMap[q.id];
                if (isAns) answeredCount++;
                if (isDoubt) doubtfulCount++;
                questionStatusMap[q.id] = isDoubt ? 'ragu-ragu' : (isAns ? 'dijawab' : 'belum_dijawab');
            });
            return { answeredCount, doubtfulCount, questionStatusMap };
        }

        function setAutosaveIndicator(status) {
            const badge = document.getElementById('autosaveBadge');
            if (!badge) return;
            if (status === 'saving') {
                badge.className = 'text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-rotate fa-spin"></i> Menyimpan...';
            } else if (status === 'error') {
                badge.className = 'text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gangguan Sinyal';
            } else {
                badge.className = 'text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md flex items-center gap-1';
                badge.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Tersimpan Cloud';
            }
        }

        window.persistExamSessionToCloud = async function(immediate = false) {
            if (!isExamWorkspaceActive || !currentActiveExam || !appData.currentUser || isSubmittingFinalExam) return false;
            const student = appData.currentUser;
            const sessId = getSessionDocId(currentActiveExam.id, student.studentId);
            const nowMs = Date.now();
            const realRemSecs = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
            remainingSeconds = realRemSecs;

            const { answeredCount, doubtfulCount, questionStatusMap } = computeProgressMetrics();

            const sessionPayload = {
                id: sessId,
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                bankId: currentActiveExam.bankId || '',
                subjectId: currentActiveExam.subjectId || '',
                subjectName: getSubjectNameById(currentActiveExam.subjectId),
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId || '',
                className: student.className || '4',
                answers: sanitizeFirestoreData(currentStudentAnswers || {}),
                doubtfulMap: sanitizeFirestoreData(currentDoubtfulMap || {}),
                questionStatusMap,
                lastQuestionIndex: currentQuestionIndex,
                answeredCount,
                doubtfulCount,
                totalQuestions: currentExamQuestions.length,
                startedAtMs: currentExamStartedAtMs,
                endTimeMs: currentExamEndTimeMs,
                remainingSeconds: realRemSecs,
                violationCount: currentViolationCount,
                violationLogs: currentViolationLogs,
                status: 'IN_PROGRESS',
                sessionToken: currentSessionToken,
                deviceInfo: getDeviceLabel(),
                updatedAtMs: nowMs,
                updatedAtFormatted: new Date(nowMs).toLocaleString('id-ID')
            };

            const existingIdx = appData.examSessions.findIndex(s => s.id === sessId);
            if (existingIdx !== -1) {
                appData.examSessions[existingIdx] = sessionPayload;
            } else {
                appData.examSessions.push(sessionPayload);
            }

            setAutosaveIndicator('saving');
            const ok = await syncCollectionRecord('examSessions', sessId, sessionPayload);
            setAutosaveIndicator(ok ? 'saved' : 'error');
            return ok;
        };

        window.scheduleAutoSave = function(immediate = false) {
            if (autoSaveDebounceTimer) clearTimeout(autoSaveDebounceTimer);
            if (immediate) {
                window.persistExamSessionToCloud(true);
            } else {
                setAutosaveIndicator('saving');
                autoSaveDebounceTimer = setTimeout(() => {
                    window.persistExamSessionToCloud(false);
                }, 350);
            }
        };

        function attachRealtimeSessionTokenListener(sessId) {
            if (sessionWatcherUnsubscribe) {
                sessionWatcherUnsubscribe();
                sessionWatcherUnsubscribe = null;
            }
            if (IS_PREVIEW || !db) return;
            try {
                const ref = doc(db, 'artifacts', appId, 'public', 'data', 'examSessions', sessId);
                sessionWatcherUnsubscribe = onSnapshot(ref, (snap) => {
                    if (!isExamWorkspaceActive) return;
                    if (!snap.exists()) {
                        // Dokumen sesi dihapus oleh Admin (Reset Sesi saat siswa sedang membuka ruang ujian)
                        window.stopAllExamTimersAndWatchers();
                        window.showModal(
                            'Sesi Ujian Direset Pengawas',
                            'Sesi ujian Anda telah direset oleh Pengawas / Administrator. Silakan mulai kembali ujian dari halaman Portal Siswa.',
                            'info',
                            () => {
                                window.renderStudentPortal(false);
                            }
                        );
                        return;
                    }
                    const remoteData = snap.data();
                    if (remoteData.status === 'SUBMITTED') {
                        window.stopAllExamTimersAndWatchers();
                        window.showModal('Ujian Telah Dikirim', 'Sesi ujian ini telah diselesaikan dan dikirim dari perangkat Anda yang lain.', 'info', () => {
                            window.renderStudentPortal(false);
                        });
                        return;
                    }
                    if (remoteData.sessionToken && currentSessionToken && remoteData.sessionToken !== currentSessionToken) {

        window.promptResumeOrStartExam = async function(examId) {
            const student = appData.currentUser;
            if (!student) return;

            const verification = await verifyExamEligibilityFromServer(examId, student);
            if (!verification.allowed) {
                window.renderStudentPortal(false);
                window.showModal('Ujian Tidak Tersedia', verification.message, 'error');
                return;
            }

            // Cek apakah sudah pernah disubmit selesai
            const finishedRes = appData.examResults.find(r => r.studentId === student.studentId && r.examId === examId);
            if (finishedRes) {
                window.showModal('Ujian Sudah Selesai', 'Anda telah menyelesaikan dan mengirim ujian ini sebelumnya.', 'info');
                window.renderStudentPortal(false);
                return;
            }

            // Ambil dokumen sesi terbaru dari Firestore untuk memastikan sinkronisasi lintas perangkat
            const sessId = getSessionDocId(examId, student.studentId);
            const cloudSess = await fetchSingleFirestoreDoc('examSessions', sessId);
            if (cloudSess) {
                const idx = appData.examSessions.findIndex(s => s.id === sessId);
                if (idx !== -1) appData.examSessions[idx] = cloudSess;
                else appData.examSessions.push(cloudSess);
            }

            const existingSess = cloudSess || appData.examSessions.find(s => s.id === sessId);
            if (existingSess && existingSess.status === 'SUBMITTED') {
                window.showModal('Ujian Telah Dikirim', 'Sesi ujian Anda telah berstatus selesai.', 'info');
                window.renderStudentPortal(false);
                return;
            }

            if (existingSess && existingSess.status === 'IN_PROGRESS') {
                window.showUnfinishedExamNotificationModal(examId);
            } else {
                window.startExamSession(examId, null);
            }
        };

        let currentActiveExam = null;
        let currentExamQuestions = [];

        window.attachAntiCheatListeners = function() {
            window.detachAntiCheatListeners();
            isExamWorkspaceActive = true;
            isViolationModalOpen = false;
            document.addEventListener('visibilitychange', handleVisibilityViolation);
            window.addEventListener('blur', handleWindowBlurViolation);
        };

        window.detachAntiCheatListeners = function() {

            document.removeEventListener('visibilitychange', handleVisibilityViolation);
            window.removeEventListener('blur', handleWindowBlurViolation);
        };

        window.previewZoomImage = function(imgUrl, caption) {
            if (!imgUrl) return;
            const html = `
                <div class="text-center space-y-2">
                    <img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(caption || 'Gambar')}" class="max-h-[65vh] w-auto mx-auto rounded-xl border border-slate-200 object-contain bg-slate-50 p-2">
                    <p class="text-xs text-slate-500 font-medium">${escapeHtml(caption || '')}</p>
                </div>
            `;

        window.startExamSession = async function(examId, resumeSessionObj = null) {
            const student = appData.currentUser;
            if (!student) return;

            const verification = await verifyExamEligibilityFromServer(examId, student);
            if (!verification.allowed) {
                window.renderStudentPortal(false);
                window.showModal('Ujian Ditutup / Belum Tersedia', verification.message, 'error');
                return;
            }
            const ex = verification.exam;

            // Pastikan ujian belum disubmit
            const alreadyDone = appData.examResults.find(r => r.studentId === student.studentId && r.examId === ex.id);
            if (alreadyDone) {
                window.showModal('Ujian Telah Diselesaikan', 'Anda tidak dapat mengerjakan ulang ujian yang sudah dikirim.', 'info');
                window.renderStudentPortal(false);
                return;
            }

            currentActiveExam = ex;
            currentExamQuestions = (ex.questionIds || []).map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            if (currentExamQuestions.length === 0) {
                currentExamQuestions = appData.questions.filter(q => q.bankId === ex.bankId);
                if (currentExamQuestions.length === 0) currentExamQuestions = [...appData.questions];
            }

            isSubmittingFinalExam = false;
            currentSessionId = getSessionDocId(ex.id, student.studentId);
            currentSessionToken = 'TOK-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            // Cek kembali dari cloud jika resumeSessionObj belum diberikan
            if (!resumeSessionObj) {
                const cloudSess = await fetchSingleFirestoreDoc('examSessions', currentSessionId);
                if (cloudSess && cloudSess.status === 'IN_PROGRESS') {
                    resumeSessionObj = cloudSess;
                }
            }

            const nowMs = Date.now();
            if (resumeSessionObj && resumeSessionObj.status === 'IN_PROGRESS') {
                // Pulihkan progres ujian sebelumnya (Resume)
                currentStudentAnswers = resumeSessionObj.answers ? JSON.parse(JSON.stringify(resumeSessionObj.answers)) : {};
                currentDoubtfulMap = resumeSessionObj.doubtfulMap ? JSON.parse(JSON.stringify(resumeSessionObj.doubtfulMap)) : {};
                const savedIdx = Number(resumeSessionObj.lastQuestionIndex) || 0;
                currentQuestionIndex = (savedIdx >= 0 && savedIdx < currentExamQuestions.length) ? savedIdx : 0;
                currentViolationCount = Number(resumeSessionObj.violationCount) || 0;
                currentViolationLogs = Array.isArray(resumeSessionObj.violationLogs) ? resumeSessionObj.violationLogs : [];
                currentExamStartedAtMs = Number(resumeSessionObj.startedAtMs) || nowMs;
                currentExamEndTimeMs = Number(resumeSessionObj.endTimeMs) || (currentExamStartedAtMs + (ex.durationMinutes * 60 * 1000));
                remainingSeconds = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
            } else {
                // Sesi baru pertama kali
                currentStudentAnswers = {};
                currentDoubtfulMap = {};
                currentQuestionIndex = 0;
                currentViolationCount = 0;
                currentViolationLogs = [];
                currentExamStartedAtMs = nowMs;
                currentExamEndTimeMs = nowMs + (ex.durationMinutes * 60 * 1000);
                remainingSeconds = ex.durationMinutes * 60;
            }

            let p = appData.examParticipants.find(x => x.examId === ex.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + ex.id,
                    examId: ex.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '4',
                    status: 'Sedang Mengerjakan',
                    violationCount: currentViolationCount,
                    extraTimeMinutes: 0
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Sedang Mengerjakan';
                p.violationCount = currentViolationCount;
            }
            syncCollectionRecord('examParticipants', p.id, p);

            // Jika waktu ujian ternyata sudah habis saat siswa berada di luar aplikasi, langsung jalankan mekanisme penyelesaian otomatis
            if (remainingSeconds <= 0) {
                isExamWorkspaceActive = true;
                window.showModal(
                    'Waktu Ujian Telah Berakhir',
                    'Batas waktu pengerjaan ujian telah habis saat sesi Anda terputus. Sistem secara otomatis menyimpan dan mengirim seluruh jawaban terakhir Anda.',
                    'info',
                    () => {
                        window.submitExamFinal();
                    }
                );
                return;
            }

            window.attachAntiCheatListeners();
            renderExamWorkspace();
            await window.persistExamSessionToCloud(true);
            startExamTimer();
            attachRealtimeSessionTokenListener(currentSessionId);
        };

        function formatHMS(totalSecs) {
            const sec = Math.max(0, Number(totalSecs) || 0);
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            return `${String(h).padStart(2, '0')} : ${String(m).padStart(2, '0')} : ${String(s).padStart(2, '0')}`;
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            if (periodicAutoSaveInterval) clearInterval(periodicAutoSaveInterval);

            // Timer berbasis selisih timestamp target (currentExamEndTimeMs) sehingga tidak bisa di-reset oleh refresh/pindah perangkat
            examTimerInterval = setInterval(() => {
                if (currentActiveExam) {
                    const latestExamInState = appData.exams.find(e => e.id === currentActiveExam.id);
                    if (!latestExamInState || !isExamStrictlyActive(latestExamInState) || !checkExamScheduleAccess(latestExamInState).allowed) {
                        window.forceCloseStudentExamByAdmin('Ujian telah ditutup oleh administrator sekolah. Jawaban yang sudah Anda isi tetap tersimpan.');
                        return;
                    }
                }
                const nowMs = Date.now();
                remainingSeconds = Math.max(0, Math.floor((currentExamEndTimeMs - nowMs) / 1000));
                const timerEl = document.getElementById('examCountdownTimer');
                if (timerEl) {
                    timerEl.innerText = formatHMS(remainingSeconds);
                }
                if (remainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    window.stopAllExamTimersAndWatchers();
                    window.showModal('Waktu Habis', 'Waktu pengerjaan ujian telah berakhir. Jawaban Anda otomatis dikirim.', 'info', () => {
                        window.submitExamFinal();
                    });
                }
            }, 1000);

            // Auto-save berkala setiap 15 detik sebagai pengaman tambahan
            periodicAutoSaveInterval = setInterval(() => {
                if (isExamWorkspaceActive && currentActiveExam && !isSubmittingFinalExam) {
                    window.persistExamSessionToCloud(true);
                }
            }, 15000);
        }

            if (type === 'true_false') return 'Tentukan apakah pernyataan tersebut Benar atau Salah!';
            if (type === 'matching') return 'Pasangkan setiap pernyataan di sebelah kiri dengan pasangan yang tepat!';
            if (type === 'short_answer') return 'Ketikkan jawaban singkat dan tepat pada kolom yang tersedia!';

            return 'Pilih satu jawaban yang paling tepat!';
        }

            if (ans === undefined || ans === null || ans === '') return false;
            if (Array.isArray(ans)) return ans.length > 0;
            if (typeof ans === 'object') return Object.keys(ans).length > 0;
            return true;
        }
