                            </div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h2 class="text-sm font-extrabold tracking-wide uppercase">${escapeHtml(currentActiveExam.examName)}</h2>
                                    <span class="hidden sm:inline-block px-2.5 py-0.5 bg-blue-900/80 text-blue-200 border border-blue-700/60 rounded-full text-[10px] font-bold">${escapeHtml(getSubjectNameById(currentActiveExam.subjectId))}</span>
                                </div>
                                <p class="text-[11px] text-slate-400">Platform Ujian dan Evaluasi Pembelajaran • <strong class="text-slate-200">${escapeHtml(appData.settings.schoolName)}</strong></p>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2.5 sm:gap-3">
                            <div class="px-3.5 py-1.5 rounded-xl bg-amber-950/90 border border-amber-600/60 text-amber-400 text-xs font-extrabold flex items-center gap-2 shadow-xs" title="Jumlah keluar dari tab/jendela ujian">
                                <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
                                <span id="examViolationCounter">Pelanggaran: ${currentViolationCount}x</span>
                            </div>

                            <div class="hidden md:flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl bg-slate-800/90 border border-slate-700">
                                <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-user-check"></i>
                                </div>
                                <div class="leading-tight">
                                    <p class="text-xs font-extrabold text-white flex items-center gap-2">
                                        <span>${escapeHtml(student.name)}</span>
                                        <span class="text-indigo-300 font-bold">•</span>
                                        <span class="text-cyan-300 font-extrabold uppercase tracking-wide">${escapeHtml(appData.settings.schoolName)}</span>
                                    </p>
                                    <p class="text-[10px] text-slate-300">Kelas ${escapeHtml(student.className || '4')} • NISN: ${escapeHtml(student.nisn)}</p>
                                </div>
                            </div>

                            <div class="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-mono font-extrabold text-sm flex items-center gap-2 shadow-md">
                                <i class="fa-regular fa-clock"></i>
                                <span id="examCountdownTimer">${formatHMS(remainingSeconds)}</span>
                            </div>
                        </div>
                    </header>

                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-y-auto lg:overflow-hidden bg-slate-50">
                        <section class="lg:col-span-3 bg-white border-b lg:border-b-0 lg:border-r border-slate-200 flex flex-col lg:h-full lg:overflow-hidden">
                            <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between shrink-0">
                                <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 flex items-center gap-2">
                                    <i class="fa-solid fa-book-open text-blue-600"></i> PANEL STIMULUS & INFORMASI
                                </h3>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                ${hasStimulusText ? `<div class="p-4 rounded-2xl bg-blue-50/60 border border-blue-100 text-slate-700 text-xs sm:text-sm leading-relaxed whitespace-pre-line">${escapeHtml(q.stimulusText)}</div>` : ''}
                                ${hasStimulusImg ? `
                                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-2.5 space-y-2">
                                        <div class="flex items-center justify-between text-[11px] text-slate-500 font-bold px-1">
                                            <span><i class="fa-regular fa-image text-blue-600 mr-1"></i> Gambar Stimulus</span>
                                            <button type="button" onclick="window.previewZoomImage('${escapeHtml(q.stimulusImage)}', 'Gambar Stimulus Soal Nomor ${currentQuestionIndex + 1}')" class="text-blue-600 hover:underline">
                                                <i class="fa-solid fa-magnifying-glass-plus mr-0.5"></i> Perbesar
                                            </button>
                                        </div>
                                        <img src="${escapeHtml(q.stimulusImage)}" alt="Stimulus" onclick="window.previewZoomImage('${escapeHtml(q.stimulusImage)}', 'Gambar Stimulus Soal Nomor ${currentQuestionIndex + 1}')" onerror="this.onerror=null; this.src='https://placehold.co/600x360/f1f5f9/64748b?text=Gambar+Stimulus+Tidak+Dapat+Dimuat';" class="w-full max-h-64 object-contain rounded-xl bg-white mx-auto cursor-zoom-in border border-slate-100">
                                    </div>
                                ` : ''}
                                ${(!hasStimulusText && !hasStimulusImg) ? `
                                    <div class="p-5 rounded-2xl bg-slate-50 border border-dashed border-slate-200 text-center space-y-1.5">
                                        <i class="fa-regular fa-file-lines text-slate-400 text-xl"></i>
                                        <p class="text-xs font-bold text-slate-600">Tidak Ada Wacana / Gambar Stimulus</p>
                                        <p class="text-[11px] text-slate-400">Perhatikan langsung pertanyaan pada panel tengah untuk menjawab soal.</p>
                                    </div>
                                ` : ''}
                                ${q.topic || q.learningObjective ? `
                                    <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 text-[11px] text-slate-500 space-y-1">
                                        ${q.topic ? `<p><strong class="text-slate-700">Materi:</strong> ${escapeHtml(q.topic)}</p>` : ''}
                                        ${q.learningObjective ? `<p><strong class="text-slate-700">Tujuan:</strong> ${escapeHtml(q.learningObjective)}</p>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </section>

                        <section class="lg:col-span-6 bg-slate-50/70 flex flex-col lg:h-full lg:overflow-hidden">
                            <div class="px-6 py-3.5 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 shrink-0">
                                <div class="flex items-center gap-2">
                                    <span class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-extrabold shadow-xs">
                                        Soal Nomor ${currentQuestionIndex + 1}
                                    </span>
                                    <span class="px-3 py-1 rounded-xl bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold">
                                        ${escapeHtml(getQuestionTypeBadgeLabel(q.type))}
                                    </span>
                                </div>
                                <div class="px-3 py-1 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-extrabold flex items-center gap-1.5">
                                    <i class="fa-solid fa-star text-amber-400"></i> Bobot: ${q.weight} Poin
                                </div>
                            </div>

                            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-5">
                                <div class="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-2xs space-y-4">
                                    <p class="text-base sm:text-lg font-extrabold text-slate-900 leading-relaxed">
                                        ${escapeHtml(q.questionText)}
                                    </p>
                                    ${hasQuestionImg ? `
                                        <div class="pt-1">
                                            <img src="${escapeHtml(q.questionImage)}" alt="Pertanyaan" onclick="window.previewZoomImage('${escapeHtml(q.questionImage)}', 'Gambar Pertanyaan Nomor ${currentQuestionIndex + 1}')" onerror="this.onerror=null; this.src='https://placehold.co/600x360/f1f5f9/64748b?text=Gambar+Soal+Tidak+Dapat+Dimuat';" class="max-h-64 w-auto rounded-xl border border-slate-200 object-contain cursor-zoom-in">
                                        </div>
                                    ` : ''}
                                </div>

                                <div class="flex items-center gap-2 text-xs font-bold text-slate-500 px-1">
                                    <i class="fa-solid fa-circle-dot text-blue-600"></i>
                                    <span>${escapeHtml(getQuestionInstructionText(q.type))}</span>
                                </div>

                                <div class="space-y-3">
                                    ${answerInputHtml}
                                </div>
                            </div>

                            <div class="px-6 py-4 bg-white border-t border-slate-200 flex items-center justify-between gap-3 shrink-0">
                                <button type="button" onclick="window.prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled class="px-4 py-2.5 bg-slate-100 text-slate-400 rounded-xl text-xs font-bold cursor-not-allowed flex items-center gap-1.5"' : 'class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1.5"'}>
                                    <i class="fa-solid fa-arrow-left"></i> Sebelumnya
                                </button>

                                <button type="button" onclick="window.toggleDoubtful('${q.id}')" class="px-5 py-2.5 ${isCurrentDoubtful ? 'bg-amber-500 text-slate-950 ring-2 ring-amber-300' : 'bg-amber-400 hover:bg-amber-500 text-slate-950'} rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 shadow-xs">
                                    <i class="fa-solid fa-flag"></i> ${isCurrentDoubtful ? 'Ragu-Ragu (Aktif)' : 'Ragu-Ragu'}
                                </button>

                                <button type="button" onclick="window.nextQuestion()" ${currentQuestionIndex === currentExamQuestions.length - 1 ? 'disabled class="px-4 py-2.5 bg-slate-100 text-slate-400 rounded-xl text-xs font-bold cursor-not-allowed flex items-center gap-1.5"' : 'class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 shadow-sm"'}>
                                    Selanjutnya <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </section>

                        <aside class="lg:col-span-3 bg-white border-t lg:border-t-0 lg:border-l border-slate-200 flex flex-col justify-between lg:h-full lg:overflow-hidden">
                            <div class="p-5 flex-1 overflow-y-auto custom-scrollbar space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-700 flex items-center gap-2">
                                        <i class="fa-solid fa-grip text-blue-600"></i> PENJELAJAH SOAL
                                    </h3>
                                    <span id="autosaveBadge" class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md">
                                        <i class="fa-solid fa-cloud-check mr-0.5"></i> Tersimpan
                                    </span>
                                </div>

                                <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] font-semibold text-slate-600 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/70">
                                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-600 inline-block"></span> Dijawab</div>
                                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> Ragu-ragu</div>
                                    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-200 border border-slate-300 inline-block"></span> Belum</div>
                                </div>

                                <div class="grid grid-cols-5 gap-2 pt-1">
                                    ${gridNav}
                                </div>
                            </div>

                            <div class="p-5 bg-slate-50/70 border-t border-slate-200 space-y-3 shrink-0">
                                <div class="flex items-center justify-between text-xs font-bold">
                                    <span class="text-slate-600">Terjawab: <strong id="answeredCounterText" class="text-blue-600">${answeredTotal}</strong> / ${currentExamQuestions.length}</span>
                                    <span class="text-amber-600">Ragu: <strong id="doubtfulCounterText">${doubtfulTotal}</strong></span>
                                </div>
                                <button type="button" onclick="window.confirmSubmitExam()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-extrabold text-sm shadow-md transition flex items-center justify-center gap-2 cursor-pointer">
                                    <i class="fa-solid fa-paper-plane"></i> Kirim & Selesai
                                </button>
                            </div>
                        </aside>
                    </div>
                </div>
            `;
        };

        window.saveAnswer = function(qId, val) {
            currentStudentAnswers[qId] = val;
            const answeredEl = document.getElementById('answeredCounterText');
            if (answeredEl) {
                let count = 0;
                currentExamQuestions.forEach(item => {
                    if (isQuestionAnswered(currentStudentAnswers[item.id])) count++;
                });
                answeredEl.innerText = String(count);
            }
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            currentStudentAnswers[qId] = val;
            renderExamWorkspace();
        };

        window.saveComplexAnswer = function(qId, val, checked) {
            if (!Array.isArray(currentStudentAnswers[qId])) currentStudentAnswers[qId] = [];
            if (checked) {
                if (!currentStudentAnswers[qId].includes(val)) currentStudentAnswers[qId].push(val);
            } else {
                currentStudentAnswers[qId] = currentStudentAnswers[qId].filter(x => x !== val);
            }
            renderExamWorkspace();
        };

        window.saveMatchingAnswer = function(qId, pairIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            if (val) {
                currentStudentAnswers[qId][String(pairIdx)] = val;
            } else {
                delete currentStudentAnswers[qId][String(pairIdx)];
            }
            renderExamWorkspace();
        };

        window.toggleDoubtful = function(qId) {
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            renderExamWorkspace();
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                window.renderExamWorkspace();
            }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) {
                currentQuestionIndex++;
                window.renderExamWorkspace();
            }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) {
                currentQuestionIndex = idx;
                window.renderExamWorkspace();
            }
        };

        window.confirmSubmitExam = function() {
            const total = currentExamQuestions.length;
            let answeredCount = 0;
            let doubtfulCount = 0;
            currentExamQuestions.forEach(q => {
                const ans = currentStudentAnswers[q.id];
                if (isQuestionAnswered(ans)) {
                    answeredCount++;
                }
                if (currentDoubtfulMap[q.id]) {
                    doubtfulCount++;
                }
            });
            const emptyCount = total - answeredCount;

            const html = `
                <div class="space-y-4 py-2 text-xs">
                    <div class="flex items-center gap-3 p-3 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-900">
                        <i class="fa-solid fa-circle-check text-xl text-emerald-600"></i>
                        <div>
                            <p class="font-bold text-sm">Konfirmasi Selesai Ujian</p>
                            <p class="text-[11px] text-emerald-700">Pastikan seluruh jawaban Anda telah diperiksa sebelum dikirim.</p>
                        </div>
                    </div>
                    <div class="space-y-2 p-4 bg-slate-50 rounded-2xl border border-slate-200 font-semibold text-slate-700">
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Total Soal:</span> <span class="font-bold text-slate-900">${total} Butir</span></div>
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Sudah Dijawab Lengkap:</span> <span class="font-bold text-blue-600">${answeredCount} Soal</span></div>
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Belum Dijawab / Belum Lengkap:</span> <span class="font-bold text-red-600">${emptyCount} Soal</span></div>
                        <div class="flex justify-between py-1"><span>Ditandai Ragu-Ragu:</span> <span class="font-bold text-amber-600">${doubtfulCount} Soal</span></div>
                    </div>
                </div>
            `;

            window.showModal('Konfirmasi Selesai Ujian', '', 'info', (confirmed) => {
                if (confirmed) {
                    window.submitExamFinal();
                }
                return true;
            }, { html, showCancel: true, okText: 'Ya, Kirim Jawaban!' });
        };

        window.submitExamFinal = function() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            window.detachAntiCheatListeners();
            const student = appData.currentUser;
            let totalScore = 0;
            let maxScore = 0;
            let correct = 0;
            let wrong = 0;
            let empty = 0;
            const essayScores = {};

            currentExamQuestions.forEach(q => {
                maxScore += q.weight;
                const ans = currentStudentAnswers[q.id];
                if (ans === undefined || ans === '' || (Array.isArray(ans) && ans.length === 0) || (typeof ans === 'object' && !Array.isArray(ans) && Object.keys(ans).length === 0)) {
                    empty++;
                    return;
                }
                if (q.type === 'pg' || q.type === 'true_false' || q.type === 'short_answer') {
                    const cleanAns = String(ans).trim().toLowerCase();
                    const cleanKey = String(q.correctAnswer).trim().toLowerCase();
                    if (cleanAns === cleanKey) {
                        totalScore += q.weight;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'pg_complex') {
                    const keys = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
                    const matches = ans.filter(k => keys.includes(k)).length;
                    if (matches === keys.length && ans.length === keys.length) {
                        totalScore += q.weight;
                        correct++;
                    } else if (matches > 0 && q.partialScoring) {
                        const partial = Math.round((matches / keys.length) * q.weight);
                        totalScore += partial;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'matching') {
                    const keyMap = q.correctAnswer || {};
                    const totalPairs = Object.keys(keyMap).length || 1;
                    let matchPairs = 0;
                    Object.keys(keyMap).forEach(k => {
                        if (ans[k] && String(ans[k]).trim().toLowerCase() === String(keyMap[k]).trim().toLowerCase()) {
                            matchPairs++;
                        }
                    });
                    if (matchPairs === totalPairs) {
                        totalScore += q.weight;
                        correct++;
                    } else if (matchPairs > 0) {
                        totalScore += Math.round((matchPairs / totalPairs) * q.weight);
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'essay') {
                    essayScores[q.id] = 0;
                }
            });

            const hasEssayQuestion = currentExamQuestions.some(q => q.type === 'essay');
            const clonedAnswers = JSON.parse(JSON.stringify(currentStudentAnswers || {}));

            appData.examResults = appData.examResults.filter(r => !(r.studentId === student.studentId && r.examId === currentActiveExam.id));

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id + '-' + Date.now(),
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                subjectId: currentActiveExam.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId,
                className: student.className || '4',
                submittedAt: new Date().toLocaleString('id-ID'),
                totalScoreObtained: totalScore,
                maxPossibleScore: maxScore,
                finalScore: Math.round((totalScore / maxScore) * 100) || 0,
                correctCount: correct,
                wrongCount: wrong,
                emptyCount: empty,
                violationCount: currentViolationCount,
                essayGradingStatus: hasEssayQuestion ? 'Belum Dinilai' : 'Sudah Dinilai',
                essayScores,
                answersSnapshot: clonedAnswers
            };

            appData.examResults.push(resultObj);
            syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            let p = appData.examParticipants.find(x => x.examId === currentActiveExam.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + currentActiveExam.id,
                    examId: currentActiveExam.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '4',
                    status: 'Selesai',
                    violationCount: currentViolationCount,
                    extraTimeMinutes: 0
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
                p.violationCount = currentViolationCount;
            }
            syncCollectionRecord('examParticipants', p.id, p);

            logActivity(`Siswa ${student.name} menyelesaikan ujian ${currentActiveExam.examName}.`);
            renderExamResultReviewPage(resultObj);
        };

                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
                                <i class="fa-solid fa-circle-check"></i>
                            </div>
                            <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>

                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">

                                <p class="text-xs font-bold text-emerald-800 uppercase">Nilai Akhir</p>
                                <h3 class="text-3xl font-extrabold text-emerald-700 mt-1">${resObj.finalScore}</h3>
                            </div>
                            <div class="p-4 bg-blue-50 rounded-2xl border border-blue-200">
                                <p class="text-xs font-bold text-blue-800 uppercase">Jawaban Benar</p>
                                <h3 class="text-2xl font-extrabold text-blue-700 mt-1">${resObj.correctCount} Soal</h3>
                            </div>
                            <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200">
                                <p class="text-xs font-bold text-amber-800 uppercase">Pelanggaran Tab</p>
                                <h3 class="text-2xl font-extrabold text-amber-700 mt-1">${resObj.violationCount || 0} Kali</h3>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-center">
                            <button type="button" onclick="window.logoutApp()" class="px-8 py-3.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-bold text-sm shadow-md transition">
                                <i class="fa-solid fa-right-from-bracket mr-2"></i> Keluar ke Halaman Login
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        window.onload = function() {
            seedPreviewData();
            initFirebaseProduction();
            window.renderLoginView();
        };
    </script>
