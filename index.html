        window.saveAnswer = function(qId, val) {
            currentStudentAnswers[qId] = val;
            const answeredEl = document.getElementById('answeredCounterText');
            if (answeredEl) {
                let count = 0;
                currentExamQuestions.forEach(item => {
                    if (isQuestionAnswered(currentStudentAnswers[item.id])) count++;
                });
                answeredEl.innerText = String(count);
            }
            window.scheduleAutoSave(false);
        };

        window.saveAnswerAndRefresh = function(qId, val) {
            currentStudentAnswers[qId] = val;
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveComplexAnswer = function(qId, val, checked) {
            if (!Array.isArray(currentStudentAnswers[qId])) currentStudentAnswers[qId] = [];
            if (checked) {
                if (!currentStudentAnswers[qId].includes(val)) currentStudentAnswers[qId].push(val);
            } else {
                currentStudentAnswers[qId] = currentStudentAnswers[qId].filter(x => x !== val);
            }
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveMatchingAnswer = function(qId, pairIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null) {
                currentStudentAnswers[qId] = {};
            }
            if (val) {
                currentStudentAnswers[qId][String(pairIdx)] = val;
            } else {
                delete currentStudentAnswers[qId][String(pairIdx)];
            }
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.saveMultiTrueFalseAnswer = function(qId, stmtIdx, val) {
            if (typeof currentStudentAnswers[qId] !== 'object' || currentStudentAnswers[qId] === null || Array.isArray(currentStudentAnswers[qId])) {
                currentStudentAnswers[qId] = {};
            }
            currentStudentAnswers[qId][String(stmtIdx)] = val;
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.toggleDoubtful = function(qId) {
            currentDoubtfulMap[qId] = !currentDoubtfulMap[qId];
            renderExamWorkspace();
            window.scheduleAutoSave(true);
        };

        window.prevQuestion = function() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                window.renderExamWorkspace();
                window.scheduleAutoSave(true);
            }
        };

        window.nextQuestion = function() {
            if (currentQuestionIndex < currentExamQuestions.length - 1) {
                currentQuestionIndex++;
                window.renderExamWorkspace();
                window.scheduleAutoSave(true);
            }
        };

        window.jumpToQuestion = function(idx) {
            if (idx >= 0 && idx < currentExamQuestions.length) {
                currentQuestionIndex = idx;
                window.renderExamWorkspace();
                window.scheduleAutoSave(true);
            }
        };

        window.confirmSubmitExam = function() {
            const total = currentExamQuestions.length;
            let answeredCount = 0;
            let doubtfulCount = 0;
            currentExamQuestions.forEach(q => {
                const ans = currentStudentAnswers[q.id];
                if (isQuestionAnswered(ans)) {
                    answeredCount++;
                }
                if (currentDoubtfulMap[q.id]) {
                    doubtfulCount++;
                }
            });
            const emptyCount = total - answeredCount;

            const html = `
                <div class="space-y-4 py-2 text-xs">
                    <div class="flex items-center gap-3 p-3 bg-emerald-50 rounded-2xl border border-emerald-200 text-emerald-900">
                        <i class="fa-solid fa-circle-check text-xl text-emerald-600"></i>
                        <div>
                            <p class="font-bold text-sm">Konfirmasi Selesai Ujian</p>
                            <p class="text-[11px] text-emerald-700">Pastikan seluruh jawaban Anda telah diperiksa sebelum dikirim. Setelah dikirim, ujian tidak dapat dibuka kembali.</p>
                        </div>
                    </div>
                    <div class="space-y-2 p-4 bg-slate-50 rounded-2xl border border-slate-200 font-semibold text-slate-700">
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Total Soal:</span> <span class="font-bold text-slate-900">${total} Butir</span></div>
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Sudah Dijawab Lengkap:</span> <span class="font-bold text-blue-600">${answeredCount} Soal</span></div>
                        <div class="flex justify-between py-1 border-b border-slate-200"><span>Belum Dijawab / Belum Lengkap:</span> <span class="font-bold text-red-600">${emptyCount} Soal</span></div>
                        <div class="flex justify-between py-1"><span>Ditandai Ragu-Ragu:</span> <span class="font-bold text-amber-600">${doubtfulCount} Soal</span></div>
                    </div>
                </div>
            `;

            window.showModal('Konfirmasi Selesai Ujian', '', 'info', (confirmed) => {
                if (confirmed) {
                    window.submitExamFinal();
                }
                return true;
            }, { html, showCancel: true, okText: 'Ya, Kirim Jawaban!' });
        };

        window.submitExamFinal = async function() {
            if (isSubmittingFinalExam) return;
            isSubmittingFinalExam = true;
            window.stopAllExamTimersAndWatchers();

            const student = appData.currentUser;
            if (!student || !currentActiveExam) {
                isSubmittingFinalExam = false;
                return;
            }

            const verification = await verifyExamEligibilityFromServer(currentActiveExam.id, student);
            if (!verification.allowed) {
                isSubmittingFinalExam = false;
                window.renderStudentPortal(false);
                window.showModal('Ujian Telah Ditutup', verification.message, 'error');
                return;
            }

            // Validasi token sesi terakhir di server agar perangkat lama yang sudah digantikan tidak menimpa hasil
            const sessId = getSessionDocId(currentActiveExam.id, student.studentId);
            const cloudSess = await fetchSingleFirestoreDoc('examSessions', sessId);
            if (cloudSess && cloudSess.status === 'SUBMITTED') {
                isSubmittingFinalExam = false;
                window.showModal('Sudah Terkirim', 'Ujian Anda telah dikirim sebelumnya.', 'info');
                window.renderStudentPortal(false);
                return;
            }
            if (cloudSess && cloudSess.sessionToken && currentSessionToken && cloudSess.sessionToken !== currentSessionToken) {
                isSubmittingFinalExam = false;
                window.showModal('Sesi Tidak Valid', 'Sesi ujian ini sedang aktif pada perangkat lain. Pengiriman hanya dapat dilakukan dari perangkat terbaru.', 'error');
                window.renderStudentPortal(false);
                return;
            }

            let totalScore = 0;
            let maxScore = 0;
            let correct = 0;
            let wrong = 0;
            let empty = 0;
            const essayScores = {};

            currentExamQuestions.forEach(q => {
                maxScore += q.weight;
                const ans = currentStudentAnswers[q.id];
                if (ans === undefined || ans === '' || (Array.isArray(ans) && ans.length === 0) || (typeof ans === 'object' && !Array.isArray(ans) && Object.keys(ans).length === 0)) {
                    empty++;
                    return;
                }
                if (q.type === 'pg' || q.type === 'short_answer') {
                    const cleanAns = String(ans).trim().toLowerCase();
                    const cleanKey = String(q.correctAnswer).trim().toLowerCase();
                    if (cleanAns === cleanKey) {
                        totalScore += q.weight;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'true_false') {
                    const opts = Array.isArray(q.options) && q.options.length > 0 ? q.options : ['Benar', 'Salah'];
                    const isMultiTF = Array.isArray(q.correctAnswer) || (opts.length > 2) || (opts.length >= 1 && !['benar', 'salah'].includes(String(opts[0]).trim().toLowerCase()));

                    if (isMultiTF) {
                        const keyArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
                        const totalStmts = keyArr.length || opts.length || 1;
                        let matchedStmts = 0;
                        for (let sIdx = 0; sIdx < totalStmts; sIdx++) {
                            const studentVal = (typeof ans === 'object' && ans !== null) ? String(ans[String(sIdx)] || '').trim().toLowerCase() : '';
                            const kVal = String(keyArr[sIdx] || '').trim().toLowerCase();
                            const normStudent = (studentVal === 'b' || studentVal === 'benar' || studentVal === 'true') ? 'benar' : (studentVal === 's' || studentVal === 'salah' || studentVal === 'false') ? 'salah' : studentVal;
                            const normKey = (kVal === 'b' || kVal === 'benar' || kVal === 'true') ? 'benar' : (kVal === 's' || kVal === 'salah' || kVal === 'false') ? 'salah' : kVal;
                            if (normStudent && normStudent === normKey) {
                                matchedStmts++;
                            }
                        }
                        if (matchedStmts === totalStmts) {
                            totalScore += q.weight;
                            correct++;
                        } else if (matchedStmts > 0 && q.partialScoring !== false) {
                            totalScore += Math.round((matchedStmts / totalStmts) * q.weight);
                            correct++;
                        } else {
                            wrong++;
                        }
                    } else {
                        const cleanAns = String(ans).trim().toLowerCase();
                        const normAns = (cleanAns === 'b' || cleanAns === 'benar' || cleanAns === 'true') ? 'benar' : (cleanAns === 's' || cleanAns === 'salah' || cleanAns === 'false') ? 'salah' : cleanAns;
                        const cleanKey = String(q.correctAnswer).trim().toLowerCase();
                        const normKey = (cleanKey === 'b' || cleanKey === 'benar' || cleanKey === 'true') ? 'benar' : (cleanKey === 's' || cleanKey === 'salah' || cleanKey === 'false') ? 'salah' : cleanKey;
                        if (normAns === normKey) {
                            totalScore += q.weight;
                            correct++;
                        } else {
                            wrong++;
                        }
                    }
                } else if (q.type === 'pg_complex') {
                    const rawKeys = Array.isArray(q.correctAnswer)
                        ? q.correctAnswer
                        : String(q.correctAnswer || '').split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
                    const studentArr = Array.isArray(ans) ? ans.map(x => String(x).trim().toUpperCase()) : [String(ans).trim().toUpperCase()];
                    const matches = studentArr.filter(k => rawKeys.includes(k)).length;
                    if (matches === rawKeys.length && studentArr.length === rawKeys.length) {
                        totalScore += q.weight;
                        correct++;
                    } else if (matches > 0 && q.partialScoring !== false) {
                        const partial = Math.round((matches / (rawKeys.length || 1)) * q.weight);
                        totalScore += partial;
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'matching') {
                    const keyMap = q.correctAnswer || {};
                    const totalPairs = Object.keys(keyMap).length || 1;
                    let matchPairs = 0;
                    Object.keys(keyMap).forEach(k => {
                        if (ans[k] && String(ans[k]).trim().toLowerCase() === String(keyMap[k]).trim().toLowerCase()) {
                            matchPairs++;
                        }
                    });
                    if (matchPairs === totalPairs) {
                        totalScore += q.weight;
                        correct++;
                    } else if (matchPairs > 0) {
                        totalScore += Math.round((matchPairs / totalPairs) * q.weight);
                        correct++;
                    } else {
                        wrong++;
                    }
                } else if (q.type === 'essay') {
                    essayScores[q.id] = 0;
                }
            });

            const hasEssayQuestion = currentExamQuestions.some(q => q.type === 'essay');
            const clonedAnswers = JSON.parse(JSON.stringify(currentStudentAnswers || {}));

            appData.examResults = appData.examResults.filter(r => !(r.studentId === student.studentId && r.examId === currentActiveExam.id));

            const resultObj = {
                resultId: 'RES-' + student.studentId + '-' + currentActiveExam.id,
                examId: currentActiveExam.id,
                examName: currentActiveExam.examName,
                subjectId: currentActiveExam.subjectId,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                classId: student.classId,
                className: student.className || '4',
                submittedAt: new Date().toLocaleString('id-ID'),
                totalScoreObtained: totalScore,
                maxPossibleScore: maxScore,
                finalScore: Math.round((totalScore / maxScore) * 100) || 0,
                correctCount: correct,
                wrongCount: wrong,
                emptyCount: empty,
                violationCount: currentViolationCount,
                essayGradingStatus: hasEssayQuestion ? 'Belum Dinilai' : 'Sudah Dinilai',
                essayScores,
                answersSnapshot: clonedAnswers
            };

            appData.examResults.push(resultObj);
            await syncCollectionRecord('examResults', resultObj.resultId, resultObj);

            // Tandai sesi aktif menjadi SUBMITTED agar tidak bisa dilanjutkan kembali dari perangkat mana pun
            const completedSessionPayload = {
                id: sessId,
                examId: currentActiveExam.id,
                studentId: student.studentId,
                nisn: student.nisn,
                studentName: student.name,
                status: 'SUBMITTED',
                submittedAtMs: Date.now(),
                submittedAtFormatted: resultObj.submittedAt,
                finalScore: resultObj.finalScore,
                violationCount: currentViolationCount,
                sessionToken: currentSessionToken
            };
            const sIdx = appData.examSessions.findIndex(s => s.id === sessId);
            if (sIdx !== -1) appData.examSessions[sIdx] = { ...appData.examSessions[sIdx], ...completedSessionPayload };
            await syncCollectionRecord('examSessions', sessId, completedSessionPayload);

            let p = appData.examParticipants.find(x => x.examId === currentActiveExam.id && x.studentId === student.studentId);
            if (!p) {
                p = {
                    id: 'PRT-' + student.studentId + '-' + currentActiveExam.id,
                    examId: currentActiveExam.id,
                    studentId: student.studentId,
                    nisn: student.nisn,
                    studentName: student.name,
                    className: student.className || '4',
                    status: 'Selesai',
                    violationCount: currentViolationCount,
                    extraTimeMinutes: 0
                };
                appData.examParticipants.push(p);
            } else {
                p.status = 'Selesai';
                p.violationCount = currentViolationCount;
            }
            await syncCollectionRecord('examParticipants', p.id, p);

            isSubmittingFinalExam = false;
            isViewingResultReview = true;
            logActivity(`Siswa ${student.name} menyelesaikan ujian ${currentActiveExam.examName}.`);
            window.renderExamResultReviewPage(resultObj);
        };

        window.openSavedExamResultReview = function(resultId) {
            const resObj = appData.examResults.find(r => (r.resultId || r.id) === resultId);
            if (!resObj) {
                window.showModal('Data Hasil Tidak Ditemukan', 'Rekap hasil ujian belum tersedia.', 'error');
                return;
            }
            window.renderExamResultReviewPage(resObj);
        };

        function evaluateSingleQuestionForReview(q, ans, resObj) {
            const isEmpty = ans === undefined || ans === null || ans === '' || (Array.isArray(ans) && ans.length === 0) || (typeof ans === 'object' && !Array.isArray(ans) && Object.keys(ans).length === 0);
            const formatVal = (v) => {
                if (v === undefined || v === null || v === '') return '(Tidak dijawab)';
                if (Array.isArray(v)) return v.join(', ');
                if (typeof v === 'object') {
                    return Object.entries(v).map(([k, val]) => `${Number(k) + 1}: ${val}`).join(' | ');
                }
                if (q.type === 'pg' && Array.isArray(q.options)) {
                    const idx = String(v).trim().toUpperCase().charCodeAt(0) - 65;
                    const optTxt = q.options[idx];
                    return optTxt ? `${String(v).toUpperCase()}. ${optTxt}` : String(v);
                }
                return String(v);
            };

            const formatKey = () => {
                const k = q.correctAnswer;
                if (q.type === 'pg' && Array.isArray(q.options)) {
                    const letter = String(k || 'A').trim().toUpperCase();
                    const idx = letter.charCodeAt(0) - 65;
                    const optTxt = q.options[idx];
                    return optTxt ? `${letter}. ${optTxt}` : letter;
                }
                if (Array.isArray(k)) return k.join(', ');
                if (typeof k === 'object' && k !== null) {
                    return Object.entries(k).map(([idxKey, val]) => `${Number(idxKey) + 1}: ${val}`).join(' | ');
                }
                return String(k ?? '-');
            };

            if (isEmpty) {
                return {
                    status: 'EMPTY',
                    badgeText: 'Tidak Dijawab',
                    badgeClass: 'bg-slate-100 text-slate-600 border-slate-300',
                    cardBorder: 'border-slate-200 bg-slate-50/60',
                    studentAnsText: '(Tidak dijawab)',
                    correctKeyText: formatKey()
                };
            }

            let isCorrect = false;
            if (q.type === 'pg' || q.type === 'short_answer') {
                isCorrect = String(ans).trim().toLowerCase() === String(q.correctAnswer).trim().toLowerCase();
            } else if (q.type === 'true_false') {
                const opts = Array.isArray(q.options) && q.options.length > 0 ? q.options : ['Benar', 'Salah'];
                const isMultiTF = Array.isArray(q.correctAnswer) || (opts.length > 2) || (opts.length >= 1 && !['benar', 'salah'].includes(String(opts[0]).trim().toLowerCase()));
                if (isMultiTF) {
                    const keyArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [];
                    const totalStmts = keyArr.length || opts.length || 1;
                    let matched = 0;
                    for (let sIdx = 0; sIdx < totalStmts; sIdx++) {
                        const sVal = (typeof ans === 'object' && ans !== null) ? String(ans[String(sIdx)] || '').trim().toLowerCase() : '';
                        const kVal = String(keyArr[sIdx] || '').trim().toLowerCase();
                        const normS = (sVal === 'b' || sVal === 'benar' || sVal === 'true') ? 'benar' : (sVal === 's' || sVal === 'salah' || sVal === 'false') ? 'salah' : sVal;
                        const normK = (kVal === 'b' || kVal === 'benar' || kVal === 'true') ? 'benar' : (kVal === 's' || kVal === 'salah' || kVal === 'false') ? 'salah' : kVal;
                        if (normS && normS === normK) matched++;
                    }
                    isCorrect = matched > 0;
                } else {
                    const cleanAns = String(ans).trim().toLowerCase();
                    const normAns = (cleanAns === 'b' || cleanAns === 'benar' || cleanAns === 'true') ? 'benar' : (cleanAns === 's' || cleanAns === 'salah' || cleanAns === 'false') ? 'salah' : cleanAns;
                    const cleanKey = String(q.correctAnswer).trim().toLowerCase();
                    const normKey = (cleanKey === 'b' || cleanKey === 'benar' || cleanKey === 'true') ? 'benar' : (cleanKey === 's' || cleanKey === 'salah' || cleanKey === 'false') ? 'salah' : cleanKey;
                    isCorrect = normAns === normKey;
                }
            } else if (q.type === 'pg_complex') {
                const rawKeys = Array.isArray(q.correctAnswer)
                    ? q.correctAnswer
                    : String(q.correctAnswer || '').split(/[,;\s]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
                const studentArr = Array.isArray(ans) ? ans.map(x => String(x).trim().toUpperCase()) : [String(ans).trim().toUpperCase()];
                const matches = studentArr.filter(k => rawKeys.includes(k)).length;
                isCorrect = (matches === rawKeys.length && studentArr.length === rawKeys.length) || (matches > 0 && q.partialScoring !== false);
            } else if (q.type === 'matching') {
                const keyMap = q.correctAnswer || {};
                let matchPairs = 0;
                Object.keys(keyMap).forEach(k => {
                    if (ans[k] && String(ans[k]).trim().toLowerCase() === String(keyMap[k]).trim().toLowerCase()) matchPairs++;
                });
                isCorrect = matchPairs > 0;
            } else if (q.type === 'essay') {
                const givenScore = (resObj.essayScores && resObj.essayScores[q.id]) ? Number(resObj.essayScores[q.id]) : 0;
                return {
                    status: 'ESSAY',
                    badgeText: resObj.essayGradingStatus === 'Sudah Dinilai' ? `Skor Uraian: ${givenScore}/${q.weight}` : 'Menunggu Koreksi Guru',
                    badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200',
                    cardBorder: 'border-indigo-200 bg-indigo-50/20',
                    studentAnsText: formatVal(ans),
                    correctKeyText: formatKey()
                };
            }

            return {
                status: isCorrect ? 'CORRECT' : 'WRONG',
                badgeText: isCorrect ? 'Benar' : 'Salah',
                badgeClass: isCorrect ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-red-100 text-red-700 border-red-300',
                cardBorder: isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-red-200 bg-red-50/20',
                studentAnsText: formatVal(ans),
                correctKeyText: formatKey()
            };
        }

            isViewingResultReview = true;
            isExamWorkspaceActive = false;

            const examObj = appData.exams.find(e => e.id === resObj.examId) || currentActiveExam;
            let questionsList = [];
            if (examObj && Array.isArray(examObj.questionIds) && examObj.questionIds.length > 0) {
                questionsList = examObj.questionIds.map(qid => appData.questions.find(q => q.id === qid)).filter(Boolean);
            }
            if (questionsList.length === 0 && examObj && examObj.bankId) {
                questionsList = appData.questions.filter(q => q.bankId === examObj.bankId);
            }
            if (questionsList.length === 0 && currentExamQuestions.length > 0) {
                questionsList = [...currentExamQuestions];
            }
            if (questionsList.length === 0) {
                questionsList = [...appData.questions];
            }

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="flex-1 flex flex-col h-full bg-slate-100 overflow-y-auto p-4 sm:p-6 custom-scrollbar">
                    <div class="max-w-xl mx-auto w-full bg-white rounded-3xl shadow-xl p-6 sm:p-8 space-y-6 my-auto text-center">
                        <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl mx-auto shadow-sm">
                            <i class="fa-solid fa-circle-check"></i>
                        </div>
                        <div class="space-y-1">
                            <h2 class="text-2xl font-extrabold text-slate-900">Ujian Telah Selesai!</h2>
                            <p class="text-xs font-semibold text-indigo-700">${escapeHtml(resObj.examName || (examObj ? examObj.examName : 'Paket Ujian'))}</p>
                            <p class="text-xs text-slate-500">${escapeHtml(resObj.studentName)} (Kelas ${escapeHtml(resObj.className)}) • Disubmit pada ${escapeHtml(resObj.submittedAt)}</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                            <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-200">
                                <p class="text-[11px] font-bold text-emerald-800 uppercase">Nilai Akhir</p>
                                <h3 class="text-3xl font-extrabold text-emerald-700 mt-1">${resObj.finalScore}</h3>
                            </div>
                            <div class="p-4 bg-blue-50 rounded-2xl border border-blue-200">
                                <p class="text-[11px] font-bold text-blue-800 uppercase">Jawaban Benar</p>
                                <h3 class="text-2xl font-extrabold text-blue-700 mt-1">${resObj.correctCount || 0} Soal</h3>
                            </div>
                            <div class="p-4 bg-red-50 rounded-2xl border border-red-200">
                                <p class="text-[11px] font-bold text-red-800 uppercase">Jawaban Salah</p>
                                <h3 class="text-2xl font-extrabold text-red-600 mt-1">${resObj.wrongCount || 0} Soal</h3>
                            </div>
                            <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200">
                                <p class="text-[11px] font-bold text-amber-800 uppercase">Kosong / Tab</p>
                                <h3 class="text-base font-extrabold text-amber-700 mt-1">${resObj.emptyCount || 0} Kosong • ${resObj.violationCount || 0}x</h3>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3">
                            <button type="button" onclick="window.renderStudentPortal(false)" class="flex-1 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl font-extrabold text-xs sm:text-sm transition cursor-pointer">
                                <i class="fa-solid fa-arrow-left mr-1.5"></i> Kembali ke Portal Siswa
                            </button>
                            <button type="button" onclick="window.logoutApp()" class="flex-1 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl font-extrabold text-xs sm:text-sm shadow-md transition cursor-pointer">
                                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Keluar
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        // Simpan progres secara otomatis ketika tab/browser hendak ditutup atau di-refresh
        window.addEventListener('beforeunload', () => {
            if (isExamWorkspaceActive && currentActiveExam && !isSubmittingFinalExam) {
                window.persistExamSessionToCloud(true);
            }
        });

        window.onload = async function() {
            try {
                await initFirebaseProduction();
                startScheduleTransitionWatcher();
                window.renderLoginView();
            } catch (error) {
                startScheduleTransitionWatcher();
                window.renderLoginView();
                window.showModal(
                    'Koneksi Firebase Gagal',
                    'Aplikasi belum dapat terhubung ke Firebase. Periksa konfigurasi project, pastikan Firestore Database tersedia, dan sesuaikan Security Rules.',
                    'error'
                );
            }
        };
    </script>
